<style>
:root{
  --bg:#f4f7fb; --panel:#ffffff; --ink:#1c2b3a; --muted:#63758a; --line:#e3e9f2;
  --brand:#0e7490; --brand2:#155e75; --accent:#7c3aed;
  --ok:#15803d; --okbg:#dcfce7; --bad:#b91c1c; --badbg:#fee2e2;
  --amber:#b45309; --amberbg:#fef3c7;
  --shadow:0 2px 10px rgba(20,40,70,.07); --radius:14px;
}
html[data-theme="dark"]{
  --bg:#0f1720; --panel:#16222e; --ink:#e6edf5; --muted:#8fa2b5; --line:#243546;
  --brand:#22b8d4; --brand2:#36c5df; --accent:#a78bfa;
  --ok:#4ade80; --okbg:#16341f; --bad:#f87171; --badbg:#3d1d1d;
  --amber:#fbbf24; --amberbg:#3a2f0e;
  --shadow:0 2px 12px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:18px;padding:10px 18px;background:var(--panel);border-bottom:1px solid var(--line);box-shadow:var(--shadow)}
.brand{text-decoration:none;color:var(--ink);font-size:1.15rem;display:flex;align-items:center;gap:8px}
.brand .tag{font-size:.7rem;background:var(--brand);color:#fff;border-radius:20px;padding:2px 8px}
.topbar nav{display:flex;gap:4px;flex:1;flex-wrap:wrap}
.topbar nav a{padding:7px 13px;border-radius:8px;text-decoration:none;color:var(--muted);font-weight:600;font-size:.92rem}
.topbar nav a.active{background:var(--brand);color:#fff}
#themeToggle{background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:8px;font-size:1rem;padding:6px 10px;cursor:pointer}
main{flex:1;width:100%;max-width:1000px;margin:0 auto;padding:22px 16px 50px}
footer{padding:14px;text-align:center;color:var(--muted);font-size:.78rem;border-top:1px solid var(--line)}
.loading{text-align:center;padding:60px;color:var(--muted)}
h1{font-size:1.6rem;margin:.2em 0 .4em}
h2{font-size:1.15rem;margin:1.2em 0 .5em}
.sub{color:var(--muted);margin-top:-4px}
.grid{display:grid;gap:12px}
.grid.sys{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.card h3{margin:.1em 0 .3em;font-size:1.02rem}
.card .count{color:var(--muted);font-size:.85rem}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:14px 0}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}
.stat .n{font-size:1.5rem;font-weight:800;color:var(--brand)}
.stat .l{font-size:.75rem;color:var(--muted)}
.badge{display:inline-block;font-size:.68rem;font-weight:700;border-radius:20px;padding:2px 9px;margin-left:6px;vertical-align:middle}
.badge-ai{background:var(--amberbg);color:var(--amber)}
.badge-src{background:#e0e7ff;color:#3730a3}
html[data-theme="dark"] .badge-src{background:#26264d;color:#a5b4fc}
.btn{display:inline-block;border:none;cursor:pointer;background:var(--brand);color:#fff;font-weight:700;padding:10px 20px;border-radius:10px;font-size:.95rem;text-decoration:none}
.btn:hover{background:var(--brand2)}
.btn.ghost{background:transparent;color:var(--brand);border:2px solid var(--brand)}
.btn.sm{padding:6px 13px;font-size:.85rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.topicrow{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;background:var(--panel);cursor:pointer}
.topicrow:hover{border-color:var(--brand)}
.topicrow .tname{font-weight:600}
.topicrow .tmeta{color:var(--muted);font-size:.8rem}
.stemwrap{margin-bottom:6px}
.stemmeta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.stem{font-size:1.13rem;line-height:1.55;font-weight:600;margin:10px 0 18px}
.qprogress{display:flex;justify-content:space-between;color:var(--muted);font-size:.82rem;margin-bottom:10px}
.opt{border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;background:var(--panel)}
.opt .opt-head{display:flex;gap:12px;align-items:flex-start}
.opt .olabel{font-weight:800;color:var(--brand);min-width:20px}
.opt .otext{flex:1;line-height:1.5}
.opt .tfbtns{display:flex;gap:8px;margin-left:6px}
.tfbtn{border:2px solid var(--line);background:transparent;color:var(--ink);font-weight:800;border-radius:9px;width:42px;height:38px;cursor:pointer;font-size:1rem}
.tfbtn:hover{border-color:var(--brand);color:var(--brand)}
.opt.correct{border-color:var(--ok);background:var(--okbg)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.tfbtn.picked.t{background:var(--ok);border-color:var(--ok);color:#fff}
.tfbtn.picked.f{background:var(--bad);border-color:var(--bad);color:#fff}
.tfbtn.dim{opacity:.35}
.verdict{font-weight:800;font-size:.85rem;margin-top:8px}
.verdict.ok{color:var(--ok)}
.verdict.bad{color:var(--bad)}
.rationale{margin-top:8px;padding:10px 12px;border-left:3px solid var(--brand);background:var(--bg);border-radius:0 8px 8px 0;font-size:.9rem;line-height:1.55;color:var(--ink)}
.quizfoot{display:flex;justify-content:space-between;align-items:center;margin-top:16px;gap:10px;flex-wrap:wrap}
.scorebig{font-size:3rem;font-weight:900}
.ok{color:var(--ok)} .bad{color:var(--bad)} .amber{color:var(--amber)}
.bar-wrap{height:10px;background:var(--line);border-radius:20px;overflow:hidden;margin:6px 0 14px}
.bar{height:100%;border-radius:20px;background:var(--brand)}
.bar.low{background:var(--bad)} .bar.mid{background:var(--amber)}
.weakrow{margin-bottom:16px}
.weakrow .wt{display:flex;justify-content:space-between;font-size:.9rem;font-weight:600}
summary{cursor:pointer;font-weight:600;padding:8px 0}
.notice{background:var(--amberbg);color:var(--amber);border-radius:10px;padding:10px 14px;font-size:.88rem;margin:12px 0}
.fc-row{display:flex;gap:10px;flex-wrap:wrap}
@media(max-width:640px){
  .stem{font-size:1.02rem}
  .tfbtn{width:44px;height:44px}
  .topbar{gap:8px;padding:8px 10px}
  .topbar nav a{padding:6px 8px;font-size:.85rem}
}

window.PAEDS_DATA = [{"id": "Q0001", "type": "tf", "stem": "A 9-month-old male infant presents with passage of loose stools for 12 days with intermittent vomiting. Which of the following statements are consistent with this condition?", "system": "Gastrointestinal & Hepatobiliary", "topic": "Diarrhoeal disease & dehydration", "source": "TF Series A", "aiAuthored": false, "options": [{"label": "A", "text": "This is a case of persistent diarrhoea.", "answer": "F", "rationale": "Persistent diarrhea is defined as an episode starting acutely but lasting 14 days or more. At 12 days, this is still classified as acute diarrhea."}, {"label": "B", "text": "Stool culture for Giardia lamblia must be done before administering antibiotics.", "answer": "F", "rationale": "Giardia lamblia is diagnosed by stool microscopy (ova, cysts, trophozoites) or antigen tests—not stool culture. Empiric antibiotics are not routinely required."}, {"label": "C", "text": "Hyperchloraemia and hyperkalaemia are complications.", "answer": "F", "rationale": "Common electrolyte complications are metabolic acidosis with hyperchloraemia and hypokalaemia, not hyperkalaemia."}, {"label": "D", "text": "The mother should give antiemetics and antidiarrhoeal drugs to alleviate symptoms.", "answer": "F", "rationale": "These are generally contraindicated in infants. Antidiarrheals can cause toxic megacolon or sedation, and vomiting is best managed with small, frequent sips of ORS."}, {"label": "E", "text": "He requires extra meals after the condition resolves.", "answer": "T", "rationale": "To catch up on growth and replace nutrients lost during the illness, the WHO recommends an extra meal every day for at least two weeks after the diarrhea stops."}]}, {"id": "Q0002", "type": "tf", "stem": "Concerning severe acute malnutrition (6–59 months), which of the following is correct?", "system": "Gastrointestinal & Hepatobiliary", "topic": "Nutrition & feeding", "source": "TF Series A", "aiAuthored": false, "options": [{"label": "A", "text": "MUAC of 13.5 cm is diagnostic.", "answer": "F", "rationale": ""}, {"label": "B", "text": "Feeding should be commenced in the stabilisation phase.", "answer": "T", "rationale": ""}, {"label": "C", "text": "Weight-for-age of −2 Z-scores from the mean is diagnostic.", "answer": "F", "rationale": ""}, {"label": "D", "text": "Sensory stimulation should be commenced in the stabilisation phase.", "answer": "F", "rationale": ""}, {"label": "E", "text": "Broad-spectrum antibiotics are indicated.", "answer": "T", "rationale": "Severe Acute Malnutrition (SAM) Definition Severe Acute Malnutrition is a life-threatening condition in children 6–59 months, characterised by severe wasting and/or nutritional oedema, resulting in high risk of mortality if not promptly treated. The diagnostic and management framework is based on World Health Organization guidelines. Classification of Acute Malnutrition 1. Severe Acute Malnutrition (SAM) Diagnosed by any one of the following: MUAC < 11.5 cm Weight-for-height/length < −3 Z-scores Bilateral pitting oedema (nutritional oedema) 2. Moderate Acute Malnutrition (MAM) MUAC 11.5–12.4 cm Weight-for-height −2 to −3 Z-scores No oedema Classification of Severe Acute Malnutrition (SAM) 1. Marasmus (Non-Edematous SAM) Severe wasting of muscle and fat. Weight-for-height < 60–80% of the median or Z-score < −3. No oedema. Child appears “skin and bones,” alert, usually hungry. Hair sparse and thin; skin loose and wrinkled."}]}, {"id": "Q0003", "type": "tf", "stem": "A 7-year-old girl presents with progressive increase in body size over one year. She eats three times daily with one snack. Exercise was stopped due to knee pain. There is acanthosis nigricans on the neck and axilla. Which of the following is true regarding her management?", "system": "Gastrointestinal & Hepatobiliary", "topic": "Nutrition & feeding", "source": "TF Series A", "aiAuthored": false, "options": [{"label": "A", "text": "Vitamin D supplementation is mandatory", "answer": "F", "rationale": "Vitamin D deficiency is common in obesity, but routine supplementation is not mandatory unless deficiency is confirmed or there are clinical indications."}, {"label": "B", "text": "Plotting at the 80th centile is diagnostic", "answer": "F", "rationale": "Diagnosis of overweight/obesity is based on BMI-for-age: ≥85th centile: overweight ≥95th centile: obesity An 80th centile is not diagnostic."}, {"label": "C", "text": "A full dietary history is required", "answer": "T", "rationale": "Assessment of childhood obesity must include a detailed dietary history (meal frequency, portion sizes, snacks, sugary drinks) and physical activity review."}, {"label": "D", "text": "Glycosylated haemoglobin should be done", "answer": "F", "rationale": "HbA1c is not routinely required in all obese children. It is indicated only if diabetes or impaired glucose tolerance is suspected."}, {"label": "E", "text": "Knee pain excludes obesity as a diagnosis", "answer": "F", "rationale": "Obesity commonly causes knee pain due to mechanical stress (e.g. Blount disease, slipped capital femoral epiphysis). It does not exclude obesity"}]}, {"id": "Q0004", "type": "tf", "stem": "A 7-year-old child presents with 3 weeks of frequent urination and tiredness, worsening over one week. There is no abdominal pain and no loss of appetite. Weight is 38 kg (10th percentile) and height is 132 cm (25th percentile). Which of the following statements are true?", "system": "Endocrine & Genetics", "topic": "Diabetes & glucose disorders", "source": "TF Series A", "aiAuthored": false, "options": [{"label": "A", "text": "Weight loss is due to breakdown of muscle", "answer": "T", "rationale": "Insulin deficiency causes a catabolic state, leading to breakdown of fat and muscle for energy, resulting in weight loss."}, {"label": "B", "text": "Insulin dose of 0.7–1.0 units/kg/day is appropriate", "answer": "T", "rationale": "Typical total daily insulin dose in newly diagnosed children is 0.5–1.0 units/kg/day, so this range is appropriate."}, {"label": "C", "text": "HbA1c ≥ 6.5% is diagnostic", "answer": "T", "rationale": "According to international criteria, HbA1c ≥ 6.5% confirms diabetes mellitus (if standardized assay is used)."}, {"label": "D", "text": "Hypoglycaemia is a known complication", "answer": "T", "rationale": "Hypoglycaemia is a common and serious complication of insulin therapy, especially during dose adjustment."}, {"label": "E", "text": "One positive autoantibody test is diagnostic", "answer": "F", "rationale": "While the presence of autoantibodies (like GAD or IA-2) supports a diagnosis of Type 1A (autoimmune) diabetes, the diagnosis of diabetes itself is based on clinical features, blood glucose levels or HbA1c, not the antibodies."}]}, {"id": "Q0005", "type": "tf", "stem": "A 2-year-old child presents with 3 days of fever, altered sensorium, and one episode of convulsion. Which of the following are likely diagnoses?", "system": "Neurology", "topic": "CNS infections & coma", "source": "TF Series A", "aiAuthored": false, "options": [{"label": "A", "text": "Cerebral malaria", "answer": "T", "rationale": "In endemic regions, cerebral malaria presents with fever, seizures, and impaired consciousness."}, {"label": "B", "text": "Pyogenic meningitis", "answer": "T", "rationale": "Classically presents with fever, seizures, altered mental state, and rapid deterioration in young children."}, {"label": "C", "text": "Epilepsy", "answer": "F", "rationale": "Epilepsy requires recurrent unprovoked seizures. This presentation is acute and febrile, making epilepsy unlikely."}, {"label": "D", "text": "Febrile seizure", "answer": "F", "rationale": "Febrile seizures are: Brief Occur in children 6 months–5 years No persistent altered consciousness afterward Altered sensorium\" (persisting after the post-ictal phase) suggests a more serious central nervous system infection or encephalopathy, not a benign febrile seizure."}, {"label": "E", "text": "Viral encephalitis", "answer": "T", "rationale": "Similar to meningitis, viral infections of the brain parenchyma present with fever, altered consciousness, and seizures."}]}, {"id": "Q0006", "type": "tf", "stem": "Concerning tumour lysis syndrome, which of the following is true?", "system": "Haematology & Oncology", "topic": "Oncologic emergencies (TLS)", "source": "TF Series A", "aiAuthored": false, "options": [{"label": "A", "text": "Nebulised salbutamol is indicated.", "answer": "F", "rationale": "Salbutamol may transiently shift potassium intracellularly in hyperkalaemia, but it is not a standard or primary treatment for TLS."}, {"label": "B", "text": "Acute lymphoblastic leukaemia is a risk factor.", "answer": "T", "rationale": ""}, {"label": "C", "text": "Calcium level of 6.8 mg/dL requires IV calcium gluconate.", "answer": "F", "rationale": "In TLS, hypocalcaemia is usually treated only if symptomatic (e.g., tetany, seizures, arrhythmias). Routine IV calcium can increase the risk of calcium-phosphate crystals depositing in the kidneys, worsening renal failure."}, {"label": "D", "text": "Allopurinol is indicated.", "answer": "T", "rationale": ""}, {"label": "E", "text": "2 L/m² of fluid is required for rehydration.", "answer": "F", "rationale": "The standard recommendation for TLS is aggressive hyperhydration, typically at 3 L/m²/day (or roughly double the maintenance rate). 2 L/m² is generally considered insufficient for the aggressive flushing required to prevent uric acid nephropathy. Other notes: Tumour lysis is a constellation of metabolic disturbances which occurs when large number of neoplastic cells are killed rapidly leading to release of intracellular ions and metabolic byproducts into systemic circulation. • Clinically; - Hyperkalemia: K >6mEq/l, - Hyperuricemia: UA >8mg/dl - Hyperphosphatemia: PO₄ >6.5mg/dl - Hypocalcemia: ionized calcium <1.5mEq/l (3mg/dl) • Increase in values by 25% within 3 days before or up to 7 days after initiation of therapy. Uric acid nephropathy. Acute kidney injury. RISK FACTORS FOR TLS • TLS can occur with every type of tumor Higher risk of occurrence; Bulky tumors {> 10cm in diameter} and /or white blood cell count of >50,000/ul. Rapidly proliferating tumors. Chemosensitivetumors. Pretreatment Lactate dehydrogenase (LDH) >2X Upper limit of normal (ULN) Organ infiltration or bone marrow involvement e.g non Hodgkin lymphomas eg Burkitt lymphoma and Acute Leukemias. High Lactate Dehydrogenase( 2X ULN) + pre existing renal insufficiency; strong prognostic indicators for TLS. PREVENTION Hydration Allopurinol (xanthine oxidase inhibitor) / Rasburicase (urate oxidase) Frequent monitoring of electrolytes and rapid correction of abnormalities. Urinary alkalinizationis no longer recommended"}]}, {"id": "Q0007", "type": "tf", "stem": "The following are investigations used in the diagnosis of tuberculosis:", "system": "Pulmonology", "topic": "Tuberculosis", "source": "TF Series A", "aiAuthored": false, "options": [{"label": "A", "text": "GeneXpert MTB/RIF.", "answer": "T", "rationale": ""}, {"label": "B", "text": "Tuberculin skin test.", "answer": "T", "rationale": ""}, {"label": "C", "text": "Chest X-ray.", "answer": "T", "rationale": ""}, {"label": "D", "text": "Full blood count.", "answer": "F", "rationale": ""}, {"label": "E", "text": "Erythrocyte sedimentation rate.", "answer": "F", "rationale": "INVESTIGATIONS IN PRESUMPTIVE TB 1. Principle of Investigation Whenever possible, bacteriological confirmation of TB from a clinical specimen should be used to make a definitive diagnosis Bacteriological methods include: Smear microscopy Culture Newer molecular tests (e.g. Xpert MTB/RIF)"}]}, {"id": "Q0008", "type": "tf", "stem": "A 2-year-old zero-dose child presents with acute lymphoblastic leukaemia. Which vaccine should NOT be given?", "system": "Infectious Disease", "topic": "Immunization", "source": "TF Series A", "aiAuthored": false, "options": [{"label": "A", "text": "Measles.", "answer": "T", "rationale": ""}, {"label": "B", "text": "Rotavirus.", "answer": "T", "rationale": ""}, {"label": "C", "text": "Oral polio vaccine.", "answer": "T", "rationale": ""}, {"label": "D", "text": "Yellow fever.", "answer": "T", "rationale": ""}]}, {"id": "Q0009", "type": "tf", "stem": "Which of the following are correctly matched in cerebral palsy?", "system": "Neurology", "topic": "Cerebral palsy & development", "source": "TF Series A", "aiAuthored": false, "options": [{"label": "A", "text": "Spastic hemiplegia – prematurity.", "answer": "F", "rationale": ""}, {"label": "B", "text": "Spastic diplegia – severe intellectual disability.", "answer": "F", "rationale": ""}, {"label": "C", "text": "Spastic quadriplegia – GMFCS grade 2.", "answer": "F", "rationale": ""}, {"label": "D", "text": "Dyskinetic cerebral palsy – kernicterus.", "answer": "T", "rationale": ""}, {"label": "E", "text": "Atonic cerebral palsy – sustained ankle clonus.", "answer": "F", "rationale": "Atonic CP is characterized by hypotonia (floppiness). Sustained ankle clonus is a sign of upper motor neuron involvement (spasticity), which is the opposite of the \"floppy\" presentation of atonic CP. Notes Cerebral palsy is a disorder of posture and movement, resulting from a permanent,non-progressive lesion to the immature or developing brain. Some common classification: Spastic Diplegia- Usually seen in preterm infants as a result of the high incidence of IVH & periventricular leukomalacia. Child presents with delayed walking, scissoring gait, commando crawl. Involvement of the UL minimal. IQ usually normal. Seizures are rare. Spastic Quadriparesis- Seen in infants/children with diffuse brain injury. There is weakness of all 4 limbs, as well as the neck and trunk muscles. Seizures and severe mental retardation are common. Most belong to functional class III(moderate to severe limitation of activity)& IV (no useful activity), or Gross Motor Function Classification System IV & V. Dyskinetic CP- Usually found in infants with kernicterus (Bilirubin encephalopathy). It is Characterized by athetosis & chorea, tongue thrusting ,feeding difficulties. There may be associated dental enamel dysplasia, impairment of upward gaze and deafness. Seizures & mental retardation are uncommon. Ataxic CP- Associated with involvement of the cerebellum. Individual has problems with balance & depth perception. Child experiences difficulties with rapid movements and is often unsteady. Spastic hemiplegia- Weakness of one UL & the ipsilateral LL. UL involvement more severe than LL. Circumduction is characteristic. Seizures in up to 1/3 cases,and cognitive impairment in about 25% cases. Hand preference in the 1st year of life is a usual feature. Associated deficit in cerebral palsy are ✓Mental Retardation/ Intellectual disability ✓ Epilepsy ✓ Hearing Impairment ✓Visual Defects- strabismus, optic atrophy, nystagmus, refractive errors, cortical visual impairment ✓Speech Defects- delayed, poor articulation, loss of voice modulation ✓ADHD ✓Failure to thrive ✓Gait abnormalities ✓Hip subluxation"}]}, {"id": "Q0010", "type": "tf", "stem": "Pulmonary tuberculosis in a 2-year-old child may present with:", "system": "Pulmonology", "topic": "Tuberculosis", "source": "TF Series A", "aiAuthored": false, "options": [{"label": "A", "text": "Cough for 2 weeks.", "answer": "T", "rationale": ""}, {"label": "B", "text": "Haemoptysis.", "answer": "F", "rationale": ""}, {"label": "C", "text": "Weight loss.", "answer": "T", "rationale": ""}, {"label": "D", "text": "Unexplained fever.", "answer": "T", "rationale": ""}, {"label": "E", "text": "Night sweats.", "answer": "T", "rationale": "TB Case Definition A TB case is: - Bacteriologically confirmed or - Clinically diagnosed by a clinician as having tuberculosis. Diagnosis of Presumptive TB in Children Screen for presumptive TB based on these key symptoms and history: - Cough lasting ≥2 weeks - Weight loss or failure to thrive (FTT) - Fever (with or without night sweats) - Contact with an adult with TB symptoms in the last 2 years - Family death attributable to TB or HIV/AIDS SIGNS TO BE EXPLORED IN A CHILD WITH PRESUMPTIVE TUBERCULOSIS (TB)"}]}, {"id": "Q0011", "type": "tf", "stem": "A 4-year-old presents with 1 week of fever and cough and 2 days of breathlessness. He is pale and dyspnoeic with HR 180 bpm, RR 80 cycles/min, and SpO₂ 88%. Examination shows hyper-resonance and reduced breath sounds on the left. Which of the following is correct?", "system": "Pulmonology", "topic": "Pneumonia & LRTI", "source": "TF Series A", "aiAuthored": false, "options": [{"label": "A", "text": "Oxygen therapy and chest radiography are required.", "answer": "T", "rationale": "Oxygen is urgent for hypoxemia (SpO₂ 88%); chest X-ray confirms effusion vs. pneumothorax and guides drainage if needed."}, {"label": "B", "text": "The most likely causative organism is Haemophilus influenzae.", "answer": "F", "rationale": "In this age group, Streptococcus pneumoniae or Staphylococcus aureus are more likely. H. influenzae is less common due to vaccination."}, {"label": "C", "text": "The diagnosis is severe pneumonia with pleural effusion.", "answer": "F", "rationale": "Pleural effusion causes dull percussion note, not hyper-resonance. Hyper-resonance suggests pneumothorax."}, {"label": "D", "text": "Poor nutrition, poor immunisation, overcrowding, and pollution are risk factors.", "answer": "T", "rationale": ""}, {"label": "E", "text": "The child will benefit from antibiotics and thoracotomy.", "answer": "F", "rationale": "Management is oxygen + antibiotics + needle decompression/chest tube. Thoracotomy is only indicated if there is large effusion/empyema requiring drainage—not indicated without imaging confirmation. Other notes Risk Factors for community acquired pneumonia • Low birth weight • Infancy • Outdoor Air Pollution • Indoor Air Pollution Crowding & Housing: Crowding, poor housing, and large family size (>6) increase transmission of respiratory infections. Nutrition:Non-breastfeeding, vitamin A deficiency, and protein-energy malnutrition impair immunity and increase pneumonia risk. HIV/AIDS:Pneumonia pattern is unchanged in asymptomatic HIV infection, but symptomatic HIV- infected children have increased incidence and severity of bacterial pneumonia."}]}, {"id": "Q0012", "type": "tf", "stem": "A term neonate presents at 14 hours of life with jerking movements of the upper limbs. Which of the following is true?", "system": "Neonatology", "topic": "Neonatal seizures & metabolic", "source": "TF Series A", "aiAuthored": false, "options": [{"label": "A", "text": "Family history is important.", "answer": "T", "rationale": ""}, {"label": "B", "text": "Perinatal asphyxia is a possible cause.", "answer": "T", "rationale": ""}, {"label": "C", "text": "Severe neonatal jaundice may be responsible.", "answer": "T", "rationale": ""}, {"label": "D", "text": "Blood glucose should be checked.", "answer": "T", "rationale": ""}, {"label": "E", "text": "IV phenobarbitone is first-line treatment.", "answer": "T", "rationale": "NEONATAL SEIZURES Definition A neonatal seizure is a paroxysmal alteration in motor activity, behaviour, or autonomic function occurring in the first 28 days of life (or up to 44 weeks post-conceptional age in preterm infants), resulting from abnormal electrical activity in the immature neonatal brain. Neonatal seizures are medical emergencies because they often indicate serious underlying brain pathology and may themselves worsen brain injury if untreated. Why Neonatal Seizures Are Unique The neonatal brain is immature, so seizures are often subtle. Many neonatal seizures lack classical tonic–clonic features. Some seizures are electrographic only (seen on EEG without clinical signs). They are usually symptomatic, not idiopathic. Aetiology (Causes) 1. Hypoxic–Ischaemic Encephalopathy (HIE) Most common cause of neonatal seizures. Usually presents within the first 24 hours of life. Associated with difficult labour, birth asphyxia, low Apgar scores, or need for resuscitation. 2. Metabolic Disturbances Very common and always reversible causes: Hypoglycaemia (most common metabolic cause) Hypocalcaemia Hypomagnesaemia Hyponatraemia or hypernatraemia These should be excluded first in every neonate with seizures. 3. Intracranial Haemorrhage More common in preterm infants. Includes intraventricular, subarachnoid, or intracerebral haemorrhage. Risk factors: prematurity, birth trauma, coagulation disorders. 4. Central Nervous System Infections Neonatal meningitis or encephalitis. Common organisms include bacteria and viruses (e.g., HSV). Often associated with fever, poor feeding, lethargy, bulging fontanelle. 5. Neonatal Stroke Perinatal arterial ischaemic stroke. Often presents with focal seizures. May have otherwise normal pregnancy and delivery history. 6. Severe Hyperbilirubinaemia Unconjugated bilirubin crosses the blood–brain barrier causing kernicterus. Causes seizures, opisthotonus, abnormal tone. 7. Congenital Brain Malformations Cortical dysplasia, lissencephaly, agenesis of corpus callosum. Often associated with refractory seizures. 8. Inborn Errors of Metabolism Suspect when seizures are recurrent, refractory, or associated with metabolic acidosis, hyperammonaemia, or failure to thrive. 9. Drug Withdrawal or Toxicity Maternal opioid, benzodiazepine, or antidepressant use. Iatrogenic causes (e.g., local anaesthetic toxicity). Types (Clinical Classification) 1. Subtle Seizures (Most Common) Eye deviation or blinking Lip smacking, chewing, sucking movements Apnoea without bradycardia Pedalling or rowing movements Often missed or mistaken for normal behaviour. 2. Clonic Seizures Rhythmic jerking of a limb or one side of the body. May be focal or multifocal. More likely to correlate with EEG changes. 3. Tonic Seizures Sustained limb or trunk stiffening. Often associated with severe brain injury. 4. Myoclonic Seizures Sudden brief jerks. Poor prognosis when persistent. Clinical Presentation Jerking or abnormal limb movements Apnoea or cyanotic spells Abnormal eye movements Poor feeding Altered tone or consciousness Temperature instability Evaluation and Investigations Immediate (First-Line) Blood glucose (must be checked immediately) Serum calcium, magnesium, sodium Full blood count and CRP (if infection suspected) Further Investigations Lumbar puncture (if meningitis suspected) Neuroimaging: Cranial ultrasound (bedside, especially in preterm) CT or MRI brain (for haemorrhage, stroke, malformations) EEG: Confirms seizures Detects electrographic-only seizures Serum bilirubin Metabolic screening if seizures are unexplained or refractory Management 1. Initial Stabilisation Ensure Airway, Breathing, Circulation (ABC) Provide oxygen Maintain normothermia Establish IV access 2. Correct Reversible Causes Treat hypoglycaemia with IV dextrose Correct electrolyte abnormalities Treat infection promptly with antibiotics Manage severe jaundice Always correct metabolic causes before starting anticonvulsants. 3. Anticonvulsant Therapy First-line IV phenobarbitone Drug of choice for neonatal seizures Effective and widely available Second-line Phenytoin or levetiracetam (depending on protocol) Refractory seizures Continuous EEG monitoring Consider specialist input Prognosis Depends mainly on: Underlying cause Severity of brain injury Response to treatment Good prognosis Isolated metabolic seizures Promptly treated hypoglycaemia or hypocalcaemia Poor prognosis Severe HIE Intracranial haemorrhage Congenital brain malformations Persistent or refractory seizures Possible long-term outcomes include: Epilepsy Cerebral palsy Developmental delay Learning difficulties"}]}, {"id": "Q0013", "type": "tf", "stem": "A preterm infant delivered at 28 weeks gestational age. Which of the following is correct?", "system": "Neonatology", "topic": "Preterm & neonatal feeding", "source": "TF Series A", "aiAuthored": false, "options": [{"label": "A", "text": "Early CPAP should be commenced.", "answer": "T", "rationale": "Starting CPAP in the delivery room helps maintain functional residual capacity and significantly reduces the need for intubation and mechanical ventilation. It also lowers risk of bronchopulmonary dysplasia."}, {"label": "B", "text": "Antibiotics should be given only after a positive blood culture.", "answer": "F", "rationale": "Preterm infants are highly susceptible to sepsis. Because cultures take 24–48 hours and neonatal sepsis is rapidly fatal, empirical antibiotics are usually started immediately if there are risk factors or symptoms."}, {"label": "C", "text": "Kangaroo mother care should begin after 3 days.", "answer": "F", "rationale": "KMC can (and should) be initiated as soon as the infant is hemodynamically stable, which can often be within the first 24 hours."}, {"label": "D", "text": "Caffeine should be started only after full enteral feeds.", "answer": "F", "rationale": "Caffeine citrate is used to treat/prevent \"apnea of prematurity.\" It is typically started within the first 24– 48 hours of life, regardless of how much the baby is eating."}, {"label": "E", "text": "Thermal care is essential from birth.", "answer": "T", "rationale": "28-weekers have high surface-area-to-volume ratios and no brown fat. Hypothermia increases mortality, so plastic wraps and radiant warmers are used immediately in the delivery room."}]}, {"id": "Q0014", "type": "tf", "stem": "Concerning polycythaemia, which of the following is correct?", "system": "Neonatology", "topic": "Neonatal seizures & metabolic", "source": "TF Series A", "aiAuthored": false, "options": [{"label": "A", "text": "Maternal diabetes mellitus is a risk factor", "answer": "T", "rationale": "Maternal diabetes causes chronic intrauterine hypoxia, leading to increased fetal erythropoiesis."}, {"label": "B", "text": "A PCV of 60% in a 2-year-old is diagnostic", "answer": "F", "rationale": "Polycythaemia is diagnosed when PCV ≥ 65%. A value of 60% is elevated but not diagnostic."}, {"label": "C", "text": "It may cause neonatal seizures", "answer": "T", "rationale": "High viscosity (\"sludge blood\") reduces cerebral blood flow, which can lead to metabolic disturbances or small infarcts, triggering seizures."}, {"label": "D", "text": "Necrotising enterocolitis is a complication", "answer": "T", "rationale": "Hyperviscosity reduces perfusion to the gut (mesenteric ischemia), which is a known risk factor for NEC."}, {"label": "E", "text": "Conservative treatment is appropriate if asymptomatic", "answer": "T", "rationale": "Asymptomatic infants are managed with observation and adequate hydration."}]}, {"id": "Q0015", "type": "tf", "stem": "A 4-year-old girl presents with headache and bumping into objects. She has a webbed neck and widely spaced nipples. Upper limb BP is higher than lower limb BP. Which of the following additional findings is likely?", "system": "Endocrine & Genetics", "topic": "Genetics & chromosomal syndromes", "source": "TF Series A", "aiAuthored": false, "options": [{"label": "A", "text": "Wide carrying angle.", "answer": "T", "rationale": "Also known as cubitus valgus, this is a classic skeletal finding in girls with Turner Syndrome."}, {"label": "B", "text": "Bounding pulse.", "answer": "F", "rationale": "Bounding pulses are characteristic of Patent Ductus Arteriosus (PDA). In coarctation, you actually find weak or delayed femoral pulses."}, {"label": "C", "text": "Apical heave.", "answer": "T", "rationale": "Because the heart must pump against the narrow segment of the aorta, the Left Ventricle becomes thick (hypertrophy). This creates a forceful, sustained \"heave\" at the apex."}, {"label": "D", "text": "Right parasternal heave.", "answer": "F", "rationale": "Indicates right ventricular hypertrophy, seen in conditions like pulmonary hypertension. Coarctation primarily affects the left ventricle, not the right."}, {"label": "E", "text": "Left parasternal heave.", "answer": "F", "rationale": "Similar to D, this usually suggests right ventricular enlargement or severe left atrial enlargement, not the left ventricular pressure overload seen here. This girl has the classic phenotype of Turner Syndrome (webbed neck, spaced nipples). The blood pressure discrepancy (Upper > Lower) confirms she has Coarctation of the Aorta."}]}, {"id": "Q0016", "type": "tf", "stem": "A 2-year-old child with known structural heart disease awaiting surgery presents with fever, poor appetite, and worsening respiratory distress for 2 weeks. Murmurs are heard at the left upper and lower sternal borders. Which diagnosis is most likely?", "system": "Cardiology", "topic": "Infective endocarditis", "source": "TF Series A", "aiAuthored": false, "options": [{"label": "A", "text": "Rheumatic tricuspid valve disease.", "answer": "F", "rationale": ""}, {"label": "B", "text": "Pulmonary stenosis.", "answer": "F", "rationale": ""}, {"label": "C", "text": "Infective endocarditis.", "answer": "T", "rationale": ""}, {"label": "D", "text": "Kawasaki disease.", "answer": "F", "rationale": ""}, {"label": "E", "text": "Pericardial effusion.", "answer": "F", "rationale": "INFECTIVE ENDOCARDITIS (IE) IN PAEDIATRICS Definition Infective endocarditis is a microbial infection of the endocardial surface of the heart, most commonly involving the heart valves, but may also affect the chordae tendineae, mural endocardium, or prosthetic material. Epidemiology Rare in children but higher incidence in those with underlying heart disease Increasing survival of children with congenital heart disease (CHD) has increased IE prevalence More common in older children and adolescents, but can occur at any age. It is less common in infancy. Male ratio is approximately equal to female ratio. Classification Acute IE Time: Hours to days–<2 weeks Symptoms: High fever, toxic appearance, heart failure Organisms: Staphylococcus aureus, Gram-negative bacilli Subacute IE Time: 2–6 weeks or longer Symptoms: Low-grade fever, malaise, weight loss Organisms: Viridans and faecalis streptococci, HACEK, Enterococci, rickettsia, diphtheroids Aetiology (Causative Organisms) Common organisms Staphylococcus aureus – most common overall; acute, severe disease Viridans streptococci – common after dental procedures Enterococci Coagulase-negative staphylococci (especially prosthetic valves) HACEK organisms (slow-growing Gram-negative bacilli) Special situations Neonates: Staphylococcus aureus, Gram-negative bacilli, Candida IV drug use / central lines: Staphylococcus aureus Prosthetic valves: Coagulase-negative staphylococci Predisposing Factors (Risk Factors) ✓Cardiac risk factors (most important) •Congenital heart disease: Ventricular septal defect (VSD) Patent ductus arteriosus (PDA) Tetralogy of Fallot. It is less common in ASD and pulmonary stenosis •Prosthetic heart valves •Previous infective endocarditis •Acquired heart diseases like rheumatic heart disease (less common in children now) ✓Non-cardiac risk factors Indwelling central venous catheters Dental caries Dental or surgical procedures Immunosuppression (often associated with fungal IE)e.g malnutrition, malignancy, chemotherapy, steroid treatment and HIV. Septicaemic illness, especially staph aureus,gram –ve organisms. Prolonged iv cannulation. IV drug abuse Urethral catheterisation/ bladder instrumentation Pathophysiology Endothelial damage (turbulent blood flow in CHD) Formation of platelet–fibrin thrombus Transient bacteraemia Bacterial adherence and colonisation Formation of vegetations Continuous bacteraemia and embolisation Clinical Features General (Systemic) Persistent fever (most common) Malaise, fatigue Weight loss Night sweats Poor feeding (infants) Cardiac features: New or changing heart murmur Signs of heart failure (tachypnoea, hepatomegaly) Cardiomegaly Late (Autoimmune) Manifestations Cutaneous and peripheral signs Digital clubbing – chronic hypoxia or vascular changes Splinter haemorrhages – linear hemorrhages under nails Osler’s nodes – tender subcutaneous nodules on fingers/toes Janeway lesions – painless erythematous macules on palms/soles Roth spots – retinal hemorrhages with pale centers Renal manifestations Haematuria – microscopic or macroscopic Nephritis – immune complex–mediated glomerulonephritis Musculoskeletal manifestations Arthritis/arthralgia – usually migratory and immune-mediated Other autoimmune features Can include fever, fatigue, weight loss, and other systemic immune responses Complications-related symptoms Stroke or seizures (embolism) Haematuria (renal emboli or glomerulonephritis) and renal failure Worsening respiratory distress can occur in IE due to: Left-to-right shunt increase if vegetations worsen the defect Heart failure from valve destruction or regurgitation Pulmonary emboli from right-sided vegetations. Investigations •Blood cultures (KEY INVESTIGATION) Take at least 3 (ideally 6) separate blood cultures from different sites Before starting antibiotics (if patient stable) Usually positive in IE •Echocardiography Transthoracic echocardiography (TTE) – first line in children Shows: Vegetations Valve destruction Abscess Regurgitation •Chest xray and ECG for diagnosis of underlying heart disease •Laboratory findings Normocytic normochromic anaemia Raised ESR and CRP Leukocytosis (or normal in subacute IE) Microscopic haematuria Positive rheumatoid factor (occasionally) Diagnostic Criteria – Modified Duke Criteria Major criteria Positive blood cultures with typical organisms Evidence of endocardial involvement on echo Minor criteria Predisposing heart condition Fever ≥ 38°C Vascular phenomena (emboli, petechiae) Immunological phenomena (glomerulonephritis) Positive blood culture not meeting major criteria Definite IE: 2 major OR 1 major + 3 minor OR 5 minor criteria Management •General principles Admit and manage in hospital Multidisciplinary care (paediatrics, cardiology, microbiology) Prolonged IV antibiotics •Antibiotic therapy Start empirical IV antibiotics after blood cultures Antibiotics must be: Bactericidal Parenteral (IV) Prolonged (4–6 weeks) Viridans streptococci:Penicillin / Ampicillin / Amoxicillin + Gentamicin ± Probenecid Staphylococcus aureus (MSSA):Cloxacillin + Gentamicin or Vancomycin (if MRSA suspected) Others Unknown organism (empirical treatment):Penicillin + Gentamicin OR Cloxacillin + Gentamicin. Anaerobic infective endocarditis:Metronidazole. Fungal infective endocarditis:Amphotericin B Indications for Surgery Refractory heart failure Large vegetations with recurrent emboli Valve rupture or abscess Persistent bacteraemia despite antibiotics Prosthetic valve endocarditis with complications Surgeries in Infective Endocarditis Valve replacement Removal of vegetations Drainage of abscess Removal of mycotic aneurysm Embolectomy Correction of underlying heart defect Complications Heart failure (most common cause of death) Systemic embolisation (brain, kidney, spleen) Arrhythmias Valvular destruction Mycotic aneurysms Prevention (Prophylaxis) High-risk children who need prophylaxis Prosthetic heart valves Previous infective endocarditis Certain cyanotic congenital heart diseases Procedures requiring prophylaxis Dental procedures involving gingival manipulation Guidelines are based on recommendations from the American Heart Association. Prognosis Improved significantly with early diagnosis and treatment Mortality is higher in: Neonates Staphylococcus aureus infection Children with heart failure or prosthetic valves. Differential diagnosis Acute rheumatic fever Sickle cell disease (SCD) complications Myocarditis Pericardial effusion Cardiomyopathies / other cardiac muscle diseases Typhoid fever and other septicaemias Tuberculosis Immunoproliferative disorders HIV infection Collagen vascular diseases (e.g., Systemic Lupus Erythematosus)."}]}, {"id": "Q0017", "type": "tf", "stem": "A 6-year-old child with Down syndrome and ventricular septal defect in congestive heart failure will present with:", "system": "Cardiology", "topic": "Congenital heart disease", "source": "TF Series A", "aiAuthored": false, "options": [{"label": "A", "text": "Vesicular breath sounds at lung bases", "answer": "F", "rationale": "may have crackles or crepitations due to pulmonary congestion"}, {"label": "B", "text": "Respiratory rate of 65 cycles per minute", "answer": "T", "rationale": "tachypnoea is common in CHF"}, {"label": "C", "text": "Pansystolic murmur loudest at the left lower sternal border", "answer": "T", "rationale": "classic VSD murmur"}, {"label": "D", "text": "Right hypochondrial pain", "answer": "F", "rationale": "not a typical feature"}]}, {"id": "Q0018", "type": "tf", "stem": "Concerning infective endocarditis, which of the following is true?", "system": "Cardiology", "topic": "Infective endocarditis", "source": "TF Series A", "aiAuthored": false, "options": [{"label": "A", "text": "Glomerulonephritis is an immune-complex manifestation", "answer": "T", "rationale": ""}, {"label": "B", "text": "Group A beta-haemolytic streptococcus is the commonest cause", "answer": "F", "rationale": "Staphylococcus aureus is most common in children with underlying heart disease"}, {"label": "C", "text": "Blood cultures should be collected within one hour", "answer": "F", "rationale": "blood cultures are ideally collected before starting antibiotics, but there’s no strict “within 1 hour” rule"}, {"label": "D", "text": "Prosthetic valves worsen prognosis", "answer": "T", "rationale": "prosthetic valve endocarditis has higher morbidity/mortality"}, {"label": "E", "text": "Thrombolytics are useful in management", "answer": "F", "rationale": "thrombolytics are not used in infective endocarditis"}]}, {"id": "Q0019", "type": "tf", "stem": "Concerning shock:", "system": "Others (Emergency/Social)", "topic": "Shock & resuscitation", "source": "TF Series A", "aiAuthored": false, "options": [{"label": "A", "text": "Tachycardia alone defines compensated shock", "answer": "F", "rationale": "Compensated shock is defined by signs like tachycardia, delayed capillary refill, cool extremities; tachycardia alone is not enough. Compensated shock is when the body maintains blood pressure through compensatory mechanisms such as tachycardia and vasoconstriction."}, {"label": "B", "text": "Hypotension is a late sign", "answer": "T", "rationale": "In shock, particularly in children, hypotension does not occur early; it’s a late and ominous sign of decompensation."}, {"label": "C", "text": "Distributive shock is the commonest type in Nigeria", "answer": "F", "rationale": "Hypovolemic shock, often due to dehydration or malaria, is most common"}, {"label": "D", "text": "The site of fluid loss is always obvious", "answer": "F", "rationale": "Internal bleeding or insensible losses may be hidden"}, {"label": "E", "text": "Multi-organ dysfunction is a complication", "answer": "T", "rationale": "Shock, if prolonged and untreated, leads to organ hypoperfusion and multiple‑organ dysfunction or failure."}]}, {"id": "Q0020", "type": "tf", "stem": "Recognition and care of critically ill children:", "system": "Others (Emergency/Social)", "topic": "Emergency care & triage", "source": "TF Series A", "aiAuthored": false, "options": [{"label": "A", "text": "Grunting indicates severe respiratory distress in infants", "answer": "T", "rationale": "Grunting enhances functional residual capacity and is a key sign of increased work of breathing and respiratory distress in infants"}, {"label": "B", "text": "Agitation may require oxygen therapy", "answer": "T", "rationale": "Agitation and altered behavior can be a sign of hypoxia, and recognition leads to considering O₂ therapy to correct poor oxygenation."}, {"label": "C", "text": "Minor airway narrowing does not significantly affect infants", "answer": "F", "rationale": "Infants have narrow airways — even small degrees of narrowing greatly increase resistance and work of breathing."}, {"label": "D", "text": "Oxygen humidification is unnecessary", "answer": "F", "rationale": "For prolonged oxygen therapy, humidification is important to prevent mucosal dryness, thick secretions, and airway irritation — standard practice in pediatrics."}, {"label": "E", "text": "Cuffed endotracheal tubes are preferred for intubation", "answer": "T", "rationale": "Current pediatric airway guidelines support the use of cuffed endotracheal tubes in most children (especially >3 kg) with proper cuff pressure management."}]}, {"id": "Q0021", "type": "tf", "stem": "A 36 hour old child presents with a 2 hour history of jerky repetitive movements for about 30 minutes. Which of the following is true", "system": "Neonatology", "topic": "Neonatal seizures & metabolic", "source": "TF Series A", "aiAuthored": false, "options": [{"label": "A", "text": "Positive family history is important", "answer": "F", "rationale": "Most neonatal seizures are symptomatic (hypoxic-ischaemic encephalopathy, metabolic, infection). Family history is less important than perinatal events."}, {"label": "B", "text": "Inability to breathe spontaneously at birth, requiring bag-and-mask ventilation for 6 minutes is a risk factor", "answer": "T", "rationale": "This suggests perinatal asphyxia, the commonest cause of seizures in the first 72 hours of life."}, {"label": "C", "text": "Severe jaundice is a possible cause", "answer": "T", "rationale": "Severe unconjugated hyperbilirubinaemia can cause kernicterus, which may present with seizures."}, {"label": "D", "text": "Random blood glucose should be deferred", "answer": "F", "rationale": "Blood glucose must be checked immediately. Hypoglycaemia is a common, reversible cause of neonatal seizures."}, {"label": "E", "text": "The first-line drug of choice for treatment is IV phenobarbital", "answer": "T", "rationale": "After correcting reversible causes (glucose, calcium, electrolytes), IV phenobarbital is first-line."}]}, {"id": "Q0022", "type": "tf", "stem": "15 year old girl with cervical and axillary lymphadenopathy she is plethoric with facial edema in respiratory distress and upper body Swelling , which of the following is true.", "system": "Haematology & Oncology", "topic": "Childhood cancers", "source": "TF Series A", "aiAuthored": false, "options": [{"label": "A", "text": "Burkitt lymphoma is a likely diagnosis", "answer": "F", "rationale": "Burkitt lymphoma usually presents with jaw or abdominal masses, not mediastinal compression."}, {"label": "B", "text": "Hodgkin lymphoma is a likely diagnosis", "answer": "F", "rationale": ""}, {"label": "C", "text": "Chest X-ray is indicated", "answer": "T", "rationale": "Urgently indicated to assess for mediastinal mass and airway compromise."}, {"label": "D", "text": "No investigation until pathologic diagnosis is confirmed", "answer": "F", "rationale": "This is an oncologic emergency. Imaging and supportive evaluation must not be delayed."}, {"label": "E", "text": "Dexamethasone may be useful", "answer": "T", "rationale": "The diagnosis is superior vena cava syndrome. Other notes OBSTRUCTIVE ONCOLOGIC EMERGENCIES These are life-threatening complications caused by tumour compression of vital structures. They include: Thoracic emergencies Superior Vena Cava Syndrome (SVCS) Superior Mediastinal Syndrome (SMS) Central Nervous System emergency Spinal cord compression 1. SUPERIOR VENA CAVA SYNDROME (SVCS) Definition Signs and symptoms resulting from obstruction of blood flow through the superior vena cava (SVC). Types of Obstruction Extrinsic – Compression by an external mass (e.g., tumour) Intrinsic – Thrombosis within the SVC Major Causes: Lymphomas Acute lymphoblastic leukaemia (especially T-cell type) Sarcomas Neuroblastoma Germ cell tumours Clinical Presentation Facial, neck, upper chest and arm edema Facial plethora Conjunctival edema Distended neck and chest veins Cerebral symptoms: Headache Dizziness Confusion Visual disturbance Loss of consciousness 2. SUPERIOR MEDIASTINAL SYNDROME (SMS) Definition Symptoms caused by obstruction of: Airways (trachea, main bronchi) Great thoracic vessels Usually due to a mediastinal mass. Causes of Symptoms Local mass effect Systemic tumour effects Infection Clinical Features (Based on Structure Involved) •Trachea / Main bronchi: Stridor Dyspnea Cough Lung collapse •Oesophagus: Dysphagia •Left recurrent laryngeal nerve:Hoarseness of voice •Phrenic nerve: Hemidiaphragm paralysis •Sympathetic trunk: Horner’s syndrome Investigations (SVCS & SMS) Chest X-ray (very useful initial test) CT scan MR angiography Echocardiography Ultrasound with Doppler flow Treatment of SVCS / SMS •Immediate Supportive Measures Elevate head (keep patient propped up) Supplemental oxygen via face mask Calm, quiet environment (minimal handling) Avoid sedatives Moderate diuresis (loop diuretics) Dexamethasone (6-hourly) •Definitive Management Endovascular stenting Tissue diagnosis Radiotherapy (for radiosensitive tumours — effect seen within 72 hours) 3. SPINAL CORD COMPRESSION Epidemiology: Occurs in about 4% of children with cancer. •Associated Tumours: Lymphomas Leukaemia Sarcomas Neuroblastoma •Mechanisms Direct tumour extension Metastasis to vertebrae causing secondary compression Spread to epidural space via vertebral foramina Subarachnoid spread from CNS tumours (e.g., medulloblastoma). Clinical Features Back pain (early sign) Dermatomal increased sensation Weakness/paralysis below level of compression Reduced sensation below level Hyperreflexia Urinary and faecal incontinence. Investigation: MRI (mainstay of diagnosis) X-ray abnormal in only 30–35% of cases Treatment Dexamethasone (immediate) Immobilization Surgery Emergency radiotherapy Chemotherapy HODGKIN LYMPHOMA (HL) Clinical Features Progressive, painless enlargement of lymph nodes which commonly involves cervical, supraclavicular, and mediastinal nodes. Systemic (“B”) symptoms may occur: fever, night sweats, weight loss Age Distribution Bimodal age peak: 15–35 years >50 years Uncommon below 5 years Clinical forms: Childhood form: <15 years Young adult form: 15–34 years Older adult form: >55 years Pathology Strong association with Epstein–Barr virus (EBV) in many cases Characteristic Reed–Sternberg cells Background infiltrate includes: Lymphocytes Histiocytes Plasma cells Classification (REAL / WHO) Two major classes: •Nodular lymphocyte-predominant Hodgkin lymphoma •Classical Hodgkin lymphoma, with four histologic subtypes: Lymphocyte-rich Nodular sclerosis (most common) Mixed cellularity Lymphocyte depletion Diagnosis •Excisional lymph node biopsy (gold standard) •Staging Investigations Full blood count (FBC) Liver function tests (LFTs) Chest X-ray (CXR) CT scan of chest and abdomen Bone marrow examination Treatment •Chemotherapy: ABVD: Adriamycin, Bleomycin, Vinblastine, Dacarbazine MOPP: Nitrogen mustard, Oncovin (vincristine), Procarbazine, Prednisone COPP (alternative to MOPP) •Radiotherapy (especially in early-stage disease or bulky nodes). NON-HODGKIN LYMPHOMA (NHL) Epidemiology Common age: 5–15 years Male predominance Clinical Features Disease may be nodal or extranodal Common sites: •Abdomen:Gastrointestinal tract (may present with intussusception, especially >6 years) Mediastinum •Head and neck •Peripheral lymph nodes •Other possible sites: Bone Breast Gonads Orbit Skin Treatment •Chemotherapy:CHOP: Cyclophosphamide, Doxorubicin, Vincristine, Prednisone •Radiotherapy (selected cases) •Surgery:Mainly for diagnosis or management of complications (e.g., bowel obstruction). 24. concerning sickle cell disease A- Prevalence in Nigeria is about 2% T Nigeria statistics: 1 to 2 million HbSS patients 2 to 3 percent of the population have HbSS B- Hand foot syndrome; 6 to 24months T Hand-foot syndrome, or Dactylitis, is often the first clinical manifestation of SCD. It typically occurs between 6 months and 2 years of age. It rarely occurs after age 5 because the bone marrow in the small bones of the hands and feet is replaced by fat as the child grows, reducing the risk of infarcts in those specific areas. C- Aplastic crisis pancytopenia F An Aplastic Crisis in SCD (usually triggered by Parvovirus B19) primarily affects the red blood cell precursors, causing a sudden drop in Hemoglobin and a low Reticulocyte count. Pancytopenia (drop in RBCs, WBCs, and Platelets) is characteristic of Aplastic Anemia, not a Sickle Cell Aplastic Crisis. In SCD, the white cells and platelets usually remain at their baseline levels. D- PCV is administered in infancy T PCV (pneumococcal conjugate vaccine) is given in infancy because children with SCD are functionally asplenic and at high risk of invasive pneumococcal infections. E- Delated puberty is a feature. T Notes: Sickle Cell Disease (SCD) Definition Sickle Cell Disease is a genetic hemoglobin disorder characterized by the presence of hemoglobin S (HbS). Genotypes associated with SCD: HbSS – sickle cell anemia, the most severe form HbSC – combination of HbS and HbC S-thalassemia – combination of HbS and beta-thalassemia HbSD – combination of HbS and HbD Hemoglobin AS (HbAS) is not considered SCD; it is the sickle cell trait. Biochemistry and Pathophysiology Mutation: glutamic acid is replaced by valine at position six of the beta-globin chain. Deoxygenated hemoglobin S forms polymers, leading to sickle-shaped red blood cells. Sickled red blood cells are: Fragile and destroyed by the reticuloendothelial system, leading to shortened red blood cell lifespan. Rigid and sticky, which blocks microcirculation, causing vaso-occlusion, tissue infarction, and organ damage. Epidemiology: Most common among black populations of West and Central Africa. Found worldwide due to migration, including North and South America. Present in Mediterranean countries such as Italy, Greece, India, and Saudi Arabia. Nigeria statistics: 1 to 2 million HbSS patients 2 to 3 percent of the population have HbSS Ibadan studies report: HbSS 3.1 percent HbSC 1.1 percent HbAS 23.7 percent Pathophysiology 1. Sickled red blood cells block microvasculature, causing vaso-occlusion, tissue infarction, pain, and organ damage. 2. Red blood cell lifespan is shortened to approximately 17 days, leading to chronic anemia. 3. Chronic anemia stimulates bone marrow activity, increasing production six to eight times normal, resulting in widening of the diploe in the skull. Clinical Features Stable State / Chronic Findings Chronic hemolytic anemia: pallor, fatigue Jaundice Skeletal changes: bossing of the skull, gnathopathy Sickle cell habitus: stunted growth, delayed puberty Hepatosplenomegaly Heart: haemic murmur Crises Precipitating Factors: Infection Hypoxia Cold exposure Acidosis Dehydration Vaso-Occlusive (Painful) Crises Clinical features: Bones: hand-foot syndrome (dactylitis), long bones, ribs, vertebrae Abdomen: may mimic acute surgical abdomen Management: Identify and treat precipitating cause Bed rest Liberal fluids, orally or intravenously, at least 1.5 times maintenance. Analgesics for pain. Typically lasts less than one week. Hydroxyurea indicated for frequent recurrent crises. Hydroxyurea Increases fetal hemoglobin (HbF),reducing the frequency of crises. Anemic Crises 1. Acute Splenic Sequestration Pooling of blood in the spleen. Rapid splenic enlargement. Severe anemia, may lead to shock and death. Common in younger children Management: Urgent blood transfusion Identify and treat precipitating cause Splenectomy only considered for recurrent episodes 2. Aplastic Crisis Temporary cessation of red blood cell production Often triggered by Parvovirus B19 infection. Marked drop in hemoglobin and reticulocyte count. White blood cell and platelet counts usually normal Management: Urgent blood transfusion Treat underlying cause 3. Hyperhemolytic Crisis Increased hemolysis leading to worsening anemia and jaundice. Often triggered by infections. Management: Blood transfusion Treat underlying cause Hydroxyurea for recurrent cases. Indications for Blood Transfusion Severe anemia or drop in hematocrit. Hemodynamic instability Other associated conditions (sepsis, acute crises). Specific complications: stroke, acute chest syndrome, splenic sequestration Other Complications •Infections: Increased susceptibility, especially to encapsulated organisms (Pneumococcus, Haemophilus influenzae). Common infections: septicemia, meningitis, pneumonia •Osteomyelitis:Staphylococcus aureus and Salmonella species •Neurological Complications: Stroke may cause hemiparesis and cranial nerve palsies Management: exchange transfusion with HbA or simple transfusion, hypertransfusion regimen, IV fluids •Respiratory: Acute chest syndrome: fever, chest pain, hypoxia Management: oxygen, IV fluids, antibiotics, blood transfusion as needed •Cardiovascular:Heart failure Genitourinary: Urinary tract infections, hematuria, hyposthenuria, nephrotic syndrome, renal failure,priapism Skeletal: Avascular necrosis of the femoral or humeral head Diagnosis Hemoglobin electrophoresis (neonatal: HPLC, isoelectric focusing; post-neonatal: citrate agar, cellulose acetate) Packed cell volume (PCV) Peripheral blood smear Full blood count Management •Stable State: Counseling and education Daily medications Vaccinations: Pneumococcus, Haemophilus influenzae type B Penicillin prophylaxis Folic acid supplementation Proguanil for malaria prophylaxis in endemic regions Crisis Management: Vaso-occlusive crisis: analgesia, hydration, bed rest; hydroxyurea for frequent crises. Anemic crises: urgent transfusions; hydroxyurea for recurrent hemolytic crises; treat underlying causes. Stroke: exchange or simple transfusion to increase HbA. Acute chest syndrome: oxygen, IV fluids, antibiotics, transfusion. Splenic sequestration: urgent transfusion; splenectomy only if recurrent. Other Therapeutic Approaches Bone marrow transplantation Hydroxyurea to reduce sickling and crises Anti-sickling drugs in development Prevention Education and awareness Prenatal diagnosis Other Hemoglobinopathies S+C Disease: milder than HbSS; higher risk of proliferative sickle retinopathy. S + β Thalassemia: S β0-thal resembles HbSS; S β+-thal is mild. S-HPFH (Hereditary Persistence of Fetal Hemoglobin): very mild; may develop avascular necrosis and mild hemolytic anemia. Life Expectancy About 50% survive beyond the fifth decade in the United States. No definitive statistics available for Nigeria"}]}, {"id": "Q0023", "type": "tf", "stem": "Concerning sickle cell anemia, which are correctly paired", "system": "Haematology & Oncology", "topic": "Sickle cell disease", "source": "TF Series A", "aiAuthored": false, "options": [{"label": "A", "text": "A cerebrovascular accident is treated with EBT with Hb A blood.", "answer": "T", "rationale": ""}, {"label": "B", "text": "Vaso-occlusive crisis is treated with 1.5 × maintenance fluid.", "answer": "T", "rationale": ""}, {"label": "C", "text": "Repeat splenic sequestration is treated with splenectomy.", "answer": "T", "rationale": ""}, {"label": "D", "text": "Priapism is corrected with intracarvenous etilephrine.", "answer": "T", "rationale": ""}, {"label": "E", "text": "in aplastic anemia there is pancytopaenia.", "answer": "F", "rationale": ""}]}, {"id": "Q0024", "type": "tf", "stem": "A 2 year old child rushed into OTCHEW with a 3 day history of fever, altered sensorium and had one episode of convulsion. The following are possible diagnoses", "system": "Neurology", "topic": "CNS infections & coma", "source": "TF Series A", "aiAuthored": false, "options": [{"label": "A", "text": "Cerebral malaria", "answer": "T", "rationale": "In a malaria-endemic country like Nigeria, fever + coma/altered consciousness ± seizures is classic for cerebral malaria."}, {"label": "B", "text": "Pyogenic meningitis", "answer": "T", "rationale": "Bacterial meningitis commonly presents with fever, seizures, and altered mental status in this age group."}, {"label": "C", "text": "Epilepsy", "answer": "F", "rationale": "Epilepsy is recurrent unprovoked seizures. This child has an acute febrile illness with altered sensorium — more suggestive of infection than epilepsy."}, {"label": "D", "text": "Febrile seizure", "answer": "F", "rationale": "Simple febrile seizures are brief (<15 min), generalized, and the child rapidly regains consciousness. Persistent altered sensorium over days is NOT typical. (Even complex febrile seizures would not cause prolonged altered consciousness for 3 days.)"}, {"label": "E", "text": "Viral encephalitis", "answer": "T", "rationale": "Encephalitis classically presents with fever, seizures, and altered consciousness."}]}, {"id": "Q0025", "type": "tf", "stem": "A child presented to the emergency department after consuming a bottle of cough syrup contaminated with ethylene glycol. Her RBG was checked. Which of the following is true", "system": "Others (Emergency/Social)", "topic": "Poisoning & toxicology", "source": "TF Series A", "aiAuthored": false, "options": [{"label": "A", "text": "Fomepizole is an antidote", "answer": "T", "rationale": "Fomepizole inhibits alcohol dehydrogenase, preventing the metabolism of ethylene glycol into its toxic metabolites (like oxalic acid)."}, {"label": "B", "text": "Gastric lavage after 4 hours is still effective", "answer": "F", "rationale": "Ethylene glycol is rapidly absorbed (usually within 1–2 hours). Lavage after 4 hours is generally ineffective. Gastric lavage is generally only effective if performed within 30–60 minutes of ingestion."}, {"label": "C", "text": "It can cause AKI", "answer": "T", "rationale": "One of the classic hallmarks of ethylene glycol poisoning is Acute Kidney Injury (AKI) caused by the formation of calcium oxalate crystals in the renal tubules."}, {"label": "D", "text": "Hypoglycemia could be a cause of unconsciousness", "answer": "F", "rationale": "Ethylene glycol causes CNS depression due to metabolic acidosis and toxic metabolites, not hypoglycemia (hypoglycemia is more typical of severe ethanol poisoning in children)."}, {"label": "E", "text": "It is a classic example of the My Pikin poison incidence", "answer": "T", "rationale": "My Pikin incident (Nigeria, 2008-9) involved diethylene glycol in teething syrup, not ethylene glycol in cough syrup. 28.Concerning tanner staging"}, {"label": "A", "text": "Testicular volume of 10 +- 2 is seen in tanner stage 1.", "answer": "F", "rationale": ""}, {"label": "B", "text": "First visible sign in females being breast development.", "answer": "T", "rationale": ""}, {"label": "C", "text": "Pubic hair extending to the thighs in tanner stage 5.", "answer": "T", "rationale": ""}, {"label": "E", "text": "The first sign of puberty in males is pubic hair.", "answer": "F", "rationale": "The first physical sign of puberty in males is testicular enlargement. Other notes: Puberty ccurs between 8 & 14years of age in girls and 9 & 14years of age in boys. Female sexual development Female puberty begins at about age 11, but can range from about ages 8 to 14. The first sign is breast development followed by a growth spurt. With improved nutrition, increasing obesity, hormonal exposures and other environmental/societal alterations, this age has been decreasing in the last few decades (secular trends). Male Sexual Development Male sexual development generally begins at an average age of 11.6 years (range 9 -13.5 years). The first physical sign of puberty in males is testicular enlargement. Puberty takes about 3 years to complete but may range from 2 to 5 years. Tanner Staging /Sexual Maturity rating (SMR) • Sexual maturity ratings include breastdevelopment in females, genital development in males and pubic hairdevelopment in both males and females. • Puberty is divided into five stages, called Tanner Stages. Definitions of stages Pubic hair (both male and female) • Tanner I -- none (pre-pubertal state) • Tanner II -- small amount of long, downy hair with slight pigmentation at the base of the penis and scrotum (males) or on the labia majora (female) • Tanner III -- hair becomes more coarse and curly, and begins to extend laterally • Tanner IV -- adult-like hair quality, extending across pubis but sparing medial thighs • Tanner V -- hair extends to medial surface of the thighs Genitals (male) • Tanner I – pre-pubertal (testicular volume less than 4 small penis) • Tanner II -- testicular volume between 4 and 6 ml; skin on scrotum thins, reddens and enlarges; penis length unchanged • Tanner III -- testicular volume between 6 and 12 ml; scrotum enlarges further; penis begins to lengthen • Tanner IV -- testicular volume between 12 and 20 ml; scrotum enlarges further and darkens; penis increases in length and circumference • Tanner V -- testicular volume greater than 20 ml; adult scrotum and penis. Breasts (female) • Tanner I -- no glandular tissue; areola follows the skin contours of the chest (pre-pubertal) • Tanner II -- breast bud forms, with small area of surrounding glandular tissue; areola begins to widen • Tanner III -- breast begins to become more elevated, and extends beyond the borders of the areola, which continues to widen but remains in contour with surrounding breast • Tanner IV -- increased breast size and elevation; areola and papilla form a secondary mound projecting from the contour of the surrounding breast • Tanner V -- breast reaches final adult size; areola returns to contour of the surrounding breast, with a projecting central papilla"}]}, {"id": "Q0026", "type": "tf", "stem": "Regarding acute severe asthma", "system": "Pulmonology", "topic": "Asthma", "source": "TF Series A", "aiAuthored": false, "options": [{"label": "A", "text": "Too breathless to talk and too breathless to feed", "answer": "T", "rationale": ""}, {"label": "B", "text": "Oral prednisolone is indicated", "answer": "T", "rationale": ""}, {"label": "C", "text": "IV aminophylline is indicated", "answer": "F", "rationale": ""}, {"label": "D", "text": "The use of pressured metered dose inhaler is not appropriate in its initial management", "answer": "F", "rationale": ""}, {"label": "E", "text": "it should be managed in the ICU", "answer": "F", "rationale": "Notes: Acute Life Threatening Asthma • Cyanosis, a silent chest, or poor respiratory effort • Fatigue or exhaustion • Agitation or reduced level of consciousness Acute Severe Asthma Severe asthma • Too breathless to talk • Too breathless to feed • Tachypnoea • Tachycardia • Retractions Moderate/Mild Acute Exacerbation Moderate acute exacerbation • Talks in phases •Tachypnea •Usually retractions •Loud wheeze Mild acute exacerbation •Talks in sentence •Breathless while walking •Increased respiratory rate •Usually no retraction •Wheeze moderate, often only end expiratory Acute therapy of asthma requires: Resuscitation, Triage, Oxygen, Bronchodilators (RTOB). In management of Acute Exacerbation of Asthma, the steps for management are organized as follows: 1. Initial Assessment The first step for any patient is the ABC assessment: A: Airway B: Breathing C: Circulation 2. Immediate Triage for Life-Threatening FeaturesAssess if any of the following \"Life-threatening\" signs are present: Drowsiness, Confusion, Silent chest, or Cyanosis. If YES (Life-Threatening Attack): Consult ICU immediately. Start SABA (Salbutamol), Oxygen, and Ipratropium. Administer Magnesium sulphate and I.V. Aminophylline. Prepare for intubation. 3. Management by Severity (No Life-Threatening Features) If the emergency signs above are absent, triage the patient based on clinical status into one of two pathways: Mild or Moderate Attack Salbutamol (SABA): Administer via MDI/spacer. Review every 20 minutes (twice at 20 and 40 mins). ≤ 5 years: 4 to 6 puffs. > 5 years: 6 to 10 puffs. Oral Prednisolone: 1–2 mg/kg (maximum 40–60 mg). Oxygen: Indicated only if SpO2 is < 95%. Ipratropium Bromide: Can be considered. Outcome: If the patient improves, consider discharge planning; if they deteriorate, move to the \"Severe\" pathway. Severe Attack Salbutamol: Administer via MDI/spacer or Nebulizer. Review every 20 minutes (twice at 20 and 40 mins). ≤ 5 years: 4 to 6 puffs. > 5 years: 6 to 10 puffs. Steroids: Oral Prednisolone (1–2 mg/kg) OR I.V. Hydrocortisone sodium succinate (4 mg/kg). Oxygen: Mandatory if SpO 2 is < 95%. Additional Therapies: Ipratropium bromide, Magnesium sulphate, or high-dose ICS should be considered. Outcome: If the patient deteriorates, escalate to the life-threatening/ICU protocol."}]}, {"id": "Q0027", "type": "tf", "stem": "Concerning childhood tumors:", "system": "Haematology & Oncology", "topic": "Childhood cancers", "source": "TF Series B", "aiAuthored": false, "options": [{"label": "A", "text": "Burkitt's lymphoma is most common in Nigeria.", "answer": "F", "rationale": ""}, {"label": "B", "text": "Retinoblastoma is most common in Ibadan.", "answer": "T", "rationale": ""}, {"label": "C", "text": "CNS tumor is the commonest in Caucasian.", "answer": "F", "rationale": ""}, {"label": "D", "text": "Most retinoblastomas are hereditary.", "answer": "F", "rationale": ""}, {"label": "E", "text": "Hepatoblastoma is associated with hemihypertrophy and Beckwith-Wiedeman syndrome.", "answer": "F", "rationale": "Extra notes: BURKITT LYMPHOMA • Malignant Lymphocytes of B lymphocyte origin • They are endemic in tropical Africa • Sporadic in Far East, Central and South America, Europe • HIV associated BL • Fastest growing tumour in man –24hr doubling time. ENDEMIC BURKITT AETIOLOGY • Epstein Barr Virus • Malaria infection • Chromosomal translocation 8;14, 8;22, 2;8 C-Myc oncogene (on Chr 8) critical in regulation of cell poliferation. PATHOLOGY FNAB –Cytology Histology: Starry –Sky appearance CLINICAL FEATURES Age: 2-16yrs peak 7yrs M>F ratio 1.7:1 SITE •Jaw; esp maxilla or orbit –loosening of teeth “dental anarchy”, jaw swelling •Abdomen-bowels, kidney, mesentery, ovaries •CNS-cranial nerve palsies, paraplegia (usually flacid), asymptomatic CSF pleocytosis • Others –thyroid, breast, testes. • Multi centric nature STAGING A – Solitary extra abdominal site AR – Completely (>90%) resected intra abdominal tumour B – Multiple extra abdominal sites C – Intra abdominal tumour + facial tumour D – Intra abdominal tumour + sites other than facial INVESTIGATIONS Tumour aspirate for cytology/incisional biopsy FBC, bone marrow, E/U, Cr, uric acid, Ca, P X-rays-jaw: loss of dental lamina dura, osteolytic lesions, dental malalignment CXR, IVU, Abd, USS, Spinal myelogram CSF –cytology TREATMENT • Chemotherapy- mainstay IV Cyclophosphamide IV Vincristine PO Prednisolone IV Cytosine arabinoside or methotrexate IT cytosine arabinoside or methotrexate • Radiotherapy- not successful • Surgery –not essential. PROGNOSIS Extent –stage Worse in CNS, Bone marrow, peripheral blood manifestations Age-worse in > 13yrs Most regress with chemotherapy but relapse is common. 80-95% survival in some reports. RETINOBLASTOMA It is the commonest childhood tumour in ibadan/Nigeria (burkitt lymphoma was previously the commonest). Malignant eye tumour arising from the retina. 60% non-hereditary and unilateral 15% hereditary and unilateral 25% hereditary and bilateral Hereditary form transmitted as auto dominant trait with 90% penetrance. Mut / Del of chromosome 13. CLINICAL FEATURES - Cat’s eye reflex / leucocoria (white pupillary reflex). - Mass protruding through the eye, strabismus, proptosis (late). PATHOLOGY Metastasizes to brain, orbit, lymph nodes, face, lung. TREATMENT Surgery Laser photocoagulation Cryotherapy Chemotherapy –Vincristine Etoposide, Carboplastin (VEC) Radiotherapy. Leukemia is the commonest childhood malignancy in whites and accounts for 4.2% of childhood tumours in Ibadan. CNS MALIGNANCIES They can either be private or secondary. PATHOLOGY Majority arise from glial cells e.g.astrocytomas, ependymomas. CLINICAL FEATURES >50% in the posterior fossa generally. Majority is hemipheric in Ibadan Peak age: 2nd half of first decade Symptoms and signs depend on histological characteristics and rate of growth. Features are: >Focal neurological deficit: Features of raised ICP which are; Early morning headaches relieved by standing rapid head enlargement Cranial nerve VI palsy Papillodema Personality changes Vomiting. INVESTIGATIONS X-RAYS • Plain • Angiography • Myelography CT Scan / MRI CSF cytology EEG Endocrine –ACTH, TSH, GH, LH, FSH TREATMENT Surgery Radiotherapy Combination chemotherapy WILMS’ TUMOUR (NEPHROBLASTOMA) Age: 1-5yrs, peak 3-4yrs Associated congenital abnormality include genitourinary tract abnormality, aniridia, hemihypertrophy, Beckwith Wiedemann syndrome +/- deletion of chromosome II. PATHOLOGY Lobulated, gray to pink, initially encapsulated Metastasis –lymph nodes, lungs, liver, bone,brain. CLINICAL FEATURES Abdominal mass which usually does not cross the midline. Pain –haemorrhage (usually painless) Haematuria Hypertension Polycythemia INVESTIGATIONS Urinalysis, Ivu, Abdominal USS. Differentials include neuroblastoma, hepatoblastoma, rhabdmyosarcoma, bening cystic tumours STAGING I – limited to one kidney II – extends beyond capsule but can be completely excised III – residual nonhematogenous extension IV – hematogenous metastasis V – bilateral TREATMENT - Surgery - Radiotherapy - Chemotherapy –Vincristine, Actinomycin D, Doxorubicin, Cyclophosphamide PROGNOSIS - Histology –anaplasia unfavourable - Age –younger better <2yrs - Extent –stage"}]}, {"id": "Q0028", "type": "tf", "stem": "The following are pathognomonic/constant features of Down’s syndrome:", "system": "Endocrine & Genetics", "topic": "Genetics & chromosomal syndromes", "source": "TF Series B", "aiAuthored": false, "options": [{"label": "A", "text": "Hypotonia", "answer": "T", "rationale": ""}, {"label": "B", "text": "Single palmar crease", "answer": "F", "rationale": ""}, {"label": "C", "text": "Dysmorphic features", "answer": "T", "rationale": ""}, {"label": "D", "text": "Intellectual disability", "answer": "T", "rationale": ""}, {"label": "E", "text": "Abnormal dermatoglyphics", "answer": "T", "rationale": "Pathognomic/Constant / Highly Consistent Features of down syndrome are: Generalized hypotonia. Abnormal dermatoglyphics e.g increased ulnar loops. Characteristic facial dysmorphism – including flat facial profile, upslanting palpebral fissures, epicanthal folds Intellectual disability – mild to moderate, present in nearly 100% of cases Common but not constant features are: Simian crease Brushfield spots Sandal gap Congenital heart disease (ASD, VSD, PDA). atrioventricular septal defect (AVSD) is the most common congenital heart disease in down syndrome. 3) Regarding Neonatal cholestasis:"}, {"label": "A", "text": "Well looking and well-nourished appearance is suggestive of biliary atresia.", "answer": "T", "rationale": ""}, {"label": "B", "text": "Low birth weight is suggestive of biliary atresia.", "answer": "F", "rationale": ""}, {"label": "C", "text": "Normal uptake on radionucleotide scan with absent excretion is suggestive of idiopathic neonatal hepatitis.", "answer": "F", "rationale": ""}, {"label": "D", "text": "Conjugated bilirubin is < 2mg/dl or <15-20% of total bilirubin.", "answer": "F", "rationale": ""}, {"label": "E", "text": "Galactosemia is caused by GALT gene mutation on chromosome 19.", "answer": "F", "rationale": "Other notes: In neonatal Cholestasis, there is; ✓prolonged conjugated hyperbilirubinaemia in the newborn period ✓Conjugated bilirubin >15% of total bilirubin ✓It is caused by a group of hepatobiliary diseases occurring within the first 3 months of life. COMMON ETIOLOGIES • Premature infants: Sepsis, total parental nutrition (TPN) • Idiopathic neonatal hepatitis • Extrahepatic biliary atresia • Intrahepatic cholestasis syndromes Evaluation. • History – Pale stool colour: Consider cholestatic disease – Fever, rash in the first trimester of pregnancy: Consider TORCH infections – Haemolysis, jaundice: – Haemolysis, jaundice: Consider ABO +Rh incompatibility leading to stones – UTI, Sepsis: Consider Neonatal infection – Diarrhoea, vomiting, poor weight gain on introduction of feeds: Consider Galactosaemia, UTI, S
