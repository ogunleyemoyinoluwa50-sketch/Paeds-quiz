topic": "CKD & renal replacement", "source": "TF Series B", "aiAuthored": false, "options": [{"label": "A", "text": "Renal replacement therapy is indicated when GFR is 30ml/kg or less", "answer": "F", "rationale": "Preparation for renal replacement therapy is indicated in GFR 30ml/min/1.73m². Renal replacement (if uremia present) (or dialysis) Is indicated in 15ml/min/1.73m²."}, {"label": "B", "text": "CCPD more user friendly than CAPD", "answer": "F", "rationale": "CCPD (Continuous Cycling Peritoneal Dialysis) uses a machine and is done overnight. CAPD (Continuous Ambulatory Peritoneal Dialysis) is manual, done during the day. CAPD is often considered more user-friendly because it doesn't require a machine or electricity and can be done at home without overnight dependence."}, {"label": "C", "text": "The best phosphate binder is aluminium hydroxide", "answer": "F", "rationale": "Aluminium hydroxide binds phosphate but has fallen out of favour due to aluminium toxicity (encephalopathy, bone disease). Preferred phosphate binders: calcium carbonate, sevelamer."}, {"label": "D", "text": "Hypertension increases rate of progression", "answer": "T", "rationale": ""}, {"label": "E", "text": "Haemodialysis is indicated once per week.", "answer": "F", "rationale": "3 sessions per week is standard."}]}, {"id": "Q0059", "type": "tf", "stem": "Which is true about Diphtheria:", "system": "Infectious Disease", "topic": "Other infections", "source": "TF Series B", "aiAuthored": false, "options": [{"label": "A", "text": "Gram + anaerobic diplococci.", "answer": "F", "rationale": "Diphtheria is an cute toxico-infection due to corynebacterium Diphtheriae. It is a gram positive, nonsporulating, anaerobic bacilli. It has 3 biotypes: gravis, intermedius, mitis • Mitis, less toxigenic, less severe disease"}, {"label": "B", "text": "C-xray is often normal.", "answer": "T", "rationale": ""}, {"label": "C", "text": "Less than 4 years is a poor prognostic factor", "answer": "T", "rationale": "This is due to respiratory obstruction"}]}, {"id": "Q0060", "type": "tf", "stem": "The following disorders of morphogenesis are correctly matched:", "system": "Endocrine & Genetics", "topic": "Genetics & chromosomal syndromes", "source": "TF Series B", "aiAuthored": false, "options": [{"label": "A", "text": "Malformation: Congenital Heart Diseases.", "answer": "T", "rationale": ""}, {"label": "D", "text": "Dysplasia: Multi Cystic.", "answer": "T", "rationale": ""}]}, {"id": "Q0061", "type": "tf", "stem": "A 3-day-old presented with bleeding from the nose, ear, and umbilical cord since birth. PCV was 33% but was apparently well. Which of these is consistent?", "system": "Neonatology", "topic": "Neonatal bleeding (VKDB)", "source": "TF Series B", "aiAuthored": false, "options": [{"label": "A", "text": "Exclusive breastfeeding and use of phenobarbitone history is an important positive.", "answer": "T", "rationale": "Breast milk is low in vitamin K. Phenobarbitone induces liver enzymes and increases vitamin K metabolism. N.B the condition is vitamin K deficiency bleeding"}, {"label": "C", "text": "PCV is within normal limits.", "answer": "F", "rationale": "Normal PCV in neonate is from 45-65%"}, {"label": "D", "text": "PT/PTTK is normal.", "answer": "F", "rationale": ""}, {"label": "E", "text": "Oral vitamin K1 is required.", "answer": "F", "rationale": "Other notes Haemorrhagic disease of the Newborn (vitamin K deficiency bleeding) After birth, there is a slight reduction in vitamin K levels between 2nd and 7th days of life Exaggeration of this process leads to HDN • Early < 24hrs • Late > 1 week Predisposing factors: - Birth asphyxia - Maternal drugs like phenobarb, ASA, Coumarin - Exclusive breastfeeding - Broad-spectrum antibiotic therapy - Perenteral nutrition Clinical features: - Bleeding which tends to be Gl,nasal,subgaleal, intracranial, post circumcision in a well child - PT, PTT prolonged - Thrombin time and fibrinogen levels are normal. Treatment: • IV vit K1 1-5mg stat • EBT in severe cases with fresh whole blood • Can be prevented by admin of IM vit K 1mg at birth 0.5mg weekly to babies on parenteral nutrition."}]}, {"id": "Q0062", "type": "tf", "stem": "A 2-year-old girl presented in the children's emergency clinic with fever, cough, weight loss of 4 weeks duration, and seizures:", "system": "Pulmonology", "topic": "Tuberculosis", "source": "TF Series B", "aiAuthored": false, "options": [{"label": "A", "text": "It would be correct to make a presumptive diagnosis of tuberculosis.", "answer": "T", "rationale": "It is a case of pulmonary TB+ TB meningitis TB meningitis clinical features are • Headache • Irritability • Vomiting • Lethargic • Convulsion • Neck stiffness Fever, cough, weight loss over 4 weeks are features of pulmonary TB"}, {"label": "B", "text": "Chest X-ray would most likely show cavities.", "answer": "F", "rationale": "In young children, cavitation is uncommon. Hilar lymphadenopathy is more typical."}, {"label": "C", "text": "The urgency makes AFB microscopy the appropriate screening test.", "answer": "F", "rationale": "GeneXpert MTB/RIF is preferred — more sensitive and gives rifampicin resistance info."}, {"label": "D", "text": "The treatment would include rifampicin, pyrazinamide, streptomycin.", "answer": "F", "rationale": "The treatment invges 2 months of rifampicin, isoniazid, pyrazinide and ethambutol and 10 months of rifampicin and isoniazid."}, {"label": "E", "text": "The treatment is for 12 months.", "answer": "T", "rationale": ""}]}, {"id": "Q0063", "type": "tf", "stem": "A 1-year-old was rushed to OTCHEW with altered sensorium, fever, and a <1 hour occurrence of convulsion. Which of these will be used for evaluation?", "system": "Neurology", "topic": "CNS infections & coma", "source": "TF Series B", "aiAuthored": false, "options": [{"label": "B", "text": "Pediatric GCS.", "answer": "T", "rationale": ""}, {"label": "D", "text": "Blantyre score.", "answer": "T", "rationale": "Used for young children with cerebral malaria."}, {"label": "E", "text": "Gross motor classification.", "answer": "F", "rationale": ""}]}, {"id": "Q0064", "type": "tf", "stem": "A 3-year-old boy presents with straining at micturition, poor urinary stream, and lower abdominal distention from infancy. His weight is 15 kg, his height 100 cm, his repeated blood pressure averages 130/80 mmHg, and the other physical findings are normal. His serum electrolyte and urea are mildly deranged, and the serum creatinine is 1.5 mg/dl:", "system": "Nephrology", "topic": "Obstructive uropathy", "source": "TF Series B", "aiAuthored": false, "options": [{"label": "A", "text": "His anthropometry is within normal limits.", "answer": "T", "rationale": ""}, {"label": "B", "text": "Micturating cystourethrogram will be of great importance in this child’s management.", "answer": "T", "rationale": ""}, {"label": "C", "text": "The most likely diagnosis is PUJ obstruction.", "answer": "F", "rationale": ""}, {"label": "D", "text": "Administration of Amlodipine is indicated.", "answer": "T", "rationale": ""}, {"label": "E", "text": "He requires urgent dialysis.", "answer": "F", "rationale": "Dialysis is involved when serum creatinine is greater than or equal to 4mg/dl POSTERIOR URETHRAL VALVES Most common cause of severe subvesical obstruction in the male infant. Valves appear as mucosal folds in the posterior urethra. Early obstruction during renal development may result in renal dysplasia Classical features - Dribbling - Poor urinary stream in neonates and infants - Bladder distention - +Symptoms of uraemia and infection. Diagnosis can be made prenatally by USS which reveals an enlarged bladder and hydronephrosis. Later in infancy - Vomiting - Failure to thrive –secondary to CRF - Dehydration –secondary to Diabetes Insipidus consequent on the obstructive uropathy Older children - Enuresis may be the presenting complaint - Micturating cystourethrogram is diagnostic and shows dilated, elongated posterior urethra and trabeculated bladder."}]}, {"id": "Q0065", "type": "tf", "stem": "The following is true concerning infancy and nutrition:", "system": "Gastrointestinal & Hepatobiliary", "topic": "Nutrition & feeding", "source": "TF Series B", "aiAuthored": false, "options": [{"label": "A", "text": "Infant feeding is individually determined.", "answer": "T", "rationale": ""}, {"label": "B", "text": "Exclusive breastfeeding prevents bifidobacterial infection.", "answer": "F", "rationale": "Exclusive breastfeeding promotes bifidobacteria growth (beneficial flora); it does not prevent infection by them, since bifidobacteria are not pathogenic but commensals."}, {"label": "C", "text": "Neonatal hypoxia is an indication for delayed full enteral feeding.", "answer": "F", "rationale": "Hypoxic neonates are at risk of NEC (necrotizing enterocolitis); feeding is typically delayed or cautiously advanced."}, {"label": "D", "text": "Fatty acid in humans is less than in Cows.", "answer": "F", "rationale": "Human milk has higher essential fatty acids (especially DHA & ARA) than cow milk, which are important for brain development."}, {"label": "E", "text": "Caloric intake for infant nutrition is 110-140 Kcal/kg/day.", "answer": "T", "rationale": "Energy requirement in infant ◊ Normal weight 100 –130kcal/kg/day ◊ VLBW: 110 –135 kcal/kg/day ◊ EBLW -130 –150 kcal/kg/day"}]}, {"id": "Q0066", "type": "tf", "stem": "The following statements are true concerning preterm infants:", "system": "Neonatology", "topic": "Preterm & neonatal feeding", "source": "TF Series B", "aiAuthored": false, "options": [{"label": "A", "text": "Maternal hypertension is a risk factor.", "answer": "T", "rationale": ""}, {"label": "B", "text": "Coordination of sucking and swallowing is expected at 30 weeks gestational age.", "answer": "F", "rationale": "Coordination of sucking and swallowing occurs ar 32-34 weeks"}, {"label": "C", "text": "Fluid requirement is directly proportional to the weight and age.", "answer": "F", "rationale": "Preterm infants may require more fluids per kg due to immature kidneys and higher insensible loss. So it's not a linear relation."}, {"label": "D", "text": "Secretory IgA is of limited value compared to that of term babies.", "answer": "F", "rationale": "Preterm babies benefit greatly from sIgA in breast milk because their own immune system is immature."}, {"label": "E", "text": "Neutrophils are of higher quality.", "answer": "F", "rationale": "Preterm infants have qualitatively and quantitatively deficient neutrophils, contributing to their infection risk."}]}, {"id": "Q0067", "type": "tf", "stem": "The following are true concerning Turner's syndrome:", "system": "Endocrine & Genetics", "topic": "Genetics & chromosomal syndromes", "source": "TF Series B", "aiAuthored": false, "options": [{"label": "A", "text": "Karyotype is indicated.", "answer": "T", "rationale": ""}, {"label": "B", "text": "High hairline.", "answer": "F", "rationale": "High posterior hairline is a classic phenotypic feature of Turner’s syndrome."}, {"label": "C", "text": "From parent to offspring.", "answer": "F", "rationale": "Turner syndrome is not inherited, but results from sporadic nondisjunction."}, {"label": "D", "text": "Most common chromosomal abnormality.", "answer": "F", "rationale": "Down syndrome (trisomy 21) is the most common chromosomal abnormality."}, {"label": "E", "text": "Hormonal therapy is indicated.", "answer": "T", "rationale": "Estrogen and growth hormone therapy are used for pubertal development and height gain."}]}, {"id": "Q0068", "type": "tf", "stem": "Which of the following is correctly linked:", "system": "Pulmonology", "topic": "Pneumonia & LRTI", "source": "TF Series B", "aiAuthored": false, "options": [{"label": "A", "text": "Non-severe community-acquired pneumonia: High dose of amoxicillin.", "answer": "T", "rationale": ""}, {"label": "B", "text": "Severe community-acquired pneumonia: First line (ceftriaxone).", "answer": "T", "rationale": "Ceftriaxone or ampicillin + gentamicin"}, {"label": "C", "text": "Bronchial asthma: Wheeze.", "answer": "T", "rationale": ""}, {"label": "D", "text": "URTI: Stridor.", "answer": "F", "rationale": "Stridor is more specific to upper airway obstruction, such as croup or laryngomalacia, not general URTI."}]}, {"id": "Q0069", "type": "tf", "stem": "The following are true", "system": "Infectious Disease", "topic": "HIV & vertical infections", "source": "TF Series B", "aiAuthored": false, "options": [{"label": "C", "text": "All infants of an HIV positive mother should commence oral Zidovudine for the first 6 months of life", "answer": "F", "rationale": "Prevention of Mother To Child Transmission (PMTCT) PMTCT interventions 1. HIV counselling and testing: The entry into PMTCT to detect positive women 2. ART given to woman during pregnancy 3. Minimal invasive procedures during labour, Elective C/S 4. ARV prophylaxis (NVP ±AZT) in the baby from birth till 6wks, ART continued in the mother during breastfeeding (Safe infant feeding)"}, {"label": "D", "text": "An infant of a Hepatitis B surface antigen (HbSag) positive mother should have Hepatits B vaccine and immunoglobulin within the first 12 hours of life", "answer": "T", "rationale": ""}, {"label": "E", "text": "An infant of a Sickle Cell disease mother is at risk of perinatal asphyxia.", "answer": "T", "rationale": "Other notes Perinatal Asphyxia Definition: Condition in the foetus/newborn in which there is reduced O2 saturation (hypoxaemia) resulting in increased acid in the blood (acidaemia). Causes/ Predisposing factors: Maternal (prenatal) factors; ✓ Infections –amnionitis etc ✓Lungs -pneumonia, asthmatic attack etc ✓Cardiac -arrythmias, heart failure etc ✓Anaemia-haemoglobinopathy,nutritional, Leukaemias ✓Diabetes, Hypertension, hypotension ✓ Uterus -hypertonia, malformations, rupture. ✓Others -drugs; narcotics , anaesthetics, alcohol, magnesium sulphate, tranquillizers. ✓ Prolonged obstructed labour ✓Placental problems • Abruptio, placenta previa, placenta insufficiency. Foetal factors • Prematurity, postmaturity, • Developmental anomalies e.g. diaphragmatic hernia, pulmonary hypoplasia, choanalatresia. • Cord problems eg knotting,compression, prolapsed • Infections e.g congenital pneumonia Effects of severe asphyxia ✓CNS; SIADH, ICH, NE resulting in seizures, hypotonia, Mental retardation, learning disabilities, speech disorders, cerebral palsy. ✓Resp; respiratory distress, type II RDS, persistent pulmonary hypertension ✓CVS; left ventricular dysfunction, tricuspid incompetence, PDA, cardiogenic shock ✓Renal; bladder atony, acute kidney injury,renal papillary necrosis ✓GIT; increased risk of NEC, liver dysfunction ✓Haemopoietic; marrow suppression, DIC, increased risk of infection ✓ Metabolic; hypo or hyperglycaemia, hyponatraemia, hypocalcaemia, acidosis"}]}, {"id": "Q0070", "type": "tf", "stem": "The following patients are at increased risk of hypovolaemic shock", "system": "Others (Emergency/Social)", "topic": "Shock & resuscitation", "source": "TF Series B", "aiAuthored": false, "options": [{"label": "A", "text": "A boy with acute glomerulonephritis", "answer": "F", "rationale": "Acute glomerulonephritis causes fluid retention not hypovolemic shock."}, {"label": "B", "text": "An hour old neonate who was born by instrumental delivery", "answer": "T", "rationale": ""}, {"label": "C", "text": "A 5 year old known haemoglobin SS patient with sequestration crisis", "answer": "T", "rationale": ""}, {"label": "D", "text": "An 18 month old with intussusception", "answer": "T", "rationale": ""}, {"label": "E", "text": "A 10 year old with massive glycosuria", "answer": "T", "rationale": ""}]}, {"id": "Q0071", "type": "tf", "stem": "A 2-year-old male toddler presented at the Children Emergency Room with fever and cough of 3 days and difficulty in breathing of 4 hours’ duration. Major findings on general examination were a temperature of 37.8 o C, and SpO2 (88%) on room air. Examination of the respiratory system revealed no stridor, no wheezes, severe lower chest in-drawing, respiratory rate 62 breaths/min, central trachea, resonant percussion note and vesicular breath sound. Additional findings in other systems were: heart rate of 170 beats/min, S1 S2 heard and normal, no murmurs and tender hepatomegaly of 4 cm", "system": "Pulmonology", "topic": "Pneumonia & LRTI", "source": "TF Series B", "aiAuthored": false, "options": [{"label": "A", "text": "The most likely diagnosis is pneumonia in heart failure.", "answer": "T", "rationale": ""}, {"label": "B", "text": "The patient should be admitted into the ward", "answer": "T", "rationale": ""}, {"label": "C", "text": "Supplemental oxygen at 4L/min should be administered through nasal prongs.", "answer": "F", "rationale": "oxygen via nasal prongs or nasal catheters should be administered at 0.5-1L/min for children 0 -2 months, 2-3L/min for children 3month to 5 years; maximum of 4L/min for older children)"}, {"label": "D", "text": "First line antibiotics are intravenous(iv) ceftriaxone and iv gentamicin", "answer": "F", "rationale": "First-line: Ampicillin + Gentamicin or Ceftriaxone (IV). Second-line: Ceftriaxone or Cefotaxime + Macrolide"}, {"label": "E", "text": "Parenteral dexamethasone at 0.6 mg/kg /day up to 3 doses should be given.", "answer": "F", "rationale": "Clinical features of pneumonia Clinical Features • The cardinal features of pneumonia in children are cough and/or difficult breathing with tachypnoea. • Fast breathing is a sensitive marker of pneumonia and is commonly present. • Fast breathing is respiratory rate - ≥50 breaths/min (in those between 2- 11 months) - ≥40 breaths/min (in those between 1- 5 years) • NB: Respiratory rate should be counted for a full minute. Count the respiratory rate when the child is awake and calm, or asleep. Other Clinical Features of Pneumonia in Children • Fever (temperature ≥37.5°C) • Respiratory distress (evidenced by indrawing of the lower chest wall, intercostal recession and nasal flaring) • Crepitations (crackling sound similar to that produced by squeezing a sheet of paper or dry leaves) in one or more lung zones. Area of dull percussion note, increased resonance and bronchial breath sound (suggests lobar pneumonia) • They may in addition have vomiting, poor feeding, diarrhoea or convulsion. • Older children may complain of chest pain (due to pleuritis), have cream coloured or brownish sputum."}]}, {"id": "Q0072", "type": "tf", "stem": "The following are false regarding chronic kidney disease", "system": "Nephrology", "topic": "CKD & renal replacement", "source": "TF Series B", "aiAuthored": false, "options": [{"label": "A", "text": "Diagnosis can be made in a 1-month old infant", "answer": "F", "rationale": "CKD diagnosis requires persistence for ≥3 months"}, {"label": "B", "text": "The finding of genu valgum deformity is not consistent with the diagnosis", "answer": "T", "rationale": "Renal osteo dystrophy is a common presentation in CKD. Genu valgum deformity can occur during to renal osteodyrophy."}, {"label": "C", "text": "Steroid resistant nephrotic syndrome is a rare cause in Nigeria", "answer": "T", "rationale": "Majority of CKD cases in Nigeria are due to steroid resistant nephrotic syndrome."}, {"label": "D", "text": "Polycythaemia is a common feature", "answer": "T", "rationale": "Anemia not polycythemia is a common feature."}, {"label": "E", "text": "High protein and phosphate diet is indicated in the management", "answer": "T", "rationale": "Protein and phosphate are restricted in the management of CKD to prevent uraemia and hyperphosphatemia."}]}, {"id": "Q0073", "type": "tf", "stem": "A 6 year old boy is admitted with a history of fever and yellowness of the eyes of 3 days duration, passage of coca-cola coloured urine of 2 days duration and reduction in urine output of 1 day duration. The following are consistent with his presentation", "system": "Nephrology", "topic": "AGN, PSGN & glomerulonephritis", "source": "TF Series B", "aiAuthored": false, "options": [{"label": "A", "text": "The finding of severe palor on examination", "answer": "T", "rationale": ""}, {"label": "B", "text": "Acidotic breathing", "answer": "T", "rationale": ""}, {"label": "C", "text": "The diagnosis of acute glomerulonephritis", "answer": "F", "rationale": ""}, {"label": "D", "text": "Serum albumin of 2.5g/dL", "answer": "F", "rationale": ""}, {"label": "E", "text": "Dialysis is contraindicated", "answer": "F", "rationale": "Notes: The diagnosis is Acute Kidney Injury (AKI) secondary to intravascular hemolysis (e.g., blackwater fever or G6PD-related hemolysis). Blackwater fever is a severe complication of falciparum malaria, characterized by massive intravascular hemolysis resulting in hemoglobinuria, leading to dark (coca-cola or tea-colored) urine, jaundice high grade fever, anemia, and potentially acute kidney injury (AKI). Clinical Signs of AKI in Blackwater Fever: Oliguria/anuria Facial/lower limb edema Acidotic breathing (Kussmaul) Uremic signs (vomiting, confusion, pericardial rub) Severe pallor Hypertension (sometimes late)."}]}, {"id": "Q0074", "type": "tf", "stem": "Concerning bronchial asthma", "system": "Pulmonology", "topic": "Asthma", "source": "TF Series B", "aiAuthored": false, "options": [{"label": "A", "text": "It is a heterogeneous disease with multiple gene inheritance pattern.", "answer": "T", "rationale": ""}, {"label": "B", "text": "Viral upper respiratory tract infection is only an inducer (precipitating factor).", "answer": "F", "rationale": "Inducers (Precipitating Factors) of bronchial asthma: Viral respiratory infections Formula feeds (lack of exclusive breastfeeding) Environmental allergens Tobacco smoke Indoor gas combustion (NO₂) Perfumes Wood smoke Air pollution (Ozone, SO₂) Inciters (Triggers): Viral upper respiratory tract infections Aeroallergens Exercise Irritant fumes Emotion Cold, dry air"}, {"label": "C", "text": "It is not a plausible diagnosis in the under-5-year-olds.", "answer": "F", "rationale": ""}, {"label": "E", "text": "A strong indication for antibiotic use is presence of crackles on chest auscultation during an acute exacerbation", "answer": "T", "rationale": "Crackles alone do not indicate bacterial infection. Antibiotics are not routinely used in asthma exacerbations unless there's clear evidence of bacterial infection (e.g., lobar pneumonia, fever with leukocytosis)."}]}, {"id": "Q0075", "type": "tf", "stem": "A 3kg baby was delivered by emergency lower segment caesarean section to a 29yr old primigravida after a labour which lasted 48hrs. The liquor was meconium stained. At 5mins of life, his heart rate was 96/min. the baby was gasping and there was no response to the nasal catheter. He was also floppy and pale. The following are true", "system": "Neonatology", "topic": "Newborn care & resuscitation", "source": "TF Series B", "aiAuthored": false, "options": [{"label": "A", "text": "The apgar score is 2.", "answer": "T", "rationale": "Apgar at 5 minutes considers: Heart rate: <100/min = 1 Respiratory effort: Gasping = 1 Muscle tone: Floppy = 0 Reflex irritability: No response to nasal catheter = 0 Color: Pale = 0"}, {"label": "B", "text": "Endotracheal intubation after adequate suctioning is indicated for the administration of oxygen.", "answer": "T", "rationale": "In a baby born through meconium-stained amniotic fluid who is depressed (i.e., not vigorous) and gasping, endotracheal suctioning followed by intubation and positive pressure ventilation (PPV) is indicated. Intubation allows for both suctioning meconium and administering oxygen directly."}, {"label": "C", "text": "Administration of alkali is the first priority.", "answer": "F", "rationale": ""}, {"label": "D", "text": "Pneumothorax is a possible complication.", "answer": "T", "rationale": ""}, {"label": "E", "text": "Seizure within the first 24hrs will be unusual.", "answer": "F", "rationale": "Meconium Aspiration Syndrome (MAS) is a problem of term and late preterm infants. Aetipathogenesis: It typically results from intrauterine asphyxia, which leads to fetal passage of meconium into the amniotic fluid. The infant may then inhale the meconium-stained liquor either before or during delivery, introducing the meconium into the airways. This causes partial airway obstruction and air trapping, which leads to hyperinflation of the lungs. In some cases, this can result in complications such as pneumothorax and pneumomediastinum due to alveolar rupture. Additionally, meconium acts as an irritant to the lung tissue, leading to chemical pneumonitis and increasing the risk of secondary bacterial infection. Clinical signs ✓ Meconium staining of skin, nails, umbilical cord. ✓ Respiratory distress soon after birth ✓Crepitations or rhonchi in lung fields ✓ Increased AP diameter of chest ✓ CXR shows overinflation, streaky atelectasis or diffuse opacification. ✓Recovery begins after 7 –10 days Management ✓ Anticipation ✓Paediatrician must be at delivery ✓ Visualization and direct suctioning of trachea immediately after birth if baby is not vigorous ✓SpO2 and blood gas monitoring ✓O2 therapy ✓Antibiotics ✓Assisted ventilation"}]}, {"id": "Q0076", "type": "tf", "stem": "A known sickle cell anaemia patient is admitted with severe drowsiness, rectal temperature of 39.5°C, PCV of 18%, deep jaundice and generalized hypotonia and absent deep tendon reflexes on the left side. This child:", "system": "Haematology & Oncology", "topic": "Sickle cell disease", "source": "TF Series B", "aiAuthored": false, "options": [{"label": "A", "text": "May have a cerebrovascular accident", "answer": "T", "rationale": "SCD patients are at high risk of ischemic stroke, especially children <14 years. Focal neurologic signs like hypotonia and absent reflexes are suggestive."}, {"label": "B", "text": "May have cerebral malaria.", "answer": "F", "rationale": ""}, {"label": "C", "text": "Needs urgent packed cell transfusion.", "answer": "F", "rationale": "urgent blood transfusion in sickle cell patients is indicated for: 1. Severe acute anemia: Sudden drop (e.g. from 25% to 10%) — like in aplastic crisis or splenic sequestration. 2. Stroke or acute neurologic events: Exchange transfusion is preferred to rapidly lower HbS <30% to stop infarction."}]}, {"id": "Q0077", "type": "tf", "stem": "Concerning sickle cell disease, which of the following is true? (stem partially illegible in source)", "system": "Haematology & Oncology", "topic": "Sickle cell disease", "source": "TF Series B", "aiAuthored": false, "options": [{"label": "D", "text": "Needs daily penicillin and streptomycin injections.", "answer": "F", "rationale": "Prophylaxis in SCD is daily oral penicillin, not streptomycin (which is used for TB). No indication for daily injections here."}, {"label": "E", "text": "Is likely to have bone marrow erythroid hyperplasia.", "answer": "T", "rationale": "SCD → chronic hemolysis → compensatory erythroid hyperplasia in marrow. 72.Predisposing factors to infective endocarditis"}, {"label": "A", "text": "Male Sex", "answer": "F", "rationale": ""}, {"label": "B", "text": "Haemophilia", "answer": "F", "rationale": ""}, {"label": "C", "text": "Rheumatic heart disease", "answer": "T", "rationale": ""}, {"label": "D", "text": "Dental caries", "answer": "T", "rationale": ""}, {"label": "E", "text": "Corrective heart surgery", "answer": "T", "rationale": "Predisposing Lesions and Risk Factors for Infective Endocarditis Cardiac Lesions Complex cyanotic congenital heart diseases (e.g., TOF, TGA) Uncorrected patent ductus arteriosus (PDA) Uncorrected ventricular septal defect (VSD), even if small Bicuspid aortic valve Rheumatic mitral valve disease Hypertrophic cardiomyopathy Prosthetic heart valves (mechanical or bioprosthetic) Surgically constructed systemic-to-pulmonary shunts or conduits Non-cardiac Risk Factors Presence of indwelling central venous catheters Injection drug use Immunosuppression (e.g., HIV, chemotherapy) Ongoing septicaemia (even in patients with structurally normal hearts) Iatrogenic/Procedural Risks Dental procedures involving manipulation of gingival tissue or perforation of oral mucosa Urethral catheterization and other urogenital manipulations 73.Concerning Diabetes Mellitus in children"}, {"label": "A", "text": "It is associated with hyperthyroidism", "answer": "T", "rationale": "Type 1 DM is an autoimmune disease and can coexist with autoimmune thyroiditis (Graves’ or Hashimoto’s)."}, {"label": "B", "text": "It can present for the first time as DKA", "answer": "T", "rationale": "A significant number of children with new-onset Type 1 DM present in diabetic ketoacidosis."}, {"label": "C", "text": "OGTT is mandatory in making a diagnosis", "answer": "F", "rationale": "> Not mandatory. Diagnosis can be made with: Random glucose ≥200 mg/dL with symptoms Fasting glucose ≥126 mg/dL HbA1c ≥6.5%"}, {"label": "D", "text": "Can be caused by prolonged steroid therapy", "answer": "T", "rationale": "Long-term corticosteroids can cause secondary diabetes due to insulin resistance"}, {"label": "E", "text": "Prolonged insulin use can lead to a cure", "answer": "F", "rationale": "74.Concerning Vit. D and Calcium metabolism"}, {"label": "A", "text": "Deficient calcium absorption leads to secondary hyperparathyroidism", "answer": "T", "rationale": "↓ Calcium → ↑ PTH to maintain calcium → secondary hyperparathyroidism."}, {"label": "B", "text": "Deficient Vit. D leads to craniotabes in infancy", "answer": "T", "rationale": "Classic finding in rickets (Vit D deficiency): craniotabes, frontal bossing, etc."}, {"label": "C", "text": "Treatment of hypocalcaemia requires the use of IV 10% Ca Gluconate /ml/kg to prevent complications", "answer": "F", "rationale": "Correct dosage is 1–2 mL/kg of 10% calcium gluconate diluted and infused slowly"}, {"label": "D", "text": "Vit. D deficiency is a common cause of BLOUNT’S Disease", "answer": "F", "rationale": "Blount’s disease is growth disorder of the tibia (tibia vara), not related to Vit D deficiency."}, {"label": "E", "text": "The use of calcium supplement is essential in the management of nutritional rickets", "answer": "T", "rationale": "Both calcium and Vit D are used in nutritional rickets treatment. 75.Concerning Congenital Adrenal Hyperplasia"}, {"label": "A", "text": "Most common manifestation is ambiguous genitalia", "answer": "T", "rationale": "In 46,XX infants with 21-hydroxylase deficiency, the most common form — ambiguous genitalia is a key feature. Note that, the most common enzyme deficiency in congenital adrenal hyperplasia is 21 Hydroxylase. Others are 11β Hydroxylase, 3β Hydroxysteroid, 17βHydroxylase/17, 20- Lyase deficiency."}, {"label": "B", "text": "Salt loosing syndrome occurs in 11 Hydroxylase deficiency", "answer": "F", "rationale": "Salt loss is seen in 21-hydroxylase deficiency, not 11-OH deficiency. 11-OH deficiency causes hypertension due to deoxycorticosterone excess."}, {"label": "C", "text": "It is a cause of short stature", "answer": "T", "rationale": "Untreated CAH → androgen excess, early epiphyseal closure → short stature"}, {"label": "D", "text": "Hypertension does not occur", "answer": "F", "rationale": "11-OH and 17-OH forms may cause hypertension due to mineralocorticoid effects."}, {"label": "E", "text": "20,22 Desmolase deficiency is not compatible with life", "answer": "F", "rationale": "This enzyme catalyzes the first step of steroidogenesis. Deficiency → complete adrenal failure → not compatible with life unless diagnosed early and treated aggressively. Other notes Congenital adrenal hyperplasia (CAH) It is an autosomal recessive disorder caused by deficiency of one of the enzymes necessary for adrenal steroid production, especially cortisol. It leads to excessive secretion of ACTH of steroids in results. Two forms (of CAH) Classic (More severe) -Characterized by cortisol deficiency and female secondary to excess adrenal androgen Diagnosis is based on elevated baseline and ACTH-stimulated levels of serum 17- hydroxyprogesterone (17- OHP) and adrenal androgens, which are suppressed with the administration of glucocorticoids. Non Classic(Less severe/Mild) Patients present late with precocious puberty or problems related to androgen excess, including hirsutism, menstrual irregularities, and infertility Diagnosis is confirmed with elevated ACTH-stimulated levels of serum 17-OHP and adrenal androgens as in the classic form 76. Seizures"}, {"label": "A", "text": "Complex febrile seizure has a duration of between 10 – 15 mins", "answer": "F", "rationale": "In complex febrile seizures, there are multiple attacks in 24 hr period, the seizures are focal and duration of seizure > 15 mins."}, {"label": "B", "text": "Recurrent febrile seizure is an indication for developing epilepsy in later life", "answer": "T", "rationale": "Risk of development of epilepsy in children with febrile seizure is very small, about 1% as in the general population. Increased risk associated with -recurrent complex febrile seizure, family history of epilepsy, neurodevelopmental delay, abnormal neurological examination."}, {"label": "C", "text": "EEG is necessary for definitive diagnosis", "answer": "F", "rationale": "EEG is not needed for the diagnosis of febrile seizures. It's only used in atypical cases or where epilepsy is suspected"}, {"label": "D", "text": "West syndrome has a poor prognosis", "answer": "T", "rationale": ""}, {"label": "E", "text": "Neurofibromatosis is inherited as Autosomal recessive", "answer": "F", "rationale": "Neurofibromatosis type 1 and 2 are inherited as autosomal dominant Other notes Infantile Spasms (Salaam Attacks / West syndrome) Seen in young infants with underlying brain injury, e.g severe perinatal asphyxia, cerebral dysgenesis, tuberous sclerosis. Most cases have associated mental retardation -Seizure represent a variety of myoclonic seizures. It may manifest as sudden flexion of the arms, neck, trunk & lower limbs, resulting in a jerk or sudden contraction of the extensor muscles of the trunk, neck & limbs, associated with a cry. -Attacks are brief and occur in clusters throughout the day. -Age of onset usually in first year of life, peak 4-6month. Diagnosis. EEG: Hypsarrhythmias characteristic . Treatment. ACTH Steroids Clonazepam Vigabatrin The prognosis Poor 77.Concerning Pott’s disease"}, {"label": "A", "text": "flaccid paralysis is a feature", "answer": "F", "rationale": "Neurological deficits in Pott’s disease typically manifest as spastic paralysis due to compression of the spinal cord — upper motor neuron signs, not flaccid (which is LMN)."}, {"label": "B", "text": "most commonly affected is the cervical vertebrae", "answer": "F", "rationale": "The thoracic spine is the most commonly affected site in Pott’s disease, followed by lumbar, then cervical."}, {"label": "C", "text": "damage starts at the spinous process", "answer": "T", "rationale": "TB spine typically begins in the anterior part of the vertebral body, not the spinous process."}, {"label": "D", "text": "steroid therapy is essential", "answer": "F", "rationale": "Steroids are not routinely essential, but may be used in cases with spinal cord compression or neurological involvement. Primary treatment is anti-TB drugs + surgical decompression if needed."}, {"label": "E", "text": "gibbus disappears following treatment", "answer": "F", "rationale": "Gibbus deformity (sharp kyphosis) due to vertebral collapse is often permanent, especially if developed before treatment. It does not usually resolve completely. 78.Concerning Guillian Barre Syndrome"}, {"label": "A", "text": "Paralysis is often symmetrical", "answer": "T", "rationale": "GBS classically causes bilateral, symmetrical ascending flaccid paralysis."}, {"label": "B", "text": "Preceding viral infection is typical", "answer": "T", "rationale": "GBS often follows a viral or bacterial infection (e.g., Campylobacter jejuni, CMV, EBV)."}, {"label": "C", "text": "Clear cut sensory level exists on the trunk", "answer": "F", "rationale": "A sensory level is a hallmark of spinal cord lesions (like transverse myelitis), not GBS."}, {"label": "D", "text": "CSF protein 800mg/dl and WBC of 2cells/mm is suggestive", "answer": "T", "rationale": "In GBS, lumbar puncture is diagnostic, it has characteristics classic albuminocytologic dissociation = ↑ protein with normal or very low WBC count in CSF. ⟶ 800 mg/dL protein and 2 cells/mm³ is very suggestive of GBS."}, {"label": "E", "text": "Plasmaphoresis is indicated when respiratory arrest is imminent.", "answer": "T", "rationale": "Plasmapheresis (or IVIG) is indicated in: Rapidly progressive weakness Bulbar or respiratory muscle involvement Imminent respiratory failure 79.Common causes of Cerebral Palsy in Nigeria include"}, {"label": "A", "text": "Severe Birth Asphyxia", "answer": "T", "rationale": ""}, {"label": "B", "text": "Severe Neonatal Jaundice", "answer": "T", "rationale": ""}, {"label": "C", "text": "Pyogenic meningitis", "answer": "T", "rationale": ""}, {"label": "D", "text": "Intrauterine factors", "answer": "T", "rationale": ""}, {"label": "E", "text": "Poliomyelitis", "answer": "F", "rationale": "Prenatal Risk Factors: Radiation exposure Anoxia (lack of oxygen) Intrauterine infections Developmental anomalies (e.g encephalocele, cerebral cysts) Exposure to harmful drugs (e.g., alcohol, narcotics) Perinatal Risk Factors: Low birth weight Birth asphyxia Birth trauma Prematurity (low gestational age) Postnatal Risk Factors: Metabolic disorders (e.g., phenylketonuria, hypoglycemia) Infections (e.g., meningitis, encephalitis) Head trauma Toxins (e.g., kernicterus from severe jaundice) Cerebral hypoxia (e.g., near-drowning, foreign body aspiration) 80.Concerning Malaria"}, {"label": "A", "text": "Artesunate is a 2nd line drug in the treatment of uncomplicated malaria", "answer": "F", "rationale": "Artesunate is actually first-line treatment for severe malaria, and in many African countries (including Nigeria), Artemisinin-based combination therapy (ACT) is first-line for uncomplicated malaria."}, {"label": "B", "text": "Chemoprophylaxis is indicated in children who recover from cerebral malaria", "answer": "F", "rationale": "Prophylaxis is only recommended in high-risk settings (e.g., non-immune travelers, sickle cell patients in endemic regions, or during epidemics)"}, {"label": "C", "text": "Oral quinine is a drug of choice used in cerebral malaria", "answer": "F", "rationale": "IV artesunate is the drug of choice for cerebral and severe malaria"}, {"label": "D", "text": "Severe malaria is common in malnourished children", "answer": "F", "rationale": ""}, {"label": "E", "text": "Acute renal failure is a known complication", "answer": "T", "rationale": "81.HbSS"}, {"label": "A", "text": "Incidence in Nigeria is about 3%", "answer": "F", "rationale": "EPIDEMIOLOGY OF SICKLE CELL DISEASE Most common among Black populations of West and Central Africa. Spread through migration to: North and South America Mediterranean countries (e.g., Italy,Greece) India and Saudi Arabia Nigeria: Estimated 1–2 million individuals with HbSS. Prevalence of HbSS: 2–3% Ibadan (Southwestern Nigeria): HbSS: 3.1% HbSC: 1.1% HbAS (Sickle cell trait): 23.7%"}, {"label": "B", "text": "Fluid restriction is indicated in vaso-occlusive crisis", "answer": "F", "rationale": ""}, {"label": "C", "text": "Cellulose –acetate paper is used to confirm diagnosis", "answer": "T", "rationale": ""}, {"label": "D", "text": "Pyrimethamine is indicated for prophylaxis (PROGUANIL)", "answer": "T", "rationale": ""}, {"label": "E", "text": "Daily folic acid/iron is indicated", "answer": "F", "rationale": "Other notes CRISIS IN SICKLE CELL DISEASE Definition: A crisis is an acute event in sickle cell disease. There are two main types: Vaso-occlusive crisis (VOC) Anaemic crises PRECIPITATING FACTORS Common triggers include: Infections Hypoxia Cold exposure Acidosis Dehydration Mnemonic: D-CHAIN Dehydration Cold Hypoxia Acidosis Infection Nutritional stress VASO-OCCLUSIVE (PAINFUL) CRISIS Sites of pain involvement: Bones: 1. Hand-Foot Syndrome (Dactylitis) – especially in infants 2. Long bones 3. Others – ribs, vertebrae Abdomen: Pain may involve various organs May mimic acute surgical abdomen Clinical Features: Severe bone or abdominal pain No significant drop in PCV Management: Identify and treat precipitating factor Bed rest Liberal fluid intake (oral or IV): At least 1.5× maintenance Analgesics (paracetamol, NSAIDs, or opioids depending on severity) > Usually resolves within less than one week ( < 1/52 ) ANAEMIC CRISES 1. Acute Splenic Sequestration Crisis Pooling of blood in the spleen → hypovolaemic shock Rapid splenic enlargement Most common in young children Sudden onset severe pallor High risk of death if not promptly treated Management: Urgent blood transfusion Identify and treat the precipitating cause 2. Aplastic Crisis Temporary cessation of erythropoiesis Often precipitated by Parvovirus B19 infection Features: Sudden drop in PCV Low reticulocyte count Normal WBC and platelet count Management: Urgent blood transfusion Treat underlying infection 3. Hyperhemolytic Crisis Marked increase in jaundice Worsening anaemia Often precipitated by infection Management: Blood transfusion Treat precipitating cause DIAGNOSIS OF SICKLE CELL DISEASE 1. Haemoglobin Electrophoresis Neonates: High Performance Liquid Chromatography (HPLC) Isoelectric Focusing (IEF) Post-neonatal (after 6 months): Citrate agar electrophoresis Cellulose acetate electrophoresis 2. Packed Cell Volume (PCV) May show low values, indicating chronic anaemia"}]}, {"id": "Q0078", "type": "tf", "stem": "Concerning acute exacerbation of bronchial asthma", "system": "Pulmonology", "topic": "Asthma", "source": "TF Series B", "aiAuthored": false, "options": [{"label": "A", "text": "Triage is the first step.", "answer": "F", "rationale": "Acute therapy requires: Resuscitation, Triage, Oxygen, Bronchodilators (RTOB) Resuscitation: Airway, Breathing,Circulation TRIAGE -Life threatening (any of confusion, drowsiness, cyanosis, silent chest) -Non life threatening (further triage to severe and moderate / mild)."}, {"label": "B", "text": "It is superflous to triage into life threatening and non-life-threatening attacks.", "answer": "F", "rationale": ""}, {"label": "C", "text": "Severe and life-threatening attacks are managed the same way.", "answer": "F", "rationale": ""}, {"label": "D", "text": "Mild and moderate acute attacks are managed the same way.", "answer": "T", "rationale": ""}, {"label": "E", "text": "Oral prednisolone and salbutamol nebulization are indicated in moderate acute attack", "answer": "T", "rationale": "MANAGEMENT OF LIFE-THREATENING ASTHMA ATTACK 1. Consult ICU 2. Initiate the following treatments immediately: Short-Acting Beta-Agonist (SABA) – e.g., nebulised salbutamol Oxygen therapy Ipratropium bromide Intravenous magnesium sulphate Intravenous aminophylline 3. Prepare for possible intubation MANAGEMENT OF SEVERE ACUTE ASTHMA ATTACK Initial Medications: Salbutamol via MDI with spacer or nebuliser: Every 20 minutes for two doses (review at 20 and 40 minutes) Dosage: 4–6 puffs if ≤ 5 years 6–10 puffs if > 5 years Systemic corticosteroids: Oral prednisolone 1–2 mg/kg (maximum 40–60 mg) OR IV hydrocortisone sodium succinate 5 mg/kg Oxygen if SpO₂ < 95% Ipratropium bromide: 250 mcg if ≤ 5 years 500 mcg if > 5 years Administer every 20 minutes for 1 hour (total of 3 doses), then continue as needed for up to 6 doses over 2 hours Should be given with initial salbutamol doses IV magnesium sulphate: 50% solution (500 mg/mL) Dose: 50 mg/kg over 20 minutes If admitted to ICU, continue infusion at 30 mg/kg/hour Consider adding high-dose inhaled corticosteroids (ICS) Further Steps Based on Clinical Response: If improving: Reduce frequency of salbutamol nebulisation If no improvement: Continue salbutamol nebulisation every 20 minutes If deteriorating at any stage: Treat as critical Initiate ICU admission IV aminophylline: 5 mg/kg over 20 minutes (maximum 500 mg) Use only if the child is very sick or deteriorating. MANAGEMENT OF MILD OR MODERATE ACUTE ASTHMA EXACERBATION 1. Bronchodilator Therapy Salbutamol via MDI with spacer or nebuliser Administer every 20 minutes for two doses Reassess at 20 and 40 minutes Dosage: 4 to 6 puffs if < 5 years 6 to 10 puffs if > 5 years 2. Corticosteroids Oral prednisolone: Dose: 1–2 mg/kg (maximum: 40–60 mg) OR IV hydrocortisone sodium succinate: Dose: 5 mg/kg"}]}, {"id": "Q0079", "type": "tf", "stem": "A 6 year old female child presents with 3 days history of fever and convulsions. On examination, she was febrile, had a Glasgow coma score of 7/15, decerebrate posturing and dilated,unreactive pupils. The following statements are true:", "system": "Neurology", "topic": "CNS infections & coma", "source": "TF Series B", "aiAuthored": false, "options": [{"label": "A", "text": "Gram negative bacilli should be considered as the likely pathogens.", "answer": "F", "rationale": "In previously healthy children,gram-positive organisms (e.g.,Streptococcus pneumoniae,Neisseria meningitidis) are more likely. Gram-negative bacilli are more common in neonates or immunocompromised."}, {"label": "B", "text": "A lumbar puncture should be performed urgently", "answer": "F", "rationale": "LP is contraindicated in children with signs of raised ICP (e.g., decerebrate posturing, dilated unreactive pupils, GCS ≤ 8) due to risk of herniation."}, {"label": "C", "text": "She likely has a vaccine-preventable disease", "answer": "T", "rationale": "Possible diseases include meningococcal or pneumococcal meningitis, both of which are vaccine- preventable."}, {"label": "D", "text": "Febrile seizure is a differential diagnosis", "answer": "F", "rationale": "Febrile seizures are brief (<15 min), generalized, and occur in children with normal neuro status. This case involves focal signs and low GCS, suggesting CNS infection or encephalopathy, not febrile seizure."}, {"label": "E", "text": "IV Cefuroxime is indicated", "answer": "F", "rationale": "For suspected meningitis/encephalitis, IV ceftriaxone or cefotaxime + vancomycin (if pneumococcal resistance suspected) is preferred. Cefuroxime has limited CNS penetration."}]}, {"id": "Q0080", "type": "tf", "stem": "The following are mandatory care that every well-baby must be offered by 30minutes of life;", "system": "Neonatology", "topic": "Newborn care & resuscitation", "source": "TF Series B", "aiAuthored": false, "options": [{"label": "A", "text": "Weigh baby", "answer": "F", "rationale": ""}, {"label": "B", "text": "Commence breastfeeding", "answer": "T", "rationale": ""}, {"label": "C", "text": "Administer IV vitamin K1", "answer": "F", "rationale": ""}, {"label": "D", "text": "Check breathing", "answer": "T", "rationale": ""}, {"label": "E", "text": "Apply chlorhexidine gel to umbilical stump", "answer": "F", "rationale": ""}]}, {"id": "Q0081", "type": "tf", "stem": "The following are correctly matched regarding abdominal examination", "system": "Gastrointestinal & Hepatobiliary", "topic": "Abdominal examination & surgical", "source": "TF Series B", "aiAuthored": false, "options": [{"label": "A", "text": "Incisional scar on the abdomen : Intestinal obstruction secondary to adhesions", "answer": "T", "rationale": ""}, {"label": "B", "text": "Ballotable kidneys: Pelviureteric junction obstruction", "answer": "T", "rationale": "A common cause of hydronephrosis, making the kidney palpable and ballotable."}, {"label": "C", "text": "Hepatosplenomegaly: Acute Leaukaemia", "answer": "T", "rationale": ""}, {"label": "D", "text": "Abdominal wall tenderness: Spontaenous bacterial peritonitis", "answer": "T", "rationale": "Especially in children with nephrotic syndrome or liver disease, SBP causes diffuse tenderness."}, {"label": "E", "text": "Positive shifting dullness: Massive ascites", "answer": "F", "rationale": ""}]}, {"id": "Q0082", "type": "tf", "stem": "A 3 hour old term male infant was rushed to the emergency room on account of 3 episodes of apnoea over the past 1hour. On examination, the weight was 4350g, the cheeks were plump and plethoric. Which of the following are true of the baby?", "system": "Neonatology", "topic": "Neonatal seizures & metabolic", "source": "TF Series B", "aiAuthored": false, "options": [{"label": "A", "text": "Maternal HbA1C levels may provide a clue to the diagnosis", "answer": "T", "rationale": "Suggestive of infant of diabetic mother (IDM); HbA1c indicates long-term glucose control in the mother."}, {"label": "B", "text": "Haematocrit of 68% is a consistent finding", "answer": "T", "rationale": "Polycythemia is common in IDM, cutoff for polycythemia is >65%."}, {"label": "C", "text": "Random plasma glucose monitoring is mandatory", "answer": "T", "rationale": "Due to risk of hypoglycemia, this is essential in IDM or large-for-gestational-age babies."}, {"label": "D", "text": "Respiratory rate of 70c/minute is consistent with this presentation", "answer": "T", "rationale": "Transient tachypnea or respiratory distress is possible in IDM due to delayed lung maturity."}, {"label": "E", "text": "Complications include cardiomyopathy", "answer": "T", "rationale": "IDM can present with hypertrophic cardiomyopathy, especially involving the interventricular septum."}]}, {"id": "Q0083", "type": "tf", "stem": "A six month old female infant delivered at term was brought into the emergency ward with progressive enlargement of the head. She had widened anterior fontanelle, sunset appearance or the eyes and distended scalp veins. Which of the following are true concerning her management?", "system": "Neurology", "topic": "Hydrocephalus & congenital neuro", "source": "TF Series B", "aiAuthored": false, "options": [{"label": "A", "text": "Occipito-frontal circumference of 38.7cm is consistent with her clinical presentation", "answer": "F", "rationale": "This is too small for a 6-month-old (normal ~43cm); so NOT consistent with hydrocephalus."}, {"label": "B", "text": "Narrowing of the ventricles is expected on transfontanelle ultrasonography", "answer": "F", "rationale": "Hydrocephalus causes ventricular enlargement, not narrowing."}, {"label": "C", "text": "She requires neurosurgical consultation", "answer": "T", "rationale": "For possible VP shunt or other intervention."}, {"label": "D", "text": "Epilepsy is a recognized complication", "answer": "F", "rationale": "Can occur if hydrocephalus affects cortex or due to increased ICP."}, {"label": "E", "text": "Mental retardation is rare with delayed treatment", "answer": "F", "rationale": "Cognitive impairment is common if hydrocephalus is not treated early."}]}, {"id": "Q0084", "type": "tf", "stem": "Indication for oxygen therapy in supportive management of pneumonia include", "system": "Pulmonology", "topic": "Pneumonia & LRTI", "source": "TF Series B", "aiAuthored": false, "options": [{"label": "A", "text": "Spo2 <90%", "answer": "T", "rationale": ""}, {"label": "B", "text": "Tachypnoea > 20/min for the age", "answer": "T", "rationale": ""}, {"label": "C", "text": "Central cyanosis", "answer": "T", "rationale": ""}, {"label": "D", "text": "Severe lower chest wall indrawing", "answer": "T", "rationale": ""}, {"label": "E", "text": "Grunting", "answer": "T", "rationale": "Oxygen therapy in pneumonia Oxygen can be life-saving in hypoxic pneumonia patients. Absolute indications for oxygen therapy are: ✓ Central cyanosis ✓Severe lower chest wall indrawing ✓ Oxygen saturation < 91% Other indications are: ✓ Tachypnoea of 20 breaths/min above the age-specific cut -off point ✓Restlessness ( not due to meningitis) ✓ titubation ✓ tachycardia 90The following is/are appropriate in a 2 year old with asthma"}, {"label": "A", "text": "MDI only", "answer": "F", "rationale": ""}, {"label": "B", "text": "MDI + VSD", "answer": "F", "rationale": ""}, {"label": "C", "text": "MDI +VSD + Mouthpiece", "answer": "F", "rationale": ""}, {"label": "D", "text": "MDI + VSD + Facemask", "answer": "T", "rationale": ""}, {"label": "E", "text": "Nebulizer + Face mask", "answer": "T", "rationale": "91.Concerning bronchiectasis"}, {"label": "A", "text": "Tb and Pertussis are common causes", "answer": "T", "rationale": ""}, {"label": "B", "text": "Antibiotics is the main stay of treatment", "answer": "F", "rationale": "Airway clearance and treating cause; antibiotics during exacerbations only."}, {"label": "C", "text": "Symptoms are similar to that of lung abscess", "answer": "T", "rationale": ""}, {"label": "D", "text": "Cor Pulmonale is a late complication", "answer": "T", "rationale": ""}, {"label": "E", "text": "Type III (saccular) has the best prognosis", "answer": "F", "rationale": "Saccular type has worst prognosis; cylindrical type is better."}]}, {"id": "Q0085", "type": "tf", "stem": "Concerning Bronchiolitis:", "system": "Pulmonology", "topic": "Bronchiolitis & viral LRTI", "source": "TF Series B", "aiAuthored": false, "options": [{"label": "A", "text": "Wheeze is present", "answer": "T", "rationale": ""}, {"label": "B", "text": "Poor prognostic indicator is underlying congenital heart defect", "answer": "T", "rationale": ""}, {"label": "C", "text": "Has poor prognosis, morality is >10%", "answer": "F", "rationale": ""}, {"label": "D", "text": "Adenovirus is the commonest cause", "answer": "F", "rationale": ""}, {"label": "E", "text": "Diazepam syrup is indicated when the patient is restless", "answer": "F", "rationale": "Definition Bronchiolitis is an acute, infectious, inflammatory disease of the lower respiratory tract resulting in obstruction of the small airways. Epidemiology Typically affects children younger than 2 years, principally during the rainy season in tropical countries, and fall and winter in temperate countries. Peak age incidence is 2 –6 months. It is a significant cause of respiratory disease during the first 2 years of life. Bronchiolitis is the most frequent lower respiratory tract infection during infancy requiring hospitalization. It is commoner in boys than girls. Infection is spread by fomites via environmental surfaces. Hand washing and the use of disposable gloves and gowns may reduce nosocomial spread. Risk factors for early onset disease and subsequent hospitalization: * Low birth weight, * Prematurity, * Lower socioeconomic group, * Crowded living conditions, * Parental smoking, * Absence of breast-feeding, and * Day care attendance. Aetiology of bronchiolitis ✓ 70% of cases due to respiratory syncytial virus (RSV).1 serotype is involved but 2 antigenic groups of RSV (A and B), with type A causing the majority of severe infections. ✓Other viruses are parainfluenza, influenza, coronavirus, adenovirus, rhinovirus, metapneumovirus, human bocavirus. ✓Mycoplasma Clinical Features of bronchiolitis Incubation period: 2-5 days. Profuse coryza, congestion and a low-grade fever initially. During a period of 2-5 days this may progress to lower respiratory tract involvement with the development of cough, dyspnoea, wheezing and feeding difficulties. Severe cases progress to respiratory distress with tachypnoea, nasal flaring, retractions and irritability and possibly cyanosis. Physical examination often reveals retractions, fine crepitations (crackles) and diffuse, fine wheezing. The severity of the disease is directly related to post-conceptual age. Infants less than six months of age are the most severely affected due to smaller, more easily obstructed airways and decreased ability to clear secretions. Clinical course Most patients have mild clinical illness and recover uneventfully in 5-7 days but coughing may persist for up to 2 weeks. However, 20% of normal children will have a protracted course with wheezing and abnormal pulmonary function studies for many months. Children with bronchopulmonary dysplasia (BPD), Congenital heart disease (CHD) and pulmonary hypertension have worse clinical course."}]}, {"id": "Q0086", "type": "tf", "stem": "The following are differentials of a military picture on Chest X-ray", "system": "Pulmonology", "topic": "Tuberculosis", "source": "TF Series B", "aiAuthored": false, "options": [{"label": "A", "text": "Pneumocystic Carini Pneumonia", "answer": "F", "rationale": "Causes ground-glass opacity, not miliary nodules."}, {"label": "B", "text": "Eosinophilic Pneumonia", "answer": "T", "rationale": ""}, {"label": "C", "text": "Chlamydia Pneumonia", "answer": "T", "rationale": ""}, {"label": "D", "text": "Sarcoidosis", "answer": "T", "rationale": ""}, {"label": "E", "text": "Chicken Pox Pneumonia", "answer": "T", "rationale": "Causes diffuse nodular infiltrates, sometimes miliary-like."}]}, {"id": "Q0087", "type": "tf", "stem": "Common Causes of Mortality in Under 5 age group include", "system": "Others (Emergency/Social)", "topic": "Community, social & global health", "source": "TF Series B", "aiAuthored": false, "options": [{"label": "A", "text": "Measles", "answer": "T", "rationale": ""}, {"label": "B", "text": "Malaria", "answer": "T", "rationale": ""}, {"label": "C", "text": "Pneumonias", "answer": "T", "rationale": ""}, {"label": "D", "text": "Gastroenteritis", "answer": "T", "rationale": ""}, {"label": "E", "text": "Malnutrition", "answer": "T", "rationale": ""}]}, {"id": "Q0088", "type": "tf", "stem": "The following are correctly matched", "system": "Cardiology", "topic": "CVS examination & concepts", "source": "TF Series B", "aiAuthored": false, "options": [{"label": "A", "text": "Single, soft pulmonary closure sound – Severe pulmonary Stenosis", "answer": "T", "rationale": ""}, {"label": "B", "text": "Loud pulmonary closure sound – Pulmonary Hypertension", "answer": "T", "rationale": ""}, {"label": "C", "text": "Ejection systolic murmur loudest at right upper sternal edge – Aortic Incompetence", "answer": "F", "rationale": "Aortic incompetence (regurgitation) produces a high-pitched early diastolic murmur, not an ejection systolic murmur. It is best heard at the left 3rd intercostal space, not RUSE. A systolic murmur at RUSE would more accurately indicate aortic stenosis."}, {"label": "D", "text": "Continuous murmur at left upper sternal edge – Ventricular Septal Defect", "answer": "F", "rationale": "Ventricular septal defect (VSD) produces a pan-systolic (holosystolic) murmur heard best at the lower left sternal edge (LLSE). A continuous murmur at LUSE is classically seen in patent ductus arteriosus (PDA)."}, {"label": "E", "text": "Diastolic apical Murmur – Mitral incompetence", "answer": "F", "rationale": "Mitral incompetence (regurgitation) causes a pansystolic murmur heard best at the apex. A diastolic murmur at the apex is typical of mitral stenosis."}]}, {"id": "Q0089", "type": "tf", "stem": "The following measures are appropriate in the treatment of hyper cyanotic spell", "system": "Cardiology", "topic": "TOF & cyanotic CHD", "source": "TF Series B", "aiAuthored": false, "options": [{"label": "A", "text": "Cardiac position", "answer": "F", "rationale": ""}, {"label": "B", "text": "Oxygen by face mask", "answer": "T", "rationale": ""}, {"label": "C", "text": "Oral propanolol, 1mg/kg/dose", "answer": "F", "rationale": ""}, {"label": "D", "text": "Antibiotics", "answer": "F", "rationale": ""}, {"label": "E", "text": "Plasma Exchange", "answer": "F", "rationale": "Hypercyanotic Spells (Tet Spells) These are acute hypoxic episodes seen in children with Tetralogy of Fallot and other cyanotic congenital heart diseases. Causes: Triggered by crying, feeding, defecation, fever, or agitation. Caused by right ventricular outflow tract spasm and decreased systemic vascular resistance. Treatment: Goals of Treatment"}]}, {"id": "Q0090", "type": "tf", "stem": "Differential diagnosis of a 4yr old child with cyanosis and reduced effort tolerance includes", "system": "Cardiology", "topic": "TOF & cyanotic CHD", "source": "TF Series B", "aiAuthored": false, "options": [{"label": "A", "text": "Tetralogy of Fallot", "answer": "T", "rationale": ""}, {"label": "B", "text": "Pulmonary stenosis", "answer": "F", "rationale": ""}, {"label": "D", "text": "Ventricular septal defect", "answer": "F", "rationale": ""}, {"label": "E", "text": "Asthma", "answer": "F", "rationale": "Asthma causes effort intolerance, wheezing, and sometimes dyspnea, but not chronic cyanosis. Cyanosis in asthma occurs only during acute severe attacks, not as a baseline. Clinical Features of Tetralogy of Fallot Symptoms: Cyanosis Effort intolerance Squatting (compensatory mechanism to increase systemic vascular resistance) Failure to thrive Hypercyanotic spells (Tet spells) Convulsions (from hypoxia or cerebral thrombosis) Cerebrovascular accident (CVA) Bleeding diathesis (due to thrombocytopenia and coagulation defects) Signs: Small for age Cyanosis Polycythemia Digital clubbing ± Breathlessness ± Right ventricular (RV) heave ± Systolic thrill at left sternal edge (LSE) Single second heart sound (S2) Ejection systolic murmur at left upper sternal edge (LUSE) or Pansystolic murmur at lower left sternal edge (LLSE) if there is a large ventricular septal defect."}]}, {"id": "Q0091", "type": "tf", "stem": "3yr old girl presented at the children outpatient clinic with 5 weeks history of progressive abdominal swelling", "system": "Haematology & Oncology", "topic": "Childhood cancers", "source": "TF Series B", "aiAuthored": false, "options": [{"label": "A", "text": "It is neuroblastoma, if the swelling crosses the midline", "answer": "T", "rationale": ""}, {"label": "B", "text": "Opsomyoclonus suggest nephroblastoma", "answer": "F", "rationale": "Opsoclonus-myoclonus syndrome (OMS) is a rare paraneoplastic syndrome that is strongly associated with neuroblastoma, not nephroblastoma."}, {"label": "C", "text": "Downwards displacement of the kidney on Ultrasound is in line with neuroblastoma", "answer": "F", "rationale": ""}, {"label": "D", "text": "Elevated urinary VMA is diagnostic for Nephroblastoma", "answer": "F", "rationale": "Elevated urinary VMA (Vanillylmandelic acid) is a marker for neuroblastoma, not Wilms tumor. NEUROBLASTOMA – INVESTIGATIONS Confirmatory test: Biopsy FBC BM (Bone Marrow aspiration/biopsy) Urinary VMA (Vanillylmandelic Acid) / HVA (Homovanillic Acid): Increased in >90% Serum CEA (Carcinoembryonic Antigen): May be elevated X-ray: May show calcifications IVU (Intravenous Urography): Kidney displaced downward and laterally, calyces normal Ultrasound/CT/MRI: Define mass and assess spread. MIBG scan (Metaiodobenzylguanidine scan): For staging and metastasis detection"}, {"label": "E", "text": "Metastasis to the lungs makes neuroblastoma more likely", "answer": "F", "rationale": "Lung metastases are more common in Wilms tumor, whereas neuroblastoma metastasizes more commonly to bone, bone marrow, liver, and skin."}]}, {"id": "Q0092", "type": "tf", "stem": "A 3 year old boy managed for TOF by the cardiology unit presented with fever after tooth extraction: the following are relevant in his management:", "system": "Cardiology", "topic": "Infective endocarditis", "source": "TF Series B", "aiAuthored": false, "options": [{"label": "A", "text": "History of conjunctival petechiae is important", "answer": "T", "rationale": "Conjunctival petechiae are a minor clinical sign of infective endocarditis and should be inquired about."}, {"label": "B", "text": "Jones criteria", "answer": "F", "rationale": "Jones criteria are for diagnosing acute rheumatic fever, not infective endocarditis. Modified Dukes criteria is used"}, {"label": "C", "text": "History of pre op medication", "answer": "T", "rationale": "Pre-operative antibiotic prophylaxis is important in patients with congenital heart disease like TOF undergoing procedures like dental extraction, to prevent infective endocarditis."}, {"label": "D", "text": "Apical murmur", "answer": "T", "rationale": "A new murmur or change in existing murmur can be a sign of valvular involvement, one of the Duke major or minor echocardiographic criteria (depending on findings)."}, {"label": "E", "text": "Antibiotics therapy for 21 days", "answer": "F", "rationale": "Standard treatment for IE in children is usually 6 weeks, depending on the organism and complications (e.g., with gentamicin or vancomycin + penicillin). Note that, the diagnosis is infective endocarditis."}]}, {"id": "Q0093", "type": "tf", "stem": "Likely differential diagnosis to consider in a 3-month old child who is cyanosed and in heart failure include", "system": "Cardiology", "topic": "TOF & cyanotic CHD", "source": "TF Series B", "aiAuthored": false, "options": [{"label": "A", "text": "Fallot’s tetralogy.", "answer": "F", "rationale": "TOF usually presents after 6 months, with cyanosis without heart failure"}, {"label": "B", "text": "Transposition of the great arteries.", "answer": "T", "rationale": ""}, {"label": "C", "text": "Critical Pulmonary stenosis.", "answer": "T", "rationale": ""}, {"label": "D", "text": "Tricuspid atresia.", "answer": "T", "rationale": ""}, {"label": "E", "text": "Critical aortic stenosis", "answer": "F", "rationale": ""}]}, {"id": "Q0094", "type": "tf", "stem": "SK is a 9-month-old girl, newly diagnosed with HIV infection. She is currently not symptomatic. Which of the following statements are true about her management?", "system": "Infectious Disease", "topic": "HIV & vertical infections", "source": "TF Series C", "aiAuthored": false, "options": [{"label": "A", "text": "Her baseline CD4 counts will determine if she requires antiretroviral therapy.", "answer": "F", "rationale": "2016 Guidelines for ART in children ART should be initiated in all children with HIV, regardless of WHO clinical stage, or at any CD4+ cell count.As a priority, ART should be initiated in the following situations: • All children < 2 years of age • All children < 5 years of age with WHO clinical stage 3 or 4 or CD4 count < 750 00cells/mm³ or CD4+ percentage < 25% • All children ≥ 5 with WHO HIV clinical stage 3 or 4 disease or CD4 count < 350 cells/mm³"}, {"label": "B", "text": "Her baseline viral load will determine if she requires antiretroviral therapy.", "answer": "F", "rationale": ""}, {"label": "C", "text": "The recommended combination antiretroviral therapy for her age is ABC/3TC/DTG.", "answer": "F", "rationale": "Age < 3 years: Abacavir + Lamivudine +Lopinavir/ritonavir (pellets) (ABC + 3TC + LPV/r) PELLETS Age 3 – 6 years: Abacavir + Lamivudine +Lopinavir/ritonavir (tablets). (ABC + 3TC + LPV/r ) tablets Age 7 – 10 years: If weight ≥ 30 kg:Abacavir + Lamivudine + Dolutegravir (ABC + 3TC + DTG) If weight < 30 kg:Abacavir + Lamivudine + Efavirenz (ABC + 3TC + EFV)"}, {"label": "D", "text": "The recommended combination antiretroviral therapy for her age is ABC/3TC/LPV/r.", "answer": "T", "rationale": ""}, {"label": "E", "text": "Continued breastfeeding is highly recommended in her.", "answer": "T", "rationale": ""}]}, {"id": "Q0095", "type": "tf", "stem": "MS is a 4-year old maternal orphan brought by aunt with 3-month history of weight loss,fever and cough. He recently lost some developmental milestones and has had bloody diarrhoea in the last 6 weeks. Which of the following are true possible differential diagnosis", "system": "Infectious Disease", "topic": "HIV & vertical infections", "source": "TF Series C", "aiAuthored": false, "options": [{"label": "A", "text": "Disseminated tuberculosis", "answer": "T", "rationale": ""}, {"label": "B", "text": "HIV associated nephropathy", "answer": "F", "rationale": ""}, {"label": "C", "text": "Protein energy malnutrition", "answer": "T", "rationale": "Prolonged weight loss and chronic illness increase the risk; PEM is a likely co-diagnosis."}, {"label": "D", "text": "HIV encephalopathy", "answer": "T", "rationale": "Developmental regression is a key sign in HIV encephalopathy"}, {"label": "E", "text": "Cerebral palsy", "answer": "F", "rationale": ""}]}, {"id": "Q0096", "type": "tf", "stem": "A four day old male term baby presented in Children Emergency Ward with a two day history of bleeding from the nose, umbilical cord and rectum. No history of fever and physical examination revealed an otherwise well child. Side room PCV was found to be 30%. Concerning hismanagement, the following statements are true", "system": "Neonatology", "topic": "Neonatal bleeding (VKDB)", "source": "TF Series C", "aiAuthored": false, "options": [{"label": "A", "text": "A history of exclusive breastfeeding and maternal phenobarbitone use in pregnancy are important positives.", "answer": "T", "rationale": ""}, {"label": "B", "text": "The PCV is within expected value and needs no intervention.", "answer": "F", "rationale": "A PCV of 30% is low for a term neonate (normal: ~45–65%). Ongoing bleeding may require transfusion."}, {"label": "C", "text": "PK / PTTK is expected to be normal.", "answer": "F", "rationale": ""}, {"label": "D", "text": "He needs urgent oral Vitamin K1.", "answer": "F", "rationale": "IV vitamin K1 is administered."}, {"label": "E", "text": "The condition is physiologic and needs only conservative management.", "answer": "F", "rationale": "Vitamin K deficiency bleeding (VKDB) is a pathologic bleeding disorder and requires active medical treatment, not conservative care. Notes Haemorrhagic disease of the Newborn (vitamin K deficiency bleeding) After birth, there is a slight reduction in vitamin K levels between 2nd and 7th days of life Exaggeration of this process leads to HDN • Early < 24hrs • Late > 1 week Predisposing factors: - Birth asphyxia - Maternal drugs like phenobarbitone, ASA, Coumarin - Exclusive breastfeeding - Broad-spectrum antibiotic therapy - Perenteral nutrition Clinical features: -Bleeding which tends to be Gl,nasal,subgaleal,intracranial,post circumcision in a well child - PT, PTT prolonged - Thrombin time and fibrinogen levels are normal. Treatment: • IV vit K1 1-5mg stat • EBT in severe cases with fresh whole blood • Can be prevented by admin of IM vit K 1mg at birth, 0.5mg weekly to babies on parenteral nutrition."}]}, {"id": "Q0097", "type": "tf", "stem": "The following are true concerning acute post-streptococcal glomerulonephritis", "system": "Nephrology", "topic": "AGN, PSGN & glomerulonephritis", "source": "TF Series C", "aiAuthored": false, "options": [{"label": "A", "text": "Lancefield group A β-Haemolytic streptococcus is the only streptococcus associated with this condition", "answer": "F", "rationale": ""}, {"label": "B", "text": "The latency period between the infection and clinical manifestation of the disease is usually 2 days.", "answer": "F", "rationale": "In AGN, the typical presentation follows an infection of the skin or pharynx, with a latent period before onset of AGN symptoms: Pharyngitis-associated AGN: 1–3 weeks latency. Pyoderma-associated AGN: 3–6 weeks latency. Following this latent period, features of AGN begin to manifest:"}, {"label": "D", "text": "Hypertensive encephalopathy is a known complication", "answer": "T", "rationale": ""}, {"label": "E", "text": "It is commonly associated with end-stage renal disease", "answer": "F", "rationale": "Acute Poststreptoccal glomerulonephritis generally has a good prognosis in children; progression to ESRD is rare. Other notes Complications of post streptococcal AGN 1. Hypertensive Encephalopathy: Convulsions Impaired consciousness Paresis"}]}, {"id": "Q0098", "type": "tf", "stem": "The following are correct steps to take in the delivery room in the given scenarios;", "system": "Neonatology", "topic": "Newborn care & resuscitation", "source": "TF Series C", "aiAuthored": false, "options": [{"label": "A", "text": "30 seconds after birth, if a term baby fails to breathe or cry after initial steps: Commence bag and mask ventilation", "answer": "T", "rationale": "Begin PPV if the baby is apneic or has gasping respiration despite drying and stimulation."}, {"label": "B", "text": "A baby that fails to breath or cry immediately after birth: Assess the Apgar score at one minute", "answer": "F", "rationale": "Apgar scoring is a tool for documentation, not for guiding immediate resuscitation. Resuscitation should begin without waiting."}, {"label": "C", "text": "If a baby fails to breath after 45seconds of bag and mask ventilation: Give intravenous adrenalin 1:10,000 dilution", "answer": "F", "rationale": "Adrenaline is indicated only if HR remains <60 bpm after 30 seconds of effective ventilation and chest compressions, not just for lack of breathing."}, {"label": "D", "text": "If a baby’s heart rate remains 80b/min despite 45seconds of bag and mask ventilation: take steps to improve ventilation and continue bagging", "answer": "T", "rationale": "If HR is between 60–100 bpm, reassess and optimize ventilation (e.g., better mask seal, positioning)."}, {"label": "E", "text": "A term baby that cries immediately after birth: Dry, reposition, place skin to skin with mother and cut the cord after 1 – 3minutes.", "answer": "T", "rationale": "F. If a baby’s heart rate is less than 60b/min, continue bagging and add chest compression T 6 A 16-hour old term male neonate was noticed to be icteric by a Medical Student while on call on a Saturday afternoon. The following lines of management are correct"}, {"label": "A", "text": "Encourage exclusive breastfeeding and see patient in 48hrs for a repeat Serum bilirubin check", "answer": "F", "rationale": "At 16 hours, jaundice is considered pathological, not physiological. This requires immediate serum bilirubin assessment and evaluation for causes such as sepsis, haemolysis, or metabolic disease."}, {"label": "B", "text": "Breast milk jaundice may be the most likely cause", "answer": "F", "rationale": "Breast milk jaundice typically appears after 3–5 days of life, not within 24 hours."}, {"label": "C", "text": "Lower Serum bilirubin in the phase of metabolic acidosis and sepsis may indicate Exchange Blood transfusion", "answer": "T", "rationale": ""}, {"label": "D", "text": "Rhesus Iso-immunization may be a cause", "answer": "T", "rationale": ""}, {"label": "E", "text": "G6PD deficiency is very unlikely", "answer": "F", "rationale": "Other notes Criteria for Pathological Jaundice in a Newborn: 1. Early onset of jaundice Appearance of jaundice within the first 24 hours of life (i.e., before 1 day old). 2. High total serum bilirubin (TSB) levels Serum bilirubin >95th percentile for age in hours, based on the Bhutani nomogram. More specifically: >15 mg/dL in term infants. >10 mg/dL in preterm infants. 3. Rate of rise is too rapid Increase in total serum bilirubin by >5 mg/dL per day. OR >0.5 mg/dL per hour. 4. Duration longer than expected Jaundice lasting >14 days in a term baby or >21 days in a preterm baby is abnormal and should be investigated (called prolonged jaundice). 5. Conjugated (direct) hyperbilirubinemia Direct (conjugated) bilirubin >2 mg/dL, or >20% of total bilirubin is considered pathological and always abnormal. Suggests cholestasis or hepatobiliary disease. 6. Signs of underlying disease Jaundice associated with: Poor feeding Lethargy High-pitched cry Vomiting Hepatosplenomegaly Anemia or pallor Sepsis Dark urine or pale (acholic) stools Neurological symptoms (risk of kernicterus)"}]}, {"id": "Q0099", "type": "tf", "stem": "The following are in keeping with a malaria parasite count of 150,000/μl in a non -endemic community.", "system": "Infectious Disease", "topic": "Malaria", "source": "TF Series C", "aiAuthored": false, "options": [{"label": "A", "text": "Serum bicarbonate of 25mmol/l", "answer": "F", "rationale": ""}, {"label": "B", "text": "Urine output of <1ml/kg/hr", "answer": "T", "rationale": "This is oliguria, a sign of acute kidney injury and severe malaria."}, {"label": "C", "text": "Haemoglobin concentration of less than 15g/dl", "answer": "F", "rationale": ""}, {"label": "D", "text": "Crepitations on lung auscultation", "answer": "T", "rationale": "Can be a feature of pulmonary edema or ARDS, complications of severe malaria."}, {"label": "E", "text": "Capillary refill <2secs", "answer": "F", "rationale": ""}]}, {"id": "Q0100", "type": "tf", "stem": "An 18 month- old female presented to the children's emergency room with a 2-day history of fever, passage of loose stool and vomiting. Examination revealed sunken eyes, small volume pulses, tenting skin, capillary refill time of 5sec, unconscious, Heart rate =166bpm, Resp rate=52cpm, weight=8kg. The following statements are correct:", "system": "Gastrointestinal & Hepatobiliary", "topic": "Diarrhoeal disease & dehydration", "source": "TF Series C", "aiAuthored": false, "options": [{"label": "A", "text": "The child will require 32mls bolus of 10% Dextrose water.", "answer": "F", "rationale": "In this scenario, the dehydration is severe and complicated by shock. Severe dehydration treatment: Rehydration therapy - Intravenous lactated Ringer solution or normal saline (20 mL/kg until perfusion and mental status improve), followed by 100 mL/kg oral rehydration solution over 4 hours or 5% dextrose (half normal saline) intravenously at twice maintenance fluid rates Replacement of losses Less than 10 kg body weight - 60-120 mL oral rehydration solution for each diarrhea stool or vomiting episode. More than 10 kg body weight - 120-140 mL oral rehydration solution for each diarrhea stool or vomiting episode. If unable to drink, administer through nasogastric tube or intravenously administer 5% dextrose (one fourth normal saline) with 20 mEq/L potassium chloride"}, {"label": "B", "text": "The deficit will be corrected with 600mls of IV fluids over 4 – 6 hours.", "answer": "F", "rationale": "To correct deficit, 100ml/kg ORS is gugen 100 ml/kg × 8 kg = 800 ml total fluid replacement."}, {"label": "C", "text": "Microscopy, culture and sensitivity of stool is required", "answer": "T", "rationale": "Especially for persistent diarrhea or dysentery."}, {"label": "D", "text": "Oral zinc administration can shorten the duration of the illness", "answer": "T", "rationale": "Zinc for 10–14 days reduces the duration and severity of diarrhea."}, {"label": "E", "text": "The most sensitive parameters for monitoring level of dehydration in this age group are skin tugor and buccal mucosa.", "answer": "F", "rationale": "Capillary refill time, mental status, and respiratory pattern are more sensitive in shock; turgor is useful but less sensitive."}]}, {"id": "Q0101", "type": "tf", "stem": "HG is a 2-year-old who presented with cough, coryza, fever, and maculopapular rash all of three days duration. His last immunization at PHC was at 6 months. His mother does not know the name of the vaccine.", "system": "Infectious Disease", "topic": "Measles & viral exanthems", "source": "TF Series C", "aiAuthored": false, "options": [{"label": "A", "text": "All he requires are antipyretics.", "answer": "F", "rationale": ""}, {"label": "B", "text": "He requires broad-spectrum antibiotics.", "answer": "F", "rationale": ""}, {"label": "C", "text": "He is to be admitted and isolated while maintaining contact precaution.", "answer": "F", "rationale": ""}, {"label": "D", "text": "His clinical evaluation is required to make a diagnosis.", "answer": "T", "rationale": "Other notes: DIAGNOSIS OF MEASLES • Mainly Clinical : Using symptoms and signs - WHO clinical case definition: Maculopapular rash (non-vesicular) and fever (> 38ºc) with at least one of the three symptoms: Cough, Coryza and Conjunctivitis. • Koplik spots pathognomonic: diagnostic Management of measles -Antipyretic, eye drops, clean the eyes, calamine lotion, adequate fluid intake. Management of complications include: Antibiotics, management of heart failure, nutritional rehabilitation, vitamin supplements , rehydration, high dose of vitamin A (significantly reduces the risk of morbidity and mortality), management of croup."}]}, {"id": "Q0102", "type": "tf", "stem": "An infant presented with fever, vomiting, and a maculopapular rash of three days duration. Dyspnea and crepitations in lung field
