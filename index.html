Neuromuscular & myopathies", "source": "Ajisco Compiled Peds", "aiAuthored": true, "options": [{"label": "A", "text": "Progressively worsening symptoms.", "answer": "T", "rationale": "DMD is relentlessly progressive."}, {"label": "B", "text": "Effort intolerance.", "answer": "T", "rationale": "Effort intolerance occurs from early proximal weakness."}, {"label": "C", "text": "Learning difficulty.", "answer": "T", "rationale": "Associated learning difficulty is common in DMD."}, {"label": "D", "text": "Positive Tensilon test.", "answer": "F", "rationale": "The Tensilon test is for myasthenia gravis, not muscular dystrophy."}]}, {"id": "A0009", "type": "tf", "stem": "A 7-year-old girl presented with a 6-month history of progressive drooping of both eyelids and double vision. Examination revealed bilateral ptosis and external ophthalmoplegia. The following are true concerning her:", "system": "Neurology", "topic": "Neuromuscular & myopathies", "source": "Ajisco Compiled Peds", "aiAuthored": true, "options": [{"label": "A", "text": "Her disease is likely to be genetic in origin.", "answer": "F", "rationale": "Myasthenia gravis is autoimmune (anti-AChR antibodies), not a genetic disease."}, {"label": "B", "text": "She requires a chest radiograph for complete evaluation.", "answer": "T", "rationale": "Chest imaging evaluates the thymus (thymic hyperplasia/thymoma)."}, {"label": "C", "text": "Positive Gower sign is a recognized feature.", "answer": "F", "rationale": "Gower sign is a feature of Duchenne muscular dystrophy, not myasthenia."}, {"label": "D", "text": "She is at risk of respiratory failure.", "answer": "T", "rationale": "Bulbar/respiratory muscle involvement risks respiratory failure (myasthenic crisis)."}, {"label": "E", "text": "Cyclophosphamide has been shown to be useful in management.", "answer": "F", "rationale": "Steroids/azathioprine are used; cyclophosphamide is not standard therapy."}]}, {"id": "A0010", "type": "tf", "stem": "A 5-year-old boy presented with a 2-day history of weakness in both lower limbs. Limb weakness was preceded by a 3-day history of fever and a 2-day history of pain and stiffness in the lower limbs. He was not immunized. Examination revealed power grade 2 in both lower limbs, hypotonia, hyporeflexia, and normal sensation. The following statements are true:", "system": "Neurology", "topic": "Polio & acute flaccid paralysis", "source": "Ajisco Compiled Peds", "aiAuthored": true, "options": [{"label": "A", "text": "A history of neck pain and stiffness is consistent with his presentation.", "answer": "T", "rationale": "Pre-paralytic/paralytic polio presents with fever, muscle pain, stiff neck and back."}, {"label": "B", "text": "A positive family history is characteristic.", "answer": "F", "rationale": "Polio is an acquired viral infection — family history is irrelevant."}, {"label": "C", "text": "The most important diagnostic investigation is a lumbosacral MRI scan.", "answer": "F", "rationale": "Diagnosis rests on stool viral isolation/PCR (plus CSF); MRI is not the key test."}, {"label": "D", "text": "He requires complete bed rest in the first week of admission and until fever resolves.", "answer": "T", "rationale": "Bed rest in the acute (febrile) phase limits progression of paralysis."}, {"label": "E", "text": "IM Acetaminophen is useful in pain control.", "answer": "F", "rationale": "IM injections are avoided in acute polio — they can provoke further paralysis; use oral analgesia."}]}, {"id": "A0011", "type": "tf", "stem": "Muscular dystrophies:", "system": "Neurology", "topic": "Neuromuscular & myopathies", "source": "Ajisco Compiled Peds", "aiAuthored": true, "options": [{"label": "A", "text": "It is genetic.", "answer": "T", "rationale": "Muscular dystrophies are genetic disorders."}, {"label": "B", "text": "There is a sex predilection.", "answer": "T", "rationale": "X-linked types (Duchenne, Becker) show strong male sex predilection."}, {"label": "C", "text": "It is progressive.", "answer": "T", "rationale": "They are progressive disorders."}, {"label": "D", "text": "There is always muscular degeneration.", "answer": "T", "rationale": "Progressive muscle fibre degeneration is the defining pathology."}, {"label": "E", "text": "Cardiomyopathy is always present.", "answer": "F", "rationale": "Cardiomyopathy is common in DMD but not invariably present in all dystrophies."}]}, {"id": "A0012", "type": "tf", "stem": "Seizures:", "system": "Neurology", "topic": "Seizures & epilepsy", "source": "Ajisco Compiled Peds", "aiAuthored": true, "options": [{"label": "A", "text": "Complex febrile seizure has a duration of between 10-15 minutes.", "answer": "F", "rationale": "Complex febrile seizures last MORE than 15 minutes (or are focal/recurrent within 24 h)."}, {"label": "B", "text": "Recurrent febrile seizure is an indication for developing epilepsy in later life.", "answer": "T", "rationale": "Recurrent/complex febrile seizures increase the risk of later epilepsy."}, {"label": "C", "text": "EEG is necessary for definitive diagnosis.", "answer": "F", "rationale": "Febrile seizure is a clinical diagnosis; EEG is not required for definitive diagnosis."}, {"label": "D", "text": "West syndrome has a poor prognosis.", "answer": "T", "rationale": "West syndrome (infantile spasms) has a poor neurodevelopmental prognosis."}, {"label": "E", "text": "Neurofibromatosis is inherited as autosomal recessive.", "answer": "F", "rationale": "Neurofibromatosis is autosomal DOMINANT, not recessive."}]}, {"id": "A0013", "type": "tf", "stem": "Concerning GBS:", "system": "Neurology", "topic": "Neuropathies & GBS", "source": "Ajisco Compiled Peds", "aiAuthored": true, "options": [{"label": "A", "text": "Paralysis is often symmetrical.", "answer": "T", "rationale": "GBS causes a symmetrical ascending flaccid paralysis."}, {"label": "B", "text": "Preceding viral infection is typical.", "answer": "T", "rationale": "A preceding viral illness (e.g. Campylobacter/viral infection) is typical."}, {"label": "C", "text": "Clear cut sensory level exists on the trunk.", "answer": "F", "rationale": "A clear truncal sensory level points to transverse myelitis, not GBS."}, {"label": "D", "text": "CSF protein 800 mg/dl and WBC of 2 cells/mm is suggestive.", "answer": "T", "rationale": "High CSF protein with normal cells (albuminocytological dissociation) supports GBS."}, {"label": "E", "text": "Plasmapheresis is indicated when respiratory arrest is imminent.", "answer": "T", "rationale": "Plasmapheresis (or IVIG) is indicated when respiratory failure threatens."}]}, {"id": "A0014", "type": "tf", "stem": "Common causes of Cerebral Palsy in Nigeria include:", "system": "Neurology", "topic": "Cerebral palsy", "source": "Ajisco Compiled Peds", "aiAuthored": true, "options": [{"label": "A", "text": "Severe birth asphyxia.", "answer": "T", "rationale": "Severe birth asphyxia is a leading cause in our setting."}, {"label": "B", "text": "Severe neonatal jaundice.", "answer": "T", "rationale": "Kernicterus from severe neonatal jaundice causes (dyskinetic) CP."}, {"label": "C", "text": "Pyogenic meningitis.", "answer": "T", "rationale": "Post-neonatal brain insult from pyogenic meningitis can cause CP."}, {"label": "D", "text": "Intrauterine factors.", "answer": "T", "rationale": "Intrauterine (prenatal) factors contribute significantly."}, {"label": "E", "text": "Poliomyelitis.", "answer": "F", "rationale": "Polio causes flaccid paralysis, not cerebral palsy."}]}, {"id": "A0015", "type": "tf", "stem": "The following are causes of seizures:", "system": "Neurology", "topic": "Seizures & epilepsy", "source": "Ajisco Compiled Peds", "aiAuthored": true, "options": [{"label": "A", "text": "Hypokalemia.", "answer": "F", "rationale": "Hypokalaemia is not a recognized metabolic cause of convulsions."}, {"label": "B", "text": "Hyponatremia.", "answer": "T", "rationale": "Hyponatraemia is a common metabolic cause of seizures."}, {"label": "C", "text": "Hypernatremia.", "answer": "T", "rationale": "Hypernatraemia (e.g. with dehydration) can provoke seizures."}, {"label": "D", "text": "Hypoglycemia.", "answer": "T", "rationale": "Hypoglycaemia is a classic cause of convulsions."}, {"label": "E", "text": "Hypocalcemia.", "answer": "T", "rationale": "Hypocalcaemia (tetany) causes convulsions, especially in infants."}]}, {"id": "A0016", "type": "tf", "stem": "The following are common causes of coma in children in Ibadan:", "system": "Neurology", "topic": "CNS infections & coma", "source": "Ajisco Compiled Peds", "aiAuthored": true, "options": [{"label": "A", "text": "Meningitis.", "answer": "T", "rationale": "Meningitis is a leading cause of childhood coma here."}, {"label": "B", "text": "Brain tumor.", "answer": "F", "rationale": "Brain tumours are uncommon causes of acute coma in children."}, {"label": "C", "text": "Cerebral malaria.", "answer": "T", "rationale": "Cerebral malaria is a common cause of coma in Ibadan."}, {"label": "D", "text": "Diabetes mellitus.", "answer": "F", "rationale": "Diabetic ketoacidosis can cause coma but is an uncommon cause in children here."}, {"label": "E", "text": "Tetanus.", "answer": "F", "rationale": "Tetanus causes muscle spasms/rigidity with intact consciousness, not coma."}]}, {"id": "A0017", "type": "tf", "stem": "Classical features of meningitis in a 1-month-old infant include:", "system": "Neurology", "topic": "CNS infections & coma", "source": "Ajisco Compiled Peds", "aiAuthored": true, "options": [{"label": "A", "text": "Positive Kernig sign.", "answer": "F", "rationale": "Kernig sign is often absent/unreliable in young infants."}, {"label": "B", "text": "Neck rigidity.", "answer": "F", "rationale": "Neck rigidity is typically absent in young infants with meningitis."}, {"label": "C", "text": "Excessive crying.", "answer": "T", "rationale": "Irritability/excessive crying is a common presentation."}, {"label": "D", "text": "Vomiting.", "answer": "T", "rationale": "Vomiting features prominently in infant meningitis."}, {"label": "E", "text": "Convulsion.", "answer": "T", "rationale": "Convulsions are a frequent feature in this age group."}]}, {"id": "A0018", "type": "tf", "stem": "An upper limb paralysis as a result of poliomyelitis will show:", "system": "Neurology", "topic": "Polio & acute flaccid paralysis", "source": "Ajisco Compiled Peds", "aiAuthored": true, "options": [{"label": "A", "text": "Wasting.", "answer": "T", "rationale": "Lower motor neuron lesion → marked muscle wasting develops."}, {"label": "B", "text": "Hypotonia.", "answer": "T", "rationale": "LMN paralysis gives hypotonia (flaccidity)."}, {"label": "C", "text": "Hypertonia.", "answer": "F", "rationale": "Hypertonia is an UPPER motor neuron feature."}, {"label": "D", "text": "Fasciculations.", "answer": "T", "rationale": "Fasciculations occur in LMN (anterior horn cell) lesions."}, {"label": "E", "text": "Brisk reflexes.", "answer": "F", "rationale": "Reflexes are reduced/absent in LMN lesions, not brisk."}]}, {"id": "A0019", "type": "tf", "stem": "Meningitis in children is most frequently caused by:", "system": "Neurology", "topic": "CNS infections & coma", "source": "Ajisco Compiled Peds", "aiAuthored": true, "options": [{"label": "A", "text": "Staphylococcus aureus.", "answer": "F", "rationale": "Staph. aureus is an uncommon cause of meningitis."}, {"label": "B", "text": "Haemophilus influenzae.", "answer": "F", "rationale": "H. influenzae type b was common but declined sharply with vaccination."}, {"label": "C", "text": "Neisseria meningitidis.", "answer": "F", "rationale": "N. meningitidis causes epidemics but is not the most frequent overall."}, {"label": "D", "text": "Streptococcus pneumoniae.", "answer": "T", "rationale": "Streptococcus pneumoniae is the most frequent cause of childhood bacterial meningitis."}]}, {"id": "A0020", "type": "tf", "stem": "The following are uncommon features of cerebral malaria:", "system": "Neurology", "topic": "CNS infections & coma", "source": "Ajisco Compiled Peds", "aiAuthored": true, "options": [{"label": "A", "text": "Cortical blindness.", "answer": "T", "rationale": "Cortical blindness is an uncommon (residual) feature of cerebral malaria."}, {"label": "B", "text": "Metabolic alkalosis.", "answer": "F", "rationale": "Cerebral malaria causes metabolic ACIDOSIS, not alkalosis — and neither fits the question properly."}, {"label": "C", "text": "Retinal hemorrhage.", "answer": "F", "rationale": "Retinal haemorrhages are COMMON in cerebral malaria (malarial retinopathy)."}, {"label": "D", "text": "Papilledema.", "answer": "T", "rationale": "Papilloedema is distinctly uncommon in cerebral malaria."}, {"label": "E", "text": "Hypoglycemia.", "answer": "F", "rationale": "Hypoglycaemia is a common complication of severe/cerebral malaria."}]}, {"id": "A0021", "type": "tf", "stem": "Petit mal:", "system": "Neurology", "topic": "Seizures & epilepsy", "source": "Ajisco Compiled Peds", "aiAuthored": true, "options": [{"label": "A", "text": "Occurs predominantly in infants of 5-12 months.", "answer": "F", "rationale": "Absence (petit mal) seizures occur in children ~4–10 years, not 5–12-month infants."}, {"label": "B", "text": "Attacks are associated with loss of muscular tone and fall.", "answer": "F", "rationale": "Falls with loss of tone describe ATONIC seizures, not absence."}, {"label": "C", "text": "Respond to pyridoxine therapy.", "answer": "F", "rationale": "Pyridoxine is for pyridoxine-dependent seizures of neonates; absence responds to ethosuximide."}, {"label": "D", "text": "Electroencephalogram has the characteristics of hypsarrhythmia.", "answer": "F", "rationale": "Hypsarrhythmia is the EEG of West syndrome; absence shows 3-Hz spike-and-wave."}, {"label": "E", "text": "Mental retardation is rare.", "answer": "T", "rationale": "Childhood absence epilepsy usually has normal cognition — mental retardation is rare."}]}, {"id": "A0022", "type": "tf", "stem": "With respect to febrile convulsions:", "system": "Neurology", "topic": "Seizures & epilepsy", "source": "Ajisco Compiled Peds", "aiAuthored": true, "options": [{"label": "A", "text": "It occurs in children aged 6 months to 5 years.", "answer": "T", "rationale": "Febrile convulsions occur between 6 months and 5 years of age."}, {"label": "B", "text": "Seizure is focal in the simple variety.", "answer": "F", "rationale": "Simple febrile seizures are GENERALIZED; focality makes them complex."}, {"label": "C", "text": "Seizure rarely lasts more than 15 minutes.", "answer": "T", "rationale": "Simple febrile seizures are brief — rarely more than 15 minutes."}, {"label": "D", "text": "Meningitis is a common cause in our environment.", "answer": "F", "rationale": "By definition febrile seizure excludes CNS infection; meningitis must rather be excluded."}, {"label": "E", "text": "Long-term prophylaxis with anticonvulsant is advisable after the first episode.", "answer": "F", "rationale": "Long-term anticonvulsant prophylaxis after a first simple febrile seizure is not recommended."}]}, {"id": "A0023", "type": "tf", "stem": "About febrile convulsions:", "system": "Neurology", "topic": "Seizures & epilepsy", "source": "Ajisco Compiled Peds", "aiAuthored": true, "options": [{"label": "A", "text": "70% are complex simple.", "answer": "F", "rationale": "About 70–80% of febrile seizures are SIMPLE, not complex."}, {"label": "B", "text": "65-95% of all febrile seizures.", "answer": "T", "rationale": "Simple febrile seizures account for the large majority of all febrile seizures."}, {"label": "C", "text": "Can be simple, complex, or both.", "answer": "T", "rationale": "Febrile seizures can be simple, complex, or show features of both."}, {"label": "D", "text": "Generalized seizures are simple seizures.", "answer": "T", "rationale": "Simple febrile seizures are generalized tonic-clonic events."}, {"label": "E", "text": "Intracranial infection can be present.", "answer": "F", "rationale": "Presence of intracranial infection excludes febrile seizure by definition."}]}, {"id": "A0024", "type": "tf", "stem": "A 1-year-old was rushed to OTCHEW with altered sensorium, fever, and a <1 hour occurrence of convulsion. Which of these will be used for evaluation?", "system": "Neurology", "topic": "CNS infections & coma", "source": "Ajisco Compiled Peds", "aiAuthored": true, "options": [{"label": "A", "text": "GCS.", "answer": "F", "rationale": "Adult GCS is not validated for a 1-year-old."}, {"label": "B", "text": "Pediatric GCS.", "answer": "T", "rationale": "The paediatric GCS is the appropriate coma scale at this age."}, {"label": "C", "text": "AVPU.", "answer": "T", "rationale": "AVPU is a valid rapid level-of-consciousness assessment."}, {"label": "D", "text": "Blantyre score.", "answer": "T", "rationale": "The Blantyre coma scale is useful, especially when cerebral malaria is suspected."}, {"label": "E", "text": "Gross motor classification.", "answer": "F", "rationale": "Gross motor (GMFCS) classification grades cerebral palsy function, not coma."}]}, {"id": "A0025", "type": "tf", "stem": "Regarding Febrile seizure:", "system": "Neurology", "topic": "Seizures & epilepsy", "source": "Ajisco Compiled Peds", "aiAuthored": true, "options": [{"label": "A", "text": "It can be simple, complex, or both.", "answer": "T", "rationale": "Febrile seizures may be simple, complex, or mixed."}, {"label": "B", "text": "Generalized seizure is a feature of simple febrile.", "answer": "T", "rationale": "Simple febrile seizures are generalized."}, {"label": "C", "text": "70% of cases are complex.", "answer": "F", "rationale": "Only ~30% are complex — most are simple."}, {"label": "D", "text": "It is the commonest form.", "answer": "T", "rationale": "Febrile seizure is the commonest convulsive disorder of childhood."}, {"label": "E", "text": "It occurs without intracranial infection.", "answer": "T", "rationale": "By definition it occurs without intracranial infection or acute electrolyte imbalance."}]}, {"id": "A0026", "type": "tf", "stem": "A 15-year-old male is found unconscious in his room, having attended a party the night before the incident. The following investigations would not be necessary at the initial presentation:", "system": "Neurology", "topic": "Neuro-emergency & poisoning", "source": "Ajisco Compiled Peds", "aiAuthored": true, "options": [{"label": "A", "text": "Toxicology screen.", "answer": "F", "rationale": "A toxicology screen IS necessary after a party with unexplained coma."}, {"label": "B", "text": "Random blood glucose.", "answer": "F", "rationale": "Random blood glucose is essential — hypoglycaemia is a reversible cause of coma."}, {"label": "C", "text": "Electroencephalogram.", "answer": "T", "rationale": "EEG is not needed at initial presentation of undifferentiated coma."}, {"label": "D", "text": "Liver function tests.", "answer": "F", "rationale": "LFTs are necessary (hepatic encephalopathy, toxin ingestion)."}, {"label": "E", "text": "Electrolytes, Urea, and Creatinine.", "answer": "F", "rationale": "E/U/Cr are routine emergency investigations in coma."}]}, {"id": "A0027", "type": "tf", "stem": "The following developmental milestones require further assessment:", "system": "Neurology", "topic": "Development & milestones", "source": "Ajisco Compiled Peds", "aiAuthored": true, "options": [{"label": "A", "text": "Head lag by 4 months.", "answer": "T", "rationale": "Head lag should be gone by ~4 months — persistence warrants assessment."}, {"label": "B", "text": "Handedness by 16 months.", "answer": "T", "rationale": "Established handedness at 16 months is too early; it may signal contralateral weakness."}, {"label": "C", "text": "Can't turn to sound at birth.", "answer": "F", "rationale": "Not turning to sound at birth is normal (develops ~3–4 months)."}, {"label": "D", "text": "Waving bye-bye.", "answer": "F", "rationale": "Waving bye-bye is normal at ~9–12 months; the option gives no abnormal age context."}]}, {"id": "A0028", "type": "tf", "stem": "Hydrocephalus:", "system": "Neurology", "topic": "Hydrocephalus & congenital neuro", "source": "Ajisco Compiled Peds", "aiAuthored": true, "options": [{"label": "A", "text": "It is endemic in Nigeria.", "answer": "F", "rationale": "Hydrocephalus is sporadic (congenital/acquired), not endemic in Nigeria."}, {"label": "B", "text": "Aqueductal stenosis is X-linked.", "answer": "T", "rationale": "Aqueductal stenosis has an X-linked (Bickers–Adams) inherited form."}, {"label": "C", "text": "Loss of sight is a known complication.", "answer": "T", "rationale": "Visual loss from optic atrophy (chronic papilloedema) is a known complication."}, {"label": "D", "text": "Hearing loss is a late complication.", "answer": "F", "rationale": "Hearing loss is not a characteristic late complication of hydrocephalus."}]}, {"id": "A0029", "type": "tf", "stem": "Concerning absence seizures:", "system": "Neurology", "topic": "Seizures & epilepsy", "source": "Ajisco Compiled Peds", "aiAuthored": true, "options": [{"label": "A", "text": "Repeated blinking of the eyes.", "answer": "T", "rationale": "Eyelid blinking/fluttering and subtle automatisms occur in absence seizures."}, {"label": "B", "text": "Repeated falls is a feature.", "answer": "F", "rationale": "Repeated falls suggest atonic/akinetic seizures, not absence."}, {"label": "C", "text": "Drug of choice is ethosuximide.", "answer": "T", "rationale": "Ethosuximide is the drug of choice for absence seizures."}, {"label": "D", "text": "Prognosis is always poor.", "answer": "F", "rationale": "Prognosis is usually GOOD — many children outgrow absence epilepsy."}, {"label": "E", "text": "EEG having 3 characteristic wave spikes.", "answer": "T", "rationale": "EEG shows the classic 3-per-second spike-and-wave pattern."}]}, {"id": "A0030", "type": "tf", "stem": "Developmental disorders:", "system": "Neurology", "topic": "Development & milestones", "source": "Ajisco Compiled Peds", "aiAuthored": true, "options": [{"label": "A", "text": "They all affect the motor.", "answer": "F", "rationale": "Developmental disorders span motor, language, social and cognitive domains — not all motor."}, {"label": "B", "text": "They must be managed with a multidisciplinary approach.", "answer": "T", "rationale": "They require multidisciplinary management (PT, OT, speech, psychology)."}, {"label": "C", "text": "Epilepsy is a comorbidity.", "answer": "T", "rationale": "Epilepsy is a recognized comorbidity of developmental disorders."}, {"label": "D", "text": "Autism is 4-5 times more common in males than females.", "answer": "T", "rationale": "Autism is 4–5 times commoner in males than females."}]}, {"id": "A0031", "type": "tf", "stem": "Which one will need further developmental assessment:", "system": "Neurology", "topic": "Development & milestones", "source": "Ajisco Compiled Peds", "aiAuthored": true, "options": [{"label": "A", "text": "Head lag at 4 months.", "answer": "T", "rationale": "Persistence of head lag at 4 months is abnormal (tone/neuromotor red flag)."}, {"label": "B", "text": "Grasp reflex at 4 months.", "answer": "T", "rationale": "The grasp reflex should be disappearing by 3–4 months; persistence at 4+ months is a red flag."}, {"label": "C", "text": "Hand preference at 16 months.", "answer": "T", "rationale": "Clear hand preference at 16 months is too early and may indicate hemiparesis."}, {"label": "D", "text": "Can't wave bye-bye at 6 months.", "answer": "F", "rationale": "Bye-bye waving is expected at ~9–12 months, so inability at 6 months is normal."}, {"label": "E", "text": "Grasp reflex at 3 months.", "answer": "F", "rationale": "A grasp reflex at 3 months is still normal."}]}, {"id": "A0032", "type": "tf", "stem": "Concerning Muscular Dystrophy:", "system": "Neurology", "topic": "Neuromuscular & myopathies", "source": "Ajisco Compiled Peds", "aiAuthored": true, "options": [{"label": "A", "text": "Genetically inherited.", "answer": "T", "rationale": "Muscular dystrophies are genetically inherited."}, {"label": "B", "text": "There is always a sex predilection.", "answer": "F", "rationale": "Sex predilection applies to X-linked types, not all dystrophies."}, {"label": "C", "text": "Degeneration of muscles is associated.", "answer": "T", "rationale": "Progressive muscle degeneration is characteristic."}, {"label": "D", "text": "Cardiomyopathy is associated with it.", "answer": "T", "rationale": "Cardiomyopathy is a recognized association (especially DMD/BMD)."}]}, {"id": "A0033", "type": "tf", "stem": "There was a clinical scenario with tuberculosis of the spine with midline swelling. The patient cannot walk:", "system": "Neurology", "topic": "Spinal cord disorders", "source": "Ajisco Compiled Peds", "aiAuthored": true, "options": [{"label": "A", "text": "Is chest X-ray important?", "answer": "T", "rationale": "Chest X-ray is important to look for pulmonary TB as the source."}, {"label": "B", "text": "Is there hyperreflexia?", "answer": "T", "rationale": "Cord compression gives UMN signs below the lesion — hyperreflexia is expected."}, {"label": "C", "text": "Is there fasciculations?", "answer": "F", "rationale": "Fasciculations are LMN signs — not expected in cord compression."}]}, {"id": "A0034", "type": "tf", "stem": "A 6-month-old child has features suggesting hydrocephalus:", "system": "Neurology", "topic": "Hydrocephalus & congenital neuro", "source": "Ajisco Compiled Peds", "aiAuthored": true, "options": [{"label": "A", "text": "Sunset eyes will be present.", "answer": "T", "rationale": "Sunset (setting-sun) eyes are classic in infant hydrocephalus."}, {"label": "B", "text": "OFC of 38.5 cm will be in keeping.", "answer": "F", "rationale": "38.5 cm OFC is too small for 6 months (~43 cm expected) — not in keeping."}, {"label": "C", "text": "Co-manage the patient with neurosurgery.", "answer": "T", "rationale": "Management requires neurosurgical co-management (CSF diversion)."}]}, {"id": "A0035", "type": "tf", "stem": "A child presented with convulsion and fever of 2 weeks duration:", "system": "Neurology", "topic": "CNS infections & coma", "source": "Ajisco Compiled Peds", "aiAuthored": true, "options": [{"label": "A", "text": "If comatose, rule out febrile seizures.", "answer": "T", "rationale": "A comatose child cannot have a simple febrile seizure — search for CNS infection."}, {"label": "B", "text": "Lumbar puncture is indicated.", "answer": "T", "rationale": "Lumbar puncture is indicated with 2 weeks of fever and convulsions."}, {"label": "C", "text": "Take brief history.", "answer": "T", "rationale": "A brief focused history is part of stabilization/evaluation."}, {"label": "D", "text": "Give IV Phenobarbital.", "answer": "F", "rationale": "First-line rescue is a benzodiazepine (e.g. diazepam); phenobarbitone is second line."}]}, {"id": "A0036", "type": "tf", "stem": "Concerning Epilepsy:", "system": "Neurology", "topic": "Seizures & epilepsy", "source": "Ajisco Compiled Peds", "aiAuthored": true, "options": [{"label": "A", "text": "Carbamazepine should be given for generalized seizures.", "answer": "F", "rationale": "Carbamazepine is for focal seizures and can worsen generalized epilepsies; valproate covers generalized."}, {"label": "B", "text": "Use EEG for diagnosis without history.", "answer": "F", "rationale": "Epilepsy is diagnosed clinically; EEG alone cannot make the diagnosis."}, {"label": "C", "text": "No jerky limb movements, rule out generalized.", "answer": "F", "rationale": "Absence seizures are generalized yet have no jerky movements — so this cannot rule them out."}]}, {"id": "A0037", "type": "tf", "stem": "The following are true about pain management in children:", "system": "Neurology", "topic": "Pain & palliative care", "source": "Ajisco Compiled Peds", "aiAuthored": true, "options": [{"label": "A", "text": "Oucher scale is used.", "answer": "T", "rationale": "The Oucher scale is a validated paediatric pain tool."}, {"label": "B", "text": "WHO analgesic ladder has 3 steps as a current treatment.", "answer": "F", "rationale": "The WHO analgesic ladder for children has TWO steps (updated guidance)."}]}, {"id": "A0038", "type": "tf", "stem": "Question on myasthenia gravis (drooping of eyelids, inability to swallow, Tensilon test was positive):", "system": "Neurology", "topic": "Neuromuscular & myopathies", "source": "Ajisco Compiled Peds", "aiAuthored": true, "options": [{"label": "A", "text": "Edrophonium is preventive.", "answer": "F", "rationale": "Edrophonium (Tensilon) is a short-acting DIAGNOSTIC agent, not preventive therapy."}, {"label": "B", "text": "It is an autoimmune disease.", "answer": "T", "rationale": "Myasthenia gravis is an autoimmune (antibody-mediated) disorder."}, {"label": "C", "text": "Steroids useful in its management.", "answer": "T", "rationale": "Steroids are useful immunosuppressive therapy in myasthenia."}]}, {"id": "A0039", "type": "tf", "stem": "About muscular dystrophies:", "system": "Neurology", "topic": "Neuromuscular & myopathies", "source": "Ajisco Compiled Peds", "aiAuthored": true, "options": [{"label": "A", "text": "Are genetically determined.", "answer": "T", "rationale": "Muscular dystrophies are genetically determined."}, {"label": "B", "text": "Always have sex predilection.", "answer": "F", "rationale": "Only X-linked forms show male predilection — not universal."}, {"label": "C", "text": "Involves degeneration of the muscle.", "answer": "T", "rationale": "They involve progressive degeneration of muscle."}, {"label": "D", "text": "Are progressive.", "answer": "T", "rationale": "They are progressive disorders."}]}, {"id": "A0040", "type": "tf", "stem": "Which of the following is correct:", "system": "Neurology", "topic": "Neuro-emergency & poisoning", "source": "Ajisco Compiled Peds", "aiAuthored": true, "options": [{"label": "A", "text": "Opioids – Naloxone.", "answer": "T", "rationale": "Opioid poisoning is reversed with naloxone."}, {"label": "B", "text": "Benzodiazepine – activated charcoal.", "answer": "F", "rationale": "Benzodiazepine overdose is reversed with FLUMAZENIL; charcoal adsorbs it poorly."}, {"label": "C", "text": "Lead – dimercaprol.", "answer": "T", "rationale": "Dimercaprol (BAL, with CaNa2EDTA) chelates lead in severe poisoning."}, {"label": "D", "text": "Organophosphate – atropine.", "answer": "T", "rationale": "Organophosphate poisoning is treated with atropine (and pralidoxime)."}]}, {"id": "A0041", "type": "tf", "stem": "Signs of lower motor neuron lesion are:", "system": "Neurology", "topic": "Neuro examination & localization", "source": "Ajisco Compiled Peds", "aiAuthored": true, "options": [{"label": "A", "text": "Marked atrophy.", "answer": "T", "rationale": "Lower motor neuron lesions cause denervation of muscle, which over weeks produces marked muscle wasting/atrophy. This contrasts with UMN lesions where wasting is slight and late."}, {"label": "B", "text": "Hyperreflexia.", "answer": "F", "rationale": "Hyperreflexia is a hallmark of UPPER motor neuron lesions (loss of inhibitory control of reflex arcs). In LMN lesions the reflex arc itself is broken, so reflexes are reduced or absent."}, {"label": "C", "text": "Sustained ankle clonus.", "answer": "F", "rationale": "Sustained ankle clonus is an extreme form of hyperreflexia — again an UMN sign. It does not occur in LMN lesions."}, {"label": "D", "text": "Flexor plantar reflex.", "answer": "F", "rationale": "A flexor (downgoing) plantar response is NORMAL. The Babinski (extensor) response is an UMN sign, not LMN."}, {"label": "E", "text": "Flaccidity.", "answer": "T", "rationale": "Loss of the motor nerve supply reduces resting muscle tone, giving flaccidity/hypotonia — a cardinal LMN feature along with weakness, wasting and hyporeflexia."}]}, {"id": "A0042", "type": "tf", "stem": "A six-month-old female infant with progressive head swelling and distended scalp vein:", "system": "Neurology", "topic": "Hydrocephalus & congenital neuro", "source": "Ajisco Compiled Peds", "aiAuthored": true, "options": [{"label": "A", "text": "OFC of 38.7 cm in view.", "answer": "F", "rationale": "An OFC of 38.7 cm is far below the ~43 cm expected at 6 months; hydrocephalus produces an ABNORMALLY LARGE head, so this measurement is not 'in view'."}, {"label": "B", "text": "Narrowing of ventricles is seen in trans ultrasound scan.", "answer": "F", "rationale": "The ultrasound shows ventricular DILATATION; narrowing of the ventricles is the opposite of what hydrocephalus does."}, {"label": "C", "text": "Neurosurgeon is indicated.", "answer": "T", "rationale": "Progressive macrocrania with signs of raised ICP requires urgent neurosurgical assessment — most will need CSF diversion (VP shunt/ETV)."}, {"label": "D", "text": "Mental retardation is rare in delayed treatment.", "answer": "F", "rationale": "Cognitive impairment is common, not rare, when treatment is delayed — early decompression protects developing brain."}, {"label": "E", "text": "Epilepsy is a possible complication.", "answer": "T", "rationale": "Epilepsy is a documented possible complication of hydrocephalus and its treatment (shunts, cortical injury)."}]}, {"id": "A0043", "type": "tf", "stem": "A 10-year-old boy presented at the children outpatient with a 1-week history of progressive weakness in both lower limbs with associated urinary incontinence and loss of sensation in both lower limbs. Which of the following is correct about management?", "system": "Neurology", "topic": "Spinal cord disorders", "source": "Ajisco Compiled Peds", "aiAuthored": true, "options": [{"label": "A", "text": "A history of febrile illness prior to onset of symptoms is important.", "answer": "T", "rationale": "A preceding febrile illness points to post/infectious causes (transverse myelitis, epidural infection, GBS variants) and guides investigation."}, {"label": "B", "text": "Spinal X-ray and MRI are indicated.", "answer": "T", "rationale": "Progressive paraparesis with a sensory level and sphincter involvement must be imaged urgently: MRI shows cord compression/inflammation and plain films may show bony disease (e.g. TB)."}, {"label": "C", "text": "He requires urethral catheterization.", "answer": "T", "rationale": "Urinary retention/incontinence from neurogenic bladder requires catheterization to prevent retention injury."}, {"label": "D", "text": "Intensive care might be required in the course of management.", "answer": "T", "rationale": "If the lesion ascends or involves respiratory muscles/autonomics, ICU support (including ventilation) may be needed."}, {"label": "E", "text": "Prognosis is generally poor.", "answer": "F", "rationale": "Many causes (e.g. transverse myelitis) carry a fair prognosis with early treatment; prognosis is not 'generally poor' across the board."}]}, {"id": "A0044", "type": "tf", "stem": "A 14-year-old adolescent with a 5-day history of headache, fever, early morning vomiting, and double vision with lack of tandem walk. Neurological evaluation revealed anisocoria:", "system": "Neurology", "topic": "CNS infections & coma", "source": "Ajisco Compiled Peds", "aiAuthored": true, "options": [{"label": "A", "text": "A history of ear discharge of 1 week prior to presentation is important in making a diagnosis.", "answer": "T", "rationale": "A preceding ear discharge suggests otogenic spread (brain abscess, meningitis) — highly relevant to the aetiology."}, {"label": "B", "text": "Physiotherapy is indicated.", "answer": "F", "rationale": "Physiotherapy has no role in the acute stabilization of raised ICP with impending herniation; it may help later for residual deficits."}, {"label": "C", "text": "Antimicrobials should be started.", "answer": "T", "rationale": "With fever and likely intracranial infection (abscess/empyema/meningitis), empiric antimicrobials must be started promptly."}, {"label": "D", "text": "Neuroimaging is indicated.", "answer": "T", "rationale": "Headache + early morning vomiting + anisocoria = raised ICP; urgent neuroimaging (CT/MRI) is mandatory before any LP."}, {"label": "E", "text": "CSF analysis is required for a diagnosis.", "answer": "F", "rationale": "With anisocoria and papilloedema (raised ICP/mass effect), LP is contraindicated — it can precipitate coning; imaging comes first."}]}, {"id": "A0045", "type": "tf", "stem": "In assessing the development of a child:", "system": "Neurology", "topic": "Development & milestones", "source": "Ajisco Compiled Peds", "aiAuthored": true, "options": [{"label": "A", "text": "Median age is more important than limit age.", "answer": "T", "rationale": "The median age (when ~50% of children attain a skill) is the clinically useful reference; limit ages mark the outer boundary of normal."}, {"label": "B", "text": "The environment plays a role.", "answer": "T", "rationale": "Environment (stimulation, nutrition, illness) influences developmental tempo, so assessment considers context."}, {"label": "C", "text": "The sequence is constant.", "answer": "T", "rationale": "While timing varies, the SEQUENCE of milestone attainment is essentially constant — regression or skipped sequences is a red flag."}]}, {"id": "A0046", "type": "tf", "stem": "Developmental milestones requiring further probing:", "system": "Neurology", "topic": "Development & milestones", "source": "Ajisco Compiled Peds", "aiAuthored": true, "options": [{"label": "A", "text": "Sits without support at 6 weeks.", "answer": "T", "rationale": "Sitting unsupported at 6 WEEKS is abnormally early — it can signal hypertonia (e.g. evolving spasticity) rather than advanced development."}, {"label": "B", "text": "Points at 18 months.", "answer": "T", "rationale": "Pointing should appear by ~12–15 months; absence at 18 months (joint attention deficit) needs probing for autism/language delay."}]}, {"id": "A0047", "type": "tf", "stem": "Features of upper motor neuron lesion include:", "system": "Neurology", "topic": "Neuro examination & localization", "source": "Ajisco Compiled Peds", "aiAuthored": true, "options": [{"label": "A", "text": "Fasciculations.", "answer": "F", "rationale": "Fasciculations arise from anterior horn cell/LMN disease, not UMN lesions."}, {"label": "B", "text": "Flaccid paralysis.", "answer": "F", "rationale": "Flaccid paralysis is LMN; UMN lesions cause SPASTIC weakness (after any initial shock phase)."}, {"label": "C", "text": "Hyperreflexia.", "answer": "T", "rationale": "Hyperreflexia is a core UMN sign from loss of cortical inhibition of spinal reflexes."}, {"label": "D", "text": "Atrophy of the muscles.", "answer": "F", "rationale": "Significant atrophy is an LMN feature; UMN wasting is only mild disuse atrophy, late."}, {"label": "E", "text": "Loss of muscle tone.", "answer": "F", "rationale": "UMN lesions INCREASE tone (hypertonia/spasticity), they do not cause loss of tone."}]}, {"id": "A0048", "type": "tf", "stem": "Which of the following is true about Bell's palsy:", "system": "Neurology", "topic": "Neuromuscular & myopathies", "source": "Ajisco Compiled Peds", "aiAuthored": true, "options": [{"label": "A", "text": "It is demyelinating facial neuritis.", "answer": "T", "rationale": "Bell's palsy is an idiopathic demyelinating/ischaemic neuritis of the facial (VII) nerve, often post-viral."}, {"label": "B", "text": "It affects upper facial muscles.", "answer": "T", "rationale": "As a LMN facial palsy it affects the WHOLE half of the face, including the upper face (forehead/eye closure) — unlike an UMN facial palsy which spares the forehead."}, {"label": "C", "text": "It is an upper motor neuron disease.", "answer": "F", "rationale": "It is a LOWER motor neuron (peripheral nerve) lesion, not an UMN one."}, {"label": "D", "text": "Exposure keratitis is a recognized complication.", "answer": "T", "rationale": "Inability to close the eye (lagophthalmos) exposes the cornea — exposure keratitis is a recognized complication, so eye care is essential."}, {"label": "E", "text": "Prognosis is poor.", "answer": "F", "rationale": "Prognosis is good: the majority recover substantially over weeks to months, especially with early steroids."}]}, {"id": "A0049", "type": "tf", "stem": "The domain of the following is correctly paired:", "system": "Neurology", "topic": "Development & milestones", "source": "Ajisco Compiled Peds", "aiAuthored": true, "options": [{"label": "A", "text": "Walking - fine motor.", "answer": "F", "rationale": "Walking is a GROSS motor skill, not fine motor."}, {"label": "B", "text": "Pincer grasp - gross motor.", "answer": "F", "rationale": "The pincer grasp is a FINE motor (vision-and-fine-motor) skill, not gross motor."}, {"label": "C", "text": "Being wary of strangers - oral.", "answer": "F", "rationale": "Wariness of strangers is a social/emotional domain milestone, not oral."}, {"label": "D", "text": "Raise head at 45 degrees in supine position - gross motor.", "answer": "T", "rationale": "Raising the head 45° in the supine/prone position uses large axial muscles — correctly paired with gross motor."}, {"label": "E", "text": "Reach out for objects - vision and fine motor.", "answer": "T", "rationale": "Reaching for objects requires visual tracking plus fine hand control — correctly paired."}]}, {"id": "A0063", "type": "tf", "stem": "Concerning child epilepsy:", "system": "Neurology", "topic": "Seizures & epilepsy", "source": "Ajisco Compiled Peds", "aiAuthored": true, "options": [{"label": "A", "text": "Jerky movement is constant in all generalized seizures.", "answer": "F", "rationale": "Not all generalized seizures have jerks — absence seizures are brief staring spells with no motor activity."}, {"label": "B", "text": "Myoclonic seizure is a shock-like jerking of a group or groups of muscles.", "answer": "T", "rationale": "Myoclonus is exactly that: sudden, brief, shock-like jerking of a muscle group(s)."}, {"label": "C", "text": "Abnormal EEG is diagnostic of epilepsy irrespective of history.", "answer": "F", "rationale": "EEG abnormalities can occur without epilepsy and vice versa; diagnosis is clinical, EEG is supportive."}, {"label": "D", "text": "Carbamazepine is the drug of choice for partial seizures.", "answer": "T", "rationale": "Carbamazepine remains a drug of choice for focal (partial-onset) seizures."}, {"label": "E", "text": "Learning disability is a known complication.", "answer": "T", "rationale": "Learning disability is a recognized comorbidity, influenced by aetiology, seizure burden and drugs."}]}, {"id": "A0064", "type": "tf", "stem": "Concerning pain management:", "system": "Neurology", "topic": "Pain & palliative care", "source": "Ajisco Compiled Peds", "aiAuthored": true, "options": [{"label": "A", "text": "Oucher scale is used in assessment.", "answer": "T", "rationale": "The Oucher scale (photo + numeric) is a validated tool for assessing pain in young children."}, {"label": "B", "text": "EMLA cream is applied 5 minutes before invasive procedures.", "answer": "F", "rationale": "EMLA (eutectic lidocaine/prilocaine) needs about 60 minutes under occlusion to work — 5 minutes is useless."}, {"label": "C", "text": "Breastfeeding to control pain in neonates from needle pricks.", "answer": "T", "rationale": "Breastfeeding (or sucrose) during neonatal needle procedures measurably reduces pain responses."}, {"label": "D", "text": "Prophylaxis using laxative in patients taking morphine.", "answer": "T", "rationale": "Opioids cause constipation, so a prophylactic laxative should accompany regular morphine."}, {"label": "E", "text": "3-step ladder for pain management in children.", "answer": "F", "rationale": "Current WHO guidance for children uses a TWO-step ladder (non-opioid then opioid); the 3-step adult ladder was replaced."}]}, {"id": "A0065", "type": "tf", "stem": "A 15-year-old presents with dysphagia, ptosis:", "system": "Neurology", "topic": "Neuromuscular & myopathies", "source": "Ajisco Compiled Peds", "aiAuthored": true, "options": [{"label": "A", "text": "Disease may have an autoimmune cause.", "answer": "T", "rationale": "Juvenile myasthenia gravis is autoimmune — antibodies target the neuromuscular junction (AChR/MuSK)."}, {"label": "B", "text": "Steroids are important in management.", "answer": "T", "rationale": "Steroids and other immunosuppressants are key disease-modifying therapy."}, {"label": "C", "text": "Edrophonium chloride to control symptoms.", "answer": "F", "rationale": "Edrophonium is only a short-acting diagnostic agent; symptom CONTROL uses longer-acting pyridostigmine."}]}, {"id": "A0066", "type": "tf", "stem": "Concerning pyogenic meningitis in childhood:", "system": "Neurology", "topic": "CNS infections & coma", "source": "Ajisco Compiled Peds", "aiAuthored": true, "options": [{"label": "A", "text": "Requires a high index of suspicion.", "answer": "T", "rationale": "Symptoms in children are often non-specific (fever, irritability, poor feeding), so a high index of suspicion is needed to avoid missing it."}, {"label": "B", "text": "Lumbar puncture is indicated.", "answer": "T", "rationale": "LP with CSF analysis (cells, glucose, protein, Gram stain/culture) is the definitive diagnostic step once raised ICP is excluded."}, {"label": "C", "text": "Learning disability is an early complication.", "answer": "F", "rationale": "Learning/intellectual disability is a LATE sequela, not an early complication. Early complications include seizures, SIADH, subdural effusion and shock."}, {"label": "D", "text": "Leads to cerebral abscess if antibiotics are not initiated early.", "answer": "F", "rationale": "Cerebral abscess is not the usual consequence of delayed treatment — typical sequelae are deafness, hydrocephalus, seizures and neurodeficit (abscess is mainly a neonatal Citrobacter issue)."}, {"label": "E", "text": "Hearing loss is a rare complication.", "answer": "F", "rationale": "Sensorineural hearing loss is a COMMON, not rare, complication (up to ~10% of survivors) — hence post-discharge audiometry is advised."}]}, {"id": "A0067", "type": "tf", "stem": "A 6-month history of bilateral progressive limb weakness and sensory impairment following febrile illness:", "system": "Neurology", "topic": "Spinal cord disorders", "source": "Ajisco Compiled Peds", "aiAuthored": true, "options": [{"label": "A", "text": "Antecedent history of febrile illness is relevant.", "answer": "T", "rationale": "The antecedent febrile illness supports post-infectious transverse myelitis, the likely diagnosis here."}, {"label": "B", "text": "Prognosis is poor.", "answer": "F", "rationale": "Prognosis is guarded but not poor per se — a substantial proportion of children with transverse myelitis make partial to good recovery with rehabilitation."}, {"label": "C", "text": "Might require intensive care.", "answer": "T", "rationale": "Ascending involvement or respiratory muscle compromise may necessitate intensive care/ventilatory support."}, {"label": "D", "text": "Spinal x-ray and MRI are indicated.", "answer": "T", "rationale": "MRI of the spine is indicated to characterize the lesion; plain films may complement in bony/infective lesions."}, {"label": "E", "text": "The child is likely to become progressively worse.", "answer": "F", "rationale": "The natural history is not inexorable worsening — with treatment most stabilize, so 'progressively worse' is too pessimistic."}]}, {"id": "A0068", "type": "tf", "stem": "Concerning Duchenne muscular dystrophy:", "system": "Neurology", "topic": "Neuromuscular & myopathies", "source": "Ajisco Compiled Peds", "aiAuthored": true, "options": [{"label": "A", "text": "Father is likely to have a positive history.", "answer": "F", "rationale": "DMD is X-linked recessive: transmitted by carrier mothers to sons; the father's history is typically negative."}, {"label": "B", "text": "Learning disability is likely mental retardation.", "answer": "T", "rationale": "DMD is associated with cognitive impairment/learning disability (dystrophin is expressed in brain as well as muscle)."}, {"label": "C", "text": "Progressive in nature.", "answer": "T", "rationale": "It is relentlessly progressive — wheelchair dependence by early teens without disease-modifying therapy."}, {"label": "D", "text": "Tensilon test is positive.", "answer": "F", "rationale": "Tensilon (edrophonium) test is the bedside test for myasthenia gravis, irrelevant in DMD."}]}, {"id": "A0069", "type": "tf", "stem": "Concerning cerebral palsy, the following associations are correctly paired:", "system": "Neurology", "topic": "Cerebral palsy", "source": "Ajisco Compiled Peds", "aiAuthored": true, "options": [{"label": "A", "text": "In atonic CP – sustained ankle clonus.", "answer": "F", "rationale": "Atonic CP is defined by LOW tone; sustained ankle clonus is a spasticity finding (spastic forms)."}, {"label": "B", "text": "Spastic quadriparesis – severe learning disability.", "answer": "T", "rationale": "Spastic quadriparesis (whole-body involvement) is the most severe form and is strongly associated with severe learning disability."}, {"label": "C", "text": "Dyskinetic CP – kernicterus.", "answer": "T", "rationale": "Kernicterus (bilirubin encephalopathy) classically produces the dyskinetic (athetoid) CP phenotype — an important preventable cause here."}, {"label": "D", "text": "Spastic quadriparesis – GMFCS II.", "answer": "F", "rationale": "Spastic quadriparesis corresponds to GMFCS levels IV–V (non-ambulant), not II (walks with limitations)."}, {"label": "E", "text": "Spastic diplegia – preterm neonate.", "answer": "T", "rationale": "Spastic diplegia (legs worse than arms) is the classic pattern of prematurity, linked to periventricular white-matter injury."}]}, {"id": "A0070", "type": "tf", "stem": "A patient presents with facial deviation to the left, Bell's phenomenon is present:", "system": "Neurology", "topic": "Neuromuscular & myopathies", "source": "Ajisco Compiled Peds", "aiAuthored": true, "options": [{"label": "A", "text": "It is due to injury to the 3rd cranial nerve.", "answer": "F", "rationale": "Facial deviation with Bell's phenomenon (eye rolling up on attempted closure) reflects 7th (facial) nerve involvement, not the 3rd nerve."}, {"label": "B", "text": "Pyogenic meningitis is a recognized cause.", "answer": "F", "rationale": "Recognized causes of facial palsy in children here include otitis media, hypertension and infiltrative tumours (e.g. Burkitt's) — pyogenic meningitis is not a typical cause of isolated facial palsy."}, {"label": "C", "text": "Good prognosis.", "answer": "T", "rationale": "Bell's palsy generally carries a good prognosis with most children recovering substantially."}, {"label": "D", "text": "Steroid is indicated in treatment.", "answer": "T", "rationale": "A short early course of corticosteroids improves recovery and is indicated in treatment."}]}, {"id": "A0071", "type": "tf", "stem": "A 5-year-old boy presented at the emergency on account of fever of 3 days duration and seizures of 3 episodes then went unconscious for 1 hour. On examination had decorticate posturing, presence of blurred optic disc (papilledema):", "system": "Neurology", "topic": "CNS infections & coma", "source": "Ajisco Compiled Peds", "aiAuthored": true, "options": [{"label": "A", "text": "He requires a lumbar puncture immediately.", "answer": "F", "rationale": "With papilloedema and decorticate posturing (severely raised ICP), immediate LP risks uncal/tonsillar herniation — stabilize and image first."}, {"label": "B", "text": "Blindness is a common complication.", "answer": "F", "rationale": "Cortical blindness can occur but is not a 'common' complication; deafness and neurodeficit are more typical sequelae."}, {"label": "C", "text": "He should start antibiotics immediately.", "answer": "T", "rationale": "Empiric IV antibiotics must be started immediately in suspected bacterial meningitis — do not delay for LP/imaging."}, {"label": "D", "text": "He requires mannitol.", "answer": "T", "rationale": "IV mannitol (or hypertonic saline) is indicated to reduce the dangerously elevated intracranial pressure."}]}, {"id": "A0072", "type": "tf", "stem": "A child was noticed to develop weakness of the lower limb, later spread to involve the upper limb, there was a previous history of febrile illness weeks ago, there was associated loss of sensation:", "system": "Neurology", "topic": "Neuropathies & GBS", "source": "Ajisco Compiled Peds", "aiAuthored": true, "options": [{"label": "A", "text": "Stool culture is diagnostic.", "answer": "F", "rationale": "Stool viral culture is for poliomyelitis; GBS is diagnosed clinically with CSF albuminocytological dissociation and nerve conduction studies."}, {"label": "B", "text": "It is a vaccine-preventable disease.", "answer": "F", "rationale": "GBS is an autoimmune post-infectious neuropathy — it is NOT vaccine-preventable (polio, its great mimic, is)."}, {"label": "C", "text": "It may require ICU admission.", "answer": "T", "rationale": "GBS can ascend to involve respiratory muscles and autonomics — ICU admission for ventilation may be required."}, {"label": "D", "text": "Prognosis is poor.", "answer": "F", "rationale": "Children with GBS usually recover well over weeks to months; prognosis is not 'poor' in most cases."}]}, {"id": "A0073", "type": "tf", "stem": "Which of the following requires further investigation:", "system": "Neurology", "topic": "Development & milestones", "source": "Ajisco Compiled Peds", "aiAuthored": true, "options": [{"label": "A", "text": "A child sits with a round back unsupported at 6 months.", "answer": "F", "rationale": "At 6 months sitting unsupported (even with a rounded back) is age-appropriate."}, {"label": "B", "text": "Does not startle at birth.", "answer": "T", "rationale": "The startle/Moro response to sound is present from birth; its absence suggests hearing deficit or neurological impairment and needs investigation."}, {"label": "C", "text": "Does not scribble at 2 years.", "answer": "T", "rationale": "Scribbling should emerge by ~15–18 months; a 2-year-old who cannot scribble at all shows fine-motor delay warranting assessment."}, {"label": "D", "text": "Does not engage in parallel play at 18 months.", "answer": "F", "rationale": "Parallel play is the NORMAL play pattern at 18 months; interactive play develops later."}]}, {"id": "A0074", "type": "tf", "stem": "A child noticed to have been staring into space:", "system": "Neurology", "topic": "Seizures & epilepsy", "source": "Ajisco Compiled Peds", "aiAuthored": true, "options": [{"label": "A", "text": "Provoked by hyperventilation.", "answer": "T", "rationale": "Absence seizures are characteristically provoked by hyperventilation — a useful bedside test."}, {"label": "B", "text": "Prognosis is poor.", "answer": "F", "rationale": "Childhood absence epilepsy has a good prognosis; the majority remit by adolescence."}, {"label": "C", "text": "Sodium valproate is useful.", "answer": "T", "rationale": "Sodium valproate (or ethosuximide) is effective therapy for absence seizures."}, {"label": "D", "text": "EEG of 3 wave spikes per sec.", "answer": "T", "rationale": "The EEG shows generalized 3-Hz spike-and-wave discharges, diagnostic of absence epilepsy."}]}, {"id": "A0075", "type": "tf", "stem": "A neonate with hypotonia at birth, which of the following is likely:", "system": "Neurology", "topic": "Neuromuscular & myopathies", "source": "Ajisco Compiled Peds", "aiAuthored": true, "options": [{"label": "A", "text": "Infantile spinal muscular atrophy.", "answer": "T", "rationale": "Infantile spinal muscular atrophy (Werdnig-Hoffmann) presents with marked floppiness from birth — a key cause of the 'floppy baby'."}, {"label": "B", "text": "Muscular dystrophy.", "answer": "F", "rationale": "Muscular dystrophies present later in childhood, not with hypotonia at birth."}, {"label": "C", "text": "Down syndrome.", "answer": "T", "rationale": "Down syndrome babies are characteristically hypotonic/floppy at birth."}]}, {"id": "A0076", "type": "tf", "stem": "Which of the following is consistent with the presentation of a 12-hour-old AGA baby delivered by elective CS at 30 weeks GA with no risk factors for sepsis:", "system": "Neurology", "topic": "Respiratory distress & TTN", "source": "Ajisco Compiled Peds", "aiAuthored": true, "options": [{"label": "A", "text": "Resp rate 88c/min.", "answer": "T", "rationale": "A respiratory rate of 88/min (tachypnoea) in a term infant with no other distress fits transient tachypnoea of the newborn (TTN), common after elective caesarean delivery."}, {"label": "B", "text": "Oxygen saturation of 80%.", "answer": "F", "rationale": "An oxygen saturation of 80% indicates significant hypoxaemia/cyanosis — inconsistent with an uncomplicated TTN course and demands urgent evaluation."}, {"label": "C", "text": "Presence of dry, meconium-stained skin.", "answer": "F", "rationale": "Meconium-stained skin implies intrauterine distress (or post-term), which contradicts the given history of an uneventful elective CS at term."}, {"label": "D", "text": "Good coordination of suck and swallow reflex.", "answer": "F", "rationale": "Suck–swallow–breathing coordination matures around 33–34 weeks; at 30 weeks GA it is not yet coordinated."}, {"label": "E", "text": "Sunburst appearance is indicated. (True, TTN)", "answer": "T", "rationale": "TTN's chest X-ray shows perihilar streaking/'sunburst' vascular markings with fluid in fissures — consistent. Source note also keying this true (TTN)."}]}, {"id": "A0077", "type": "tf", "stem": "A 2-year-old girl presented in the children’s emergency clinic, with fever, cough, weight loss of 4 weeks duration, and seizures:", "system": "Neurology", "topic": "CNS infections & coma", "source": "Ajisco Compiled Peds", "aiAuthored": true, "options": [{"label": "A", "text": "It would be correct to make a presumptive diagnosis of tuberculosis.", "answer": "T", "rationale": "Four weeks of cough, fever and weight loss in a Nigerian child justifies a presumptive TB diagnosis while definitive tests are pursued."}, {"label": "B", "text": "Chest X-ray would most likely show cavities.", "answer": "F", "rationale": "Young children with pulmonary TB typically show hilar lymphadenopathy/miliary pattern, NOT cavities — cavitation is an adult-type feature."}, {"label": "C", "text": "The urgency makes AFB microscopy the appropriate screening test.", "answer": "F", "rationale": "AFB microscopy is low-yield in children (paucibacillary); GeneXpert on gastric aspirate/stool, CXR and TST are preferred."}, {"label": "D", "text": "The treatment would include rifampicin, pyrazinamide, streptomycin.", "answer": "F", "rationale": "Standard anti-TB therapy is RHZE (isoniazid, rifampicin, pyrazinamide, ethambutol). Streptomycin is no longer first-line."}, {"label": "E", "text": "The treatment is for 12 months. (True, CNS TB because of seizures)", "answer": "T", "rationale": "Seizures indicate CNS (TB meningitis) involvement, and CNS/disseminated TB is treated for 9–12 months — the source note also keys this TRUE for CNS TB."}]}, {"id": "A0079", "type": "tf", "stem": "A 5-year-old boy presented to OTCHEW convulsing with 6 previous episodes of recurrent generalized tonic-clonic seizures associated with fever within 5 hours prior to presentation. He relapsed into unconsciousness after the first episode and remained unconscious up to presentation. Which of the following is correct:", "system": "Neurology", "topic": "CNS infections & coma", "source": "Ajisco Compiled Peds", "aiAuthored": true, "options": [{"label": "A", "text": "Likely etiology is severe perinatal asphyxia.", "answer": "F", "rationale": "An acute febrile illness with status epilepticus points to CNS infection (meningitis/encephalitis/cerebral malaria) — not a remote perinatal asphyxia aetiology."}, {"label": "B", "text": "EEG is mandatory.", "answer": "F", "rationale": "EEG is not mandatory in the emergency phase; stopping seizures, securing the airway and treating infection take priority."}, {"label": "C", "text": "IV rectal diazepam should be given at arrival.", "answer": "T", "rationale": "If the child is still convulsing without IV access, rectal diazepam is the appropriate immediate rescue treatment (buccal/intranasal alternatives exist)."}, {"label": "D", "text": "IV thiopentone may be indicated.", "answer": "T", "rationale": "For refractory status epilepticus, IV thiopentone (ICU-level anaesthesia) may be indicated."}, {"label": "E", "text": "History of ear discharge in the last one week.", "answer": "T", "rationale": "A recent ear discharge points to an otogenic source (brain abscess/meningitis), which is important for aetiology-directed therapy."}]}, {"id": "A0080", "type": "tf", "stem": "Seizures are caused by:", "system": "Neurology", "topic": "Seizures & epilepsy", "source": "Ajisco Compiled Peds", "aiAuthored": true, "options": [{"label": "A", "text": "Hypokalemia.", "answer": "F", "rationale": "Hypokalaemia causes weakness/arrhythmias but is not a recognized cause of convulsions."}, {"label": "B", "text": "Hyperkalemia.", "answer": "F", "rationale": "Hyperkalaemia's danger is cardiac arrhythmia, not seizures."}, {"label": "C", "text": "Hyponatremia.", "answer": "T", "rationale": "Hyponatraemia lowers the seizure threshold — a classic metabolic cause of convulsions."}, {"label": "D", "text": "Hypocalcemia.", "answer": "T", "rationale": "Hypocalcaemia causes tetany and seizures, particularly in infants."}, {"label": "E", "text": "Hypoglycemia.", "answer": "T", "rationale": "Hypoglycaemia is a common, readily reversible cause of convulsions — always check RBG in a convulsing child."}]}, {"id": "A0081", "type": "tf", "stem": "Hydrocephalus:", "system": "Neurology", "topic": "Hydrocephalus & congenital neuro", "source": "Ajisco Compiled Peds", "aiAuthored": true, "options": [{"label": "A", "text": "Aqueductal stenosis is common in females.", "answer": "F", "rationale": "X-linked aqueductal stenosis affects MALES, so it is not 'common in females'."}, {"label": "B", "text": "IVH is a common cause in preterms.", "answer": "T", "rationale": "Post-haemorrhagic hydrocephalus following intraventricular haemorrhage is a well-recognized complication in preterm infants."}, {"label": "C", "text": "Meningitis causes obstructive hydrocephalus.", "answer": "T", "rationale": "Meningitis (especially TB/bacterial) can obstruct CSF pathways/outlet foramina, causing obstructive hydrocephalus."}, {"label": "D", "text": "Aneurysm of vein of Galen causes non-communicating hydrocephalus.", "answer": "T", "rationale": "A vein of Galen aneurysmal malformation can compress the aqueduct of Sylvius, producing non-communicating (obstructive) hydrocephalus."}, {"label": "E", "text": "Meningitis causes obstructive hydrocephalus.", "answer": "T", "rationale": "Same statement as C — meningitic adhesions can produce obstruction at the outlet foramina (as well as impaired absorption)."}]}, {"id": "A0082", "type": "tf", "stem": "A 3-year-old girl presented at the emergency room with fever, jaundice, and passage of dark-colored urine. She became oliguric and developed seizures. On examination, she had mild periorbital edema. The following are consistent with her presentation:", "system": "Neurology", "topic": "Comorbid emergencies (cross-system)", "source": "Ajisco Compiled Peds", "aiAuthored": true, "options": [{"label": "A", "text": "Febrile seizure.", "answer": "F", "rationale": "Seizures here arise from hypertensive encephalopathy/uraemia in acute nephritic illness — not a benign febrile convulsion."}, {"label": "B", "text": "Hypertension.", "answer": "T", "rationale": "Hypertension is a hallmark of acute glomerulonephritis and explains encephalopathic seizures."}, {"label": "C", "text": "Serum creatinine of 6.5 mg/dL.", "answer": "T", "rationale": "Creatinine of 6.5 mg/dL (markedly elevated) is consistent with acute kidney injury complicating AGN."}, {"label": "D", "text": "Dialysis is contraindicated.", "answer": "F", "rationale": "Dialysis is INDICATED in severe oliguric renal failure with encephalopathy/severe electrolyte disturbance — not contraindicated."}, {"label": "E", "text": "Spironolactone is indicated.", "answer": "F", "rationale": "Spironolactone is potassium-sparing and dangerous in oliguric AKI with hyperkalaemia; frusemide is used instead."}]}, {"id": "A0083", "type": "tf", "stem": "Poliomyelitis:", "system": "Neurology", "topic": "Polio & acute flaccid paralysis", "source": "Ajisco Compiled Peds", "aiAuthored": true, "options": [{"label": "A", "text": "The infection is transmitted through inhalation of infectious droplets.", "answer": "F", "rationale": "Polio spreads mainly by the FAECO-ORAL route, not respiratory droplets."}, {"label": "B", "text": "It is caused by an RNA virus.", "answer": "T", "rationale": "Poliovirus is an enterovirus — a single-stranded RNA picornavirus."}, {"label": "C", "text": "The vaccine used in Nigeria consists of killed virus.", "answer": "F", "rationale": "Nigeria's routine schedule centres on the LIVE attenuated oral polio vaccine (bOPV), with one IPV (killed) dose — not 'consists of killed virus'."}, {"label": "D", "text": "In the acute phase, the patient may present with signs & symptoms of meningitis.", "answer": "T", "rationale": "The non-paralytic/'abortive' phase of polio can present indistinguishably from aseptic meningitis."}, {"label": "E", "text": " The virus attacks the posterior column of the spinal cord.", "answer": "F", "rationale": "Poliovirus destroys the ANTERIOR horn cells (LMN), not the posterior column — hence flaccid paralysis with preserved sensation."}]}, {"id": "A0084", "type": "tf", "stem": "Miscellaneous:", "system": "Neurology", "topic": "Neuro-emergency & poisonings/misc", "source": "Ajisco Compiled Peds", "aiAuthored": true, "options": [{"label": "A", "text": "Erb's palsy results from damage to C5 & C6 roots.", "answer": "T", "rationale": "Erb's palsy ('waiter's tip') follows injury to the C5–C6 roots of the brachial plexus, classically from shoulder dystocia."}, {"label": "B", "text": "Myocardial damage is a likely complication of severe birth asphyxia.", "answer": "T", "rationale": "Severe birth asphyxia is a multi-system insult; myocardial dysfunction and transient tricuspid insufficiency are documented complications."}, {"label": "C", "text": "The paraplegia associated with spinal TB is usually of the spastic variety.", "answer": "T", "rationale": "Pott disease compresses the spinal cord, producing spastic (UMN) paraplegia."}, {"label": "D", "text": "Cryptorchidism is one of the components of prune belly syndrome.", "answer": "T", "rationale": "Prune belly syndrome comprises deficient abdominal wall musculature, urinary tract dilatation AND bilateral cryptorchidism."}, {"label": "E", "text": "Burkitt’s lymphoma is an important cause of death in preschool age in Nigeria.", "answer": "F", "rationale": "Burkitt's lymphoma predominantly affects school-age children (peak 5–10 yrs) and is not a leading cause of death in the preschool group — malaria, pneumonia and diarrhoea dominate."}]}, {"id": "A0085", "type": "tf", "stem": "A 4-year-old boy has a severe seizure disorder and mental retardation; the following are true:", "system": "Neurology", "topic": "Neurocutaneous & developmental", "source": "Ajisco Compiled Peds", "aiAuthored": true, "options": [{"label": "A", "text": "A facial hemangioma is a pointer to the diagnosis.", "answer": "T", "rationale": "A facial port-wine stain (haemangioma) in the V1 distribution points to Sturge-Weber syndrome with associated seizures."}, {"label": "B", "text": "Intracranial calcification may be present.", "answer": "T", "rationale": "Intracranial calcification ('tram-track' gyral calcification in Sturge-Weber; periventricular in tuberous sclerosis/CMV) may be present."}, {"label": "C", "text": "He may have one of the neurocutaneous syndromes.", "answer": "T", "rationale": "The combination of seizure disorder + mental retardation + skin stigmata defines the neurocutaneous syndromes."}, {"label": "D", "text": "CT skull is essential for diagnosis.", "answer": "T", "rationale": "Cranial CT is essential to demonstrate the calcification and guide the specific diagnosis."}, {"label": "E", "text": "The prognosis is poor.", "answer": "T", "rationale": "Severe seizures with retardation in these syndromes carry a poor neurodevelopmental prognosis."}]}, {"id": "A0087", "type": "tf", "stem": "With regard to meningitis:", "system": "Neurology", "topic": "CNS infections & coma", "source": "Ajisco Compiled Peds", "aiAuthored": true, "options": [{"label": "A", "text": "Common etiological agents in the newborn are gram-negative organisms.", "answer": "T", "rationale": "In the newborn the classic agents are group B Streptococcus and gram-negative bacilli (E. coli, Klebsiella, Listeria) acquired from the birth canal — so gram-negatives predominate alongside GBS."}, {"label": "B", "text": "In pyogenic meningitis, pending culture results, the drug of choice is IM penicillin & streptomycin.", "answer": "F", "rationale": "Empiric therapy is IV third-generation cephalosporin (± ampicillin); the IM penicillin–streptomycin combination is outdated and inadequate."}, {"label": "C", "text": "The CSF is usually turbid in TB meningitis.", "answer": "F", "rationale": "TB meningitis CSF is usually clear or xanthochromic with a cobweb clot; frankly TURBID CSF characterizes pyogenic meningitis."}, {"label": "D", "text": "The meninges may be the primary site of tuberculous infection.", "answer": "F", "rationale": "TB of the meninges is SECONDARY — it follows haematogenous (miliary) spread from a primary focus, usually the lung."}, {"label": "E", "text": "The CSF glucose in aseptic meningitis is always normal.", "answer": "F", "rationale": "'Always' is too strong: CSF glucose is usually normal in viral meningitis but can be reduced in mumps and LCM virus infection."}]}, {"id": "A0088", "type": "tf", "stem": "Cerebral palsy:", "system": "Neurology", "topic": "Cerebral palsy", "source": "Ajisco Compiled Peds", "aiAuthored": true, "options": [{"label": "A", "text": "Is a progressive disorder of posture & movement.", "answer": "F", "rationale": "CP is a STATIC (non-progressive) disorder, although its clinical expression evolves as the child grows."}, {"label": "B", "text": "Results from injury to the developing brain.", "answer": "T", "rationale": "By definition CP results from a permanent, non-progressive injury to the developing fetal or infant brain."}, {"label": "C", "text": "Bilirubin encephalopathy is the commonest cause in Ibadan.", "answer": "F", "rationale": "Severe perinatal asphyxia/hypoxic-ischaemic injury is generally the leading cause here; kernicterus is a major but not the commonest cause."}, {"label": "D", "text": "Spastic diplegia occurs commonly in low birth weight infants.", "answer": "T", "rationale": "Spastic diplegia (Little's disease) is strongly associated with prematurity and low birth weight (periventricular leukopathy)."}, {"label": "E", "text": "Dyskinesia results from involuntary movement and changes in muscle tone.", "answer": "T", "rationale": "Dyskinetic CP is characterized by involuntary movements (athetosis/chorea) with fluctuating muscle tone from basal ganglia injury."}]}, {"id": "A0089", "type": "tf", "stem": "The following are constant features of Down's syndrome:", "system": "Neurology", "topic": "Development & genetic syndromes", "source": "Ajisco Compiled Peds", "aiAuthored": true, "options": [{"label": "A", "text": "Mental retardation.", "answer": "T", "rationale": "Some degree of intellectual disability is essentially constant in Down syndrome."}, {"label": "B", "text": "Simian creases.", "answer": "T", "rationale": "The single palmar (simian) crease is a classic, near-constant dysmorphic feature."}, {"label": "C", "text": "Hypotonia.", "answer": "T", "rationale": "Generalized hypotonia from birth is a constant feature of Down syndrome."}, {"label": "D", "text": "Congenital heart disease.", "answer": "F", "rationale": "Congenital heart disease occurs in only about 40–50% — frequent but NOT constant."}, {"label": "E", "text": "Translocation of chromosome 21.", "answer": "F", "rationale": "The great majority have free trisomy 21 (non-disjunction); translocation accounts for only ~3–4%."}]}, {"id": "A0091", "type": "tf", "stem": "Klumpke's paralysis results from damage to:", "system": "Neurology", "topic": "Birth trauma & brachial plexus", "source": "Ajisco Compiled Peds", "aiAuthored": true, "options": [{"label": "A", "text": "Radial nerve.", "answer": "F", "rationale": "Radial nerve injury causes wrist drop, not Klumpke's."}, {"label": "B", "text": "Nerve roots C8 and T1.", "answer": "T", "rationale": "Klumpke's paralysis follows injury to the C8 and T1 nerve roots — hand muscles and long flexors, ± Horner syndrome."}, {"label": "C", "text": "Nerve roots C5 and C6.", "answer": "F", "rationale": "C5–C6 injury gives Erb's palsy, not Klumpke's."}, {"label": "D", "text": "Phrenic nerve.", "answer": "F", "rationale": "Phrenic nerve injury causes diaphragmatic paralysis, occasionally accompanying Erb's."}, {"label": "E", "text": "Facial nerve.", "answer": "F", "rationale": "Facial nerve is a cranial nerve, unrelated to the brachial plexus."}]}, {"id": "A0092", "type": "tf", "stem": "A leg paralysis as a result of poliomyelitis will show:", "system": "Neurology", "topic": "Polio & acute flaccid paralysis", "source": "Ajisco Compiled Peds", "aiAuthored": true, "options": [{"label": "A", "text": "Wasting.", "answer": "T", "rationale": "Anterior horn cell loss (LMN) denervates muscle → marked wasting ensues."}, {"label": "B", "text": "A positive Babinski response.", "answer": "F", "rationale": "Babinski (extensor plantar) is an UMN sign; polio is an LMN disease."}, {"label": "C", "text": "Exaggerated reflexes.", "answer": "F", "rationale": "Reflexes are diminished/absent in LMN lesions, not exaggerated."}, {"label": "D", "text": "Diminished tone.", "answer": "T", "rationale": "Tone is diminished (flaccid paralysis) — the classic polio picture."}, {"label": "E", "text": "Glove and stocking anesthesia.", "answer": "F", "rationale": "Sensation is characteristically INTACT in polio; glove-and-stocking anaesthesia suggests peripheral neuropathy (e.g. GBS variants)."}]}, {"id": "A0094", "type": "tf", "stem": "Intracranial calcification in childhood occurs in:", "system": "Neurology", "topic": "CNS infections & coma", "source": "Ajisco Compiled Peds", "aiAuthored": true, "options": [{"label": "A", "text": "CMV.", "answer": "T", "rationale": "Congenital CMV classically gives PERIVENTRICULAR intracranial calcification."}, {"label": "B", "text": "Congenital rubella syndrome.", "answer": "F", "rationale": "Congenital rubella features are PDA, cataracts and sensorineural deafness — intracranial calcification is not its hallmark."}, {"label": "C", "text": "TB meningitis.", "answer": "T", "rationale": "Healed TB meningitis can leave basal intracranial calcification."}, {"label": "D", "text": "Congenital toxoplasmosis.", "answer": "T", "rationale": "Congenital toxoplasmosis causes DIFFUSE intracranial calcification (triad: chorioretinitis, hydrocephalus, calcification)."}, {"label": "E", "text": "Craniopharyngioma.", "answer": "T", "rationale": "Craniopharyngioma characteristically shows suprasellar calcification on imaging."}]}, {"id": "A0095", "type": "tf", "stem": "TB meningitis:", "system": "Neurology", "topic": "CNS infections & coma", "source": "Ajisco Compiled Peds", "aiAuthored": true, "options": [{"label": "A", "text": "Is a benign disease.", "answer": "F", "rationale": "TB meningitis is among the most severe childhood infections — high mortality and high neurological sequelae without early treatment."}, {"label": "B", "text": "Is typically associated with CSF polymorph pleocytosis.", "answer": "F", "rationale": "CSF pleocytosis in TBM is predominantly LYMPHOCYTIC (after a possible early neutrophilic phase), not polymorphonuclear."}, {"label": "C", "text": "Is as common as pyogenic meningitis.", "answer": "F", "rationale": "Pyogenic meningitis is considerably more common than TB meningitis in children."}, {"label": "D", "text": "Steroids are useful in management.", "answer": "T", "rationale": "Adjunctive corticosteroids reduce inflammation/infarction and are recommended in TB meningitis."}, {"label": "E", "text": "Is sometimes associated with choroidal tubercles.", "answer": "T", "rationale": "Choroidal tubercles (with miliary TB) are a useful bedside clue to TBM."}]}, {"id": "A0096", "type": "tf", "stem": "The following are associated with intracranial hemorrhage in newborns:", "system": "Neurology", "topic": "Neonatal neurology", "source": "Ajisco Compiled Peds", "aiAuthored": true, "options": [{"label": "A", "text": "Prematurity.", "answer": "T", "rationale": "Prematurity is the strongest association — germinal matrix/intraventricular haemorrhage of the preterm."}, {"label": "B", "text": "Birth asphyxia.", "answer": "T", "rationale": "Birth asphyxia/hypoxia predisposes to intracranial haemorrhage."}, {"label": "C", "text": "IV NaCO3.", "answer": "T", "rationale": "Rapid IV sodium bicarbonate boluses (hyperosmolar load) are a recognized precipitant of IVH."}, {"label": "D", "text": "Neonatal seizure.", "answer": "F", "rationale": "Neonatal seizures are a MANIFESTATION of the haemorrhage, not an underlying association/cause."}, {"label": "E", "text": "Hydrocephalus.", "answer": "F", "rationale": "Hydrocephalus is a COMPLICATION/sequela of IVH, not a precipitating association."}]}, {"id": "A0097", "type": "tf", "stem": "The following conditions are associated with Down’s syndrome:", "system": "Neurology", "topic": "Development & genetic syndromes", "source": "Ajisco Compiled Peds", "aiAuthored": true, "options": [{"label": "A", "text": "Leukemia.", "answer": "T", "rationale": "Down syndrome carries a markedly increased risk of leukaemia (ALL and AML-M7)."}, {"label": "B", "text": "Hydrocephalus.", "answer": "F", "rationale": "Hydrocephalus is not a recognized association of Down syndrome."}, {"label": "C", "text": "CHD.", "answer": "T", "rationale": "Congenital heart disease (AVSD, VSD) is a classic association."}, {"label": "D", "text": "A large tongue.", "answer": "T", "rationale": "Macroglossia/large protruding tongue is a typical feature."}, {"label": "E", "text": "Brushfield spots.", "answer": "T", "rationale": "Brushfield spots (speckled irides) are characteristic."}]}, {"id": "A0098", "type": "tf", "stem": "Common causes of MR in Nigeria include:", "system": "Neurology", "topic": "Development & milestones", "source": "Ajisco Compiled Peds", "aiAuthored": true, "options": [{"label": "A", "text": "Phenylketonuria.", "answer": "F", "rationale": "PKU is rare in Nigeria (and not routinely screened for) — not a common cause here."}, {"label": "B", "text": "Tetanus.", "answer": "F", "rationale": "Tetanus causes spasms and autonomic instability, not mental retardation."}, {"label": "C", "text": "Cerebral birth trauma.", "answer": "T", "rationale": "Cerebral birth trauma and perinatal hypoxic injury are leading causes of MR in our setting."}, {"label": "D", "text": "Down’s syndrome.", "answer": "T", "rationale": "Down syndrome is a major recognizable cause of intellectual disability."}, {"label": "E", "text": "Kernicterus.", "answer": "T", "rationale": "Kernicterus from severe neonatal jaundice is an important preventable cause of MR here."}]}, {"id": "A0100", "type": "tf", "stem": "The anterior horn cell is the site of damage in:", "system": "Neurology", "topic": "Neuro examination & localization", "source": "Ajisco Compiled Peds", "aiAuthored": true, "options": [{"label": "A", "text": "Guillain-Barré syndrome", "answer": "F", "rationale": "GBS is a demyelination of peripheral nerves/roots, not an anterior horn cell disease."}, {"label": "B", "text": "Paralytic polio", "answer": "T", "rationale": "Poliovirus selectively destroys anterior horn cells — hence LMN flaccid paralysis with intact sensation."},
