epsis – Delayed stooling: Consider Cystic fibrosis, hypothyroidism. Physical Examination • Weight:–Suggestive of Failure To Thrive • Head circumference:–Microcephaly suggestive of TORCH. Physical Examination General appearance: • Ill-looking: – Suggestive of infection, metabolic disease • Well-Looking:– Suggestive of biliary atresia • Choroidoretinitis, cataracts: – Suggestive of TORCH infections and galactosaemia • Cardiac murmurs: – Suggestive of Alagille, Congenital form of Biliary atresia • Ascites, abdominal wall veins, liver and splenic enlargement: –Suggestive of Portal hypertension • Ascites, minimal jaundice, pale stools: –Spontaneous perforation of the bile duct • Pale Stool and dark urine: –Suggestive of Cholestasis • Skin examination: Bruising, petechiae: • Dysmorphic features:–Suggestive of Trisomy 21, 18, 13,Alagille syndrome. Galactosaemia • Caused by mutation in the galactose-1- phosphate uridyltransferase (GALT) gene on chromosome 9. • Cardinal features: hepatomegaly, cataracts and mental handicap. Presentation • Feeding difficulty with vomiting and failure to gain weight with poor growth in the first few weeks of life. • Lethargy and hypotonia occur. • Jaundice and hepatomegaly develops. • There are often associated coagulation defects. • Sepsis (often with E. coli) can be fatal. • Cataracts may be apparent even in the early days of life. • Ascites may even be apparent in early life. • Developmental delay may affect speech, language and general learning. Investigations • Lactose (milk) ingestion results in glucose and galactose, there will be galactose in the urine. (Glucose oxidase negative) • Hyperbilirubinaemia is often unconjugated at first but becomes conjugated later. • Renal function: Urinary Albumin and amino acids • Confirmatory: A quantitative erythrocyte analysis for galacose 1 phosphate dehydrogenase activity is required. IDIOPATHIC NEONATAL HEPATITIS o Generally normal stools or acholic stools with onset at one month-old o Low birth weight o Normal liver on exam or hepatomegaly with normal to firm consistency o Impaired uptake on radionuclide scan with normal excretion o Biopsy shows intralobular inflammation with focal hepatocellular necrosis and disruption of the hepatic architecture. No alteration of the bile ducts. Giant cell transformation occurs but is nonspecific. o Familial cases (15-20%). Biliary Atresia Bile duct obstruction due to fibrosis and inflammation of bile ducts of unknown aetiology, though viruses have been implicated. It could be; 1) Perinatal or “classic”type (70-85%): Obstruction begins after birth. Signs/symptoms develop within 2-4 weeks of age. No associated abnormalities 2) Embryonic type (15-30%): Obstructive process begins in utero. Cholestatic symptoms present at birth. Associated with congenital anomalies e.g situs inversus, polysplenia, asplenia, malrotation, cardiac anomalies. EXTRAHEPATIC BILIARY ATRESIA Generally acholic stools with onset at about 2 weeks-old. There is: ✓Average birth weight ✓Hepatomegaly with firm to hard consistency ✓ Increased incidence of polysplenia syndrome and intraabdominal vascular anomalies. ✓Normal uptake on radionucleotide scan with absent excretion ✓Biopsy shows bile duct proliferation, bile plugs, portal or perilobular fibrosis and oedema, and intact lobular structure. Clinical Features • Early presentation - History: Variable degrees of persistent jaundice, dark urine, light coloured stools, pruritus - Usually Well-looking, appear well nourished - Hepatomegaly ±splenomegaly Surgical Management • Kasai Procedure: Resection of the obliterated bile duct w/with creation of a hepato-portoenterostomy • Timing of procedure predicts the prognosis - <56 days-bile flow returned in 80-90% of cases - Bile flow established in only 20% after 120 days - Only 30% with complete drainage. Usually require a liver transplant within one year."}]}, {"id": "Q0029", "type": "tf", "stem": "Concerning Kwashiorkor:", "system": "Gastrointestinal & Hepatobiliary", "topic": "Nutrition & feeding", "source": "TF Series B", "aiAuthored": false, "options": [{"label": "A", "text": "Hypothermia is a recognized complication.", "answer": "T", "rationale": ""}, {"label": "C", "text": "Measles is a recognized precipitant.", "answer": "T", "rationale": ""}, {"label": "D", "text": "Weight of 100% expected for age makes the diagnosis unlikely", "answer": "T", "rationale": "(Children with kwashiorkor may have near-normal weight-for-age because of edema, which masks actual weight loss. However, true 100% weight-for-age without edema would make the diagnosis unlikely)."}]}, {"id": "Q0030", "type": "tf", "stem": "Concerning neonatal infections:", "system": "Neonatology", "topic": "Neonatal sepsis & infections", "source": "TF Series B", "aiAuthored": false, "options": [{"label": "A", "text": "Late onset has lower mortality", "answer": "T", "rationale": "[Early-onset sepsis (EOS) (usually within 72 hours of life) is associated with higher mortality] while late onset (after 72 hours) has lower mortality."}, {"label": "B", "text": "Females are more affected than males", "answer": "F", "rationale": ""}, {"label": "C", "text": "All neonates are relatively immunocompromised", "answer": "T", "rationale": ""}, {"label": "D", "text": "1st line of treatment is Ceftaxidime/ Gentamicin", "answer": "F", "rationale": "First line treatment is Ampicillin + Gentamicin"}, {"label": "E", "text": "Silver nitrate conjunctivitis is treated with erythromycin eye ointment.", "answer": "F", "rationale": "Silver nitrate or chemical conjunctivitis is self limiting Other notes Incidence of neonatal sepsis/infection: • Early-onset bacteremia has a frequency of 0.5 to 5.0 cases per 1,000 live births, depending on the institutional setting and the gestation of the neonate. • The risk is three to five times greater in preterm neonates. • Sepsis accounts for approximately 15% of all neonatal mortality and three to 15% of all stillbirths. Etiology/Predisposing Factors: • Infection may be acquired in utero (transplacentally), transcervically or after birth. • Early onset –Within 72hrs of life • Deficiency of various components of neonatal immune mechanisms. • Low birth weight babies have defective IgG response to infections • Deficiency of alternate pathway of complement activation and classic pathway to some extent. • Defective phagocyte migration and less effective neutrophil killing of ingested bacteria. Neutrophils from sick neonates have greater deficits in killing capacity of their neutrophils • Antibody dependent and independent cell mediated immunity is also deficient hence also prone to viral infections • Males have higher predisposition than females • Common organisms involved in early onset sepsis are (maternal genitourinary tract organisms); • Group B Streptococci, Eschericia coli, Klebsiella, Listeria monocytogenes, Staphylococcus aureus, Hemophilus influenza. (SEK SHeL). Risk Factors; (Maternal): • Prolonged rupture of membranes (>24hrs) • Chorioamnionitis • Maternal peripartal fever, leucocytosis, fetal heart rate greater than 160/min • Foul smelling amniotic fluid • Premature labor and delivery • Antenatal steroids • Manipulative operative delivery. Neonatal Risk Factors): • Birth Asphyxia • Instrumentation, catheterization, IVF etc • Hospitalization • Low birth weight • Prematurity • Presence of open congenital anomalies Clinical Signs; • Most often non specific esp in preterms • Respiratory distress (retractions,tachypnea,cyanosis, apnoea,grunting,). The lung is the most common site of infection in the neonate. • Cardiovascular (poor perfusion, tachycardia, hypotension, shock, acidemia) • Temperature instability (hyperthermia; morecommon in term neonates and hypothermia; more common in preterms) • Gastrointestinal (poor feeding, abdominal distention, regurgitation, ileus, NEC) • Neurologic (seizures, lethargy, hypotonia,decreased activity) • Skin (petechiae, purpura, pallor) • Metabolic (glucose instability, metabolic acidosis) Other deep infections • Bacterial: • Meningitis • UTI • Osteomyelitis • Arthritis • Viral: Chronic Infections • Congenital Rubella • Toxoplasmosis • CMV • Herpes • Herpes • HIV/AIDS Superficial Infections • Conjunctivitis • Nappy dermatitis • Oral thrush • Cutaneous Infections Cutaneous Infections • Pustules • Scalded skin syndrome: serious generalised exfoliative staph. skin infection, skin is moist and red, there is release of exotoxin with subsequent oedema, tenderness and skin peeling off. • Umbilical sepsis • Necrotizing fascitis • Treatment is by antibiotics Conjunctivitis • Aetiology: N. Gonnorrhoea, Chlamydia Trachomatis, Staph aureus and secondary silver nitrate • Increase incidence with PROM and Prematurity. Types of neonatal conjunctivitis include: • Silver Nitrate conjunctivitis: start 6-12 hour after birth and clears within 24 hrs. • Gonococcal: Present within 6 days after birth, Treatment is ceftriaxone or Kanamycin plus gentamicin eye ointment, eye irrigation • Chlamydial conjunctivitis present by 2-3 weeks,Treatment is with oral erythromycin for 2 weeks. • Aseptic neonatal conjunctivitis most often is a chemical conjunctivitis that is induced by silver nitrate solution, which is used at birth for Crede prophylaxis of infectious conjunctivitis. • Chemical conjunctivitis is becoming less common owing to the use of erythromycin ointment or Providone iodide in place of silver nitrate solution for the prophylaxis of infectious conjunctivitis."}]}, {"id": "Q0031", "type": "tf", "stem": "Concerning Immunization", "system": "Infectious Disease", "topic": "Immunization", "source": "TF Series B", "aiAuthored": false, "options": [{"label": "A", "text": "The AstraZeneca-Oxford vaccine is the only COVID-19 vaccine in use in Nigeria", "answer": "F", "rationale": "(Other vaccines in use in Nigeria are Moderna, Pfizer-BioNTech, Johnson & Johnson, and Sinopharm)."}, {"label": "C", "text": "No vaccine is 100% efficacious", "answer": "T", "rationale": ""}, {"label": "D", "text": "According to the NPI schedule, vaccines given at 14 weeks include Rotavirus, OPV3, Penta3, PCV3, IPV", "answer": "T", "rationale": "According to the Nigerian National Programme on Immunization (NPI) schedule, the vaccines given at 14 weeks include: Rotavirus (Dose 3) OPV 3 (Oral Polio Vaccine) Penta 3 (Pentavalent vaccine - DPT, Hep B, Hib) PCV 3 (Pneumococcal Conjugate Vaccine) IPV2 (Inactivated Polio Vaccine)"}, {"label": "E", "text": "Measles, Yellow fever and Pentavalent vaccines are all given intramuscularly 0.5ml", "answer": "F", "rationale": "Most vaccines are given intramuscular except, yellow fever (given at 9 month, site is subcutaneous), vitamin A (given at 9 months and continue every 6months till the child is 5years, site is oral), measles (given at 9month, site is subcutaneous), oral polio vaccine (given at birth, 6weeks, 10 weeks and 14 weeks, site is oral) and rotavirus vaccine (given at 6 weeks, 10 weeks and 14 weeks, site is oral). BCG is given intradermal."}]}, {"id": "Q0032", "type": "tf", "stem": "Infant feeding", "system": "Neonatology", "topic": "Preterm & neonatal feeding", "source": "TF Series B", "aiAuthored": false, "options": [{"label": "A", "text": "100mls of breastmilk contains 67cal", "answer": "F", "rationale": "(100 mls of breast milk contains 66.7 kcal)"}, {"label": "B", "text": "coordinated sucking and swallowing develops after 34 weeks", "answer": "F", "rationale": "It develops by 32-34 weeks."}, {"label": "C", "text": "3 hourly feeds is recommended if < 1.5kg", "answer": "F", "rationale": "Three hourly feeds for babies 1.5 kg and above."}, {"label": "D", "text": "Babies in the first 4-6 months can obtain all their nutritional needs from breastmilk", "answer": "T", "rationale": ""}, {"label": "E", "text": "Breast Milk can cause neonatal jaundice", "answer": "T", "rationale": "Babies in the first 4-6 months can obtain all their nutritional needs from breast milk. But during the second half of infancy, additional energy is needed in the form of more solid diet. Notes on calculations in infant nutrition • 100 mls of breast milk contains 66.7 kcal • Increment per day in the first 7 days is 10-20 mls per kg/day. Upper limit for preterms. • Calories used after day 7. • Two hourly feeds for babies less than 1.5 kg • Three hourly feeds for babies 1.5 kg and above. • Oral feeds via nipple or cup /spoon by 32–34 weeks • Phototherapy allowance of 20 –30mls /kg /day DAILY REQUIREMENT • Fluids: 60-70ml/kg for full term on the 1st day of life, increasing by 10-20ml/kg daily till end of 1st week. • 80-90ml/kg for preterm on the 1st day of life, increasing by 10-20ml/kg daily till end of 1st week. • Calorie: 100-110kcal/kg for full term up to 140 • 160kcal/kg for LBW • Milk feed contains 67Kcal per 100ml • Protein: 2-3g/kg DISADVANTAGES OF BREAST MILK • Low content of Vitamin K • Transmission of diseases: – Viruses: Human Immunodeficiency Virus (HIV), Cytomegalovirus (CMV), Human T-cell Lymphotropic Virus (HTLV), Herpes Simplex Virus (HSV) – Bacteria: Mycobacterium tuberculosis (the cause of tuberculosis) • Excretion of drugs into breast milk, including antimetabolites and chloramphenicol • Breast milk jaundice – due to the presence of the enzyme beta-glucuronidase, which reduces the activity of the enzyme glucuronyl transferase, leading to increased unconjugated bilirubin. Foetal Gut • Gut formed by 10 weeks • Fetus can swallow amniotic fluid by 16 weeks • GI motility present by 24 weeks • Organized peristalsis is present by 29 –30 weeks • Coordinated sucking and swallowing develops by 32 -34 weeks"}]}, {"id": "Q0033", "type": "tf", "stem": "Concerning Cerebral palsy", "system": "Neurology", "topic": "Cerebral palsy & development", "source": "TF Series B", "aiAuthored": false, "options": [{"label": "A", "text": "Spastic hemiplegia is usually seen in preterm and cases of intraventricular haemorrage and periventricular leukomalacia", "answer": "F", "rationale": ""}, {"label": "B", "text": "Seizures and Severe mental retardation are unusual in spastic diplegia", "answer": "T", "rationale": ""}, {"label": "C", "text": "Lowerlimbs involvement are more severe than Upperlimbs in Spastic hemiplegia", "answer": "F", "rationale": ""}, {"label": "D", "text": "Scissory gait is seen in Ataxic CP", "answer": "F", "rationale": ""}, {"label": "E", "text": "Kernicterus and hand preference are seen in Dyskinetic CP", "answer": "F", "rationale": "Cerebral palsy is a disorder of posture and movement, resulting from a permanent, non-progressive lesion to the immature or developing brain. Some common classification: Spastic Diplegia- Usually seen in preterm infants as a result of the high incidence of IVH & periventricular leukomalacia. Child presents with delayed walking, scissoring gait, commando crawl. Involvement of the Upper Limb minimal. IQ usually normal. Seizures are rare. Spastic Quadriparesis- Seen in infants/ children with diffuse brain injury. There is weakness of all 4 limbs, as well as the neck and trunk muscles. Seizures and severe mental retardation are common. Most belong to functional class III(moderate to severe limitation of activity)& IV (no useful activity), or Gross Motor Function Classification System IV & V Dyskinetic CP- Usually found in infants with Bilirubin encephalopathy. Characterized by athetosis & chorea, tongue thrusting, feeding difficulties. There may be associated dental enamel dysplasia, impairment of upward gaze and deafness. Seizures & mental retardation are uncommon. Ataxic CP- Associated with involvement of the cerebellum. Individual has problems with balance & depth perception. Child experiences difficulties with rapid movements and is often unsteady. Spastic hemiplegia- Weakness of one UL & the ipsilateral LL. UL involvement more severe than LL. Circumduction is characteristic. Seizures in up to 1/3 cases, and cognitive impairment in about 25% cases. Hand preference in the 1st year of life is a usual feature. Associated deficit in cerebalpalsy are ✓Mental Retardation/ Intellectual disability ✓ Epilepsy ✓ Hearing Impairment ✓Visual Defects- strabismus, optic atrophy, nystagmus, refractive errors, cortical visual impairment ✓Speech Defects- delayed, poor articulation, loss of voice modulation ✓ADHD ✓Failure to thrive ✓Gait abnormalities ✓Hip subluxation"}]}, {"id": "Q0034", "type": "tf", "stem": "The following are correctly paired", "system": "Cardiology", "topic": "Congenital heart disease", "source": "TF Series B", "aiAuthored": false, "options": [{"label": "A", "text": "Marfan syndrome : MV prolapse", "answer": "T", "rationale": "Mitral valve prolapse is commonly associated with Marfan syndrome due to connective tissue defects."}, {"label": "B", "text": "William syndrome : Pulmonary stenosis", "answer": "T", "rationale": "Supravalvular aortic stenosis is classical, but peripheral pulmonary stenosis also occurs commonly in Williams syndrome."}, {"label": "C", "text": "Globular heart on CXR : TGA", "answer": "F", "rationale": "Transposition of the great arteries (TGA) shows the \"egg-on-a-string\" appearance on chest X-ray, not a globular heart. Globular heart is typically seen in pericardial effusion or Ebstein anomaly."}, {"label": "D", "text": "Cardiac apex : Cardiac sidedness", "answer": "F", "rationale": "Cardiac apex (apex beat) gives apex position, but cardiac sidedness is defined by morphology of the atria (right vs left atrial features), not apex location."}, {"label": "E", "text": "Pulmonary stenosis: Pansystolic murmur", "answer": "F", "rationale": "Pulmonary stenosis produces a crescendo-decrescendo (ejection systolic) murmur, best heard at the left upper sternal border. Other notes Paediatric conditions associated with pansystolic murmurs:"}]}, {"id": "Q0035", "type": "tf", "stem": "Childhood tuberculosis", "system": "Pulmonology", "topic": "Tuberculosis", "source": "TF Series B", "aiAuthored": false, "options": [{"label": "A", "text": "BCG immunization offers absolute immunity", "answer": "F", "rationale": "BCG provides partial protection, especially against severe forms (like miliary TB and TB meningitis), but not absolute immunity."}, {"label": "B", "text": "Cough of any duration is accepted in HIV patient", "answer": "T", "rationale": ""}, {"label": "C", "text": "Phlyctenular conjunctivitis shows hypersensitivity to protein", "answer": "T", "rationale": "is due to a delayed hypersensitivity reaction to tuberculoprotein."}, {"label": "D", "text": "Steriods is indicated in the management of Pulmonary TB", "answer": "F", "rationale": "Steroids are not used routinely in pulmonary TB. They are reserved for specific complications (e.g., TB meningitis, pericardial TB, severe pleural TB)."}, {"label": "E", "text": "Duration of treatment for abdominal TB and TB adenitis is 12 months", "answer": "F", "rationale": "Pulmonary TB and all forms of Extrapulmonary TB except TB meningitis, Miliary TB, Osteoarticular TB (spine, joints) requires regimen 1; 2 months RHZE (intensive phase) & 4 months RH (a total of 6 months). TB meningitis, Miliary TB, Osteoarticular TB (spine, joints) requires regimen 2; 2 months RHZE & 10 months RH (a total of 12 months). Other notes; Indications for use of Steroids in TB treatment • Steroids have a supportive therapeutic effect and have been shown to improve survival and reduce complications in patients in specific forms of TB disease. • TB meningitis • TB pericarditis • TB pleural effusion • Hypo-adrenalism • TB laryngitis, EndobronchialTB • Severe hypersensitivity reaction associated with TB and to anti-TB drugs • Renal tract TB • Massive lymph node enlargement with pressure effect"}]}, {"id": "Q0036", "type": "tf", "stem": "The following are true concerning a child in shock", "system": "Others (Emergency/Social)", "topic": "Shock & resuscitation", "source": "TF Series B", "aiAuthored": false, "options": [{"label": "A", "text": "Tachycardia is one of the earliest signs", "answer": "T", "rationale": ""}, {"label": "B", "text": "Hypotension is not an early feature", "answer": "T", "rationale": "Hypotension is a late and ominous sign in pediatric shock. Children can maintain normal blood pressure until very late due to strong compensatory mechanisms."}, {"label": "C", "text": "20mls/kg of fluid over 30 mins is recommended in cardiogenic shock", "answer": "F", "rationale": "In cardiogenic shock, rapid fluid boluses can worsen pulmonary edema and heart failure. Instead, small aliquots (5–10 ml/kg) over a longer time with close monitoring is advised."}, {"label": "D", "text": "IM epinephrine is always indicated", "answer": "F", "rationale": "IM epinephrine is indicated only in anaphylactic shock, not in all types of pediatric shock (e.g., hypovolemic, septic, cardiogenic)."}, {"label": "E", "text": "Blood transfusion is considered above crystalloid boluses in a non-hypotensive child with severe anemia", "answer": "T", "rationale": ""}]}, {"id": "Q0037", "type": "tf", "stem": "The following are usual causes of sustained hypertension in under-10", "system": "Nephrology", "topic": "Hypertension", "source": "TF Series B", "aiAuthored": false, "options": [{"label": "A", "text": "Chronic glomerulonephritis", "answer": "T", "rationale": ""}, {"label": "B", "text": "Chronic pyelonephritis", "answer": "T", "rationale": ""}, {"label": "C", "text": "Obstructive uropathy", "answer": "T", "rationale": ""}, {"label": "D", "text": "Essential hypertension", "answer": "F", "rationale": "Rare in children <10 years; hypertension at this age is almost always secondary. Essential (primary) hypertension becomes more common in adolescents."}, {"label": "E", "text": "Autosomal dominant polycystic kidney disease", "answer": "T", "rationale": ""}]}, {"id": "Q0038", "type": "tf", "stem": "Match the following", "system": "Neonatology", "topic": "Neonatal sepsis & infections", "source": "TF Series B", "aiAuthored": false, "options": [{"label": "A", "text": "Toxoplasmosis – conjugated hyperbilirubinemia", "answer": "T", "rationale": ""}, {"label": "B", "text": "Rubella – microcephaly", "answer": "T", "rationale": ""}, {"label": "C", "text": "Syphilis – Hutchinson’s tooth", "answer": "T", "rationale": ""}, {"label": "D", "text": "CMV – Scattered Intracranial calcification", "answer": "T", "rationale": ""}, {"label": "E", "text": "Herpes – mental retardation", "answer": "T", "rationale": "CNS involvement can lead to neurodevelopmental delay. 14.Miscellaneous"}, {"label": "A", "text": "Cortical thickening is seen on plain radiograph in Chronic osteomyelitis", "answer": "T", "rationale": ""}, {"label": "B", "text": "Limited barium swallow is useful in a 3month old child with TOF.", "answer": "F", "rationale": ""}, {"label": "C", "text": "Tuberculosis of the lung can present with Pleural effusion on plain chest radiograph", "answer": "T", "rationale": ""}, {"label": "D", "text": "Ultrasound can be used to outline the lungs", "answer": "F", "rationale": "Ultrasound is poor for air-filled lungs but good for pleural space."}, {"label": "E", "text": "Boot shaped heart is seen on plain chest radiograph in VSD", "answer": "F", "rationale": "Boot shaped heart is seen in tetralogy of fallot 15.Meconium Aspiration syndrome"}, {"label": "A", "text": "It occurs in preterm babies", "answer": "F", "rationale": ""}, {"label": "B", "text": "Broad spectrum antibiotics is indicated", "answer": "T", "rationale": ""}, {"label": "C", "text": "hyperinflation of the lungs occurs till school age", "answer": "F", "rationale": ""}, {"label": "D", "text": "Features of bronchopneumonia are seen on chest radiograph", "answer": "F", "rationale": "(More of patchy infiltrates, not classic bronchopneumonia)"}, {"label": "E", "text": "Pneumomediastinum is a complication", "answer": "T", "rationale": "Other notes Meconium Aspiration Syndrome (MAS) is a problem of term and late preterm infants. Aetipathogenesis: It typically results from intrauterine asphyxia, which leads to fetal passage of meconium into the amniotic fluid. The infant may then inhale the meconium-stained liquor either before or during delivery, introducing the meconium into the airways. This causes partial airway obstruction and air trapping, which leads to hyperinflation of the lungs. In some cases, this can result in complications such as pneumothorax and pneumomediastinum due to alveolar rupture. Additionally, meconium acts as an irritant to the lung tissue, leading to chemical pneumonitis and increasing the risk of secondary bacterial infection. Clinical signs ✓ Meconium staining of skin, nails, umbilical cord. ✓ Respiratory distress soon after birth ✓Crepitations or rhonchi in lung fields ✓ Increased AP diameter of chest ✓ CXR shows overinflation, streaky atelectasis or diffuse opacification. ✓Recovery begins after 7 –10 days Management ✓ Anticipation ✓Paediatrician must be at delivery ✓ Visualization and direct suctioning of trachea immediately after birth if baby is not vigorous ✓SpO and blood gas monitoring ✓O2 therapy ✓Antibiotics ✓Assisted ventilation 16.The following are causes of unconjugated jaundice and severe anaemia in a 4day old."}, {"label": "A", "text": "G6PD Deficiency", "answer": "T", "rationale": ""}, {"label": "B", "text": "Septicaemia", "answer": "T", "rationale": ""}, {"label": "C", "text": "ABO incompatibility", "answer": "T", "rationale": ""}, {"label": "D", "text": "Fracture of the femur", "answer": "F", "rationale": "May cause anemia from blood loss but not jaundice"}, {"label": "E", "text": "Infant of a Diabetic mother", "answer": "T", "rationale": "Causes of unconjugated Jaundice with Anemia in Neonates: ABO incompatibility Rh isoimmunization G6PD deficiency Hereditary spherocytosis Neonatal sepsis Birth trauma / cephalhematoma Twin-to-twin transfusion syndrome Alpha-thalassemia major Causes of conjugated Jaundice with Anemia in neonates Cytomegalovirus (CMV) infection Herpes simplex virus (HSV) Congenital syphilis Toxoplasmosis Rubella Neonatal sepsis Galactosemia Tyrosinemia type I Alagille syndrome Hemophagocytic lymphohistiocytosis (HLH) 17.Concerning Measles"}, {"label": "A", "text": "Koplik spots are diagnostic", "answer": "T", "rationale": ""}, {"label": "B", "text": "the fever crashes at the onset of the rash", "answer": "F", "rationale": ""}, {"label": "C", "text": "Laryngotracheobronchitis is a complication", "answer": "T", "rationale": ""}, {"label": "D", "text": "Stevens – Johnson syndrome is a differential diagnosis", "answer": "T", "rationale": ""}, {"label": "E", "text": "Parenteral drugs are contraindicated in the acute phase", "answer": "F", "rationale": "Other notes: Epidemiology of Measles Measles is endemic in most parts of the world. It is highly infectious. The median age of measles infection in Nigeria is 17 months. Transplacentally acquired immunity is present during the first 6 months of life. Mode of transmission: Respiratory droplets or, less commonly, by airborne transmission. Population at risk/ Risk factors: • Risk factors: Overcrowding, malnourished or immunocompromised children. CLINICAL FEATURES OF MEASLES: 3 stages 1. Incubation period: 10-14 days with few signs or symptoms. 2. Prodromal period: It last 3 to 5 days, it is characterized by: - Mild to moderate fever - Slight backing cough - Coryza - Conjunctivitis - Koplik spots Occasionally, the prodrome may be severe with hyperpyrexia, convulsion and pneumonia • Usually coryza, fever, cough are increasing in severity • Koplik spot: Pathognomonic of measles. Present on the palate, buccal mucosa usually opposite the lower molars. Greyish white dots as small as grains of sand with reddish area. Very transient and last 12-18hours • The red mottling on the hard and soft palate is called exanthem. 3. Final stage: - Abrupt rise in temperature with appearance of rash - The rash: -Starts as macules behind the ears, along the hairline, entire face, upper arm - Within 24 hours, rash become maculopapular - After the first 24 hrs, rash spreads to the back, abdomen entire arms and thigh - Reaches the legs on the 3rd day • In uncomplicated cases symptoms subside rapidly within 2 days. • When fading of rash begins, it disappears in the order it appeared. • The severity of the disease is related to the extent & confluence of the rash • Mild rash, not confluent – mild disease. • Very mild – few lesions on thigh / legs • Severe rash, confluent, ecchymotic in the palms and soles – severe disease. • As the rash fades there is desquamation which disappears within 7-10 days. • Complete absence of rash is rare. • Itching is mild. DIAGNOSIS • Mainly Clinical : Using symptoms and signs - WHO clinical case definition: Maculopapular rash (non-vesicular) and fever (> 38ºc) with at least one of the three symptoms: Cough, Coryza and Conjunctivitis. • Koplik spots pathognomonic: diagnostic • FBC- Leucopenia relative lymphocytosis • C/S/F in measles encephalitis shows increased protein, increased WBC and lymphocytes, glucose is normal • Viral studies: - Isolation of the measles virus from a clinical specimen (e.g., nasopharynx, urine) -Significant rise in measles IgG - Positive serologic test for measles IgM antibody. DIFFERENTIAL DIAGNOSIS • Roseola infection: Rash appears as temperature decreases • Rubella: Associated tender lymphadenopathy with less striking rash • Drug reaction: No Cough, history of drug ingestion • Enteroviral infections: Rash is less striking degree of fever and severity of illness is less • Rickettsial infection: rash spares the face • Scarlet fever: Rash is diffuse, finely papular with a goose flesh texture on an erythematous base Steven Johnson syndrome can also be a differential. COMPLICATIONS OF MEASLES Complications are reported in 1 out of 15 cases. They include: 1. Respiratory: Bronchopneumonia: This can be viral (Giant cell) or Bacterial Laryngotracheobronchitis (Croup) Activation of TB lesion 2. Cardiac Myocarditis (infrequent; may lead to heart failure) 3. Neurologic Febrile seizures Encephalomyelitis (1–2/1000 cases, appears 2–5 days after onset of rash) Subacute sclerosing panencephalitis (SSPE) 4. Gastrointestinal Gastroenteritis Malnutrition Cancrum oris 5. Ophthalmologic Blindness (due to Vitamin A deficiency) Conjunctivitis"}]}, {"id": "Q0039", "type": "tf", "stem": "Causes of vomiting and diarrhea in the first year of life include", "system": "Gastrointestinal & Hepatobiliary", "topic": "Diarrhoeal disease & dehydration", "source": "TF Series B", "aiAuthored": false, "options": [{"label": "A", "text": "Furunculosis", "answer": "T", "rationale": ""}, {"label": "B", "text": "Malaria", "answer": "T", "rationale": ""}, {"label": "D", "text": "Bronchopneumonia", "answer": "T", "rationale": ""}, {"label": "E", "text": "Pityriasis Versicolor", "answer": "F", "rationale": "Other notes 1. Infectious Causes of diarrhea and vomiting in first year of life are: Viral gastroenteritis (e.g., Rotavirus, Norovirus, Adenovirus) Bacterial enteritis (e.g., Salmonella, Shigella, E. coli, Campylobacter) Parasitic infections (e.g., Giardia lamblia) Urinary tract infections (UTI) Otitis media Sepsis Bronchopneumonia Furunculosis (can cause systemic illness with vomiting and diarrhea). 2. Non-Infectious Gastrointestinal Causes Overfeeding Food intolerance (e.g., lactose intolerance, cow’s milk protein allergy) Gastroesophageal reflux disease (GERD) Pyloric stenosis (projectile vomiting without diarrhea) Intussusception Malabsorption syndromes (e.g., celiac disease) Necrotizing enterocolitis (NEC) – in neonates Congenital GI anomalies (e.g., malrotation, Hirschsprung’s disease)"}]}, {"id": "Q0040", "type": "tf", "stem": "The following are multifactorial disorders in aetiology:", "system": "Endocrine & Genetics", "topic": "Genetics & chromosomal syndromes", "source": "TF Series B", "aiAuthored": false, "options": [{"label": "A", "text": "Cleft lip", "answer": "T", "rationale": ""}, {"label": "B", "text": "Sickle cell Anaemia", "answer": "F", "rationale": "(Autosomal recessive single-gene disorder)"}, {"label": "C", "text": "Congenital dislocation of the hip", "answer": "F", "rationale": ""}, {"label": "D", "text": "Exomphalos", "answer": "T", "rationale": ""}, {"label": "E", "text": "Achondroplasia", "answer": "F", "rationale": "(Caused by a mutation in FGFR3 gene - single gene disorder) 20.The following are teratogenic"}, {"label": "A", "text": "Phenytoin", "answer": "T", "rationale": ""}, {"label": "B", "text": "Chloroquine", "answer": "F", "rationale": ""}, {"label": "C", "text": "Paracetamol", "answer": "F", "rationale": ""}, {"label": "D", "text": "Thalidomide", "answer": "T", "rationale": ""}, {"label": "E", "text": "Mercury", "answer": "T", "rationale": "Environmental teratogens and their effects are; ✓Sedatives ( IUGR, Cleft lip, Facial features like FAS), ✓Thalidomide( limb deformities, renal agenesis, TOF) ✓Phenytoin( hypoplasia of distal phalanges, mental deficiency) ✓ACE inhibitors (PDA, renal tubular dysplasia, CNS defects) ✓Toluene – anencephaly, microcephaly, craniofacial, cardiac and limb defects, FAS. ✓Polychlorinated and polybrominated biphenyls (PCBs) - insulating fluids,additives, plasticizers- “cola baby”, exophthalmos, natal teeth. ✓Lead- ≥50µg/dl – VACTERL association ✓Mercury – organic form ≥3µg/dl causes severe brain injury- Minamata disease. ✓ Lithium – 1st trimester exposure: Cardiovascular- tricuspid atresia; Malformations of the CNS, ears and ureter. 21.Histological features in chronic active hepatitis include"}, {"label": "A", "text": "Mononuclear cell infiltration", "answer": "T", "rationale": ""}, {"label": "B", "text": "Piecemeal necrosis", "answer": "T", "rationale": ""}, {"label": "C", "text": "Bridging necrosis", "answer": "T", "rationale": ""}, {"label": "D", "text": "Expansion of the portal tracts", "answer": "T", "rationale": ""}, {"label": "E", "text": "Rosette formation", "answer": "T", "rationale": "22.Concerning Acute Hepatitis B"}, {"label": "A", "text": "Presence of Anti HBs indicates a resolution", "answer": "T", "rationale": ""}, {"label": "B", "text": "About 10% progress to chronic state", "answer": "T", "rationale": "<10% of immunocompetent children and adolescents develop chronic hepatitis B after acute infection. However, 90% of neonates infected perinatally progress to chronic hepatitis B. In general pediatric populations: about 5–10% may become chronic."}, {"label": "C", "text": "Primary Liver Cell Carcinoma is a complication", "answer": "T", "rationale": ""}, {"label": "D", "text": "Case fatality in Fulminant hepatitis is 80%", "answer": "T", "rationale": "fulminant hepatitis B has a high mortality, with case fatality rates as high as 70–80% without liver transplantation."}, {"label": "E", "text": "It is faeco-oral in transmission", "answer": "F", "rationale": "Hepatitis A and E are feco oral. Serological markers: HBsAg (Hepatitis B surface antigen): Indicates current infection, either acute or chronic. If present for more than six months, it suggests chronic hepatitis B infection Anti-HBs (Hepatitis B surface antibody) Indicates immunity May result from recovery after infection or from vaccination Anti-HBc (Total hepatitis B core antibody) Indicates past or ongoing infection Seen only in natural infection, not after vaccination IgM Anti-HBc Indicates recent or acute infection Helps identify infection during the window period when HBsAg is disappearing HBeAg (Hepatitis B e antigen) Indicates high viral replication and high infectivity Anti-HBe (Hepatitis B e antibody) Indicates lower infectivity and the beginning of immune control over the virus HBV DNA Measures the amount of virus in the blood Used to assess infectivity and monitor response to antiviral therapy"}]}, {"id": "Q0041", "type": "tf", "stem": "Indication for oxygen therapy in supportive management of pneumonia includes", "system": "Pulmonology", "topic": "Pneumonia & LRTI", "source": "TF Series B", "aiAuthored": false, "options": [{"label": "A", "text": "Sao2 <90%", "answer": "T", "rationale": ""}, {"label": "B", "text": "Tachypnoea > 20/min for the age", "answer": "T", "rationale": ""}, {"label": "C", "text": "Central cyanosis", "answer": "T", "rationale": ""}, {"label": "D", "text": "Severe lower chest wall indrawing", "answer": "T", "rationale": ""}, {"label": "E", "text": "Grunting", "answer": "T", "rationale": "Oxygen therapy in pneumonia Oxygen can be life-saving in hypoxic pneumonia patients. Absolute indications for oxygen therapy are: ✓ Central cyanosis ✓Severe lower chest wall indrawing ✓ Oxygen saturation < 91% Other indications are: ✓ Tachypnoea of 20 breaths/min above the age-specific cut -off point ✓Restlessness ( not due to meningitis) ✓ titubation ✓ tachycardia 24.The following is/are appropriate in a 2 year old with asthma"}, {"label": "A", "text": "MDI only", "answer": "F", "rationale": "MDI (Metered Dose Inhaler) alone is not appropriate for a 2-year-old because they cannot coordinate inhalation and actuation properly. A VSD (valved spacer device) helps deliver the drug more effectively."}, {"label": "B", "text": "MDI + VSD", "answer": "F", "rationale": ""}, {"label": "C", "text": "MDI +VSD + Mouthpiece", "answer": "F", "rationale": "A mouthpiece is more appropriate for children aged 4 years and above."}, {"label": "D", "text": "MDI + VSD + Facemask", "answer": "T", "rationale": "Children under 4 years old generally require a facemask in addition to the VSD, because they cannot use a mouthpiece reliably."}, {"label": "E", "text": "Nebulizer + Face mask", "answer": "T", "rationale": "Nebulizer with face mask is an alternative, especially in emergencies or when the child can't tolerate MDI + spacer."}]}, {"id": "Q0042", "type": "tf", "stem": "About febrile convulsions:", "system": "Neurology", "topic": "Seizures & epilepsy", "source": "TF Series B", "aiAuthored": false, "options": [{"label": "B", "text": "Can be simple, complex, or both.", "answer": "F", "rationale": ""}, {"label": "C", "text": "Generalized seizures are simple seizures.", "answer": "T", "rationale": ""}, {"label": "D", "text": "Intracranial infection can be present.", "answer": "F", "rationale": ""}, {"label": "E", "text": "Commonest seizure of childhood.", "answer": "T", "rationale": "Other notes: Seizures can be divided into 2 broad groups – i)Febrile Seizures ii)Afebrile Seizures ( Epilepsy) Febrile Seizures These are seizures occurring in young children as a result of elevated body temperature in the absence of a pathology in the brain. • Affects about 2-3% of young children, between the ages of 3month and 5 years. Common causes of febrile Seizure include: Malaria URTI Pharyngo-tonsillitis Otitis Media Bronchopneumonia UTI Measles • Febrile seizures are usually brief, generalised tonic, clonic and occur in conjunction with a rapid rise in body temperature. 25% cases have a positive family history. • There are 2 main forms of febrile seizures - Simple and - Complex Febrile Seizures Simple -Commoner form seen -Single attack in 24 hr period -Seizures are generalised -Last for < 15 mins Complex -Multiple attacks in 24 hr period -Seizures are focal -Duration of seizure > 15 mins. • Recurrence occurs in about 1/3 of cases after the first episode. • Risk of recurrence increases with – i)Young age at first episode ii)Onset of seizure at lower body temperature • Risk of development of epilepsy in children with febrile seizure is very small, about 1% as in the general population. Increased risk associated with -Complex febrile seizure, family history of epilepsy, abnormal neurological examination. Afebrile Seizures (Epilepsy) Epilepsy refers to recurrent afebrile seizures, i.e. more than 1 episode of afebrile seizure • Epilepsy affects about 1% of the population worldwide but higher prevalence in the developing countries of the world. • A common problem in Paediatric Neurology service, constitutes about 45.3% cases seen in the Peadriatic Neurology Clinic, UCH. Aetiology - Idiopathic - Perinatal brain injury-Neonatal encephalopathy, Intracranial haemorrhage. - CNS infections - Congenital malformations of the CNS - Trauma with head injury - Neurocutaneous syndromes: Neurofibromatosis, Tuberous sclerosis. - Genetic disorders e.g. Juvenille Myoclonic Epilepsy - Brain tumours. Classification of Epilepsy ✓ Simple / Complex ✓ Focal / Generalised ✓Specific Epileptic Syndromes –Rolandic epilepsy, Landau Kleffner syndrome, Lennox Gastaut syndrome, infantile spasms. ✓ Idiopathic/Cryptogenic/Symptomatic. Simple–No alteration of consciousness Complex-Associated alteration or loss of consciousness Focal/ Partial- affects a part of the brain. Generalised –affects both cerebral hemispheres and the whole body. May be convulsive e.g. GTC, Tonic or Clonic, or nonconvulsive e.g. Absence seizure, Atonic seizure. Classification of seizure type important for i) Choice of appropriate treatment ii) Prognosis Generalised Seizures These include: i)Generalised tonic, clonic seizures ii)Absence seizures iii)Atonic seizures iv)Myoclonic jerks"}]}, {"id": "Q0043", "type": "tf", "stem": "The following are consistent with late presentation of biliary atresia:", "system": "Gastrointestinal & Hepatobiliary", "topic": "Hepatobiliary & cholestasis", "source": "TF Series B", "aiAuthored": false, "options": [{"label": "A", "text": "Failure to thrive.", "answer": "T", "rationale": ""}, {"label": "B", "text": "Hepatosplenomegaly which gives the impression of normal weight for age.", "answer": "T", "rationale": ""}, {"label": "C", "text": "Xanthomas.", "answer": "T", "rationale": ""}, {"label": "D", "text": "Ascites.", "answer": "T", "rationale": ""}, {"label": "E", "text": "Gastrointestinal bleeding.", "answer": "T", "rationale": "27.With respect to examination for cardiac diseases in children:"}, {"label": "A", "text": "CT ratio of 50% in keeping with TOF.", "answer": "F", "rationale": "TOF often shows a normal or decreased CT ratio with a characteristic boot-shaped heart due to right ventricular hypertrophy (RVH)."}, {"label": "B", "text": "Pulmonary vascular markings that extend to lateral 1/3 suggest pulmonary atresia.", "answer": "F", "rationale": "Pulmonary vascular markings (PVM) that extend to the lateral one-third of the lung fields suggest increased pulmonary blood flow, not pulmonary atresia. Pulmonary atresia is actually associated with reduced PVM due to obstruction of flow."}, {"label": "C", "text": "Boot-shaped heart shows right atrial enlargement.", "answer": "F", "rationale": "A boot-shaped heart indicates right ventricular hypertrophy, not right atrial enlargement. This appearance is classic in TOF."}, {"label": "D", "text": "Right-sided gastric shadow shows dextrocardia.", "answer": "F", "rationale": "A right-sided gastric shadow typically indicates situs inversus, not isolated dextrocardia. Dextrocardia alone may not shift the gastric shadow unless situs is also reversed."}]}, {"id": "Q0044", "type": "tf", "stem": "Which of the following is consistent with the presentation of a 12-hour-old AGA baby delivered by elective CS at 30 weeks GA with no risk factors for sepsis:", "system": "Neonatology", "topic": "Newborn care & resuscitation", "source": "TF Series B", "aiAuthored": false, "options": [{"label": "A", "text": "Resp rate 88 c/min.", "answer": "T", "rationale": "A respiratory rate of 88 breaths per minute is common in preterm infants and may indicate transient tachypnea of the newborn (TTN), especially after elective cesarean section."}, {"label": "B", "text": "Oxygen saturation of 80%.", "answer": "T", "rationale": "Oxygen saturation of 80% is often seen in preterm infants due to immature lungs, surfactant deficiency, or respiratory distress syndrome (RDS), requiring supplemental oxygen."}, {"label": "C", "text": "Presence of dry, meconium-stained skin.", "answer": "F", "rationale": "Meconium-stained skin is not expected in a 30-week gestation infant; it is typically seen in late preterm or term infants with meconium-stained amniotic fluid."}, {"label": "E", "text": "Sunburst appearance is indicated.", "answer": "T", "rationale": "Other note Transient tachypnoea of the Newborn (TTN). Wet lung disease or delayed clearance of lung water. TTN is a benign, self-limiting respiratory condition seen in newborns, caused by delayed absorption of fetal lung fluid after birth. Risk factors: Preterm birth, Maternal Diabetes, Maternal sedation, Ceasarian delievery. Clinical signs: Positive mild depression at birth, tachypnoea (RR 60 –120/min), hyperinflation, grunting, chest wall indrawing. Chest radiograph shows “Sunburst pattern” which clears in 24hrs. It is benign and self limiting and child recovers in 24 –72hrs."}]}, {"id": "Q0045", "type": "tf", "stem": "Concerning development of sexual characteristics:", "system": "Endocrine & Genetics", "topic": "Growth & puberty", "source": "TF Series B", "aiAuthored": false, "options": [{"label": "A", "text": "FSH and LH are responsible for the growth of the scrotum and penis in males.", "answer": "F", "rationale": "Growth of the penis and scrotum in males is stimulated by testosterone, which is released in response to LH. FSH primarily supports spermatogenesis."}, {"label": "B", "text": "Testosterone is responsible for acne, hair growth, and adult body odor in both sexes.", "answer": "T", "rationale": ""}, {"label": "C", "text": "In girls, the first sign of sexual development is a growth spurt followed by breast development", "answer": "F", "rationale": "In girls, the first sign of puberty is thelarche (breast development), not the growth spurt. The growth spurt usually follows the onset of breast development."}, {"label": "D", "text": "In boys, the first sign of sexual development is testicular enlargement.", "answer": "T", "rationale": ""}]}, {"id": "Q0046", "type": "tf", "stem": "About immunization in Nigeria:", "system": "Infectious Disease", "topic": "Immunization", "source": "TF Series B", "aiAuthored": false, "options": [{"label": "A", "text": "Antigens in penta are diphtheria, pertussis, tetanus, HIB, and hep B.", "answer": "T", "rationale": ""}, {"label": "B", "text": "Men A is given at 4 months.", "answer": "F", "rationale": "Meningococcal A (Men A) vaccine is administered at 9 months, not 4 months, according to the National Programme on Immunization (NPI)."}, {"label": "C", "text": "MMR is on the schedule", "answer": "T", "rationale": "MMR (Measles, Mumps, Rubella) is now part of the national immunization schedule, typically given at 15 months."}, {"label": "D", "text": "Vitamin A is given at 6, 15 months.", "answer": "F", "rationale": "(It is given at 9 months and 15 months)"}, {"label": "E", "text": "The first dose of hep B is given at birth.", "answer": "T", "rationale": "BCG, Hep B0 and OPV are given at birth. OPV, Hep B0 are given at birth or within 2 weeks of delivery. f. BCG vaccine is given intramuscularly. F BCG is given intradermally. Pentavalent, IPV and PCV vaccines are given intramuscularly. IPV is given at 6weeks and 14 weeks g. Oral polio vaccine is no longer necessary. F"}]}, {"id": "Q0047", "type": "tf", "stem": "Concerning the SDGs:", "system": "Others (Emergency/Social)", "topic": "Community, social & global health", "source": "TF Series B", "aiAuthored": false, "options": [{"label": "A", "text": "They are a group of programs set by the heads of government of middle and lowincome countries to solve their countries' challenges.", "answer": "F", "rationale": "The SDGs were adopted by all UN member states, not just low- and middle-income countries, to address global development challenges."}, {"label": "B", "text": "Only goal 3, its targets, and indicators are specific to health.", "answer": "T", "rationale": "Goal 3 is specifically focused on health: “Ensure healthy lives and promote well-being for all at all ages.” Its targets and indicators are health-specific."}, {"label": "C", "text": "One of the targets is to ensure that under-5 mortality is reduced to 25 deaths per 1000 by the year 2030.", "answer": "T", "rationale": "One key health target under SDG 3 is to reduce under-5 mortality to no more than 25 per 1,000 live births by 2030."}, {"label": "D", "text": "They will be replaced by the Millennium Development Goals by the time of their expiration in 2030.", "answer": "F", "rationale": "The SDGs are a successor to the Millennium Development Goals (MDGs); they will not be replaced by them in 2030."}, {"label": "E", "text": "Goals 1 to 17 are related to health.", "answer": "T", "rationale": "All 17 SDGs have direct or indirect impacts on health, e.g., poverty, education, clean water, and gender equality. 32.An 8-year-old boy presented with a history of facial and body swelling of 5 days, reduced urine output of 3 days. Urine distinct urinalysis shows proteinuria of 2+. Blood pressure 180/130mmHg. The following are consistent with findings:"}, {"label": "A", "text": "A. Rhythm gallop on CVS examination.", "answer": "T", "rationale": ""}, {"label": "B", "text": "B. Normal-sized kidneys on ultrasound.", "answer": "T", "rationale": "In acute glomerulonephritis,the kidneys are normal or slightly enlarged. Small echogenic kidneys are seen in chronic kidney disease, not acute."}, {"label": "D", "text": "D. Fluid challenge with IV normal saline.", "answer": "F", "rationale": "In a child with edema, oliguria, and hypertension, a fluid challenge is contraindicated. It can worsen hypertension, pulmonary edema, and heart failure.I"}, {"label": "E", "text": "E. IV furosemide is contraindicated.", "answer": "F", "rationale": "IV furosemide is not contraindicated — in fact, it's often used to promote diuresis in volume-overloaded patients with some renal function. Other notes Acute Nephritic Syndrome in children: Common cause are Post infectious Glomerulonephritis HSP (Henoch-Schonlein purpura ) Less common cause are MPGN IgA Nephropathy SLE Infective Endocarditis –related Shunt nephritis Uncommon cause are: Wegener’s granulomatosis Polyarteritis nodosa Post-Streptococcal Acute Glomerulonephritis (PSAGN): PSAGN is the prototype of acute glomerulonephritis. It is most commonly caused by Lancefield Group A β-hemolytic Streptococcus (Streptococcus pyogenes). It typically follows a pharyngeal or cutaneous infection (e.g., pyoderma, scabies) caused by nephritogenic strains of Streptococcus. Nephritogenic Streptococcal Strains (M Protein Serotypes): Pharyngitis-associated AGN: Common serotypes: M type 12 (most frequently) Others include: M types 1, 4, 6, 25 Pyoderma-associated AGN: Common serotype: M type 49 Others include: M types 53, 55, 56, 57, 58 Clinical Features of Acute Glomerulonephritis (AGN) The typical presentation follows an infection of the skin or pharynx, with a latent period before onset of AGN symptoms: Pharyngitis-associated AGN: 1–3 weeks latency. Pyoderma-associated AGN: 3–6 weeks latency. Following this latent period, features of AGN begin to manifest:"}]}, {"id": "Q0048", "type": "tf", "stem": "In treatment of community Acquired Pneumonia", "system": "Pulmonology", "topic": "Pneumonia & LRTI", "source": "TF Series B", "aiAuthored": false, "options": [{"label": "A", "text": "First line treatment for non severe pneumonia is co-amoxiclav", "answer": "F", "rationale": ""}, {"label": "B", "text": "Second line treatment is for non severe high dose amoxicillin", "answer": "F", "rationale": ""}, {"label": "C", "text": "First line for severe pneumonia is iv Gentamicin + amoxicillin", "answer": "F", "rationale": ""}, {"label": "D", "text": "2nd line treatment for severe pneumonia is iv cefuroxime + gentamicin.", "answer": "F", "rationale": ""}, {"label": "E", "text": "Duration for non-HiV pts is 5days", "answer": "T", "rationale": "Notes: Non-Severe Pneumonia (Pneumonia) Features: Fast breathing +/- chest indrawing Treatment: First-line: Amoxicillin (oral) Second-line: Co-amoxiclav or Macrolides (e.g., azithromycin) Severe Pneumonia Features: Features of pneumonia plus any of the following: Cyanois ( or oxygen saturation <90%), grunting, very severe chest indrawing, convulsion, inability to feed, decreased level of consciousness. Treatment: First-line: Ampicillin + Gentamicin or Ceftriaxone (IV) Second-line: Ceftriaxone or Cefotaxime + Macrolide Add Vancomycin or Cloxacillin if staphylococcal pneumonia is suspected"}]}, {"id": "Q0049", "type": "tf", "stem": "In nephrotic syndrome", "system": "Nephrology", "topic": "Nephrotic syndrome", "source": "TF Series B", "aiAuthored": false, "options": [{"label": "A", "text": "corticosterods are the mainstay of treatment", "answer": "T", "rationale": ""}, {"label": "B", "text": "prednisolone is given at 60mg/m^2/day", "answer": "T", "rationale": ""}, {"label": "C", "text": "cyclophosphamide is useful in the treatment of frequently relapsing NS", "answer": "T", "rationale": ""}, {"label": "D", "text": "Calceneurin inhibitor is the first line management for steroid resistant NS", "answer": "F", "rationale": ""}, {"label": "E", "text": "cyclsporin is useful in steroid dependent NS", "answer": "T", "rationale": "MINIMAL CHANGE (STEROID-SENSITIVE) NEPHROTIC SYNDROME Levels of Management 1. Initial Episode Prednisolone 60 mg/m²/day (maximum 80 mg/day) for 4 weeks Then 40 mg/m² on alternate days for 4 weeks Duration of taper: 3 to 7 months 2. First Two Relapses Prednisolone 30 mg/m²/day until remission Then 40 mg/m² on alternate days for 4 weeks Total duration: 3 to 7 months 3. Frequent Relapses Maintenance prednisolone 0.1–0.5 mg/kg on alternate days Duration: up to 12 months 4. Relapse on Prednisolone > 0.5 mg/kg on Alternate Days Add Levamisole 2.5 mg/kg on alternate days Duration: 4 to 12 months (may extend to 6 to 24 months)"}]}, {"id": "Q0050", "type": "tf", "stem": "The following are extrahepatic causes of neonatal cholestasis", "system": "Gastrointestinal & Hepatobiliary", "topic": "Hepatobiliary & cholestasis", "source": "TF Series B", "aiAuthored": false, "options": [{"label": "A", "text": "Idiopathic neonatal hepatitis", "answer": "F", "rationale": ""}, {"label": "B", "text": "Cystic fibrosis", "answer": "T", "rationale": ""}, {"label": "C", "text": "Galactosemia", "answer": "F", "rationale": ""}, {"label": "D", "text": "Choledochal cysts", "answer": "T", "rationale": ""}, {"label": "E", "text": "Biliary Atresia", "answer": "T", "rationale": "Neonatal Cholestasis Prolonged conjugated hyperbilirubinaemia in the newborn period Conjugated bilirubin >15% of total bilirubin Caused by a group of hepatobiliary diseases occurring within the first 3 months of life ETIOLOGIES Basic distinction is between: – Extrahepatic aetiologies – Intrahepatic aetiologies. •Extrahepatic Cholestasis: - Biliary Atresia - Choledochal cysts - Spontaneous perforation of the bile duct - Mucus plug as in cystic fibrosis • Hepatocellular or Intrahepatic Cholestasis - Idiopathic neonatal hepatitis - Diagnosis based on liver biopsy findings of giant cell hepatitis - 60-70% resolve without sequelae Differential diagnosis • Infections. - Viral: TORCH, CMV, HIV, HBV, Coxsakie, Echovirus - Bacterial: sepsis, UTI secondary to E.coli, Staph aureus • Genetic/metabolic - Galactosemia, hypothyroidism, cystic fibrosis, hypopituitarism • Toxic/secondary causes: TPN (total parenteral nutrition) associated cholestasis. COMMON ETIOLOGIES • Premature infants - Sepsis - TPN-associated • Idiopathic neonatal hepatitis • Extrahepatic biliary atresia • Intrahepatic cholestasis syndromes Evaluation • History – Pale stool colour: • Consider cholestatic disease – Fever, rash in the first trimester of pregnancy: • Consider TORCH infections – Haemolysis, jaundice: • Consider ABO +Rh incompatibility leading to stones – UTI, Sepsis: • Consider Neonatal infection – Diarrhoea, vomiting, poor weight gain on introduction of feeds: • Consider Galactosaemia, UTI, Sepsis – Delayed stooling: • Consider Cystic fibrosis, hypothyroidism"}]}, {"id": "Q0051", "type": "tf", "stem": "On acute Otitis media", "system": "Pulmonology", "topic": "URTI, ENT & upper airway", "source": "TF Series B", "aiAuthored": false, "options": [{"label": "A", "text": "Per oris amoxicillin in neonate", "answer": "F", "rationale": ""}, {"label": "B", "text": "Honey licks", "answer": "F", "rationale": ""}, {"label": "C", "text": "Oral paracetamol for fever and pain", "answer": "T", "rationale": ""}, {"label": "D", "text": "Visit to ENT", "answer": "T", "rationale": ""}, {"label": "E", "text": "IV pethidine for severe pain", "answer": "F", "rationale": "Other notes Acute otitis media (AOM) It is common in infants because of high frequency of common colds and the anatomy of the infant’s eustachian tube, which is shorter, wider and straight. Definition: Acute inflammation of middle ear resulting in an effusion and associated with rapid onset of symptoms such as otalgia, fever, irritability, anorexia, or vomiting. Aetiology - In neonates: Staphylococcus aureus, Pseudomonas spp., Escherichia coli and other Gram negative rods. - In older children: Streptococcus pneumoniae, Haemophilus influenzae, Moraxella catarrhalis,Streptococcus pyogenes and others Clinical features: - Classical symptoms: otalgia, fever, hearing loss. - With rupture of tympanic membrane there is otorrhoea (< 14 days). - Non-specific symptoms: crying, irritability, ear pulling, and trouble sleeping, in infants who cannot talk. - Other non-specific symptoms are:diarrhoea, vomiting. Predisposing factors Blockage of the eustachian tubes may be caused by: - Acute coryza (common cold) - Allergies - Exposure to cigarette smoke - Infected or hypertrophy of adenoids - For infants, being fed lying down (drinking a bottle while lying on the back) Risk Factors: * Age (six and 18 months are most likely to have infections) - Attending daycare centre - Recent illness (such as a cold or sinus infection) - History of allergies (allergic rhinitis, or sinusitis) - Exposure to secondhand smoke - Having family members who are prone to ear infections - Using a pacifier Complications: - Hearing loss - Mastoiditis - Petrositis - Labyrinthitis - Meningitis - Brain abscess Treatment: - In neonates: parenteral ampicillin/sulbactam plus amikacin - Older children: oral high dose amoxicillin (first line), co-amoxiclav (2nd line). - If vomiting drugs, parenteral ceftriaxone (Rocephin). - Supportive management:ear(aural) toiletting for otorrhoea,antipyretic/analgesic e.g acetaminophen."}]}, {"id": "Q0052", "type": "tf", "stem": "Concerning UTIs", "system": "Nephrology", "topic": "UTI & pyuria", "source": "TF Series B", "aiAuthored": false, "options": [{"label": "A", "text": "seen more in males than females before 6 months of age", "answer": "T", "rationale": ""}, {"label": "B", "text": "symptoms include fever, pyrexia of unknown origin,...", "answer": "T", "rationale": ""}, {"label": "C", "text": "Vesicourethral reflux is a cause", "answer": "T", "rationale": ""}, {"label": "D", "text": "Nitrofurantoin is used to treat acute pyelonephritis", "answer": "F", "rationale": "Nitrofurantoin is used for lower UTI (cystitis), not for acute pyelonephritis. IV ceftriaxone and gentamicin is used for 14days to treat pyelonephritis."}, {"label": "E", "text": "Inital treatement on first presentation, abdominal USS is indicated", "answer": "F", "rationale": "EPIDEMIOLOGY OF UTI • Most UTIs are asymptomatic • Asymptomatic UTI commoner in preterm than term infants • In 1st 6months, UTI commoner in males • After 6 months UTI commoner in females • UTIs develop most often in 1st yr of life • Symptomatic UTI v 4.1/1000 newborn • In infancy, congenital structural anomalies of the Urinary tract probably account for higher incidence in boys • UTI in more common in uncircumcised male infants • Sicklers are at higher risk of UTI CLINICAL PRESENTATION Variable High index of suspicion required Neonate -non-specific, poor feeding, diarrhoea, vomiting, jaundice, fever, cyanosis, circulatory collapse Older infants: Fever, Pyrexia of unknown origin, weight loss, FTT Older Children: urinary frequency, abdominal pains, dysuria, hematuria secondary to onset enuresis, renal angle tenderness"}]}, {"id": "Q0053", "type": "tf", "stem": "Which of the following are correctly matched?", "system": "Cardiology", "topic": "Congenital heart disease", "source": "TF Series B", "aiAuthored": false, "options": [{"label": "A", "text": "Weak brachial and dorsalis pedis pulses - Aortic stenosis", "answer": "T", "rationale": "In aortic stenosis, there is reduced pulses in both upper and lower limbs. There is also apical heave or thrust"}, {"label": "B", "text": "Ejection systolic murmur at right upper sternal border - pulmonary stenosis", "answer": "F", "rationale": "Ejection systolic murmur at the right upper sternal border suggests aortic stenosis, not pulmonary stenosis. Pulmonary stenosis has an ejection systolic murmur which is heard best at the left upper sternal border (2nd right intercostal space or 3rd left intercostal space) transmitted to neck (apex). It is of harsh grade quality."}, {"label": "C", "text": "Hypocalcaemia - William syndrome", "answer": "F", "rationale": "Williams syndrome is associated with hypercalcaemia in infancy, not hypocalcaemia."}, {"label": "D", "text": "Pulmonary stenosis - Right parasternal heave", "answer": "F", "rationale": "Pulmonary stenosis causes right ventricular hypertrophy, which does produce a left parasternal heave, not right."}, {"label": "E", "text": "Cough - Mitral stenosis.", "answer": "T", "rationale": "Cough is a feature of mitral stenosis, often due to pulmonary congestion or compression of the recurrent laryngeal nerve. 39. The following are true of hypokalemia A-it is a common side effect of diuretic use T Especially with loop and thiazide diuretics, potassium loss is common. B-there is involvement of deep tendon reflexes T Hypokalaemia can cause muscle weakness and hyporeflexia, although less common, reflexes can be affected. C-while correcting, should not be more then 40meq/L T For IV correction, potassium concentration should not exceed 40 mEq/L to avoid vein irritation or arrhythmias. D-ECG shows widened PR interval F Flattened T waves U waves ST depression PR interval is typically not widened. Ecg findings in hyperkalemia are: Increased PR interval widened QRS peaked T waves E- Bicarbonate doses be given with care F Sodium bicarbonate can worsen hypokalaemia by causing intracellular shift of potassium"}]}, {"id": "Q0054", "type": "tf", "stem": "Features consistent with bronchial Asthma in a <5 year old.", "system": "Pulmonology", "topic": "Asthma", "source": "TF Series B", "aiAuthored": false, "options": [{"label": "A", "text": "wheeze < 3 episodes", "answer": "F", "rationale": ""}, {"label": "B", "text": "history of atopy", "answer": "T", "rationale": ""}, {"label": "C", "text": "persistent cough > 1 week after a cold", "answer": "T", "rationale": ""}, {"label": "D", "text": "improvement with nebulised normal saline", "answer": "F", "rationale": ""}, {"label": "E", "text": "recurrent history of common cold", "answer": "T", "rationale": "Clinical Features of bronchial asthma: 5 years and younger: • Persistent cough > 1week after a cold • Repeated ‘’common cold’’ in a day care centre attendee • Wheeze: ≥ 3 episodes • Clinical signs of airway obstruction • Personal/Family History of Atopy • Improvement with bronchodilators • Eosinophilia"}]}, {"id": "Q0055", "type": "tf", "stem": "A child was brought into the emergency convulsing after suffereing a fever for two days duration", "system": "Neurology", "topic": "Seizures & epilepsy", "source": "TF Series B", "aiAuthored": false, "options": [{"label": "A", "text": "the most likely diagnosis is meningitis", "answer": "F", "rationale": ""}, {"label": "B", "text": "Checking her blood sugar is mandatory", "answer": "T", "rationale": ""}, {"label": "C", "text": "the presence of coma rules out febrile seizures", "answer": "T", "rationale": ""}, {"label": "D", "text": "iv phenobarbitone is indicated in her management", "answer": "F", "rationale": ""}, {"label": "E", "text": "an IV access should be established immediately", "answer": "T", "rationale": "Other notes Febrile Seizures These are seizures occurring in young children as a result of elevated body temperature in the absence of a pathology in the brain. • Affects about 2-3% of young children, between the ages of 3month and 5 years. Common causes of febrile Seizure include: Malaria URTI Pharyngo-tonsillitis Otitis Media Bronchopneumonia UTI Measles • Febrile seizures are usually brief, generalised tonic, clonic and occur in conjunction with a rapid rise in body temperature. 25% cases have a positive family history. • There are 2 main forms of febrile seizures - Simple and - Complex Febrile Seizures Simple -Commoner form seen -Single attack in 24 hr period -Seizures are generalised -Last for < 15 mins Complex -Multiple attacks in 24 hr period -Seizures are focal -Duration of seizure > 15 mins. • Recurrence occurs in about 1/3 of cases after the first episode. • Risk of recurrence increases with – i)Young age at first episode ii)Onset of seizure at lower body temperature • Risk of development of epilepsy in children with febrile seizure is very small, about 1% as in the general population. Increased risk associated with -Complex febrile seizure, family history of epilepsy, abnormal neurological examination. Management of Febrile Seizures 1. ABC of resuscitation Airway-Clear & Maintain airways Breathing -Ensure that patient is breathing or assist respiration if needed Circulation-Assess circulatory function 2. Check Blood Sugar, if, <40mg/dl give 50% Glucose 1-2ml/kg stat, dil1:2 3. Abort the Seizure by giving an anticonvulsant: - Rectal Diazepam. Age <3yr give 5mg ; >3yr give 10mg - IV Diazepam –0.1 –0.3mg/kg/dose - IM Paraldehyde 1ml / year of life."}]}, {"id": "Q0056", "type": "tf", "stem": "Every newborn must have the following", "system": "Neonatology", "topic": "Newborn care & resuscitation", "source": "TF Series B", "aiAuthored": false, "options": [{"label": "A", "text": "suction of the airway immediately after birth", "answer": "F", "rationale": ""}, {"label": "B", "text": "bag mask ventilation after suctioning the airway if the child is not able to establish respiration spontaneously", "answer": "T", "rationale": ""}, {"label": "C", "text": "skin to skin care within the 1st hour of life", "answer": "T", "rationale": ""}, {"label": "D", "text": "breastfeeding within the first hour of life", "answer": "T", "rationale": ""}, {"label": "E", "text": "cord cleaning with chlorhexidine gel between the 60th and 90th minute of life", "answer": "T", "rationale": ""}]}, {"id": "Q0057", "type": "tf", "stem": "In Tumor Lysis Syndrome", "system": "Haematology & Oncology", "topic": "Oncologic emergencies (TLS)", "source": "TF Series B", "aiAuthored": false, "options": [{"label": "A", "text": "Fluid administration at daily maintenance value is adequate", "answer": "F", "rationale": ""}, {"label": "B", "text": "Allopurinol is useful in preventing it", "answer": "T", "rationale": ""}, {"label": "C", "text": "Uric acid of 11mg/dl is in keeping", "answer": "T", "rationale": ""}, {"label": "D", "text": "IV NaHCO3 is used in its treatment", "answer": "T", "rationale": ""}, {"label": "E", "text": "Can occur in Acute Leukaemia", "answer": "T", "rationale": "• Tumour lysis is a constellation of metabolic disturbances which occurs when large number of neoplastic cells are killed rapidly leading to release of intracellular ions and metabolic byproducts into systemic circulation. • Clinically; - Hyperkalemia: K >6mEq/l, - Hyperuricemia: UA >8mg/dl - Hyperphosphatemia: PO₄ >6.5mg/dl - Hypocalcemia: ionized calcium <1.5mEq/l (3mg/dl) • Increase in values by 25% within 3 days before or up to 7 days after initiation of therapy. Uric acid nephropathy. Acute kidney injury. RISK FACTORS FOR TLS • TLS can occur with every type of tumor Higher risk of occurrence; Bulky tumors {> 10cm in diameter} and /or white blood cell count of >50,000/ul. Rapidly proliferating tumors. Chemosensitivetumors. Pretreatment Lactate dehydrogenase (LDH) >2X Upper limit of normal (ULN) Organ infiltration or bone marrow involvement e.g non Hodgkin lymphomas eg Burkitt lymphoma and Acute Leukemias. High Lactate Dehydrogenase( 2X ULN) + pre existing renal insufficiency; strong prognostic indicators for TLS. PREVENTION Hydration Allopurinol (xanthine oxidase inhibitor) / Rasburicase (urate oxidase) Frequent monitoring of electrolytes and rapid correction of abnormalities. Urinary alkalinizationis no longer recommended 44.Concerning Fluid Administration"}, {"label": "A", "text": "Darrow’s solution contains 36mmol/L", "answer": "T", "rationale": "Darrow’s solution typically contains: Sodium: ~60 mmol/L Potassium: ~36 mmol/L Chloride: ~60 mmol/L Lactate: ~23 mmol/L"}, {"label": "B", "text": "Home made salt and sugar solution contains 45mmol/L of K and 20mmol/L of NaHCO3", "answer": "F", "rationale": "Homemade Oral Rehydration Solution (ORS) does not contain potassium or sodium bicarbonate. It is generally composed of: 1 litre of clean water 6 level teaspoons of sugar 0.5 level teaspoon of salt – This provides sodium (~75 mmol/L), chloride, and glucose – no potassium or bicarbonate."}, {"label": "C", "text": "SSS contains 40-90mmol of NaHCO3", "answer": "F", "rationale": ""}, {"label": "D", "text": "Normal saline contains 154meq/L", "answer": "T", "rationale": "– 0.9% Normal saline contains: Sodium = 154 mEq/L Chloride = 154 mEq/L"}, {"label": "E", "text": "8.4% of NaHCO3 contains 1meq/L", "answer": "F", "rationale": "8.4% Sodium bicarbonate contains 1 mEq/mL, not 1 mEq/L. 45.HIV"}, {"label": "A", "text": "In a 12month old child ,western blot can be used to diagnose", "answer": "F", "rationale": "Western blot is an antibody based test. It is not reliable in infants under 18 months because maternal HIV IgG antibodies cross the placenta and can persist in the infant for up to 18 months, leading to false positives. Same as ELISA (antibody based test). HIV DNA PCR which detects viral DNA is recommended screening tool for children <18 months."}, {"label": "B", "text": "Risk of mother to child transfer is about 35 – 50% in Africa", "answer": "T", "rationale": "VERTICAL: (Mother-to-Child) -90% •Risk of transmission • Western Europe: 25-35% • Africa: 35-45% •Stages of transmission 1. Intra-uterine (In utero) 2. Peripartum (60%: Most important) 3. Post partum (breastfeeding) –least common"}, {"label": "C", "text": "Measles vaccine is contraindicated in a child born to a HIV mother", "answer": "F", "rationale": "Immunization of HIV exposed/infected children • Give immunizations according to National schedule • If the child is not showing any symptoms, all vaccines in the schedule can be given, including measles • If symptoms are present only BCG &Yellow fever vaccine are contraindicated • Other recommended vaccines include: - pneumococcal vaccine - Varicella-zoster (chicken pox) - Hepatitis A - Yearly influenza vaccine • Avoid missed opportunities for HIV infected children who are sick"}, {"label": "D", "text": "Breastfeeding is contraindicated", "answer": "F", "rationale": ""}, {"label": "A", "text": "Acute is commoner than chronic in children", "answer": "T", "rationale": "Acute lymphoblastic leukaemia (ALL) is the most common childhood cancer. Chronic leukaemias are rare in children."}, {"label": "B", "text": "Down’s syndrome increases predisposition", "answer": "T", "rationale": ""}, {"label": "C", "text": "Abnormal bleeding is common in leukaemia", "answer": "T", "rationale": "Due to thrombocytopenia from bone marrow suppression."}, {"label": "D", "text": "Blasts in peripheral film is diagnostic", "answer": "F", "rationale": "While blasts on peripheral film are suggestive, diagnosis is confirmed via bone marrow aspiration showing >25% blasts (in ALL)."}, {"label": "E", "text": "Fever occurs in most cases", "answer": "T", "rationale": "47.Burkitt’s lymphoma"}, {"label": "A", "text": "Commoner in the maxilla than in the mandible", "answer": "T", "rationale": "Endemic Burkitt’s lymphoma often affects jaw/maxilla, especially in African children."}, {"label": "C", "text": "There is generalised lymphadenopathy in endemic type", "answer": "F", "rationale": "Endemic type tends to have localized jaw or facial swelling, not generalised lymphadenopathy. – Sporadic type is more likely to involve abdominal lymph nodes."}, {"label": "D", "text": "Modified Ziegler’s regimen used in the treatment", "answer": "T", "rationale": "Ziegler's protocol includes cyclophosphamide, vincristine, methotrexate – often used in endemic settings."}, {"label": "E", "text": "Prognosis is better in abdominal than in the jaw form", "answer": "F", "rationale": "Jaw involvement (endemic) generally has better prognosis than abdominal involvement (sporadic), especially when treated early. Other notes: BURKITT LYMPHOMA • Malignant Lymohocyte of B lymphocyte origin • Endemic – Tropical Africa • Sporadic – Far East, Central and South America, Europe • HIV associated BL • Fastest growing tumour in man –24hr doubling time. ENDEMIC BURKITT Commonest childhood malignant tumour in Ibadan AETIOLOGY • EB Virus • Malaria infection • Chromosomal translocation 8;14, 8;22, 2;8 C-Myc oncogene (on Chr 8) critical in regulation of cell poliferation PATHOLOGY FNAB –Cytology Histology: Starry –Sky appearance CLINICAL FEATURES Age: 2-16yrs peak 7yrs M>F ratio 1.7:1 SITE •Jaw; esp maxilla or orbit –loosening of teeth “dental anarchy”, jaw swelling •Abdomen-bowels, kidney, mesentery, ovaries •CNS-cranial nerve palsies, paraplegia (usually flacid), asymptomatic CSF pleocytosis • Others –thyroid, breast, testes. • Multi centric nature 48.Concerning UTI"}, {"label": "A", "text": "All confirmed cases must be investigated", "answer": "T", "rationale": ""}, {"label": "B", "text": "Staph. Aureus is the commonest cause in Ibadan", "answer": "F", "rationale": "The most common causative organism worldwide is Escherichia coli but in Ibadan, klebsiella is the most common causative organism. Others causative organisms are are Proteus, Staphylococcus. In neonates in Nigeria, Klebsiella is the commonest and E. coli 2nd commonest."}, {"label": "C", "text": "Presence of an indwelling catheter implies a complicated case", "answer": "T", "rationale": "Complicated UTI: those with reduced renal function, obstruction, dilatation, reflux, neurogenic dysfunction of the bladder, indwelling urinary catheter or foreign body in the urinary tract. Uncomplicated UTI: UTI in absence of the factors above"}, {"label": "D", "text": "Co-trimoxazole is the 1st line drug in Ibadan", "answer": "T", "rationale": ""}, {"label": "E", "text": "Bowel training is a preventive measure", "answer": "T", "rationale": "PREVENTION • Careful perineal hygiene • Prevent constipation/bladder training (complete bladder emptying) • Low dose prophylaxis with - VUR - Recurrent UTI - Neurogenic bladder 49.In a 3 month old infant, the following are correct:"}, {"label": "A", "text": "Jaundice is less common in breastfed infants than those on formula feeds", "answer": "F", "rationale": "Breast milk jaundice is more common and prolonged in breastfed infants due to β-glucuronidase in breast milk."}, {"label": "B", "text": "Breastmilk contains more Vit D than cow milk", "answer": "T", "rationale": "HUMAN Vs COW MILK • Protein and anti-infective agents: – Human (1%) << Cow (3%) –Contains lactoferrin, lactalbumin, IgA, perioxidases, and lysozome. • Carbohydrate –Lactose (human > cow) • Fats –Essential FA (linoleic, & linolenic acids) --unsaturated Minerals –increased Na, decreased Ca/PO4 ratio in cow milk • Vitamins –Adequate Vit A C E & D –Reduced Vit K –Hence baby to receive Vit K at birth"}, {"label": "C", "text": "Incidence of URTI is lower in breastfed children", "answer": "T", "rationale": "Breast milk contains immunoglobulins (mainly IgA), lysozyme, and lactoferrin that protect against respiratory infections."}, {"label": "D", "text": "Breast milk is the best source of Fe", "answer": "F", "rationale": "Breast milk has low iron content, though highly bioavailable. It is not considered the \"best\" source once stores are depleted. Iron-fortified cereals or supplements are often needed by 6 months. Other notes BENEFITS OF BREASTFEEDING To the child: • Breast Milk provides essential and adequate nutrients and calories to the baby at optimum temperature. • Protects against infection. –It reduces the incidence of diarrhoeal diseases and acute respiratory infections. –The high concentration of secretary 1gA antibodies specific to BM prevents micro organism from adhering to the intestinal mucosa. –The IgA also protects the oral mucosa, eyes, respiratory tract and inner ears –The presence of lactoferrin (an iron binding protein) has an inhibitory effect on the growth of E. coli in the intestine –Lactobacillus bifidus: breaks down lactose into lactic and acetic acids making the intestinal content of the breast-fed infant acid. This acidity interferes with the growth of many pathogenic organisms. To the mother: • Aids involution of the uterus, with reduction in post partum bleeding. • Personal satisfaction and feeling of fulfilment of motherhood. • Frequent breast feeding delays the return of menses and serves as contraceptive (lactational Amenorrhea). • It is convenient and cheap. • Mothers who nurse their babies also seem to be less likely to develop breast, ovarian or uterine cancer early in life. 50."}, {"label": "A", "text": "SGA loses 5-10% bodyweight and grows rapidly", "answer": "F", "rationale": ""}, {"label": "B", "text": "Clavicular fracture in one arm may affect its participation in Moro’s Reflex", "answer": "T", "rationale": ""}, {"label": "C", "text": "Lecithin-Sphingomyelin ratio is about 1.5 in preterm", "answer": "T", "rationale": "An L:S ratio >2.0 indicates lung maturity. A ratio of 1.5 is seen in many preterm infants and indicates immature lungs."}, {"label": "D", "text": "Term infants gain 30mg per day", "answer": "F", "rationale": ""}, {"label": "E", "text": "OFC increases by 0.8-1cm weekly in preterm", "answer": "T", "rationale": "Weight in neonates: Weight • Normal birthweight 2.5kg – 3.99kg • Low birthweight <2.5kg • Macrosomia > 4kg • SGA < 10th centile of expected for GA • LGA > 90th centile of expected for GA • AGA babies lose 10% of birth weight in 1st week • SGA babies lose 0 – 3% of bt wt in 1st week • Birthweight is regained by 7 – 10days in term infants • 10 – 12days in well preterms • Birthweight doubles by 4 – 6mths • Triples by 12mths • Daily weight gain (10 – 15g/kg) 20 - 30gm with adequate caloric intake. 51.Concerning AGN"}, {"label": "A", "text": "It is caused by Group B B-haemolytic streptococcus", "answer": "F", "rationale": "It is caused by group A beta haemolytic streptococcus (streptococcus pyogenes)"}, {"label": "B", "text": "ASO titre is higher in pharyngeal related AGN than in pyoderma", "answer": "T", "rationale": "Antistreptolysin 0 titre (ASO titre) is a confirmatory tests for post streptococcal AGN. It has the following features; - It starts to rise in the 1st 10days - it reaches a peak in 4/52 and tails off in 6/52 - ASOT > 333 Todds Unit markedly raised (<166 normal)"}, {"label": "C", "text": "It has a better prognosis than Nephrotic syndrome", "answer": "T", "rationale": "Prognosis of AGN: Prognosis is good. 80% recover completely. 10% may go into CRF, so follow up for up to adulthood."}, {"label": "D", "text": "Proteinuria of more than one year is normal", "answer": "F", "rationale": "The following features are indications for renal biopsy in post streptococcal AGN: - Hypertension > 3/52 - ARF - Low C3 > 8 -12wks -Nephrotic syndrome - Proteinuria >6months -Microscopic haematuria >one year"}, {"label": "E", "text": "There is a transient hypocomplimentaemia", "answer": "T", "rationale": "There is low C3 level in post streptococcal AGN which returns to normal within 6-8 weeks."}]}, {"id": "Q0058", "type": "tf", "stem": "Concerning chronic kidney disease", "system": "Nephrology", "
