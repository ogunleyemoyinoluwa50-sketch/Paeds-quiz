:", "system": "Infectious Disease", "topic": "Measles & viral exanthems", "source": "TF Series C", "aiAuthored": false, "options": [{"label": "A", "text": "Acyclovir is indicated.", "answer": "F", "rationale": "Acyclovir is primarily used for: Herpes Simplex Virus (HSV) Varicella-Zoster Virus (VZV) These may present with vesicular rashes, not maculopapular rashes."}, {"label": "B", "text": "Sending serum for a serological test can be used to confirm diagnosis.", "answer": "T", "rationale": "If a viral cause (e.g. measles, dengue, rubella) is suspected, serology (IgM/IgG) or PCR can confirm. For example: Measles: Anti-measles IgM Dengue: NS1 antigen, IgM/IgG Rubella: IgM"}, {"label": "C", "text": "Blood culture is indicated.", "answer": "T", "rationale": "Given the child’s fever, respiratory signs, and systemic symptoms, bacteremia/sepsis must be considered. Blood culture is essential before starting antibiotics."}, {"label": "D", "text": "Diagnosis is clinical.", "answer": "T", "rationale": "In many pediatric febrile illnesses with rash, the initial diagnosis is clinical."}, {"label": "E", "text": "Antibiotic is indicated for crepitations.", "answer": "T", "rationale": "Crepitations (crackles) on auscultation suggest alveolar involvement — i.e., pneumonia. Even if the initial cause is viral, secondary bacterial pneumonia is common, especially in infants. Start empirical antibiotics (e.g., Ampicillin + Gentamicin or Ceftriaxone, depending on setting and age)."}]}, {"id": "Q0103", "type": "tf", "stem": "The following are correctly matched:", "system": "Neurology", "topic": "Cerebral palsy & development", "source": "TF Series C", "aiAuthored": false, "options": [{"label": "A", "text": "Transfer object between hands: 5 months.", "answer": "F", "rationale": "It occurs at 7 months."}, {"label": "B", "text": "Dry at night: 2 years.", "answer": "F", "rationale": "Normally about 2years of age, a child controls urine during the day and by 4years controls it at night also. By 5years most children are dry night and day."}, {"label": "C", "text": "Tower of 2 blocks: 12 months.", "answer": "T", "rationale": "Tower of two blocks- 12 months Tower of three blocks- 18 months Tower of six blocks - 2 years Tower of eight or a train with 4 blocks- 2.5 years"}, {"label": "D", "text": "Pincer grip: 7 months.", "answer": "F", "rationale": "Mature pincer grip is achieved by 10 months. Others are Follow moving object or face by turning the head- 6 weeks Palmar grasp- 4-6 months Reaches out for toys- 4 months"}, {"label": "E", "text": "Draws circle: 36 months.", "answer": "T", "rationale": "Draws line - 2 years Draw circle- 3 years Draw square- 4 years Draw triangle- 5 years Draw cross- 3.5 years Other notes ENURESIS: Involuntary voiding of urine due to lack of bladder control beyond an appropriate age in childhood. Can be defined as repeated, spontaneous voiding of urine during sleep in a child five years and older. - Normally about 2yrs of age, a child controls urine during the day and by 4yrs controls it at night also. - By 5yrs most children are dry night and day. - Enuresis is a fairly common problem due to poor toilet rhythm and delay in maturation of bladder control."}]}, {"id": "Q0104", "type": "tf", "stem": "A 6-year-old boy presenting for the first time with a history of tiredness on exertion and blueness of the lips and digits of 3 years is very likely to be suffering from:", "system": "Cardiology", "topic": "TOF & cyanotic CHD", "source": "TF Series C", "aiAuthored": false, "options": [{"label": "A", "text": "Transposition of the great arteries.", "answer": "F", "rationale": "TGA typically presents within the first 24–48 hours of life with profound cyanosis that does not respond to oxygen. Since this child has lived for 3 years with symptoms and is now 6, TGA is highly unlikely"}, {"label": "B", "text": "Tricuspid atresia.", "answer": "F", "rationale": "presents very early in life with cyanosis and requires surgical palliation, often within the first few months."}, {"label": "C", "text": "Pulmonary stenosis.", "answer": "T", "rationale": "Pulmonary stenosis is a right ventricular outflow tract obstruction, which can vary from mild to severe. When severe and long-standing, it may lead to right-to-left shunting through a patent foramen ovale (PFO) or ASD, causing cyanosis. It can remain undetected for years, especially if the stenosis is moderate and only becomes symptomatic during exertion. Symptoms can include fatigue, exertional dyspnea, cyanosis, and clubbing if chronic."}, {"label": "D", "text": "Fallot’s tetralogy.", "answer": "T", "rationale": "TOF is the most common cyanotic congenital heart disease beyond infancy. Cyanosis develops gradually, especially as pulmonary stenosis worsens. Many children with TOF are missed in infancy, especially in low-resource settings, and present around 2–6 years with: Fatigue on exertion Cyanosis Clubbing Squatting after activity (to increase systemic vascular resistance and reduce right-to-left shunting) They may have had “tet spells” (hypoxic spells) which can be missed or misinterpreted."}, {"label": "E", "text": "Eisenmenger’s syndrome.", "answer": "T", "rationale": "Eisenmenger’s syndrome is the late result of an uncorrected large left-to-right shunt (e.g., VSD, ASD, PDA) causing pulmonary hypertension, which eventually causes reversal of shunt (right-to-left) and cyanosis. It typically presents in children or adolescents who had previously asymptomatic congenital heart disease, now turning cyanotic with exercise intolerance. It is a diagnosis of late presentation, and the time course fits this child who has had symptoms since age 3. Physical exam may reveal: Cyanosis Clubbing Loud pulmonary component of second heart sound (P2) Signs of right heart failure if advanced"}]}, {"id": "Q0105", "type": "tf", "stem": "A 15-year-old male is found unconscious in his room, having attended a party the night before the incident. The following investigations would not be necessary at the initial presentation:", "system": "Others (Emergency/Social)", "topic": "Poisoning & toxicology", "source": "TF Series C", "aiAuthored": false, "options": [{"label": "A", "text": "Toxicology screen.", "answer": "F", "rationale": "Very necessary due to suspected substance ingestion. The patient was found unconscious after a party, raising suspicion for alcohol, opioids, benzodiazepines, cannabis, or other recreational drug overdose. A toxicology screen (urine or blood) is essential to identify or rule out common substances of abuse."}, {"label": "B", "text": "Random blood glucose.", "answer": "F", "rationale": "Hypoglycemia is a common, reversible cause of unconsciousness."}, {"label": "C", "text": "Electroencephalogram.", "answer": "T", "rationale": ""}, {"label": "D", "text": "Liver function tests.", "answer": "F", "rationale": "If toxic ingestion is suspected (especially paracetamol, alcohol, or other hepatotoxic agents), LFTs are important."}, {"label": "E", "text": "Electrolytes, Urea, and Creatinine.", "answer": "F", "rationale": "Electrolyte disturbances (especially hyponatremia, hypernatremia, hypokalemia, etc.) are common causes of altered consciousness. Urea and creatinine help assess renal function, which can be impaired in toxic ingestion or dehydration."}]}, {"id": "Q0106", "type": "tf", "stem": "MS is a 4-year-old maternal child brought by an aunt with a 3-month history of weight loss, fever, and cough. He recently lost some developmental milestones and has had bloody diarrhea in the last 6 weeks. Which of the following are true about his evaluation and management?", "system": "Infectious Disease", "topic": "HIV & vertical infections", "source": "TF Series C", "aiAuthored": false, "options": [{"label": "A", "text": "Maternal antenatal history is relevant to his presentation.", "answer": "T", "rationale": "Maternal antenatal history (including HIV status, substance use, infections like TORCH, and PMTCT interventions) is highly relevant, especially in a child with failure to thrive, developmental regression, and chronic infections, which could indicate HIV infection."}, {"label": "B", "text": "The APGAR scores are required to fully assess his presentation.", "answer": "F", "rationale": ""}, {"label": "C", "text": "The family's source of drinking water could explain some of his presentation.", "answer": "F", "rationale": ""}, {"label": "D", "text": "A history of having received BCG immunization does not preclude the most likely diagnosis.", "answer": "T", "rationale": "BCG vaccination does not prevent primary infection or progression to TB in all cases—especially in children with HIV, where BCG may even disseminate."}, {"label": "E", "text": "A travel history is relevant in him.", "answer": "F", "rationale": ""}]}, {"id": "Q0107", "type": "tf", "stem": "The following are correctly paired:", "system": "Cardiology", "topic": "Congenital heart disease", "source": "TF Series C", "aiAuthored": false, "options": [{"label": "A", "text": "Bicuspid aortic valve: coarctation of the aorta.", "answer": "T", "rationale": "Bicuspid aortic valve is commonly associated with coarctation of the aorta, especially in Turner syndrome and males with congenital heart disease. It occurs in ~50% of coarctation cases."}, {"label": "B", "text": "Egg on side appearance: tetralogy of Fallot.", "answer": "F", "rationale": "\"Egg-on-side\" or \"egg-on-a-string\" appearance is classically seen in transposition of the great arteries (TGA), not Tetralogy of Fallot (TOF). TOF shows a boot-shaped heart due to right ventricular hypertrophy and upturned apex."}, {"label": "C", "text": "Oligemic: transposition of the great arteries.", "answer": "F", "rationale": "TGA is a cyanotic lesion with increased pulmonary blood flow, not oligemic. Oligemic lung fields (reduced vascular markings) are more typical of TOF and pulmonary atresia due to reduced pulmonary blood flow."}, {"label": "D", "text": "Soft S2: pulmonary atresia.", "answer": "T", "rationale": "In pulmonary atresia, the pulmonary valve is absent or non-functional, so the second heart sound (P2) is often inaudible or soft, resulting in a single S2."}, {"label": "E", "text": "AV septal defect: extra chromosome 21.", "answer": "T", "rationale": "An atrioventricular septal defect (AVSD) is the most common cardiac defect in children with Down syndrome (Trisomy 21)."}]}, {"id": "Q0108", "type": "tf", "stem": "Concerning glomerular diseases:", "system": "Nephrology", "topic": "AGN, PSGN & glomerulonephritis", "source": "TF Series C", "aiAuthored": false, "options": [{"label": "A", "text": "Oedema in acute GN is more marked than that in nephrotic syndrome.", "answer": "F", "rationale": ""}, {"label": "B", "text": "The initial presentation of rapidly progressive glomerulonephritis is a mixed nephritic-nephrotic picture.", "answer": "T", "rationale": "RPGN often presents with features of nephritic syndrome (hematuria, hypertension, active urine sediment) plus significant proteinuria, sometimes reaching nephrotic range, giving a mixed picture."}, {"label": "C", "text": "Proteinuria seen in AGN is usually within the range of 300-400 mg/day.", "answer": "F", "rationale": "Proteinuria in AGN is typically >1 g/day, but generally sub-nephrotic (<3.5 g/day). 300–400 mg/day is too low and may fall within normal-to-borderline range."}, {"label": "D", "text": "Active urinary sediments are seen in AGN.", "answer": "T", "rationale": "“Active” sediment refers to red blood cells, red cell casts, and white cells seen under microscopy, which is typical of nephritic syndromes like AGN. Casts are proteins filtered but not reabsorbed which form moulds at the tubules rbcs attached. Rbc casts includes granular casts (when rbc degenerate),Hyaline casts.} Other notes: Clinical features of post streptococcal AGN: Typical picture is infection of the skin or the pharynx; followed by a latent period of about (1-3wks) for pharyngitis associated AGN and 3-6wks for pyoderma associated AGN before appearance of features of AGN:"}]}, {"id": "Q0109", "type": "tf", "stem": "Concerning post-infectious AGN:", "system": "Nephrology", "topic": "AGN, PSGN & glomerulonephritis", "source": "TF Series C", "aiAuthored": false, "options": [{"label": "A", "text": "Pyoderma associated AGN occurs after a latent period of 10 days.", "answer": "F", "rationale": "(Latent period is 3-6 weeks)"}, {"label": "B", "text": "Pharyngitis associated AGN occurs after a latent period of about 3 weeks.", "answer": "T", "rationale": "Latent period is between 1-3 weeks"}, {"label": "C", "text": "Blood transfusion is given to correct the anemia seen.", "answer": "F", "rationale": "Anemia is typically mild and dilutional from fluid retention. Transfusion is rarely needed, unless severe or due to another cause (e.g., hemolysis)."}, {"label": "D", "text": "It could occur with no prior history of pharyngitis or pyoderma.", "answer": "T", "rationale": ""}, {"label": "E", "text": "Berger’s disease is a possible differential diagnosis.", "answer": "T", "rationale": "IgA nephropathy (Berger’s disease) may present with macroscopic hematuria post-infection, often confused with PSAGN."}]}, {"id": "Q0110", "type": "tf", "stem": "In AGN:", "system": "Nephrology", "topic": "AGN, PSGN & glomerulonephritis", "source": "TF Series C", "aiAuthored": false, "options": [{"label": "A", "text": "Circulating immune complexes may be demonstrated.", "answer": "T", "rationale": "Complement system is activated in post streptococcal AGN. Serum C3 is elevated for 6-8 weeks before returning to normal; Serum C4 is normal."}, {"label": "B", "text": "Plasma infusion is a useful adjunct to treatment.", "answer": "F", "rationale": "Plasma infusion is not part of standard management in AGN. Treatment is supportive, focused on fluid, BP, and electrolyte control."}, {"label": "C", "text": "Heart failure is a possible complication.", "answer": "T", "rationale": ""}, {"label": "D", "text": "Hyperkalemia is a common finding.", "answer": "T", "rationale": "Hyperkalaemia, decreased bicarbonates, increased urea and creatinine are common findings in AGN. Hyperkalemia is corrected by: - IV Calcum gluconate 10% (>6.5mEq/L with ECG changes) - IV NaHCo3 - Glucose/insulin - Ion exchange resin - Dialysis might or might not be indicated"}]}, {"id": "Q0111", "type": "tf", "stem": "Congenital nephrosis is characterized by:", "system": "Nephrology", "topic": "Nephrotic syndrome", "source": "TF Series C", "aiAuthored": false, "options": [{"label": "A", "text": "Hypertension.", "answer": "F", "rationale": ""}, {"label": "B", "text": "Elevated ASO titre.", "answer": "F", "rationale": ""}, {"label": "C", "text": "Albuminuria.", "answer": "T", "rationale": ""}, {"label": "D", "text": "Hypoproteinemia.", "answer": "T", "rationale": "Other notes Congenital nephrosis (also called congenital nephrotic syndrome) is a rare, genetically inherited kidney disorder that presents within the first 3 months of life with the features of nephrotic syndrome — massive proteinuria, hypoalbuminemia, edema, and hyperlipidemia. Clinical details Onset: At birth or within the first 3 months of life. The most common form is Finnish type (NPHS1 gene mutation on chromosome 19q13). Inheritance is by autosomal recessive. Clinical signs include generalized edema, Poor weight gain, Proteinuria, Hypoproteinemia. Lab findings - Massive proteinuria (>50 mg/kg/day)- Low serum albumin- Elevated lipids Kidney size is enlarged (due to mesangial expansion and proliferation)."}]}, {"id": "Q0112", "type": "tf", "stem": "Concerning HIV nephropathy in children:", "system": "Nephrology", "topic": "Renal investigations & misc", "source": "TF Series C", "aiAuthored": false, "options": [{"label": "A", "text": "It may manifest before AIDS develops.", "answer": "F", "rationale": "HIV-associated nephropathy (HIVAN) typically presents after significant immunosuppression, when CD4 counts are low and viral replication is uncontrolled. It is not usually an early manifestation."}, {"label": "B", "text": "HIV associated glomerulosclerosis has a striking predilection for blacks.", "answer": "T", "rationale": "Focal segmental glomerulosclerosis (FSGS), particularly the collapsing variant seen in HIVAN, is genetically linked to APOL1 mutations, found predominantly in individuals of African descent."}, {"label": "C", "text": "Children with focal segmented sclerosis have a better outcome.", "answer": "F", "rationale": "FSGS in HIVAN is associated with rapid progression to ESRD, especially the collapsing type. Prognosis is poor without ART."}, {"label": "D", "text": "Enlarged kidneys for age and height are consistently found at the late stage of the disease.", "answer": "F", "rationale": "Renal enlargement is usually an early finding due to glomerular hypertrophy and interstitial inflammation."}, {"label": "E", "text": "Proteinuria is the earliest and the most consistent finding", "answer": "T", "rationale": "Persistent proteinuria is the hallmark of HIVAN and often the first sign before overt renal failure."}]}, {"id": "Q0113", "type": "tf", "stem": "The following drugs are nephrotoxic in large doses:", "system": "Nephrology", "topic": "Renal investigations & misc", "source": "TF Series C", "aiAuthored": false, "options": [{"label": "A", "text": "Methicillin", "answer": "T", "rationale": ""}, {"label": "B", "text": "Tetracycline", "answer": "T", "rationale": ""}, {"label": "C", "text": "Streptomycin", "answer": "T", "rationale": ""}, {"label": "D", "text": "Kanamycin", "answer": "T", "rationale": ""}, {"label": "E", "text": "Penicillin", "answer": "T", "rationale": ""}]}, {"id": "Q0114", "type": "tf", "stem": "Common causes of hypertension in childhood include:", "system": "Nephrology", "topic": "Hypertension", "source": "TF Series C", "aiAuthored": false, "options": [{"label": "A", "text": "Acute nephritis.", "answer": "T", "rationale": ""}, {"label": "B", "text": "Chronic nephritis.", "answer": "T", "rationale": ""}, {"label": "C", "text": "Congenital adrenal hyperplasia.", "answer": "T", "rationale": ""}, {"label": "D", "text": "Coarctation of the aorta.", "answer": "T", "rationale": ""}, {"label": "E", "text": "Renal artery stenosis.", "answer": "T", "rationale": ""}]}, {"id": "Q0115", "type": "tf", "stem": "Polyuria occurs in the following:", "system": "Nephrology", "topic": "Fluid, electrolyte & tubular disorders", "source": "TF Series C", "aiAuthored": false, "options": [{"label": "B", "text": "Eosinophilic granuloma", "answer": "T", "rationale": "Central diabetes insipidus is a known complication due to pituitary infiltration."}, {"label": "C", "text": "Hypocalcemia", "answer": "F", "rationale": "Hypercalcemia, not hypocalcemia, impairs ADH action and tubular function, causing polyuria."}, {"label": "D", "text": "Chronic Renal Insufficiency", "answer": "T", "rationale": ""}, {"label": "E", "text": "Cushing syndrome", "answer": "F", "rationale": "Causes fluid retention and hypertension, not polyuria."}]}, {"id": "Q0116", "type": "tf", "stem": "Concerning SIADH:", "system": "Nephrology", "topic": "Fluid, electrolyte & tubular disorders", "source": "TF Series C", "aiAuthored": false, "options": [{"label": "A", "text": "It is characterized by concentrated urine and euvolemic hyponatremia.", "answer": "T", "rationale": ""}, {"label": "C", "text": "Lab results may show increased urinary sodium.", "answer": "T", "rationale": ""}, {"label": "D", "text": "Lab results may show increased serum sodium.", "answer": "F", "rationale": "Other notes: Syndrome of Inappropriate Antidiuretic Hormone Secretion (SIADH) This condition is characterized by inappropriate continued secretion of antidiuretic hormone (ADH) despite the presence of: Concentrated urine Euvolemic hyponatremia (low blood sodium without signs of dehydration or fluid overload). Causes of SIADH 1. Central Nervous System (CNS) disorders – e.g., infections, trauma, tumors 2. Respiratory conditions – e.g., pneumonia, tuberculosis 3. Tumors – especially those secreting ectopic ADH (e.g., small cell lung carcinoma) 4. Medications/Drugs – such as: Antidepressants (e.g., selective serotonin reuptake inhibitors) Antipsychotics Chemotherapy agents Antiepileptics Laboratory Findings in SIADH Decreased serum sodium (hyponatremia) Increased urine sodium concentration Increased urine specific gravity (concentrated urine) Decreased urine output Treatment of SIADH First-line treatment: Fluid restriction For chronic SIADH: Medications that reduce the effect of ADH, such as: Lithium Demeclocycline"}]}, {"id": "Q0117", "type": "tf", "stem": "Concerning Diabetes Insipidus:", "system": "Nephrology", "topic": "Fluid, electrolyte & tubular disorders", "source": "TF Series C", "aiAuthored": false, "options": [{"label": "A", "text": "It may be caused by drugs like naloxone and ethanol.", "answer": "T", "rationale": ""}, {"label": "B", "text": "Lithium and demeclocycline may be responsible for nephrogenic DI.", "answer": "T", "rationale": ""}, {"label": "C", "text": "It may be associated with cleft palate.", "answer": "T", "rationale": ""}, {"label": "D", "text": "It may be associated with familial cerebellar ataxia.", "answer": "T", "rationale": "Diabetes Insipidus This condition is characterized by the passage of large volumes of dilute urine due to: Central (neurogenic) cause: inadequate secretion of antidiuretic hormone (ADH) Nephrogenic cause: the kidneys' failure to respond to circulating ADH Causes of Diabetes Insipidus 1. Central Diabetes Insipidus Primary (idiopathic or familial) Secondary causes: head injury, neurosurgery, tumors, infections 2. Nephrogenic Diabetes Insipidus Primary (congenital):X-linked or autosomal recessive genetic mutations. Secondary causes: Chronic kidney disease Electrolyte disturbances: low potassium (hypokalemia), high calcium (hypercalcemia) Systemic illnesses: e.g., sarcoidosis, amyloidosis 3. Drugs affecting ADH Inhibiting ADH secretion: naloxone, alcohol Blocking ADH action at the kidney (peripheral resistance): lithium, demeclocycline, mannitol, some chemotherapeutic (cytotoxic) agents, and angiographic contrast media"}]}, {"id": "Q0118", "type": "tf", "stem": "Concerning urinary tract infections:", "system": "Nephrology", "topic": "UTI & pyuria", "source": "TF Series C", "aiAuthored": false, "options": [{"label": "A", "text": "Significant bacteriuria is defined as the growth of 100,000 colony-forming units/ml of freshly voided urine.", "answer": "T", "rationale": "In UTI, Significant bacteriuria: growth of > 10^5 colony forming units (CFU)/ml of freshly voided urine or Any growth from suprapublic specimen except 2-3 x10^3 CFU/ml of coagulase negative staphylococci. Bacteriuria may be –"}, {"label": "B", "text": "Pyelitis refers to infection of the upper tract with parenchymal involvement.", "answer": "F", "rationale": "UTI: Conditions in which there is growth of bacteria within the urinary tract. Sites: Cystitis– bladder involvement Pyelitis– upper tract involvement without parenchymal involvement. Pyelonephritis– renal parenchymal involvement"}, {"label": "C", "text": "Covert bacteriuria is the presence of bacteria in repeated samples of a child who has reported less than 2 symptoms.", "answer": "F", "rationale": "Covert bacteriuria: bacteriuria in repeated samples from a child who does not report symptoms usually at a health investigation or routine check-up."}, {"label": "D", "text": "Girls have a higher risk of recurrence than boys.", "answer": "T", "rationale": "60% recurrence occurs in female while 20% of recurrence occur in male"}, {"label": "E", "text": "Relapse refers to infection within 4 weeks of treatment while reinfection refers to infection after 4 weeks of treatment.", "answer": "F", "rationale": "Relapse in Urinary Tract Infection (UTI): Relapse refers to re-infection with the same organism that caused the original infection, occurring within 6 weeks (typically within 1 week) after completing treatment. Possible causes of relapse include:"}]}, {"id": "Q0119", "type": "tf", "stem": "Concerning UTI:", "system": "Nephrology", "topic": "UTI & pyuria", "source": "TF Series C", "aiAuthored": false, "options": [{"label": "A", "text": "It is commoner in males in the first 6 months of life but commoner in females afterwards.", "answer": "T", "rationale": ""}, {"label": "B", "text": "It is commoner in uncircumcised male infants.", "answer": "T", "rationale": ""}, {"label": "C", "text": "Staph is the commonest etiological agent in most Caucasian studies.", "answer": "F", "rationale": ""}, {"label": "D", "text": "E. coli is the predominant etiological agent among neonates in Ibadan.", "answer": "F", "rationale": "The most common causative organism worldwide is Escherichia coli but in Ibadan, klebsiella is the commonest"}]}, {"id": "Q0120", "type": "tf", "stem": "UTI in a neonate may present as:", "system": "Nephrology", "topic": "UTI & pyuria", "source": "TF Series C", "aiAuthored": false, "options": [{"label": "A", "text": "Poor feeding", "answer": "T", "rationale": ""}, {"label": "B", "text": "Jaundice", "answer": "T", "rationale": ""}, {"label": "C", "text": "Cyanosis", "answer": "T", "rationale": ""}, {"label": "D", "text": "Diarrhea", "answer": "T", "rationale": ""}, {"label": "E", "text": "Circulatory collapse", "answer": "T", "rationale": "CLINICAL PRESENTATIONS OF UTI Variable High index of suspicion required Neonate -non-specific, poor feeding, diarrhoea, vomiting, jaundice, fever, cyanosis, circulatory collapse. Older infants: Fever, PUO, weight loss, Failure to thrive. Older Children: urinary frequency, abdominal pains, dysuria, hematuria secondary to onset enuresis, Renal angle tenderness."}]}, {"id": "Q0121", "type": "tf", "stem": "The following are causes of sterile pyuria:", "system": "Nephrology", "topic": "UTI & pyuria", "source": "TF Series C", "aiAuthored": false, "options": [{"label": "A", "text": "Renal TB", "answer": "T", "rationale": ""}, {"label": "B", "text": "Nephrotic syndrome", "answer": "T", "rationale": ""}, {"label": "C", "text": "Viral infection", "answer": "T", "rationale": ""}, {"label": "D", "text": "Hypertension", "answer": "F", "rationale": ""}, {"label": "E", "text": "Trichinosis", "answer": "F", "rationale": "Pyuria refers to the presence of white blood cells (WBCs) in the urine, which suggests inflammation in the urinary tract. Quantitative thresholds for pyuria: >10 WBCs per mm³ in unspun (uncentrifuged) urine – this is considered more reliable. >5 WBCs per high-power field (HPF) in centrifuged urine. These findings suggest inflammation, most commonly due to urinary tract infection (UTI), but do not confirm it on their own. That's why pyuria is suggestive but not diagnostic of UTI. STERILE PYURIA Sterile pyuria means pyuria without bacterial growth on standard urine culture. Seen in renal tuberculosis, nephrotic syndrome. Also from contamination (e.g. vaginal flora), viral infection"}]}, {"id": "Q0122", "type": "tf", "stem": "Concerning physiological differences between the neonatal and adult kidney:", "system": "Nephrology", "topic": "Renal investigations & misc", "source": "TF Series C", "aiAuthored": false, "options": [{"label": "A", "text": "Neonates have reduced GFR.", "answer": "T", "rationale": "GFR is low at birth (~20 ml/min/1.73m²), increases over the first weeks/months."}, {"label": "B", "text": "Intrarenal pressure is higher in the neonatal kidney.", "answer": "F", "rationale": ""}, {"label": "C", "text": "At birth, neonatal GFR is 75% of adult GFR.", "answer": "F", "rationale": "At birth, GFR is ~20–25% of adult values."}, {"label": "D", "text": "The adult kidney has a higher concentrating ability", "answer": "T", "rationale": ""}, {"label": "E", "text": "Infants have a lower threshold for bicarbonate.", "answer": "F", "rationale": "Infants actually have a higher threshold (i.e., they excrete bicarbonate at lower serum levels), which contributes to metabolic acidosis."}]}, {"id": "Q0123", "type": "tf", "stem": "Concerning obstructive uropathy in children:", "system": "Nephrology", "topic": "Obstructive uropathy", "source": "TF Series C", "aiAuthored": false, "options": [{"label": "A", "text": "Upper urinary obstruction is the commonest cause of neonatal ascites.", "answer": "F", "rationale": "Urinary ascites in neonates is typically from lower urinary tract obstruction, especially PUV."}, {"label": "B", "text": "Posterior urethral valves are commoner in males than in females.", "answer": "T", "rationale": ""}, {"label": "C", "text": "The triad of PUV obstruction includes dribbling, poor urinary stream, and bladder distention.", "answer": "T", "rationale": "Classical features - Dribbling - Poor urinary stream in neonates and infant. - Bladder distention - +Symptoms of uraemia and infection. Diagnosis can be made prenatally by USS which reveals an enlarged bladder and hydronephrosis. Later in infancy - Vomiting - Failure to thrive –secondary to CRF - Dehydration –secondary to Diabetes Insipidus Consequent on the obstructive uropathy Older children - Enuresis may be the presenting complaint - Micturating cystourethrogram is diagnostic and shows dilated, elongated posterior urethra and trabeculated bladder."}, {"label": "D", "text": "Enuresis may be a presenting complaint in older children.", "answer": "T", "rationale": ""}, {"label": "E", "text": "Mohan's valvotomy is preferred over obliteration by diathermy in PUV.", "answer": "T", "rationale": "Mohan’s valvotomy is the standard in low-resource settings; diathermy obliteration may risk more damage."}]}, {"id": "Q0124", "type": "tf", "stem": "The following are true except:", "system": "Nephrology", "topic": "Fluid, electrolyte & tubular disorders", "source": "TF Series C", "aiAuthored": false, "options": [{"label": "A", "text": "Secondary enuresis is defined as a recurrence of wetting in a child who has been dry for at least 6 months.", "answer": "F", "rationale": ""}, {"label": "B", "text": "By the age of 3 years, children are usually dry by day and night.", "answer": "F", "rationale": ""}, {"label": "C", "text": "Pharmacological treatment of enuresis includes imipramine and desmopressin.", "answer": "T", "rationale": ""}, {"label": "D", "text": "Primary enuresis is more likely to have a pathological basis than secondary enuresis.", "answer": "F", "rationale": "Other notes Enuresis can be defined as repeated, spontaneous voiding of urine during sleep in a child five years and older. - Normally about 2yrs of age, a child controls urine during the day and by 4yrs controls it at night also. - By 5yrs most children are dry night and day. - Enuresis is a fairly common problem due to poor toilet rhythm and delay in maturation of bladder control. PRIMARY ENURESIS –employed when a child has never achieved dryness for a significant period of time and implies the absence of detectable underlying pathology SECONDARY ENURESIS –is the recurrence of wetting in a child who has been dry for at least 1 year and is more likely to have a pathological basis. Rule out Organic causes –UTI, Diabetes, SCD, PUV etc. Could be Psychological. Management of non-organic ENURESIS: • Behavioural: Fluid restriction, Night-time waking (lifting), Star achievement cards with rewards, Enuretic buzzer alarms • Pharmacotherapy –drugs e.g Imipramine, Desmopressin (preferred) • Combination of modalities."}]}, {"id": "Q0125", "type": "tf", "stem": "The following are true:", "system": "Nephrology", "topic": "Renal investigations & misc", "source": "TF Series C", "aiAuthored": false, "options": [{"label": "A", "text": "Inulin clearance is the gold standard for determining GFR hence its routine use.", "answer": "F", "rationale": "It is gold standard but not routinely used due to complexity."}, {"label": "B", "text": "Intravenous urogram only defines structural but not functional characteristics of the kidneys.", "answer": "F", "rationale": "IVU gives some functional information (e.g., excretion and uptake patterns)."}, {"label": "C", "text": "Serum urea does not start to increase until half of the nephrons are affected.", "answer": "T", "rationale": "RENAL FUNCTION TESTS • Serum urea: does not start to rise till about half of the nephrons are knocked off. It is not a good early indicator. Affected by nitrogen balance and state of hydration. • Serum creatinine: more useful but not an early marker. Derived from muscle metabolism."}, {"label": "D", "text": "Serum urea is more useful than serum creatinine in assessing renal function.", "answer": "F", "rationale": ""}]}, {"id": "Q0126", "type": "tf", "stem": "Concerning chronic renal disease:", "system": "Nephrology", "topic": "CKD & renal replacement", "source": "TF Series C", "aiAuthored": false, "options": [{"label": "A", "text": "It is defined in a patient with a GFR < 60 ml/min/1.73 m².", "answer": "T", "rationale": ""}, {"label": "B", "text": "Dialysis is indicated in a patient with a GFR 30-59 ml/min/1.73 m².", "answer": "F", "rationale": "Dialysis is indicated when GFR <15, unless severe symptoms arise earlier."}, {"label": "C", "text": "The most common cause in Caucasian children is chronic pyelonephritis.", "answer": "F", "rationale": "SIGNIFICANCE OF CAKUT Congenital Anomalies of the Kidney and Urinary Tract (CAKUT) constitute approximately 20 to 30 percent of all anomalies identified in the prenatal period. CAKUT are now the leading cause of chronic kidney failure in children, accounting for 30-40% of ESRD in children in the developed economies."}, {"label": "D", "text": "The most common cause in Nigerian children is steroid-resistant nephrotic syndrome secondary to tertian malaria.", "answer": "F", "rationale": "Majority of cases in Nigeria are due to steroid resistant nephrotic syndrome but not secondary to tertian malaria."}]}, {"id": "Q0127", "type": "tf", "stem": "The following are possible clinical manifestations of CRF:", "system": "Nephrology", "topic": "CKD & renal replacement", "source": "TF Series C", "aiAuthored": false, "options": [{"label": "A", "text": "Hypertension", "answer": "T", "rationale": ""}, {"label": "B", "text": "Arrhythmias", "answer": "T", "rationale": ""}, {"label": "C", "text": "Acute respiratory tract infection", "answer": "T", "rationale": ""}, {"label": "D", "text": "Gynecomastia", "answer": "F", "rationale": ""}, {"label": "E", "text": "GI bleeding", "answer": "T", "rationale": "f. Osteodystrophy T g. Pruritus T h. Short stature T"}]}, {"id": "Q0128", "type": "tf", "stem": "The following may be biochemical parameters associated with CRF:", "system": "Nephrology", "topic": "CKD & renal replacement", "source": "TF Series C", "aiAuthored": false, "options": [{"label": "A", "text": "Na: 130 mmol/l", "answer": "T", "rationale": "Mild hyponatremia (130–134 mmol/L) is a common finding in CRF, usually dilutional due to fluid retention or impaired water handling."}, {"label": "B", "text": "HCO3: 32 mmol/l", "answer": "F", "rationale": "Normal bicarbonate range: 22–28 mmol/L. In CRF, you typically get low bicarbonate due to metabolic acidosis."}, {"label": "C", "text": "Urea: 99 mg/dl", "answer": "T", "rationale": "Urea rises as renal clearance diminishes; >50 mg/dL is common in CRF, and >100 mg/dL in severe cases."}, {"label": "D", "text": "Creatinine: 0.6 mg/dl", "answer": "F", "rationale": "Creatinine level is elevated based on age and muscle mass; often ≥2–3 mg/dL in moderate to advanced CRF"}, {"label": "E", "text": "Albumin: 5.0 mg/dl", "answer": "F", "rationale": "Normal pediatric serum albumin is 3.5–5.0 g/dL. However, in CRF, especially with nephrotic-range proteinuria or poor nutrition, hypoalbuminemia is much more typical (e.g., <3.5 g/dL)."}]}, {"id": "Q0129", "type": "tf", "stem": "The following are true of erythropoietin therapy:", "system": "Nephrology", "topic": "CKD & renal replacement", "source": "TF Series C", "aiAuthored": false, "options": [{"label": "A", "text": "It improves appetite.", "answer": "T", "rationale": ""}, {"label": "B", "text": "It improves sleep.", "answer": "T", "rationale": ""}, {"label": "C", "text": "It could lead to iron overload.", "answer": "F", "rationale": ""}, {"label": "D", "text": "It could lead to hyperkalemia.", "answer": "T", "rationale": ""}, {"label": "E", "text": "It could cause hypertension.", "answer": "T", "rationale": ""}]}, {"id": "Q0130", "type": "tf", "stem": "About renal replacement therapy:", "system": "Nephrology", "topic": "CKD & renal replacement", "source": "TF Series C", "aiAuthored": false, "options": [{"label": "A", "text": "It is indicated when GFR falls < 10 ml/min/1.73 m².", "answer": "F", "rationale": "It is indicated when GFR falls < 15 ml/min/1.73 m². However, it may be started earlier if the patient becomes symptomatic (e.g uremia)"}, {"label": "B", "text": "Continuous Ambulatory Peritoneal Dialysis (CAPD) is favored in children.", "answer": "T", "rationale": ""}, {"label": "C", "text": "Age is not a limiting factor for renal transplantation.", "answer": "F", "rationale": "Age is indeed a limiting factor, especially in infants <1 year due to technical and immunologic challenges. So this option is false."}, {"label": "D", "text": "Hemodialysis usually lasts between 3-4 hours.", "answer": "T", "rationale": ""}]}, {"id": "Q0131", "type": "tf", "stem": "Concerning renal biopsy:", "system": "Nephrology", "topic": "Renal investigations & misc", "source": "TF Series C", "aiAuthored": false, "options": [{"label": "A", "text": "All patients with nephrotic syndrome in the Nigerian context should have it done if there is no contraindication.", "answer": "F", "rationale": "It is only indicated in steroid-resistant, atypical, or relapsing cases."}, {"label": "B", "text": "An absolute contraindication is having a solitary kidney.", "answer": "T", "rationale": ""}, {"label": "C", "text": "A relative contraindication is having a horseshoe kidney.", "answer": "T", "rationale": ""}, {"label": "D", "text": "Obesity is a relative contraindication.", "answer": "T", "rationale": ""}, {"label": "E", "text": "The presence of ascites is an absolute contraindication.", "answer": "F", "rationale": "It is relative, not absolute — can be corrected before biopsy."}]}, {"id": "Q0132", "type": "tf", "stem": "Concerning blood pressure in children:", "system": "Nephrology", "topic": "Hypertension", "source": "TF Series C", "aiAuthored": false, "options": [{"label": "A", "text": "Normal values are values less than the 95th percentile for age, gender, and height.", "answer": "F", "rationale": "Normal BP is defined as <90th percentile for age, sex, and height. The 90th–95th range is termed elevated BP, not normal."}, {"label": "B", "text": "Hypertension is described in a patient with a blood pressure >95th percentile.", "answer": "T", "rationale": "Hypertension in children is defined as BP >95th percentile on at least three separate occasions."}, {"label": "C", "text": "Secondary hypertension is more common than primary hypertension in children less than 10 years.", "answer": "T", "rationale": "In children <10 years, secondary hypertension (due to renal disease, endocrine disorders, coarctation) is more common than primary hypertension."}, {"label": "D", "text": "The incidence of hypertension in children is 1-2%.", "answer": "T", "rationale": ""}, {"label": "E", "text": "Measurement in a neonate is best done using oscillometry/doppler USS.", "answer": "T", "rationale": ""}]}, {"id": "Q0133", "type": "tf", "stem": "In mitral incompetence:", "system": "Cardiology", "topic": "Valvular & pericardial disease", "source": "TF Series C", "aiAuthored": false, "options": [{"label": "A", "text": "The pulse is collapsing.", "answer": "F", "rationale": "A collapsing (water-hammer) pulse is seen in aortic regurgitation, not mitral regurgitation."}, {"label": "B", "text": "The characteristic murmur is diastolic in timing.", "answer": "F", "rationale": "The murmur in MR is a pan-systolic (holosystolic) murmur, due to backflow during systole."}, {"label": "C", "text": "The murmur is maximal at the left sternal edge.", "answer": "F", "rationale": "The murmur is best heard at the apex, often radiating to the axilla—not at the left sternal edge."}, {"label": "D", "text": "Left ventricular enlargement occurs.", "answer": "T", "rationale": "Chronic MR leads to volume overload, causing left ventricular enlargement and hypertrophy."}, {"label": "E", "text": "Rheumatic fever is the commonest cause in childhood.", "answer": "T", "rationale": ""}]}, {"id": "Q0134", "type": "tf", "stem": "Cardiac lesions of TOF include:", "system": "Cardiology", "topic": "TOF & cyanotic CHD", "source": "TF Series C", "aiAuthored": false, "options": [{"label": "A", "text": "Aortic stenosis", "answer": "F", "rationale": ""}, {"label": "B", "text": "Pulmonary stenosis", "answer": "T", "rationale": ""}]}, {"id": "Q0135", "type": "tf", "stem": "The following combinations are associated with congenital heart disease:", "system": "Cardiology", "topic": "Congenital heart disease", "source": "TF Series C", "aiAuthored": false, "options": [{"label": "A", "text": "Maternal diabetes mellitus.", "answer": "T", "rationale": ""}, {"label": "B", "text": "Rubella infection after the 16th week of pregnancy.", "answer": "F", "rationale": "Rubella infection before 10 weeks gestation is strongly associated with CHDs (PDA, PS), not after 16 weeks."}, {"label": "C", "text": "Marfan's syndrome.", "answer": "T", "rationale": ""}]}, {"id": "Q0136", "type": "tf", "stem": "In TOF:", "system": "Cardiology", "topic": "TOF & cyanotic CHD", "source": "TF Series C", "aiAuthored": false, "options": [{"label": "A", "text": "Growth retardation is a common feature.", "answer": "F", "rationale": "In TOF, patients can be small for age on examination. Failure to thrive is a common symptoms."}, {"label": "B", "text": "Cyanosis usually appears during the 2nd year of life.", "answer": "T", "rationale": "It appears during infancy"}, {"label": "C", "text": "The lung field in a chest X-ray shows increased vascular markings.", "answer": "F", "rationale": "The lung fields shows decreased pulmonary vascular markings"}, {"label": "D", "text": "There is evidence of left ventricular hypertrophy in ECG.", "answer": "F", "rationale": "There is evidence of right ventricular hypertrophy (there may be left ventricular hypertrophy) and right axis deviation on ECG."}, {"label": "E", "text": "Subacute bacterial endocarditis is a common complication.", "answer": "T", "rationale": "Complications are hypercuanotic spells, infective endocarditis, growth retardation from chronic hypoxia."}]}, {"id": "Q0137", "type": "tf", "stem": "Wide pulse pressure is often a feature of:", "system": "Cardiology", "topic": "CVS examination & concepts", "source": "TF Series C", "aiAuthored": false, "options": [{"label": "A", "text": "Venous hum", "answer": "T", "rationale": ""}, {"label": "B", "text": "Mitral incompetence", "answer": "F", "rationale": ""}, {"label": "E", "text": "Thyrotoxicosis", "answer": "T", "rationale": ""}]}, {"id": "Q0138", "type": "tf", "stem": "Typical features of TOF include:", "system": "Cardiology", "topic": "TOF & cyanotic CHD", "source": "TF Series C", "aiAuthored": false, "options": [{"label": "A", "text": "Presentation in the first year of life.", "answer": "T", "rationale": "TOF typically presents in infancy with cyanosis or poor feeding."}, {"label": "B", "text": "Squatting.", "answer": "T", "rationale": "Squatting increases systemic vascular resistance, reducing the right-to-left shunt and relieving hypoxia"}, {"label": "C", "text": "Single soft S2.", "answer": "T", "rationale": "Squatting increases systemic vascular resistance, reducing the right-to-left shunt and relieving hypoxia."}, {"label": "D", "text": "Heart failure.", "answer": "F", "rationale": ""}, {"label": "E", "text": "Good response to hyperoxic test.", "answer": "F", "rationale": "Hyperoxia test shows poor improvement in TOF, distinguishing it from lung causes of cyanosis."}]}, {"id": "Q0139", "type": "tf", "stem": "The following are true of cardiac failure in the infant:", "system": "Cardiology", "topic": "Heart failure & CCF", "source": "TF Series C", "aiAuthored": false, "options": [{"label": "A", "text": "Bronchopneumonia is a common precipitating factor.", "answer": "T", "rationale": ""}, {"label": "B", "text": "The absence of pedal edema rules out the diagnosis.", "answer": "F", "rationale": "Pedal edema is rare in infants; hepatomegaly and tachypnea are more reliable signs."}, {"label": "C", "text": "There is usually associated raised JVP.", "answer": "F", "rationale": ""}, {"label": "D", "text": "Tachycardia is a common feature.", "answer": "T", "rationale": ""}, {"label": "E", "text": "The vaccine treatment is indicated irrespective of etiology.", "answer": "F", "rationale": ""}]}, {"id": "Q0140", "type": "tf", "stem": "PDA:", "system": "Cardiology", "topic": "Congenital heart disease", "source": "TF Series C", "aiAuthored": false, "options": [{"label": "A", "text": "Is a benign condition which rarely causes heart failure.", "answer": "F", "rationale": "Large PDAs can lead to heart failure, especially in preterms."}, {"label": "B", "text": "May be caused by intrauterine infection.", "answer": "T", "rationale": "Rubella infection in early pregnancy can result in PDA and other defects."}, {"label": "C", "text": "The diastolic pressure is usually normal.", "answer": "F", "rationale": "Diastolic pressure is reduced due to continuous runoff from the aorta to pulmonary artery causing wide pulse pressure."}, {"label": "D", "text": "Examination of the peripheral pulse is of no diagnostic value.", "answer": "F", "rationale": "Bounding pulses and hyperdynamic precordium are helpful in diagnosis."}, {"label": "E", "text": "The characteristic continuous murmur may be caused by other defects.", "answer": "T", "rationale": "Continuous murmurs can also result from arteriovenous malformations and aortopulmonary windows."}]}, {"id": "Q0141", "type": "tf", "stem": "Signs of CCF in an infant of six months:", "system": "Cardiology", "topic": "Heart failure & CCF", "source": "TF Series C", "aiAuthored": false, "options": [{"label": "A", "text": "Tachycardia", "answer": "T", "rationale": ""}, {"label": "B", "text": "Pedal edema", "answer": "F", "rationale": "It is rare in infants"}, {"label": "C", "text": "Raised JVP", "answer": "F", "rationale": ""}, {"label": "D", "text": "Hepatomegaly", "answer": "T", "rationale": "Hepatomegaly is the most reliable clinical sign of congestive heart failure in infants."}, {"label": "E", "text": "Crepitation in lung bases", "answer": "T", "rationale": "Suggestive of pulmonary edema"}]}, {"id": "Q0142", "type": "tf", "stem": "A 5-year-old Nigerian child born in Britain is admitted to the ER with a 1-day history of high fever (temp. 40°C) and an episode of convulsion. He returned to Nigeria with his parents 3 months earlier:", "system": "Infectious Disease", "topic": "Malaria", "source": "TF Series C", "aiAuthored": false, "options": [{"label": "A", "text": "The fever is the most likely cause of the convulsion.", "answer": "T", "rationale": ""}, {"label": "B", "text": "The fact that the child was born in Britain makes meningitis an unlikely diagnosis.", "answer": "F", "rationale": ""}, {"label": "C", "text": "Cerebral malaria is a probable diagnosis.", "answer": "T", "rationale": ""}, {"label": "D", "text": "The finding of malaria parasite in blood film rules out meningitis.", "answer": "F", "rationale": ""}, {"label": "E", "text": "Lumbar puncture should be done only if convulsion is recurrent.", "answer": "F", "rationale": ""}]}, {"id": "Q0143", "type": "tf", "stem": "The following are features of a large PDA:", "system": "Cardiology", "topic": "Congenital heart disease", "source": "TF Series C", "aiAuthored": false, "options": [{"label": "A", "text": "Continuous murmur.", "answer": "T", "rationale": ""}, {"label": "B", "text": "Normal or raised diastolic pressure.", "answer": "F", "rationale": "(diastolic pressure is typically low causing wide pulse pressure)"}, {"label": "C", "text": "Biventricular heart failure.", "answer": "T", "rationale": ""}, {"label": "D", "text": "Loud P2", "answer": "T", "rationale": ""}, {"label": "E", "text": "Normal sized left ventricle", "answer": "F", "rationale": "Left ventircle is dilated due to volume overload"}]}, {"id": "Q0144", "type": "tf", "stem": "A wide pulse pressure is usually found in:", "system": "Cardiology", "topic": "CVS examination & concepts", "source": "TF Series C", "aiAuthored": false, "options": [{"label": "A", "text": "Sickle cell haemoglobinopathy", "answer": "F", "rationale": ""}, {"label": "B", "text": "AV malformation", "answer": "T", "rationale": ""}, {"label": "C", "text": "Mitral Regurgitation", "answer": "F", "rationale": ""}, {"label": "D", "text": "Aortic Regurgitation", "answer": "T", "rationale": ""}, {"label": "E", "text": "Pb poisoning", "answer": "F", "rationale": ""}]}, {"id": "Q0145", "type": "tf", "stem": "In patients with moderately severe pericardial effusion:", "system": "Cardiology", "topic": "Valvular & pericardial disease", "source": "TF Series C", "aiAuthored": false, "options": [{"label": "A", "text": "The heart sounds are often muffled.", "answer": "T", "rationale": ""}, {"label": "C", "text": "The central venous pressure is usually elevated.", "answer": "F", "rationale": "With moderate to large pericardial effusion, especially if tamponade develops, CVP increases due to impaired venous return."}, {"label": "D", "text": "Cardiac contour is globular because the myocardium is damaged.", "answer": "F", "rationale": "The contour appears globular due to fluid collection, not myocardial damage."}, {"label": "E", "text": "M mode ECG is diagnostic.", "answer": "F", "rationale": "2D echocardiography is diagnostic of pericardial effusion."}]}, {"id": "Q0146", "type": "tf", "stem": "An 18-month-old baby was brought on account of delayed developmental milestones, upward slanting of the eyelids, and a protruding tongue. He attained a social smile at 6 months. The following are in keeping:", "system": "Endocrine & Genetics", "topic": "Genetics & chromosomal syndromes", "source": "TF Series C", "aiAuthored": false, "options": [{"label": "A", "text": "Extra chromosome 21.", "answer": "T", "rationale": ""}, {"label": "B", "text": "Atrioventricular septal defect.", "answer": "T", "rationale": "The commonest congenital heart disease in down syndrome."}, {"label": "C", "text": "Bilateral cataracts.", "answer": "F", "rationale": ""}, {"label": "D", "text": "Cyanotic congenital heart disease.", "answer": "F", "rationale": "Most congenital heart defect in down syndrome are acyanotic."}]}, {"id": "Q0147", "type": "tf", "stem": "A week-old boy was brought to the hospital on account of a history of difficulty in urination, fever, poor stream, and abdominal swelling at birth:", "system": "Nephrology", "topic": "Obstructive uropathy", "source": "TF Series C", "aiAuthored": false, "options": [{"label": "A", "text": "The most likely diagnosis is pelviureteric junction obstruction.", "answer": "F", "rationale": "Most likely cause is Posterior urethral valve."}, {"label": "B", "text": "An intravenous urogram confirms the diagnosis.", "answer": "F", "rationale": "Micturating cystourethrogram us diagnostic"}, {"label": "C", "text": "He should do a sepsis screen.", "answer": "T", "rationale": ""}, {"label": "D", "text": "Vesicotomy is the first line of treatment in UCH.", "answer": "T", "rationale": "Antenatal intervention involves prenatal bladder decompression by percutaneous vesicoamniotic shunt."}]}, {"id": "Q0148", "type": "tf", "stem": "Concerning CKD:", "system": "Nephrology", "topic": "CKD & renal replacement", "source": "TF Series C", "aiAuthored": false, "options": [{"label": "A", "text": "Heart failure is a complication.", "answer": "T", "rationale": ""}, {"label": "B", "text": "Genu valgum is consistent.", "answer": "T", "rationale": "This is as a result of renal osteo dystrophy"}, {"label": "C", "text": "They present with polycythaemia.", "answer": "F", "rationale": "They present with anemia"}, {"label": "D", "text": "Obstructive diseases are a rare cause.", "answer": "F", "rationale": "Obstructive uropathy are common cause"}, {"label": "E", "text": "Diagnosis can be made in a two-month-old.", "answer": "T", "rationale": ""}]}, {"id": "Q0149", "type": "tf", "stem": "A 16-year-old adolescent was found unconscious in his room after partying the previous night. The following are important questions to ask in the history:", "system": "Others (Emergency/Social)", "topic": "Poisoning & toxicology", "source": "TF Series C", "aiAuthored": false, "options": [{"label": "A", "text": "Dietary recall", "answer": "T", "rationale": ""}, {"label": "B", "text": "Academic performance", "answer": "T", "rationale": ""}, {"label": "C", "text": "Past medical condition", "answer": "T", "rationale": ""}, {"label": "D", "text": "Alcohol history", "answer": "T", "rationale": ""}]}, {"id": "Q0150", "type": "tf", "stem": "Regarding the 16-year-old adolescent above, the following investigations should be carried out at initial presentation:", "system": "Others (Emergency/Social)", "topic": "Poisoning & toxicology", "source": "TF Series C", "aiAuthored": false, "options": [{"label": "A", "text": "Toxicology screen", "answer": "T", "rationale": ""}, {"label": "B", "text": "Random blood glucose", "answer": "T", "rationale": ""}, {"label": "E", "text": "E/U/CR", "answer": "T", "rationale": ""}]}, {"id": "Q0151", "type": "tf", "stem": "The following are true regarding growth in children:", "system": "Endocrine & Genetics", "topic": "Growth & puberty", "source": "TF Series C", "aiAuthored": false, "options": [{"label": "A", "text": "Catch-up growth starts at birth and is completed over 6-18 months.", "answer": "T", "rationale": ""}, {"label": "B", "text": "Catch-down growth starts between 3-6months and is completed by 9-20 months.", "answer": "T", "rationale": ""}, {"label": "C", "text": "Thyroid hormone is responsible for growth in infancy.", "answer": "T", "rationale": "Other notes Birth size of a child is influenced by maternal size and health • Catch-up growth starts soon after birth & is completed over 6-18months • Catch-down growth starts between 3-6mths & is completed by 9-20months • The initial growth velocity in the 1st 3 months corresponds to 38cm/ year rapidly decreases and ends at 5cm/yr about 4 years of age • A similar pattern is observed for weight gain. Growth hormone, thyroxine, insulin, and corticosteroids all influence growth rate."}]}, {"id": "Q0152", "type": "tf", "stem": "A 14-year-old girl presented with a 6-month history of polydipsia, polyphagia, and weight loss. She also complained of abdominal pain and vaginal itching and maculopapular discoloration", "system": "Endocrine & Genetics", "topic": "Diabetes & glucose disorders", "source": "TF Series C", "aiAuthored": false, "options": [{"label": "A", "text": "The diagnosis has a male preponderance.", "answer": "F", "rationale": "Type 1 DM has a slight female predominance in some populations and no consistent male preponderance."}, {"label": "B", "text": "She may end up with delayed puberty.", "answer": "T", "rationale": "Poorly controlled diabetes can lead to delayed puberty due to chronic illness."}, {"label": "C", "text": "A history of vomiting implies an acute exacerbation of symptoms.", "answer": "T", "rationale": "Vomiting can indicate diabetic ketoacidosis (DKA), a serious acute complication."}, {"label": "D", "text": "The normal fasting blood glucose should reveal ≥126 mg/dl and an OGTT of ≥200mg/dl.", "answer": "F", "rationale": "These values are diagnostic, not normal. Normal FBS: <100 mg/dL; OGTT: <140 mg/dL."}]}, {"id": "Q0153", "type": "tf", "stem": "A week-old child was brought to the emergency on account of a 3-day history of fever, breathlessness, and poor feeding:", "system": "Neonatology", "topic": "Neonatal sepsis & infections", "source": "TF Series C", "aiAuthored": false, "options": [{"label": "A", "text": "The likely diagnosis is delayed onset sepsis.", "answer": "T", "rationale": ""}, {"label": "B", "text": "A lumbar puncture is indicated.", "answer": "F", "rationale": "LP is indicated unless contraindicated (e.g., unstable), to rule out meningitis."}, {"label": "C", "text": "The first line of treatment is IV ceftriaxone.", "answer": "F", "rationale": "The first line is ampicillin + gentamicin."}]}, {"id": "Q0154", "type": "tf", "stem": "Regarding community-acquired pneumonia:", "system": "Pulmonology", "topic": "Pneumonia & LRTI", "source": "TF Series C", "aiAuthored": false, "options": [{"label": "A", "text": "It occurs 80% of the time in children two years old and younger.", "answer": "F", "rationale": ""}, {"label": "B", "text": "First line of treatment for severe pneumonia is IV ceftriaxone.", "answer": "F", "rationale": "First-line: Ampicillin + Gentamicin or Ceftriaxone (IV) Second-line: Ceftriaxone or Cefotaxime + Macrolide"}, {"label": "C", "text": "It is majorly caused by gram-negative organisms.", "answer": "F", "rationale": "Common pathogens: Streptococcus pneumoniae (gram-positive) Haemophilus influenzae type b (gram-negative, but declining due to vaccine) Viruses are common in <5s (e.g. RSV, influenza) So, it is not majorly caused by gram-negative organisms."}, {"label": "D", "text": "It is vaccine-preventable.", "answer": "T", "rationale": ""}]}, {"id": "Q0155", "type": "tf", "stem": "A 3-year-old boy was brought to the emergency on account of a history of cough, breathlessness, inspiratory stridor, and noisy breathing with no wheeze:", "system": "Pulmonology", "topic": "URTI, ENT & upper airway", "source": "TF Series C", "aiAuthored": false, "options": [{"label": "A", "text": "The most likely diagnosis is acute bronchiolitis.", "answer": "F", "rationale": "Bronchiolitis: wheeze, cough, chest recession, no stridor This child has stridor, suggesting upper airway obstruction (Croup mostly)"}, {"label": "B", "text": "It is advisable to use salbutamol.", "answer": "F", "rationale": "Salbutamol is not effective in croup, because croup is not due to bronchospasm. Management: nebulized adrenaline + dexamethasone"}, {"label": "C", "text": "Anterior neck x-ray will help in its diagnosis.", "answer": "F", "rationale": ""}, {"label": "D", "text": "Nebulize with salbutamol.", "answer": "F", "rationale": "68)Concerning asthma:"}, {"label": "A", "text": "Resuscitation is the first step.", "answer": "T", "rationale": ""}, {"label": "B", "text": "It is important to triage into mild and life-threatening conditions.", "answer": "T", "rationale": "TRIAGE -Life threatening (any of confusion, drowsiness, cyanosis, silent chest) -Non life threatening (further triage to severe and moderate / mild)."}, {"label": "C", "text": "Aminophylline is useful in its treatment.", "answer": "T", "rationale": ""}, {"label": "D", "text": "Mild and moderate attacks are managed in the same way.", "answer": "T", "rationale": ""}, {"label": "E", "text": "Life-threatening attacks are managed in the emergency.", "answer": "F", "rationale": "They are managed in the ICU"}]}, {"id": "Q0156", "type": "tf", "stem": "Concerning vesicular acute tonsillitis:", "system": "Pulmonology", "topic": "URTI, ENT & upper airway", "source": "TF Series C", "aiAuthored": false, "options": [{"label": "A", "text": "The follicles are filled with pus.", "answer": "F", "rationale": ""}, {"label": "B", "text": "Abdominal pain and vomiting are common features.", "answer": "F", "rationale": "They occur in 25%"}, {"label": "C", "text": "Its causative organism is β-hemolytic strep.", "answer": "F", "rationale": "Causative agent us Coxsackie A virus"}, {"label": "D", "text": "There is a high risk of it leading to acute glomerulonephritis.", "answer": "F", "rationale": ""}, {"label": "E", "text": "There is a high chance of it causing rheumatic fever.", "answer": "F", "rationale": "Other notes Acute tonsillitis with vesicles (Herpagina) -CoxsackieA virus • It present with fever, sore throat, dysphagia, and lesions in the posterior pharynx. • Headache and backache in older children, • Vomiting and abdominal pain occur in 25%. • Characteristic lesions vesicles and ulcers surrounded by erythematous rings."}]}, {"id": "Q0157", "type": "tf", "stem": "A 2-year-old child was brought into the emergency after suffering a convulsion. On examination, she is centrally cyanosed with digital clubbing and cold extremities:", "system": "Cardiology", "topic": "TOF & cyanotic CHD", "source": "TF Series C", "aiAuthored": false, "options": [{"label": "A", "text": "She just had a hyper cyanotic spell.", "answer": "T", "rationale": ""}, {"label": "B", "text": "She should be nursed in a cardiac position.", "answer": "T", "rationale": ""}]}, {"id": "Q0158", "type": "tf", "stem": "Regarding cardiac diseases:", "system": "Cardiology", "topic": "CVS examination & concepts", "source": "TF Series C", "aiAuthored": false, "options": [{"label": "A", "text": "A prominent right border signifies right ventricular hypertrophy.", "answer": "F", "rationale": ""}, {"label": "B", "text": "A dilated pulmonary artery is consistent with pulmonary atresia.", "answer": "F", "rationale": "Pulmonary atresia = hypoplastic Pulmonaty artery, not dilated. Dilated PA = pulmonary hypertension or stenosis."}, {"label": "C", "text": "In TOF, the cardiothoracic ratio is increased.", "answer": "F", "rationale": "TOF usually have a normal or small sized heart."}]}, {"id": "Q0159", "type": "tf", "stem": "Concerning muscular dystrophies:", "system": "Neurology", "topic": "Neuromuscular & other neuro", "source": "TF Series C", "aiAuthored": false, "options": [{"label": "A", "text": "They are always progressive.", "answer": "T", "rationale": ""}, {"label": "B", "text": "They lead to mental retardation.", "answer": "T", "rationale": ""}]}, {"id": "Q0160", "type": "tf", "stem": "An 8-year-old child was brought to the hospital for the sudden development of a limp while playing. She was well hydrated with a blood pressure of 90/60 and her glucose level was 65%:", "system": "Others (Emergency/Social)", "topic": "Emergency care & triage", "source": "TF Series C", "aiAuthored": false, "options": [{"label": "A", "text": "She should be given 70mls of 10% dextrose water.", "answer": "F", "rationale": ""}, {"label": "B", "text": "She should be given 15mls of normal saline.", "answer": "F", "rationale": ""}, {"label": "C", "text": "She should be given IV propranolol.", "answer": "F", "rationale": ""}, {"label": "D", "text": "She should be given IV dopamine.", "answer": "F", "rationale": ""}]}, {"id": "Q0161", "type": "tf", "stem": "Regarding COVID-19 in children:", "system": "Infectious Disease", "topic": "Other infections", "source": "TF Series C", "aiAuthored": false, "options": [{"label": "A", "text": "15% of cases are diagnosed in children.", "answer": "F", "rationale": ""}, {"label": "B", "text": "20% of confirmed childhood cases are complicated.", "answer": "F", "rationale": ""}, {"label": "C", "text": "There is no evidence of mother-to-child transmission.", "answer": "F", "rationale": ""}, {"label": "D", "text": "Diagnosis is made with stool.", "answer": "F", "rationale": ""}, {"label": "E", "text": "The vaccine is a killed vaccine taken in two doses.", "answer": "F", "rationale": "The vaccine is mRNA Vaccine"}]}, {"id": "Q0162", "type": "tf", "stem": "A child presented at the hospital with a three-day history of fever, dark-colored urine, jaundice, and oliguria. His management involves:", "system": "Infectious Disease", "topic": "Malaria", "source": "TF Series C", "aiAuthored": false, "options": [{"label": "A", "text": "Blood film for malaria parasite.", "answer": "T", "rationale": ""}, {"label": "B", "text": "Acute dialysis.", "answer": "F", "rationale": ""}, {"label": "C", "text": "A fluid challenge test.", "answer": "T", "rationale": "If hypovolemia is suspected."}]}, {"id": "Q0163", "type": "tf", "stem": "A 6-year-old boy presented with maxillary swelling of 6 weeks duration and proptosis of the right eye:", "system": "Haematology & Oncology", "topic": "Childhood cancers", "source": "TF Series C", "aiAuthored": false, "options": [{"label": "A", "text": "Hodgkin's lymphoma is the likely diagnosis.", "answer": "F", "rationale": ""}, {"label": "B", "text": "Rhabdomyosarcoma is the likely diagnosis.", "answer": "T", "rationale": ""}, {"label": "C", "text": "Abdominal ultrasound is mandatory.", "answer": "T", "rationale": ""}, {"label": "D", "text": "It is diagnosed by fine needle aspiration for cytology.", "answer": "T", "rationale": ""}, {"label": "E", "text": "Lumbar puncture is contraindicated.", "answer": "F", "rationale": ""}]}, {"id": "Q0164", "type": "tf", "stem": "A child presented with a painless abdominal swelling:", "system": "Haematology & Oncology", "topic": "Childhood cancers", "source": "TF Series C", "aiAuthored": false, "options": [{"label": "A", "text": "A mass that crosses the midline is in keeping with nephroblastoma.", "answer": "F", "rationale": ""}, {"label": "B", "text": "Presence of aniridia is in keeping with nephroblastoma.", "answer": "T", "rationale": ""}, {"label": "C", "text": "The first line of management is nil per oris and IV fluids.", "answer": "F", "rationale": ""}, {"label": "D", "text": "A cannonball opacity in the lungs is in keeping with nephroblastoma.", "answer": "T", "rationale": ""}]}, {"id": "Q0165", "type": "tf", "stem": "Which of the following with HBSS is correctly paired:", "system": "Haematology & Oncology", "topic": "Sickle cell disease", "source": "TF Series C", "aiAuthored": false, "options": [{"label": "A", "text": "Cerebrovascular accident: transfusion with HbA.", "answer": "T", "rationale": ""}, {"label": "B", "text": "Frequent vaso-occlusive crisis: fluids.", "answer": "F", "rationale": "Treatment is by hydroxyurea"}, {"label": "C", "text": "Frequent hemolytic crisis: hydroxyurea.", "answer": "F", "rationale": ""}, {"label": "D", "text": "Splenic sequestration: splenectomy.", "answer": "T", "rationale": ""}]}, {"id": "Q0166", "type": "tf", "stem": "Regarding tumor lysis syndrome:", "system": "Haematology & Oncology", "topic": "Oncologic emergencies (TLS)", "source": "TF Series C", "aiAuthored": false, "options": [{"label": "A", "text": "It can occur before chemotherapy.", "answer": "T", "rationale": ""}, {"label": "B", "text": "Burkitt's lymphoma is a risk factor.", "answer": "T", "rationale": ""}, {"label": "C", "text": "Hyperkalemia is consistent.", "answer": "T", "rationale": ""}, {"label": "D", "text": "It is prevented with allopurinol.", "answer": "T", "rationale": ""}]}, {"id": "Q0167", "type": "tf", "stem": "Regarding urinary tract infection in neonates:", "system": "Nephrology", "topic": "UTI & pyuria", "source": "TF Series C", "aiAuthored": false, "options": [{"label": "A", "text": "Urgency and frequency are common presentations.", "answer": "F", "rationale": "Symptoms are usually non specific e.g vommiting, diarrhea, jaundice."}, {"label": "B", "text": "It is caused mainly by viruses.", "answer": "F", "rationale": ""}, {"label": "C", "text": "It is vaccine-preventable.", "answer": "F", "rationale": ""}]}, {"id": "Q0168", "type": "tf", "stem": "A child presented with a four-week history of cough, fever, and weight loss:", "system": "Pulmonology", "topic": "Tuberculosis", "source": "TF Series C", "aiAuthored": false, "options": [{"label": "A", "text": "Absence of cavity on CXR rules out TB.", "answer": "F", "rationale": "TB can exist without cavity"}, {"label": "B", "text": "History of contact rules out TB.", "answer": "F", "rationale": ""}]}, {"id": "Q0169", "type": "tf", "stem": "A 2-year-old boy presented with a history of pale stool, dark urine, and jaundice:", "system": "Gastrointestinal & Hepatobiliary", "topic": "Hepatobiliary & cholestasis", "source": "TF Series C", "aiAuthored": false, "options": [{"label": "A", "text": "The most likely diagnosis is biliary atresia.", "answer": "F", "rationale": "The symptoms suggest cholestatic liver disease. Signs/symptoms of billiary atresia develop within 2-4 weeks of age."}, {"label": "B", "text": "A total bilirubin of 12mg/dl and conjugated of 2mg/dl is in keeping with conjugated hyperbilirubinemia.", "answer": "T", "rationale": "Conjugated hyperbilirubinemia is Conjugated bilirubin >15% of total bilirubin. In this scenario 2/12= 16.7%"}, {"label": "C", "text": "Reduced uptake and normal excretion with technetium 99 is consistent with biliary atresia.", "answer": "F", "rationale": "In biliary atresia, uptake is normal, but excretion is absent (no tracer in bowel at 24 hours). Impaired uptake and normal excretion would suggest idiopathic neonatal hepatitis"}, {"label": "D", "text": "A history of vomiting and diarrhea on introduction of feeds is important.", "answer": "T", "rationale": "This suggests galactosemia (a differential)"}, {"label": "E", "text": "Abdominal ultrasound scan can diagnose idiopathic neonatal cholestasis.", "answer": "F", "rationale": "Idiopatic neonatal cholestasis is a diagnosis of exclusion"}]}, {"id": "Q0170", "type": "tf", "stem": "A mother brought in a child presenting with a 3-day history of bloody mucoid diarrhea and fever:", "system": "Gastrointestinal & Hepatobiliary", "topic": "Diarrhoeal disease & dehydration", "source": "TF Series C", "aiAuthored": false, "options": [{"label": "A", "text": "The most likely causative organism is rotavirus.", "answer": "F", "rationale": "The causative is shigella. This is a case of dysentery"}, {"label": "B", "text": "It is not vaccine-preventable.", "answer": "F", "rationale": ""}, {"label": "C", "text": "First line of treatment is broad-spectrum antibiotics.", "answer": "T", "rationale": ""}, {"label": "D", "text": "Personal hygiene can prevent a future recurrence.", "answer": "T", "rationale": "84)Which of the following is true regarding Hypokalemia:"}, {"label": "A", "text": "Diarrhoea is a known cause", "answer": "T", "rationale": ""}, {"label": "B", "text": "Hypoactive bowel sounds", "answer": "T", "rationale": ""}, {"label": "C", "text": "ECG shows tall tented T wave", "answer": "T", "rationale": "It causes flat T wave"}, {"label": "D", "text": "Correction with potassium should not exceed 40meq/L.", "answer": "T", "rationale": ""}]}, {"id": "Q0171", "type": "tf", "stem": "A 3-year old presents to the emergency room with fever, jaundice and passage of dark coloured urine. She thereafter became oliguric and developed seizures. The following are consistent with her presentation:", "system": "Nephrology", "topic": "AGN, PSGN & glomerulonephritis", "source": "TF Series C", "aiAuthored": false, "options": [{"label": "A", "text": "Febrile seizures", "answer": "F", "rationale": ""}, {"label": "B", "text": "Hypertension", "answer": "T", "rationale": ""}, {"label": "C", "text": "Serum creatinine of 6.5mg/dl", "answer": "T", "rationale": ""}, {"label": "D", "text": "Dialysis is contraindicated", "answer": "F", "rationale": ""}, {"label": "E", "text": "Spironolactone is indicated", "answer": "T", "rationale": "Spironolactone is a potassium-sparing diuretic. In AKI, there is risk of hyperkalemia, and spironolactone is not routinely used, especially in oliguric AKI. 86.With respect to preparation for delivery of a baby, the following provisions must be made in the labour ward"}, {"label": "A", "text": "Glucose and boiled water in a flask", "answer": "T", "rationale": ""}, {"label": "B", "text": "Baby cap and 2 pieces of dry linen", "answer": "T", "rationale": ""}, {"label": "C", "text": "Bulb syringe or functioning suction machine", "answer": "T", "rationale": ""}, {"label": "D", "text": "Bag and mask of appropriate size", "answer": "T", "rationale": ""}, {"label": "E", "text": "IV sodium bicarbonate 8.4meq/l.", "answer": "F", "rationale": ""}]}, {"id": "A0001", "type": "tf", "stem": "A 6-year-old female child presents with a 3-day history of fever and convulsions. On examination, she was febrile, had a Glasgow coma score of 7/15, decerebrate posturing, and dilated, unreactive pupils. The following statements are true:", "system": "Neurology", "topic": "CNS infections & coma", "source": "Ajisco Compiled Peds", "aiAuthored": true, "options": [{"label": "A", "text": "Gram-negative bacilli should be considered as the likely pathogens.", "answer": "F", "rationale": "Commonest pathogens at this age: S. pneumoniae, N. meningitidis, Hib — not gram-negative bacilli."}, {"label": "B", "text": "A lumbar puncture should be performed urgently.", "answer": "F", "rationale": "LP is contraindicated now — decerebrate posturing and fixed dilated pupils signal severely raised ICP (herniation risk)."}, {"label": "C", "text": "She likely has a vaccine-preventable disease.", "answer": "T", "rationale": "Meningitis from Hib and pneumococcus is vaccine-preventable."}, {"label": "D", "text": "Febrile convulsion is a differential diagnosis.", "answer": "F", "rationale": "Coma, decerebrate posturing and pupillary signs exclude a simple febrile convulsion."}, {"label": "E", "text": "IV Cefuroxime is indicated.", "answer": "T", "rationale": "Empiric IV cephalosporin cover is indicated while aetiology is confirmed."}]}, {"id": "A0002", "type": "tf", "stem": "Concerning muscular dystrophies:", "system": "Neurology", "topic": "Neuromuscular & myopathies", "source": "Ajisco Compiled Peds", "aiAuthored": true, "options": [{"label": "A", "text": "They are always progressive.", "answer": "T", "rationale": "Muscular dystrophies are progressive degenerative myopathies."}, {"label": "B", "text": "They lead to mental retardation.", "answer": "F", "rationale": "Only some (e.g. Duchenne) are associated with intellectual impairment; it is not universal."}, {"label": "C", "text": "They are genetic in origin.", "answer": "T", "rationale": "All muscular dystrophies are inherited genetic disorders."}]}, {"id": "A0003", "type": "tf", "stem": "A six-month-old female infant delivered at term was brought into the emergency ward with progressive enlargement of the head. She had a widened anterior fontanelle, sunset appearance of the eyes, and distended scalp veins. Which of the following are true concerning her management?", "system": "Neurology", "topic": "Hydrocephalus & congenital neuro", "source": "Ajisco Compiled Peds", "aiAuthored": true, "options": [{"label": "A", "text": "Occipito-frontal circumference of 38.7 cm is consistent with her clinical presentation.", "answer": "F", "rationale": "38.7 cm is too small for a 6-month-old (expected ~43 cm); hydrocephalus gives a large OFC."}, {"label": "B", "text": "Narrowing of the ventricles is expected on transfontanelle ultrasonography.", "answer": "F", "rationale": "Hydrocephalus shows ventricular DILATATION, not narrowing."}, {"label": "C", "text": "She requires neurosurgical consultation.", "answer": "T", "rationale": "She needs neurosurgical review for CSF diversion (e.g. VP shunt)."}, {"label": "D", "text": "Epilepsy is a recognized complication.", "answer": "T", "rationale": "Epilepsy is a recognized complication of hydrocephalus/raised ICP."}, {"label": "E", "text": "Mental retardation is rare with delayed treatment.", "answer": "F", "rationale": "Delayed treatment commonly causes cognitive impairment — it is not rare."}]}, {"id": "A0004", "type": "tf", "stem": "A 6-year-old boy with a 6-month history of DMD:", "system": "Neurology", "topic": "Neuromuscular & myopathies", "source": "Ajisco Compiled Peds", "aiAuthored": true, "options": [{"label": "A", "text": "Learning disabilities.", "answer": "T", "rationale": "Learning/intellectual disability is common in Duchenne muscular dystrophy."}, {"label": "B", "text": "Positive Tensilon test.", "answer": "F", "rationale": "A positive Tensilon (edrophonium) test indicates myasthenia gravis, not DMD."}, {"label": "C", "text": "Positive Hx in father.", "answer": "F", "rationale": "DMD is X-linked recessive — inherited via carrier mothers, not from the father."}, {"label": "D", "text": "Effort intolerance.", "answer": "T", "rationale": "Effort intolerance from progressive proximal weakness is typical."}, {"label": "E", "text": "Progressively worsening symptoms.", "answer": "T", "rationale": "DMD symptoms progressively worsen with age."}]}, {"id": "A0005", "type": "tf", "stem": "An 18-month-old baby was brought on account of delayed developmental milestones, upward slanting of the eyelids, and a protruding tongue. He attained a social smile at 6 months. The following are in keeping:", "system": "Neurology", "topic": "Development & genetic syndromes", "source": "Ajisco Compiled Peds", "aiAuthored": true, "options": [{"label": "A", "text": "Extra chromosome 21.", "answer": "T", "rationale": "Trisomy 21 (extra chromosome 21) causes Down syndrome."}, {"label": "B", "text": "Atrioventricular septal defect.", "answer": "T", "rationale": "Endocardial cushion (atrioventricular septal) defect is characteristic of Down syndrome."}, {"label": "C", "text": "Bilateral cataracts.", "answer": "T", "rationale": "Cataracts occur with increased frequency in Down syndrome."}, {"label": "D", "text": "Cyanotic congenital heart disease.", "answer": "F", "rationale": "Down syndrome CHDs are acyanotic (AVSD, VSD, PDA), not cyanotic lesions."}]}, {"id": "A0006", "type": "tf", "stem": "A 4-year-old with a 6-month history of low midline back swelling and a 3-month history of weakness while walking. Examination shows a weight of 11 kg, power of 2, hypertonia, and increased deep tendon reflexes. The following are true:", "system": "Neurology", "topic": "Spinal cord disorders", "source": "Ajisco Compiled Peds", "aiAuthored": true, "options": [{"label": "A", "text": "Fasciculations are present.", "answer": "F", "rationale": "Fasciculations are a lower motor neuron sign — this child has UMN signs (hypertonia, hyperreflexia)."}, {"label": "B", "text": "AFP surveillance team would come for stool culture.", "answer": "F", "rationale": "Polio (AFP surveillance) causes flaccid LMN paralysis, which this UMN picture does not fit."}, {"label": "C", "text": "Chest x-ray is mandatory.", "answer": "T", "rationale": "Chest X-ray is mandatory when TB of the spine (Pott disease) is suspected."}, {"label": "D", "text": "Spinal MRI is diagnostic.", "answer": "T", "rationale": "Spinal MRI delineates cord compression and is the diagnostic investigation of choice."}, {"label": "E", "text": "She shows signs of spinal compression.", "answer": "T", "rationale": "Weakness with hypertonia and brisk reflexes indicates spinal cord compression."}]}, {"id": "A0007", "type": "tf", "stem": "The following are true concerning childhood epilepsy:", "system": "Neurology", "topic": "Seizures & epilepsy", "source": "Ajisco Compiled Peds", "aiAuthored": true, "options": [{"label": "A", "text": "Jerky movements are a feature of all generalized seizures.", "answer": "F", "rationale": "Not all generalized seizures jerk — absence seizures have no motor manifestation."}, {"label": "B", "text": "Presence of abnormal electrical discharges on EEG is diagnostic of epilepsy irrespective of contrary history findings.", "answer": "F", "rationale": "Epilepsy is a clinical diagnosis; EEG supports but never overrides the history."}, {"label": "C", "text": "Myoclonic seizures are brief jerks of one or two muscle groups.", "answer": "T", "rationale": "Myoclonic seizures are brief shock-like jerks of one or a few muscle groups."}, {"label": "D", "text": "Carbamazepine is the preferred choice for partial seizures.", "answer": "T", "rationale": "Carbamazepine is a preferred agent for focal (partial) seizures."}, {"label": "E", "text": "Learning disability is a complication.", "answer": "T", "rationale": "Learning disability is a recognized comorbidity of childhood epilepsy."}]}, {"id": "A0008", "type": "tf", "stem": "The following are consistent with a 2-year-old with Duchenne muscular dystrophy:", "system": "Neurology", "topic": "
