 {"label": "C", "text": "Hypertrophic muscular dystrophy", "answer": "F", "rationale": "Muscular dystrophy is a primary muscle (dystrophin) disease."}, {"label": "D", "text": "Myasthenia gravis", "answer": "F", "rationale": "Myasthenia gravis affects the neuromuscular junction (postsynaptic ACh receptors), not the anterior horn cell."}, {"label": "E", "text": "Tetanus", "answer": "F", "rationale": "Tetanus toxin acts on inhibitory (Renshaw) interneurons of the spinal cord, not anterior horn cells."}]}, {"id": "A0102", "type": "tf", "stem": "The following are true of birth trauma:", "system": "Neurology", "topic": "Birth trauma & brachial plexus", "source": "Ajisco Compiled Peds", "aiAuthored": true, "options": [{"label": "A", "text": "The swelling due to cephalhematoma usually crosses the midline", "answer": "F", "rationale": "Cephalhaematoma is limited by suture lines (periosteal blood); it is CAPUT succedaneum that crosses the midline/sutures."}, {"label": "B", "text": "A sternomastoid tumor usually occurs after breech delivery and can be seen within a few hours after birth", "answer": "F", "rationale": "Sternomastoid 'tumour' is associated with breech/difficult delivery but becomes apparent at 2–3 WEEKS of life, not within hours."}, {"label": "C", "text": "Subcutaneous fat necrosis should be excised to prevent calcification and infection", "answer": "F", "rationale": "Subcutaneous fat necrosis resolves spontaneously over weeks — excision is unnecessary (it can calcify harmlessly)."}, {"label": "D", "text": "Facial nerve injury is usually of upper motor neuron type", "answer": "F", "rationale": "Birth-related facial nerve injury (forceps pressure) is a LOWER motor neuron (peripheral) palsy."}, {"label": "E", "text": "In Erb's palsy there is damage to the 6th and 7th cervical nerves and is managed by physiotherapy", "answer": "F", "rationale": "Erb's palsy involves the C5 and C6 roots (not C6–C7); although physiotherapy IS the mainstay, the root description makes the statement false."}]}, {"id": "A0103", "type": "tf", "stem": "Myasthenia Gravis:", "system": "Neurology", "topic": "Neuromuscular & myopathies", "source": "Ajisco Compiled Peds", "aiAuthored": true, "options": [{"label": "A", "text": "Uncommon in childhood", "answer": "T", "rationale": "Myasthenia gravis is relatively uncommon in childhood compared with adults (juvenile myasthenia)."}, {"label": "B", "text": "Curable in about 25% of affected children", "answer": "F", "rationale": "MG is controllable; durable 'cure' occurs in only a minority — figures like 25% overstate remission even after thymectomy."}, {"label": "C", "text": "Treated with pyridostigmine bromide", "answer": "T", "rationale": "Pyridostigmine bromide (anticholinesterase) is the main symptomatic treatment."}, {"label": "D", "text": "Not associated with other immunological diseases", "answer": "F", "rationale": "MG IS associated with other autoimmune diseases (thyroid disorders, SLE, etc.) and thymoma."}, {"label": "E", "text": "Diagnosed clinically by the demonstration of progressive weakness on repetitive or sustained muscular contraction", "answer": "T", "rationale": "The clinical hallmark is fatigable weakness — increasing weakness with repetitive or sustained muscle contraction (e.g. sustained upgaze)."}]}, {"id": "A0104", "type": "tf", "stem": "In Duchenne muscular dystrophy:", "system": "Neurology", "topic": "Neuromuscular & myopathies", "source": "Ajisco Compiled Peds", "aiAuthored": true, "options": [{"label": "A", "text": "Creatinine phosphokinase at birth of 100 U/L is suggestive", "answer": "F", "rationale": "In DMD the CK is MASSIVELY elevated from birth (thousands of U/L); 100 U/L is normal and does not suggest the disease."}, {"label": "B", "text": "Muscle biopsy shows degeneration of muscle fibers", "answer": "T", "rationale": "Muscle biopsy demonstrates degeneration and regeneration of fibres with fatty/fibrous replacement (and absent dystrophin on staining)."}, {"label": "C", "text": "The inheritance is autosomal recessive", "answer": "F", "rationale": "Inheritance is X-LINKED recessive, not autosomal recessive."}, {"label": "D", "text": "Cardiomyopathy is a cause of death", "answer": "T", "rationale": "Cardiomyopathy (and respiratory failure) is a leading cause of death in DMD."}, {"label": "E", "text": "It is a differential diagnosis of cerebral palsy", "answer": "F", "rationale": "DMD is not a differential of cerebral palsy — it presents in later childhood with progressive weakness, not a static lesion."}]}, {"id": "A0105", "type": "tf", "stem": "Tuberous sclerosis features include:", "system": "Neurology", "topic": "Neurocutaneous syndromes", "source": "Ajisco Compiled Peds", "aiAuthored": true, "options": [{"label": "A", "text": "Seizure disorders", "answer": "T", "rationale": "Seizures (including infantile spasms) are a cardinal feature of tuberous sclerosis."}, {"label": "B", "text": "Intracranial calcification", "answer": "T", "rationale": "Periventricular calcified nodules ('brain stones') are a hallmark of TS."}, {"label": "C", "text": "Capillary hemangioma", "answer": "F", "rationale": "Capillary haemangioma suggests Sturge-Weber; TS skin lesions are facial angiofibromas ('adenoma sebaceum'), ash-leaf spots and shagreen patches."}, {"label": "D", "text": "Hydrocephalus", "answer": "T", "rationale": "Subependymal giant-cell astrocytoma (SEGA) in TS can obstruct the foramen of Monro, causing hydrocephalus."}, {"label": "E", "text": "Hypsarrhythmia on EEG", "answer": "T", "rationale": "Hypsarrhythmia (EEG of infantile spasms) is commonly seen since TS is a leading cause of infantile spasms."}]}, {"id": "A0106", "type": "tf", "stem": "Complications of lumbar puncture:", "system": "Neurology", "topic": "CNS infections & coma (procedures)", "source": "Ajisco Compiled Peds", "aiAuthored": true, "options": [{"label": "A", "text": "Headache", "answer": "T", "rationale": "Post-LP headache (low CSF pressure) is the commonest complication."}, {"label": "B", "text": "Vomiting", "answer": "T", "rationale": "Nausea/vomiting may accompany the low-pressure headache after LP."}, {"label": "C", "text": "Injury to the spinal cord", "answer": "F", "rationale": "LP is done below the conus (L3–L5) precisely to avoid cord injury — cord damage is not an expected complication (nerve-root irritation may cause transient radicular pain)."}, {"label": "D", "text": "Meningitis", "answer": "T", "rationale": "Introduction of infection (meningitis) is a documented, though rare, complication."}, {"label": "E", "text": "Sciatic nerve injury", "answer": "F", "rationale": "Sciatic nerve injury is not a recognized complication of a properly performed lumbar puncture."}]}, {"id": "A0107", "type": "tf", "stem": "The following differential diagnoses could be considered in a 6-year-old boy with generalized seizures:", "system": "Neurology", "topic": "Seizures & epilepsy", "source": "Ajisco Compiled Peds", "aiAuthored": true, "options": [{"label": "A", "text": "Head trauma", "answer": "T", "rationale": "Head trauma is a recognized cause of generalized seizures in children."}, {"label": "B", "text": "Petit mal epilepsy", "answer": "F", "rationale": "Petit mal (absence) is a generalized NON-CONVULSIVE epilepsy — it does not cause convulsive seizures and is not a differential here."}, {"label": "C", "text": "Chronic renal failure", "answer": "T", "rationale": "Chronic renal failure (uraemia/hypertensive encephalopathy) can present with seizures."}, {"label": "D", "text": "Cerebral malaria", "answer": "T", "rationale": "Cerebral malaria is a leading cause of convulsions in our environment."}, {"label": "E", "text": "Sickle cell disease", "answer": "T", "rationale": "Sickle cell disease can cause stroke, which may present with seizures."}]}, {"id": "A0108", "type": "tf", "stem": "Facial palsy may occur in the following conditions:", "system": "Neurology", "topic": "Neuromuscular & myopathies", "source": "Ajisco Compiled Peds", "aiAuthored": true, "options": [{"label": "A", "text": "Following forceps delivery", "answer": "T", "rationale": "Forceps pressure at birth is a classic cause of neonatal facial nerve palsy."}, {"label": "B", "text": "Chronic mastoiditis", "answer": "T", "rationale": "Chronic mastoiditis/middle-ear infection can damage the facial nerve as it traverses the temporal bone."}, {"label": "C", "text": "Cerebellar tumor", "answer": "F", "rationale": "Isolated facial palsy is not a typical feature of cerebellar tumours — CPA-angle (not cerebellar) lesions affect CN VII/VIII, and these are rare in children."}, {"label": "D", "text": "Bacterial meningitis", "answer": "F", "rationale": "Cranial nerve palsies are uncommon in acute bacterial meningitis (they are more characteristic of TB meningitis)."}, {"label": "E", "text": "Poliomyelitis", "answer": "F", "rationale": "Poliomyelitis is not a recognized cause of facial palsy — it targets anterior horn cells of the spinal cord."}]}, {"id": "A0109", "type": "tf", "stem": "Reflexes normally present at birth include:", "system": "Neurology", "topic": "Development & milestones", "source": "Ajisco Compiled Peds", "aiAuthored": true, "options": [{"label": "A", "text": "Parachute", "answer": "F", "rationale": "The parachute (protective extension) reflex appears around 6–9 months, absent at birth."}, {"label": "B", "text": "Stepping", "answer": "T", "rationale": "The stepping (automatic walking) reflex is present at birth."}, {"label": "C", "text": "Tonic neck", "answer": "T", "rationale": "The asymmetric tonic neck ('fencing') reflex is present from birth."}, {"label": "D", "text": "Rooting", "answer": "T", "rationale": "Rooting is present at birth and aids breastfeeding."}, {"label": "E", "text": "Gag", "answer": "T", "rationale": "The gag reflex is intact from birth."}]}, {"id": "A0110", "type": "tf", "stem": "Concerning poliomyelitis:", "system": "Neurology", "topic": "Polio & acute flaccid paralysis", "source": "Ajisco Compiled Peds", "aiAuthored": true, "options": [{"label": "A", "text": "The virus is a DNA virus", "answer": "F", "rationale": "Poliovirus is an RNA (picorna)virus, not DNA."}, {"label": "B", "text": "It is transmitted by the fecal-oral route", "answer": "T", "rationale": "Transmission is chiefly by the faeco-oral route."}, {"label": "C", "text": "The virus travels along axons in the posterior column of the spinal cord", "answer": "F", "rationale": "After viraemia the virus invades ANTERIOR horn cells of the cord/brainstem — it neither ascends the posterior column nor is sensory."}, {"label": "D", "text": "The paralysis is usually asymmetrical", "answer": "T", "rationale": "Polio characteristically causes ASYMETRICAL flaccid paralysis."}, {"label": "E", "text": "Proximal muscle groups are more often affected than distal muscle groups", "answer": "T", "rationale": "Proximal limb muscles (and legs more than arms) are typically more affected."}]}, {"id": "A0111", "type": "tf", "stem": "Myasthenia gravis:", "system": "Neurology", "topic": "Neuromuscular & myopathies", "source": "Ajisco Compiled Peds", "aiAuthored": true, "options": [{"label": "A", "text": "Is an autosomal recessive disease", "answer": "F", "rationale": "MG is autoimmune, not autosomal recessive."}, {"label": "B", "text": "The pathological lesion affects the motor end plate", "answer": "T", "rationale": "The pathology is antibody-mediated destruction/blockade of acetylcholine receptors at the motor end plate (postsynaptic membrane)."}, {"label": "C", "text": "Edrophonium is the drug of choice for treatment", "answer": "F", "rationale": "Edrophonium is only a short-acting diagnostic agent; TREATMENT of choice is pyridostigmine."}, {"label": "D", "text": "Most patients die before the age of 20 years", "answer": "F", "rationale": "With modern therapy most patients live normal lives — early death is no longer expected."}, {"label": "E", "text": "Diagnosis is majorly clinical", "answer": "T", "rationale": "Diagnosis rests chiefly on the clinical picture of fatigable weakness, confirmed by edrophonium/antibody/EMG tests."}]}, {"id": "A0112", "type": "tf", "stem": "Epilepsy:", "system": "Neurology", "topic": "Seizures & epilepsy", "source": "Ajisco Compiled Peds", "aiAuthored": true, "options": [{"label": "A", "text": "Hypsarrhythmia is a typical finding in infantile spasm", "answer": "T", "rationale": "Hypsarrhythmia (chaotic high-voltage EEG) is the classic pattern of infantile spasms."}, {"label": "B", "text": "Ethosuximide is a drug of choice in the treatment of psychomotor epilepsy", "answer": "F", "rationale": "Ethosuximide is the drug of choice for ABSENCE seizures; psychomotor (temporal lobe) epilepsy uses carbamazepine."}, {"label": "C", "text": "Petit mal usually has its onset in the 2nd decade of life", "answer": "F", "rationale": "Petit mal (absence) begins in CHILDHOOD (~4–10 years), not the 2nd decade."}, {"label": "D", "text": "The prognosis for infantile spasm is good", "answer": "F", "rationale": "Infantile spasms carry a POOR prognosis, with most survivors having developmental impairment."}, {"label": "E", "text": "Febrile convulsion can occur at the onset of the fever", "answer": "T", "rationale": "Febrile convulsions frequently occur early — at the onset/rapid rise of the fever."}]}, {"id": "A0113", "type": "tf", "stem": "Drug of choice:", "system": "Neurology", "topic": "Emergency drugs (cross-system)", "source": "Ajisco Compiled Peds", "aiAuthored": true, "options": [{"label": "A", "text": "In status epilepticus is phenobarbitone", "answer": "F", "rationale": "First-line for status epilepticus is a benzodiazepine (diazepam/lorazepam); phenobarbitone is second-line."}, {"label": "B", "text": "In status asthmaticus is subcutaneous adrenaline", "answer": "F", "rationale": "Status asthmaticus is treated with repeated NEBULIZED salbutamol and systemic steroids — subcutaneous adrenaline is no longer routine (it is for anaphylaxis)."}, {"label": "C", "text": "In petit mal epilepsy is phenytoin", "answer": "F", "rationale": "Petit mal responds to ethosuximide/valproate — phenytoin may even worsen absence seizures."}, {"label": "D", "text": "In meningococcal meningitis is penicillin G", "answer": "T", "rationale": "Penicillin G (high-dose) remains a drug of choice for proven meningococcal disease, though ceftriaxone is the usual empiric agent."}, {"label": "E", "text": "In giardiasis is mepacrine", "answer": "T", "rationale": "Mepacrine (quinacrine) is the classical drug of choice for giardiasis in standard texts — metronidazole/tinidazole are the modern first-line equivalents."}]}, {"id": "A0114", "type": "tf", "stem": "The following disorders result in hypotonia:", "system": "Neurology", "topic": "Neuro examination & localization", "source": "Ajisco Compiled Peds", "aiAuthored": true, "options": [{"label": "A", "text": "Cerebral palsy secondary to birth asphyxia", "answer": "F", "rationale": "CP from severe asphyxia is typically the SPASTIC form (hypertonia), not hypotonia."}, {"label": "B", "text": "Poliomyelitis", "answer": "T", "rationale": "Polio (LMN destruction) gives flaccid, hypotonic paralysis."}, {"label": "C", "text": "Duchenne muscular dystrophy", "answer": "T", "rationale": "Muscle diseases like DMD present with hypotonia and proximal weakness."}, {"label": "D", "text": "Wernig Hoffman's disease", "answer": "T", "rationale": "Werdnig-Hoffmann (SMA type 1) is the classic 'floppy baby' with profound hypotonia."}, {"label": "E", "text": "Erb's palsy", "answer": "T", "rationale": "Erb's palsy is an LMN (brachial plexus) lesion — flaccid, hypotonic arm."}]}, {"id": "A0115", "type": "tf", "stem": "A 3-day-old boy presents with a 3-day history of fever, repeated seizures, and coma in the previous hour. Cerebrospinal fluid examination was remarkable only for a sugar level of 10 mg/dL (blood sugar 25 mg/dL):", "system": "Neurology", "topic": "CNS infections & coma", "source": "Ajisco Compiled Peds", "aiAuthored": true, "options": [{"label": "A", "text": "Cerebral malaria", "answer": "F", "rationale": "At 3 days of age cerebral malaria is highly unlikely (congenital malaria is rare) and the very low CSF glucose argues against it."}, {"label": "B", "text": "Pyogenic meningitis", "answer": "T", "rationale": "CSF glucose of 10 mg/dL against blood glucose of 25 (ratio 0.4) is LOW — the hallmark of bacterial (pyogenic) meningitis, fitting fever + seizures + coma."}, {"label": "C", "text": "TB meningitis", "answer": "F", "rationale": "TB meningitis does not present in the first days of life."}, {"label": "D", "text": "Febrile convulsion", "answer": "F", "rationale": "A comatose neonate with abnormal CSF cannot be labelled a benign febrile convulsion."}, {"label": "E", "text": "Typhoid psychosis", "answer": "F", "rationale": "Typhoid psychosis is a diagnosis of older children/adults, not neonates."}]}, {"id": "A0116", "type": "tf", "stem": "The following seizure types are well matched with drugs of first choice for management:", "system": "Neurology", "topic": "Seizures & epilepsy", "source": "Ajisco Compiled Peds", "aiAuthored": true, "options": [{"label": "A", "text": "Absence seizure: clonazepam", "answer": "F", "rationale": "First choice for absence seizures is ethosuximide (or valproate), not clonazepam."}, {"label": "B", "text": "Complex partial seizure: clonazepam", "answer": "F", "rationale": "Complex partial (focal) seizures are treated with carbamazepine, not clonazepam."}, {"label": "C", "text": "Generalized tonic-clonic seizure: phenobarbitone", "answer": "T", "rationale": "Phenobarbitone is an accepted first-line agent for generalized tonic-clonic seizures in resource-limited settings (valproate/carbamazepine elsewhere)."}, {"label": "D", "text": "Infantile spasm: adrenocorticotropic hormone (ACTH)", "answer": "T", "rationale": "Infantile spasms are treated with ACTH (or vigabatrin, especially in tuberous sclerosis)."}, {"label": "E", "text": "Febrile seizures", "answer": "F", "rationale": "Incomplete pairing as written; acute febrile seizures need only antipyresis/reassurance ± diazepam rescue — continuous prophylaxis is not recommended."}]}, {"id": "A0117", "type": "tf", "stem": "With respect to cerebral palsy:", "system": "Neurology", "topic": "Cerebral palsy", "source": "Ajisco Compiled Peds", "aiAuthored": true, "options": [{"label": "A", "text": "Common causes in this environment include postnatal viral encephalitis", "answer": "F", "rationale": "The leading causes here are perinatal asphyxia and kernicterus — postnatal viral encephalitis is not among the commonest."}, {"label": "B", "text": "Mental retardation occurs in all forms of the disease", "answer": "F", "rationale": "Cognitive impairment occurs in only about half; many children with CP (e.g. mild spastic diplegia) have normal intellect."}, {"label": "C", "text": "Diagnosis is not possible until the age of 1 year", "answer": "F", "rationale": "CP can be suspected and diagnosed in early infancy from abnormal tone, posture and delayed milestones — no need to wait one year."}, {"label": "D", "text": "Diagnosis is not definite in the absence of skull X-ray", "answer": "F", "rationale": "CP is a CLINICAL diagnosis; skull X-ray is irrelevant (neuroimaging is used to find aetiology, not to make the diagnosis definite)."}, {"label": "E", "text": "The mainstay of management is physiotherapy", "answer": "T", "rationale": "Physiotherapy (with occupational/speech therapy within a multidisciplinary team) is the mainstay of management."}]}, {"id": "A0118", "type": "tf", "stem": "In Duchenne muscular dystrophy:", "system": "Neurology", "topic": "Neuromuscular & myopathies", "source": "Ajisco Compiled Peds", "aiAuthored": true, "options": [{"label": "A", "text": "Creatinine phosphokinase at birth of 1000 U/L is suggestive", "answer": "T", "rationale": "CK (CPK) is already markedly elevated at birth in DMD — ~1000 U/L or higher is suggestive."}, {"label": "B", "text": "Muscle biopsy shows degeneration of muscle fibers", "answer": "T", "rationale": "Muscle biopsy shows degenerating fibres with fat/fibrous replacement (and absent dystrophin)."}, {"label": "C", "text": "The inheritance is autosomal recessive", "answer": "F", "rationale": "DMD is X-LINKED recessive."}, {"label": "D", "text": "Cardiomyopathy is a cause of death", "answer": "T", "rationale": "Cardiomyopathy is a major cause of mortality in DMD."}, {"label": "E", "text": "It is a differential diagnosis of cerebral palsy", "answer": "F", "rationale": "DMD is not a differential diagnosis of cerebral palsy."}]}, {"id": "A0121", "type": "tf", "stem": "A known sickle cell anemia patient is admitted with severe drowsiness, rectal temperature of 39.5°C, PCV of 18%, deep jaundice, and generalized hypotonia and absent deep tendon reflexes on the left side. This child:", "system": "Neurology", "topic": "Neuro-emergency (SCD complications)", "source": "Ajisco Compiled Peds", "aiAuthored": true, "options": [{"label": "A", "text": "May have had a cerebrovascular accident", "answer": "T", "rationale": "Unilateral hypotonia/areflexia in an SCD child with fever raises the possibility of a cerebrovascular accident (stroke)."}, {"label": "B", "text": "May have cerebral malaria", "answer": "T", "rationale": "High fever with altered consciousness in an endemic setting makes cerebral malaria a strong differential."}, {"label": "C", "text": "Needs urgent packed cell transfusion", "answer": "T", "rationale": "PCV of 18% with neurological signs mandates urgent transfusion (exchange transfusion if stroke is confirmed)."}, {"label": "D", "text": "Needs daily penicillin and streptomycin injections", "answer": "F", "rationale": "Daily penicillin/streptomycin injections are outdated; routine pneumococcal prophylaxis is oral penicillin and severe malaria/sepsis management follows standard protocols."}, {"label": "E", "text": "Is likely to have bone marrow erythroid hyperplasia", "answer": "T", "rationale": "Ongoing haemolysis with rapid red-cell production implies the marrow will show erythroid hyperplasia."}]}, {"id": "A0122", "type": "tf", "stem": "The following are possible features of meningitis except:", "system": "Neurology", "topic": "CNS infections & coma", "source": "Ajisco Compiled Peds", "aiAuthored": true, "options": [{"label": "A", "text": "Headache", "answer": "F", "rationale": "Headache is a classic meningeal symptom — so it is not the exception."}, {"label": "B", "text": "Irritability", "answer": "F", "rationale": "Irritability is typical, especially in infants."}, {"label": "C", "text": "Diarrhea", "answer": "T", "rationale": "Diarrhoea is NOT a feature of meningitis — it is the exception sought."}, {"label": "D", "text": "Convulsion", "answer": "F", "rationale": "Convulsions frequently complicate childhood meningitis."}, {"label": "E", "text": "Posturing", "answer": "F", "rationale": "Abnormal posturing (decorticate/decerebrate) occurs with severe intracranial pressure changes in meningitis."}]}, {"id": "A0123", "type": "tf", "stem": "A 5-year-old boy falls down in the bank and starts convulsing:", "system": "Neurology", "topic": "Emergency first aid (seizure)", "source": "Ajisco Compiled Peds", "aiAuthored": true, "options": [{"label": "A", "text": "Hold the child and restrain to stop convulsion", "answer": "F", "rationale": "Never restrain a convulsing child — it can cause injury and does not shorten the seizure."}, {"label": "B", "text": "Look for a table and place him on it", "answer": "F", "rationale": "Leave the child on the ground/bed; lifting onto a table risks falls and injury."}, {"label": "C", "text": "Turn the child to his side", "answer": "T", "rationale": "Place the child in the lateral (recovery) position to protect the airway and prevent aspiration."}, {"label": "D", "text": "Do mouth-to-mouth resuscitation", "answer": "F", "rationale": "Mouth-to-mouth during a convulsion is futile and hazardous; breathing resumes after the seizure."}, {"label": "E", "text": "Ask someone to fan the child", "answer": "F", "rationale": "Fanning serves no therapeutic purpose during a convulsion."}]}, {"id": "A0124", "type": "tf", "stem": "A 5-day-old male neonate presented with reduced activities, windmill movement, and repeated sideways gaze. The following are true about the presentation:", "system": "Neurology", "topic": "Neonatal seizures & metabolic", "source": "Ajisco Compiled Peds", "aiAuthored": true, "options": [{"label": "A", "text": "Fever is a clinical presentation", "answer": "F", "rationale": "Sick neonates more commonly present with HYPOTHERMIA than fever; fever is not the characteristic presentation here."}, {"label": "B", "text": "Jaundice is restricted to face", "answer": "F", "rationale": "Pathological jaundice progresses cephalocaudally beyond the face; 'restricted to face' is the mild (physiological) pattern and does not fit this sick neonate."}, {"label": "C", "text": "RBG is a necessary investigation", "answer": "T", "rationale": "Checking random blood glucose is essential — hypoglycaemia is a common, reversible cause of neonatal seizures."}, {"label": "D", "text": "All the three signs are danger signs", "answer": "T", "rationale": "Reduced activity, abnormal repetitive movements (seizure equivalents) and persistent sideways gaze are all recognized danger signs in the young infant."}, {"label": "E", "text": "Likely diagnosis is severe perinatal asphyxia", "answer": "F", "rationale": "Cannot conclude perinatal asphyxia on this history alone — neonatal sepsis/meningitis and hypoglycaemia must first be excluded."}]}, {"id": "A0125", "type": "tf", "stem": "A 7-year-old boy presented with a 10-day history of lower limb weakness, 7-day history of upper limb weakness, difficulty breathing, and unable to swallow. The following are in keeping with this disease:", "system": "Neurology", "topic": "Neuropathies & GBS", "source": "Ajisco Compiled Peds", "aiAuthored": true, "options": [{"label": "A", "text": "He requires admission to the ICU", "answer": "T", "rationale": "Ascending (GBS-type) paralysis with respiratory difficulty and bulbar involvement is an emergency — ICU admission for monitoring/ventilation is required."}, {"label": "B", "text": "He needs urgent lumbar puncture", "answer": "T", "rationale": "Urgent LP supports the diagnosis (albuminocytological dissociation) and excludes infection."}, {"label": "C", "text": "Stool sample is needed for diagnosis", "answer": "F", "rationale": "Stool viral studies are for the polio differential; they are not needed to diagnose GBS."}, {"label": "D", "text": "He has an excellent prognosis", "answer": "F", "rationale": "With respiratory and bulbar involvement the prognosis is guarded, not 'excellent'."}]}, {"id": "A0126", "type": "tf", "stem": "The following are in keeping with globular cardiac silhouette:", "system": "Cardiology", "topic": "Pericardial disease & endomyocardial fibrosis", "source": "Ajisco Compiled Peds", "aiAuthored": true, "options": [{"label": "A", "text": "Chronic kidney disease", "answer": "T", "rationale": "A globular or flask-shaped cardiac silhouette is the classic radiographic picture of a large pericardial effusion (or, less often, a dilated cardiomyopathy). Chronic kidney disease causes uraemic pericarditis with effusion, so it is a recognized cause of this shadow. A clue is the combination of an enlarged heart with relatively normal (oligaemic) lung fields."}, {"label": "B", "text": "Pulmonary stenosis", "answer": "F", "rationale": "Pulmonary stenosis produces right ventricular hypertrophy with post-stenotic dilatation of the main pulmonary artery, and cardiac size is usually normal. It does not produce pericardial fluid, so a globular silhouette is not expected."}, {"label": "C", "text": "Atrioventricular septal defect", "answer": "F", "rationale": "An atrioventricular septal defect is a large left-to-right shunt: it enlarges all four chambers with pulmonary plethora, giving generalized cardiomegaly rather than a symmetric water-bottle heart. The globular shape specifically reflects fluid in the pericardial sac, not chamber dilatation."}, {"label": "D", "text": "Marasmus", "answer": "F", "rationale": "Marasmus does not cause pericardial effusion; the wasted child's heart is, if anything, relatively small. Oedema/anasarca in malnutrition is a feature of kwashiorkor (hypoalbuminaemia), not of marasmus, and it is not a cause of the globular cardiac shadow being tested."}, {"label": "E", "text": "TB pericarditis", "answer": "T", "rationale": "Tuberculous pericarditis is one of the commonest causes of a large pericardial effusion in Nigerian children, producing the classic globular (water-bottle) heart on chest X-ray. Echocardiography confirms the echo-free fluid space around the heart. If untreated it may progress to tamponade or constrictive pericarditis."}]}, {"id": "A0127", "type": "tf", "stem": "The following are clinical features of an adolescent with chronic rheumatic heart disease:", "system": "Cardiology", "topic": "Rheumatic fever & rheumatic heart disease", "source": "Ajisco Compiled Peds", "aiAuthored": true, "options": [{"label": "A", "text": "Elevated Jugular Venous Pressure", "answer": "T", "rationale": "Chronic rheumatic valvular disease with decompensation produces right-sided heart failure, of which a raised jugular venous pressure is a cardinal sign. In adolescents the JVP is far easier to assess than in infants, whose short necks make it unreliable."}, {"label": "B", "text": "Tender Hepatomegaly", "answer": "T", "rationale": "Systemic venous congestion from right heart failure engorges the liver and stretches its capsule, producing TENDER hepatomegaly. This is one of the most dependable signs of congestive cardiac failure at any paediatric age and often tracks the course of the failure."}, {"label": "C", "text": "Tachycardia", "answer": "T", "rationale": "A persistently elevated heart rate is the earliest compensatory response to falling cardiac output and is present in virtually all children with decompensated rheumatic heart disease. Tachycardia out of proportion to fever, especially with a gallop rhythm, should always raise suspicion."}, {"label": "D", "text": "Tachypnoea", "answer": "T", "rationale": "Pulmonary venous congestion from left-sided (mitral) disease raises the respiratory rate; orthopnoea and basal crepitations accompany it. The combination of tachycardia plus tachypnoea is a sensitive pointer to cardiac failure."}, {"label": "E", "text": "Hyperactive praecordium", "answer": "T", "rationale": "Volume-overloaded ventricles — the mitral and/or aortic regurgitation typical of chronic RHD — produce a hyperdynamic (hyperactive) praecordium with a displaced, thrusting apex. Stenotic lesions by contrast give thrills rather than a hyperactive impulse."}]}, {"id": "A0128", "type": "tf", "stem": "A 2-year-old is being followed up in the paediatric cardiology clinic for a large ventricular septal defect. He is on oral furosemide, spironolactone, and captopril. He is stable. The following are likely findings in the serum electrolyte and urea sampling:", "system": "Cardiology", "topic": "Heart failure in children", "source": "Ajisco Compiled Peds", "aiAuthored": true, "options": [{"label": "A", "text": "Bicarbonate 12mmol/L", "answer": "F", "rationale": "Furosemide causes a hypokalaemic, hypochloraemic metabolic ALKALOSIS, so bicarbonate is expected to be normal or HIGH, not 12 mmol/L. A bicarbonate this low implies significant metabolic acidosis, which does not fit a stable child on this regimen."}, {"label": "B", "text": "Sodium 120mmol/L", "answer": "T", "rationale": "Hyponatraemia is common in children with large shunts on this combination: furosemide directly wastes sodium and the failing circulation retains water (dilutional hyponatraemia via ADH). Captopril adds to sodium loss by removing aldosterone-mediated sodium retention, so a sodium of 120 mmol/L is quite plausible."}, {"label": "C", "text": "Potassium 6.5mmol/L", "answer": "F", "rationale": "Although spironolactone and captopril both retain potassium, a value of 6.5 mmol/L in a child described as stable is unlikely — the concurrent furosemide drives kaliuresis and the regimen is deliberately balanced to keep potassium near normal. Potassium of 6.5 is a medical emergency (peaked T waves, arrhythmias) incompatible with clinical stability."}, {"label": "D", "text": "Urea 18mg/dl", "answer": "T", "rationale": "A mild prerenal rise in urea is expected with effective diuresis and ACE-inhibitor use; 18 mg/dL sits at the upper edge of normal and is entirely consistent. A markedly raised urea with high creatinine would instead suggest over-diuresis or intrinsic renal impairment."}, {"label": "E", "text": "Chlorine 128mmol/L", "answer": "F", "rationale": "Loop diuretics waste chloride, producing hypochloraemic alkalosis, so a CHLORIDE of 128 mmol/L is the reverse of the expected finding. The typical electrolyte signature of this regimen is low-normal sodium, low chloride signaling, raised bicarbonate and near-normal potassium."}]}, {"id": "A0129", "type": "tf", "stem": "The following are correctly paired:", "system": "Cardiology", "topic": "Congenital heart disease — overview & associations", "source": "Ajisco Compiled Peds", "aiAuthored": true, "options": [{"label": "A", "text": "Bicuspid aortic valve: coarctation of the aorta", "answer": "T", "rationale": "A bicuspid aortic valve is found in a large proportion (up to half) of patients with coarctation of the aorta, and both lesions are associated with Turner syndrome. This is one of the highest-yield structural associations in congenital cardiology and explains why the aortic valve must always be assessed in coarctation."}, {"label": "B", "text": "Egg on side appearance: tetralogy of Fallot", "answer": "F", "rationale": "Egg-on-side (egg on a string) appearance belongs to TRANSPOSITION of the great arteries — an ovoid heart with a narrow superior mediastinum because the aorta and pulmonary trunk overlie each other. Fallot's tetralogy gives a boot-shaped heart (coeur en sabot) with an upturned apex and a concave pulmonary bay."}, {"label": "C", "text": "Oligemic: transposition of the great arteries", "answer": "F", "rationale": "Transposition with adequate mixing typically shows INCREASED pulmonary vascular markings; oligaemic lung fields indicate reduced pulmonary blood flow as in Fallot's tetralogy, pulmonary atresia or critical pulmonary stenosis. Pairing oligaemia with TGA is therefore incorrect."}, {"label": "D", "text": "Soft S2: pulmonary atresia", "answer": "T", "rationale": "In pulmonary atresia there is little or no forward flow across the pulmonary valve, so P2 is soft or inaudible and the second heart sound is effectively single (A2 alone). A single soft S2 in a cyanosed neonate strongly points to severely reduced pulmonary blood flow."}, {"label": "E", "text": "AV septal defect: extra chromosome 21", "answer": "T", "rationale": "Atrioventricular septal (endocardial cushion) defect is the signature cardiac lesion of Down syndrome (trisomy 21), occurring in roughly 40% of affected children. Conversely, a large share of all AVSDs occur in children with trisomy 21."}]}, {"id": "A0130", "type": "tf", "stem": "A 2-year-old child was brought into the emergency after suffering a convulsion. On examination, she is centrally cyanosed with digital clubbing and cold extremities:", "system": "Cardiology", "topic": "Fallot's tetralogy & other cyanotic CHD", "source": "Ajisco Compiled Peds", "aiAuthored": true, "options": [{"label": "A", "text": "She just had a hypercyanotic spell", "answer": "T", "rationale": "The combination of central cyanosis, digital clubbing (chronic cyanotic congenital heart disease) and a convulsion in a 2-year-old is the classic hypercyanotic (tet) spell of Fallot's tetralogy. Spells result from a sudden increase in right-to-left shunting (infundibular spasm with low systemic resistance); severe spells cause seizures, stroke or death from cerebral hypoxia."}, {"label": "B", "text": "She should be nursed in a cardiac position", "answer": "T", "rationale": "First-aid management is to nurse the child in the knee-chest (cardiac) position: flexing the thighs raises systemic vascular resistance and venous return, immediately reducing the right-to-left shunt and increasing pulmonary blood flow. Oxygen, morphine, IV fluids and correction of acidosis follow."}, {"label": "C", "text": "The most likely diagnosis is transposition of great arteries", "answer": "F", "rationale": "Transposition of the great arteries presents with intense cyanosis in the first days of life as the ductus closes; an untreated 2-year-old with clubbing, squatting/spell-type events and stable growth is far more typical of Fallot's tetralogy, the commonest cyanotic lesion of childhood. TGA does not produce discrete hypercyanotic spells."}, {"label": "D", "text": "A PCV of 28% is consistent", "answer": "F", "rationale": "Chronic cyanosis drives erythropoietin-mediated POLYCYTHAEMIA, so the expected PCV is markedly raised (often 55-75%), not 28%. A PCV of 28% is a dangerous relative anaemia that reduces oxygen-carrying capacity and can itself precipitate or worsen spells."}]}, {"id": "A0131", "type": "tf", "stem": "Regarding cardiac diseases:", "system": "Cardiology", "topic": "Chest X-ray & ECG in cardiology", "source": "Ajisco Compiled Peds", "aiAuthored": true, "options": [{"label": "A", "text": "A prominent right border signifies right ventricular hypertrophy", "answer": "F", "rationale": "On a PA film the right heart border is formed by the superior vena cava and the RIGHT ATRIUM, so prominence of the right border indicates right ATRIAL enlargement. Right ventricular hypertrophy instead lifts and rounds the apex and fills the retrosternal space (best appreciated on a lateral view); it does not make the right border prominent."}, {"label": "B", "text": "A dilated pulmonary artery is consistent with pulmonary atresia", "answer": "F", "rationale": "Pulmonary atresia gives a small or absent main pulmonary artery segment with oligaemic lung fields — the pulmonary bay is concave, not dilated. A dilated pulmonary artery reflects post-stenotic dilatation (valvar pulmonary stenosis) or increased flow/pressure from a left-to-right shunt."}, {"label": "C", "text": "In TOF, the cardiothoracic ratio is increased", "answer": "F", "rationale": "In uncomplicated TOF heart size is usually NORMAL — the cardiothoracic ratio is around 50%. The diagnostic feature is the SHAPE of the heart (boot-shaped, upturned apex, concave pulmonary bay) rather than enlargement; cardiomegaly in a supposed TOF should prompt a search for an associated lesion such as absent pulmonary valve."}]}, {"id": "A0132", "type": "tf", "stem": "A 5-year-old being examined at the clinic prior to admission into primary school. On cardiovascular examinations, the following are normal examinations:", "system": "Cardiology", "topic": "Cardiac examination, pulses & murmurs", "source": "Ajisco Compiled Peds", "aiAuthored": true, "options": [{"label": "A", "text": "HR of 110bpm", "answer": "T", "rationale": "The normal resting heart rate for a 5-year-old is roughly 80-120 beats/min, and anxiety during examination readily pushes it to the upper part of that range, so 110/min is acceptable. Sustained rates well above 130/min in a calm, afebrile child would warrant evaluation."}, {"label": "B", "text": "BP of 100/70mmHg", "answer": "T", "rationale": "A quick rule of thumb for median systolic pressure is 70 + (2 x age in years), i.e. about 80 mmHg at 5 years, with the normal range extending above 100/70. A single reading of 100/70 mmHg is within normal limits; diagnosing hypertension requires persistently elevated readings on repeat measurement with the correct cuff size."}, {"label": "C", "text": "Precordial thrills", "answer": "F", "rationale": "A praecordial thrill is never a normal finding: it is the palpable sign of a loud (at least grade 4) murmur generated by significant turbulent flow, as in ventricular septal defect, aortic or pulmonary stenosis. Its discovery mandates full cardiac evaluation."}, {"label": "D", "text": "Third heart sound", "answer": "T", "rationale": "A third heart sound is a common NORMAL finding in healthy children and young adults, reflecting rapid early filling of a compliant ventricle. It needs to be distinguished from a pathological gallop, which travels with tachycardia and other signs of failure rather than occurring in a well child."}, {"label": "E", "text": "Pericardial friction rub", "answer": "F", "rationale": "A pericardial friction rub is always pathological, indicating pericarditis (viral, tuberculous, uraemic or rheumatic). It is a scratchy, to-and-fro, squeaky sound that varies with posture and respiration and is never part of a normal school-entry examination."}]}, {"id": "A0133", "type": "tf", "stem": "An 11-year-old boy with body swelling of 3 years, cough, breathlessness, orthopnea, and oliguria of 1 month duration. BP is 170/120mmHg, Cr is 8.5. The following are in keeping:", "system": "Cardiology", "topic": "Heart failure in children", "source": "Ajisco Compiled Peds", "aiAuthored": true, "options": [{"label": "A", "text": "Apex beat at 6LIC outside mid clavicular line", "answer": "T", "rationale": "Chronic severe hypertension with fluid overload produces left ventricular dilatation/hypertrophy, which displaces the apex beat downward and laterally — to the 6th left intercostal space outside the mid-clavicular line. A displaced apex is a key bedside sign of cardiomegaly in this setting."}, {"label": "B", "text": "Diagnosis of AGN", "answer": "F", "rationale": "Acute glomerulonephritis is an ACUTE illness (oedema, hypertension and smoky urine evolving over days to a few weeks) with usually reversible renal impairment. A 3-year history of body swelling with a creatinine of 8.5 mg/dL indicates CHRONIC kidney disease (such as chronic glomerulonephritis), not an acute nephritic episode."}, {"label": "C", "text": "PCV 16%", "answer": "T", "rationale": "Severe normocytic anaemia is expected in advanced chronic kidney disease from reduced erythropoietin production, uraemic marrow suppression, shortened red-cell survival and dilution. A PCV around 16% is entirely consistent and itself worsens the cardiac failure by further reducing oxygen delivery."}, {"label": "D", "text": "Dialysis is contraindicated", "answer": "F", "rationale": "This child has several absolute indications for dialysis: refractory fluid overload with pulmonary congestion, severe symptomatic hypertension, and established uraemia (Cr 8.5 mg/dL). Far from being contraindicated, urgent dialysis is life-saving here."}, {"label": "E", "text": "IV normal saline at 20ml/kg over 30 minutes", "answer": "F", "rationale": "A rapid normal-saline bolus in an oligo-anuric, severely hypertensive, overloaded child would precipitate acute pulmonary oedema and hypertensive crisis. A 20 ml/kg bolus is the treatment of HYPOVOLAEMIC shock — this child has the opposite physiology (fluid overload), so management is fluid restriction, diuresis where possible, and dialysis."}]}, {"id": "A0134", "type": "tf", "stem": "Signs of CCF in an infant of six months:", "system": "Cardiology", "topic": "Heart failure in children", "source": "Ajisco Compiled Peds", "aiAuthored": true, "options": [{"label": "A", "text": "Tachycardia", "answer": "T", "rationale": "Tachycardia is the earliest and most consistent sign of heart failure in infants: the immature ventricle cannot increase stroke volume efficiently, so cardiac output is maintained almost entirely through rate."}, {"label": "B", "text": "Pedal edema", "answer": "F", "rationale": "Dependent (pedal) oedema is uncommon and late in INFANT heart failure; when oedema appears in infants it is more often periorbital/facial. The dependable infantile signs are tachycardia, tachypnoea, hepatomegaly, gallop rhythm, sweating and feeding difficulty with poor weight gain."}, {"label": "C", "text": "Raised JVP", "answer": "F", "rationale": "The JVP is notoriously difficult to assess in infants because of the short, fat neck and inability to position them, so it is an unreliable sign below about 2 years. Hepatomegaly is the practical marker of systemic venous congestion in this age group."}, {"label": "D", "text": "Hepatomegaly", "answer": "T", "rationale": "A soft, tender, enlarged liver is the most reliable sign of right-sided congestion in infant heart failure — the hepatic edge often descends and recedes in parallel with the clinical course of the failure."}, {"label": "E", "text": "Crepitation in lung bases", "answer": "T", "rationale": "Left-sided failure with pulmonary venous congestion produces tachypnoea, chest recession and crepitations at the lung bases. In infants these signs may be masked by, or misattributed to, coexisting bronchiolitis or pneumonia, which are themselves common precipitants of the failure."}]}, {"id": "A0135", "type": "tf", "stem": "A 6-year-old boy presenting for the first time with a history of tiredness on exertion and blueness of the lips and digits of 3 years is very likely to be suffering from:", "system": "Cardiology", "topic": "Fallot's tetralogy & other cyanotic CHD", "source": "Ajisco Compiled Peds", "aiAuthored": true, "options": [{"label": "A", "text": "Transposition of the great arteries", "answer": "F", "rationale": "Transposition of the great arteries is a NEONATAL emergency: without an adequate mixing lesion or surgical correction, survival to 6 years is exceptional. Its natural history is intense cyanosis from the first hours-days of life, not a first presentation at school age."}, {"label": "B", "text": "Tricuspid atresia", "answer": "F", "rationale": "Tricuspid atresia presents with cyanosis in the neonatal period or early infancy because pulmonary blood flow depends entirely on associated lesions. Presenting for the first time at 6 years with only 3 years of symptoms makes it a poor fit."}, {"label": "C", "text": "Pulmonary stenosis", "answer": "F", "rationale": "Valvar pulmonary stenosis is characteristically ACYANOTIC; cyanosis occurs only in critical neonatal stenosis or when severe stenosis coexists with an atrial-level right-to-left shunt. A simple explanation of cyanosis with reduced effort tolerance beginning in early childhood is not isolated PS."}, {"label": "D", "text": "Fallot’s tetralogy", "answer": "T", "rationale": "Fallot's tetralogy is the commonest cyanotic congenital heart disease beyond infancy: cyanosis classically appears in late infancy/early childhood with exertional dyspnoea, squatting and progressive clubbing. A first presentation at age 6 with a 3-year history of blueness fits unrepaired TOF best."}, {"label": "E", "text": "Eisenmenger’s syndrome", "answer": "F", "rationale": "Eisenmenger syndrome requires years of a large unrestricted left-to-right shunt before pulmonary vascular disease reverses the shunt; such a child would typically have had an earlier acyanotic phase with (often) infant heart failure. Nothing in the stem suggests a preceding large shunt, making straightforward TOF far more likely."}]}, {"id": "A0136", "type": "tf", "stem": "A 6-year-old girl presented in the Children Out-patient Clinic for pre-school medical evaluation. On examination, she was pink in room air, weighed 17kg and had no dysmorphic features. The first and second heart sounds were heard, with wide fixed splitting of the second heart sound and a soft systolic murmur loudest at the left upper sternal border:", "system": "Cardiology", "topic": "Acyanotic CHD (left-to-right shunts)", "source": "Ajisco Compiled Peds", "aiAuthored": true, "options": [{"label": "A", "text": "History of recurrent chest infections is likely", "answer": "T", "rationale": "The increased pulmonary blood flow of an atrial septal defect predisposes to recurrent respiratory infections in childhood, so such a history is likely. Many children with moderate ASDs nonetheless remain strikingly asymptomatic and are picked up at pre-school checks exactly like this one."}, {"label": "B", "text": "Digital clubbing is a likely finding", "answer": "F", "rationale": "An uncomplicated ASD is acyanotic, and clubbing requires chronic arterial desaturation; it would appear only after decades with late shunt reversal (Eisenmenger physiology). Finding clubbing here should make you reconsider the diagnosis entirely."}, {"label": "C", "text": "Splinter haemorrhages are likely findings", "answer": "F", "rationale": "Splinter haemorrhages are a peripheral stigmata of infective endocarditis. ASD is among the LOWEST-risk lesions for endocarditis — routine antibiotic prophylaxis is not even recommended for an isolated secundum ASD — so these findings are not expected."}, {"label": "D", "text": "ECG will show features of right atrial enlargement", "answer": "T", "rationale": "Atrial-level shunting volume-overloads the RIGHT side, so the ECG of a significant secundum ASD shows right atrial enlargement, right axis deviation and incomplete right bundle branch block (rSR' in V1). These right-sided changes are the characteristic pattern."}, {"label": "E", "text": "Echocardiography will show pulmonary stenosis", "answer": "F", "rationale": "Echocardiography will demonstrate the atrial septal defect itself, with right atrial and right ventricular dilatation from the volume overload. The systolic murmur comes from increased flow across a NORMAL pulmonary valve (relative stenosis), not from anatomical pulmonary stenosis."}]}, {"id": "A0137", "type": "tf", "stem": "An 18-month-old female presented to the children's emergency room with a 2-day history of fever, passage of loose stool, and vomiting. Examination revealed sunken eyes, small volume pulses, tenting skin, capillary refill time of 5 seconds, unconscious, Heart rate = 166bpm, Resp rate = 52cpm, weight = 8kg. The following statements are correct:", "system": "Cardiology", "topic": "Shock & fluid resuscitation", "source": "Ajisco Compiled Peds", "aiAuthored": true, "options": [{"label": "A", "text": "The child will require a 32ml bolus of 10% Dextrose water", "answer": "F", "rationale": "Dextrose boluses are reserved for documented or strongly suspected hypoglycaemia, given as about 5 ml/kg of 10% dextrose (about 40 ml here); 32 ml is not a standard dose and a sugar bolus is not the resuscitation this shocked child needs. The priority is rapid isotonic crystalloid — 20 ml/kg boluses of normal saline or Ringer's lactate — with a bedside glucose checked alongside."}, {"label": "B", "text": "The deficit will be corrected with 600mls of IV fluids over 4 – 6 hours", "answer": "F", "rationale": "This child has severe (about 10%) dehydration with shock; WHO Plan C after initial boluses delivers roughly 100 ml/kg — about 800 ml for an 8-kg child — of Ringer's lactate/normal saline intravenously over 3-6 hours. 600 ml under-doses the deficit and misstates the schedule."}, {"label": "C", "text": "Microscopy, culture, and sensitivity of stool are required", "answer": "T", "rationale": "In a child this ill — admitted, febrile, in shock — stool microscopy, culture and sensitivity are justified to identify invasive bacterial causes (e.g. Shigella) or cholera, which change antibiotic and public-health management. Uncomplicated watery diarrhoea managed at home does not require it."}, {"label": "D", "text": "Oral zinc administration can shorten the duration of the illness", "answer": "T", "rationale": "WHO recommends zinc supplementation (10-20 mg daily for 10-14 days) as adjunct therapy for acute childhood diarrhoea: it shortens the episode, reduces severity, and lowers the risk of subsequent episodes in the following months."}, {"label": "E", "text": "The most sensitive parameters for monitoring the level of dehydration in this age group are skin turgor and buccal mucosa", "answer": "F", "rationale": "Skin turgor is confounded by age and nutritional status — unreliable in malnutrition (loose skin) and obesity (preserved turgor) — so it is not the most sensitive monitoring tool. Serial BODY WEIGHT and urine output are the most sensitive, objective indices of rehydration progress in this age group."}]}, {"id": "A0138", "type": "tf", "stem": "A 2-year-old child presented in the emergency room in hypovolemic shock. You are unable to gain intravenous access after multiple attempts. Which of the following are the most appropriate steps to take?", "system": "Cardiology", "topic": "Shock & fluid resuscitation", "source": "Ajisco Compiled Peds", "aiAuthored": true, "options": [{"label": "A", "text": "Consult to paediatric surgery unit to do a cut down", "answer": "F", "rationale": "Venous cutdown is slow, requires surgical expertise, and sacrifices the vein; it is a distant fallback when everything else has failed. Paediatric life-support guidelines place intraosseous access far earlier in the algorithm."}, {"label": "B", "text": "Consult to ICU to obtain central venous access", "answer": "F", "rationale": "Central venous cannulation is time-consuming and hazard-prone in a crashing 2-year-old, and should not delay circulatory access; intraosseous access is achieved in under a minute and accepts all resuscitation fluids, blood products and drugs. Escalation to central access is for later, after stabilisation."}, {"label": "C", "text": "Attempt intraosseous access", "answer": "T", "rationale": "When peripheral venous access fails in shock, intraosseous puncture (proximal tibia, or distal femur/humerus) is the recommended next step — fast, reliable, with flow rates adequate for full resuscitation. Guidelines advise moving to IO within about 90 seconds of failed IV attempts."}, {"label": "D", "text": "Cannulate an umbilical vessel", "answer": "F", "rationale": "Umbilical venous cannulation is a NEONATAL technique, feasible only in the first days of life before the vessels involute. It is not an option in a 2-year-old."}, {"label": "E", "text": "Access the femoral artery", "answer": "F", "rationale": "Arterial lines are for blood-gas sampling and pressure monitoring, NOT for volume resuscitation — rapid intra-arterial infusion risks distal limb ischaemia. If a deep line is truly needed it would be the femoral VEIN, and only when intraosseous access is unavailable or has failed."}]}, {"id": "A0139", "type": "tf", "stem": "The following patients are at increased risk of hypovolaemic shock:", "system": "Cardiology", "topic": "Shock & fluid resuscitation", "source": "Ajisco Compiled Peds", "aiAuthored": true, "options": [{"label": "A", "text": "A boy with acute glomerulonephritis", "answer": "F", "rationale": "Acute glomerulonephritis causes salt-and-water RETENTION with hypervolaemia, hypertension and pulmonary oedema — its physiology is fluid overload, the exact opposite of hypovolaemia. Its emergencies are hypertensive encephalopathy and congestive failure, not hypovolaemic shock."}, {"label": "B", "text": "An hour-old neonate who was born by instrumental delivery", "answer": "T", "rationale": "Instrumental (especially vacuum) delivery predisposes to subgaleal haemorrhage, whose potential space can accommodate a large fraction of a neonate's blood volume, causing hypovolaemic shock within hours of birth. Other concealed bleeds of traumatic delivery (intracranial, ruptured liver) do the same."}, {"label": "C", "text": "A 5-year-old known haemoglobin SS patient with sequestration crisis", "answer": "T", "rationale": "Acute splenic sequestration traps a large volume of blood in the spleen, producing a precipitous fall in haemoglobin with reticulocytosis and hypovolaemic shock — a leading cause of early death in sickle cell disease. An enlarging spleen with shock signs demands urgent transfusion."}, {"label": "D", "text": "An 18-month-old with intussusception", "answer": "T", "rationale": "Intussusception combines vomiting, third-space sequestration into obstructed bowel and bloody (redcurrant-jelly) stool to produce significant volume loss; late presenters classically arrive in hypovolaemic shock. Fluid resuscitation must precede any reduction attempt."}, {"label": "E", "text": "A 10-year-old with massive glycosuria", "answer": "T", "rationale": "Massive glycosuria — as in diabetic ketoacidosis — drives an osmotic diuresis with profound losses of water and electrolytes, leading to hypovolaemic shock. This is precisely why careful, graded rehydration is the cornerstone of DKA management."}]}, {"id": "A0140", "type": "tf", "stem": "Differential diagnosis of a 4-year-old child with cyanosis and reduced effort tolerance includes:", "system": "Cardiology", "topic": "Cyanosis, clubbing & assessment", "source": "Ajisco Compiled Peds", "aiAuthored": true, "options": [{"label": "A", "text": "Tetralogy of Fallot", "answer": "T", "rationale": "Fallot's tetralogy is the archetypal cyanotic lesion of this age group, and exertional breathlessness with squatting, spells and cyanosis is its hallmark — it tops the differential."}, {"label": "B", "text": "Pulmonary stenosis", "answer": "T", "rationale": "Severe pulmonary stenosis, especially with an atrial-level right-to-left shunt, causes cyanosis with easy fatigability, so it legitimately appears in this differential. Only MILD pulmonary stenosis is reliably acyanotic."}, {"label": "C", "text": "Tricuspid atresia", "answer": "T", "rationale": "Tricuspid atresia is a cyanotic lesion with reduced pulmonary blood flow; affected children have chronic cyanosis, clubbing and poor exercise tolerance. It usually declares itself in early infancy, but it belongs in the differential list."}, {"label": "D", "text": "Ventricular septal defect", "answer": "F", "rationale": "An uncomplicated ventricular septal defect is an ACYANOTIC left-to-right shunt. Cyanosis appears only after Eisenmenger transformation, which usually takes many years to develop — so a straightforward VSD does not explain cyanosis at age 4."}, {"label": "E", "text": "Asthma", "answer": "T", "rationale": "In a severe acute episode asthma produces hypoxaemia with central cyanosis and marked limitation of activity, making it the principal RESPIRATORY differential of cyanosis in this age group. Separating cardiac from pulmonary causes — clinically and with the hyperoxia test — is a core exam skill."}]}, {"id": "A0141", "type": "tf", "stem": "Predisposing factors to infective endocarditis:", "system": "Cardiology", "topic": "Infective endocarditis", "source": "Ajisco Compiled Peds", "aiAuthored": true, "options": [{"label": "A", "text": "Male sex", "answer": "F", "rationale": "Although adult series show a male predominance, sex is not a meaningful predisposing MECHANISM in paediatric endocarditis — the true predispositions are structural heart lesions, prosthetic material, immunosuppression and portals of infection. Do not confuse an epidemiological association with a true risk factor when answering."}, {"label": "B", "text": "Haemophilia", "answer": "F", "rationale": "Haemophilia is a congenital bleeding disorder with no causal link to endocarditis: it neither damages valve endothelium nor seeds bacteraemia. (Haemophiliacs with indwelling central lines for factor concentrates are a special iatrogenic exception, but that is not what the option implies.)"}, {"label": "C", "text": "Rheumatic heart disease", "answer": "T", "rationale": "Rheumatic heart disease is the classic underlying lesion for infective endocarditis in our environment, where RHD remains common. Previously inflamed, jet-injured valve endothelium is exactly where circulating bacteria seed and form vegetations."}, {"label": "D", "text": "Dental caries", "answer": "T", "rationale": "Poor dentition and dental work seed viridans-group streptococci into the bloodstream — a major portal of entry for subacute endocarditis. This is the rationale for dental hygiene education and periprocedural antibiotic prophylaxis in high-risk cardiac patients."}, {"label": "E", "text": "Corrective heart surgery", "answer": "T", "rationale": "Prosthetic patches, conduits and valves placed at corrective surgery are foreign material with a high propensity for infection, both early post-operatively and late. Repaired congenital heart disease with residual defects remains a high-risk category for which endocarditis prophylaxis is recommended."}]}, {"id": "A0142", "type": "tf", "stem": "Cyanosis:", "system": "Cardiology", "topic": "Cyanosis, clubbing & assessment", "source": "Ajisco Compiled Peds", "aiAuthored": true, "options": [{"label": "A", "text": "The extremities are blue and warm in peripheral cyanosis", "answer": "F", "rationale": "Peripheral cyanosis reflects sluggish peripheral blood flow with increased tissue oxygen extraction — the extremities are blue and COLD (shock, cold exposure, heart failure). Warm blue extremities with a bounding circulation point instead to CENTRAL cyanosis."}, {"label": "B", "text": "Is not clinically recognized until reduced HB exceeds 5gm/100ml", "answer": "T", "rationale": "Clinical cyanosis becomes detectable when reduced (deoxygenated) haemoglobin in the capillaries reaches about 5 g/dL. This is why a severely anaemic patient may never appear cyanosed despite profound hypoxia, while a polycythaemic patient looks blue at only moderate desaturation."}, {"label": "C", "text": "Central cyanosis is due to deficient oxygenation of HB", "answer": "T", "rationale": "Central cyanosis results from reduced arterial oxygen saturation — inadequate oxygenation of haemoglobin from right-to-left cardiac shunting, intrapulmonary shunting or alveolar hypoventilation/diffusion failure. Because the deoxyhaemoglobin is in the arterial circulation, the tongue and oral mucosa are blue as well as the extremities."}, {"label": "D", "text": "Inhalation of 100% oxygen helps to differentiate between pulmonary and cardiac causes", "answer": "T", "rationale": "In the hyperoxia (nitrogen washout) test, 100% oxygen is given for 5-10 minutes: with pulmonary disease the PaO2 rises markedly (typically above 200-250 mmHg) because the problem is at the alveolus, whereas with a right-to-left shunt it rises very little (usually below 100-150 mmHg) since shunted blood never meets ventilated alveoli. It is a simple, powerful bedside distinction between pulmonary and cardiac cyanosis."}, {"label": "E", "text": "Is an unusual feature of EMF", "answer": "T", "rationale": "Endomyocardial fibrosis presents as a restrictive cardiomyopathy dominated by failure signs — ascites, oedema, raised JVP, cachexia — not by cyanosis. Apparent cyanosis in a supposed EMF patient should prompt a search for severe pulmonary oedema or an alternative diagnosis."}]}, {"id": "A0143", "type": "tf", "stem": "The following measures are appropriate in the treatment of a hypercyanotic spell:", "system": "Cardiology", "topic": "Fallot's tetralogy & other cyanotic CHD", "source": "Ajisco Compiled Peds", "aiAuthored": true, "options": [{"label": "A", "text": "Cardiac position", "answer": "T", "rationale": "Placing the child in the knee-chest (cardiac) position increases systemic vascular resistance and venous return, which instantly reduces the right-to-left shunt and forces more blood through the pulmonary bed. It is the first manoeuvre and the one mothers of known patients are taught."}, {"label": "B", "text": "Oxygen by face mask", "answer": "T", "rationale": "High-flow 100% oxygen by face mask improves oxygenation of whatever blood does reach ventilated alveoli and helps lower pulmonary vascular resistance. It is standard initial therapy, though insufficient alone for a severe spell."}, {"label": "C", "text": "Oral propanolol, 1mg/kg/dose", "answer": "F", "rationale": "For an ACUTE spell the beta-blocker is given INTRAVENOUSLY (propranolol about 0.1-0.25 mg/kg as a slow IV push), alongside morphine, IV fluids and correction of acidosis; splanchnic perfusion is too poor for oral dosing to act in time. ORAL propranolol (about 1 mg/kg/dose 6-8 hourly) is the subsequent MAINTENANCE/prophylactic regimen, not spell-terminating treatment."}, {"label": "D", "text": "Antibiotics", "answer": "F", "rationale": "Antibiotics play no role in terminating a hypercyanotic spell, which is a haemodynamic event driven by infundibular spasm and falling systemic resistance. They are indicated only when treating an identified bacterial trigger such as pneumonia or endocarditis."}, {"label": "E", "text": "Plasma exchange", "answer": "F", "rationale": "Plasma exchange is not part of spell management. Where polycythaemia is extreme and symptomatic, the relevant intervention is partial EXCHANGE TRANSFUSION (venesection with volume replacement) to lower viscosity — a separate, elective consideration."}]}, {"id": "A0144", "type": "tf", "stem": "A 3-year-old boy managed for TOF by the cardiology unit presented with fever after tooth extraction: the following are relevant in his management:", "system": "Cardiology", "topic": "Infective endocarditis", "source": "Ajisco Compiled Peds", "aiAuthored": true, "options": [{"label": "A", "text": "Urinary MCS", "answer": "F", "rationale": "The decisive microbiological investigation in suspected infective endocarditis is multiple sets of BLOOD cultures taken before antibiotics. Urine contributes only indirectly (microscopic haematuria is a minor Duke criterion) — urine culture does not diagnose or exclude endocarditis."}, {"label": "B", "text": "Jones criteria", "answer": "F", "rationale": "The Jones criteria diagnose acute RHEUMATIC FEVER. The framework needed here is the modified DUKE criteria for infective endocarditis (blood cultures, echocardiography, vascular and immunological phenomena); applying Jones criteria would misdirect the work-up entirely."}, {"label": "C", "text": "History of pre-op medication", "answer": "T", "rationale": "Documenting whether antibiotic prophylaxis was given before the dental extraction is directly relevant: an unprotected procedure in a cyanotic CHD patient is exactly the scenario for viridans streptococcal bacteraemia seeding the heart. Any antibiotics already received also affect culture yield and the choice of empiric therapy."}, {"label": "D", "text": "Apical murmur", "answer": "F", "rationale": "The murmur of TOF is an ejection systolic murmur at the left UPPER sternal border, not the apex; an apical murmur is not characteristic of the underlying lesion. What matters in endocarditis surveillance is a NEW or CHANGING (usually regurgitant) murmur, not an apical one."}]}, {"id": "A0145", "type": "tf", "stem": "A ten-year-old boy presented at OTCHEW with body swelling and reduced urine output of 2 weeks duration. Cough and breathlessness of 5 days duration. The BP was 160/120 and Creatinine level was 12mg/dl. The following are correct with his presentation:", "system": "Cardiology", "topic": "Heart failure in children", "source": "Ajisco Compiled Peds", "aiAuthored": true, "options": [{"label": "A", "text": "Heart failure is a complication", "answer": "T", "rationale": "Severe hypertension combined with salt-and-water overload in acute nephritic syndrome with renal failure readily precipitates congestive cardiac failure, including pulmonary oedema — which explains the cough and breathlessness. CCF is a recognized emergency complication of AGN with acute kidney injury."}, {"label": "B", "text": "It's a feature of CKD", "answer": "F", "rationale": "A 2-week history is an ACUTE presentation, most consistent with acute glomerulonephritis with acute kidney injury rather than chronic kidney disease. Severe hypertension and fluid overload can occur in CKD too, but labelling this acute picture a feature of CKD misdiagnoses the child (contrast cases with years of preceding oedema)."}, {"label": "C", "text": "Fluid challenge is a contraindication", "answer": "T", "rationale": "With oliguria, oedema, breathlessness and a BP of 160/120, the circulation is fluid OVERLOADED; a fluid challenge would worsen pulmonary oedema and hypertension and could be fatal. Management is fluid restriction, diuretics if any urine output persists, antihypertensives and dialysis."}, {"label": "D", "text": "PCV of 23% is consistent with the diagnosis", "answer": "T", "rationale": "A PCV in the low 20s fits this picture well: haemodilution from fluid overload, plus reduced erythropoietin effect as renal failure deepens. Anaemia of this degree is regularly documented in severe nephritic syndrome/AKI presentations."}, {"label": "E", "text": "Haemodialysis would be helpful", "answer": "T", "rationale": "A creatinine of 12 mg/dL with oliguria, fluid overload causing respiratory compromise, and severe hypertension squarely meets dialysis indications (refractory volume overload and significant uraemia). Haemodialysis rapidly removes fluid and corrects the internal milieu while renal recovery is awaited."}]}, {"id": "A0146", "type": "tf", "stem": "The common cyanotic CHD includes:", "system": "Cardiology", "topic": "Fallot's tetralogy & other cyanotic CHD", "source": "Ajisco Compiled Peds", "aiAuthored": true, "options": [{"label": "A", "text": "VSD", "answer": "F", "rationale": "VSD is the commonest congenital heart defect overall, but it is ACYANOTIC — a left-to-right shunt. Cyanosis appears only after late Eisenmenger transformation, so it is not classed among the cyanotic lesions."}, {"label": "B", "text": "ASD", "answer": "F", "rationale": "ASD is likewise an acyanotic, left-to-right (atrial-level) shunt; cyanosis would require advanced pulmonary vascular disease with shunt reversal, which is rare and late. It does not belong in a list of cyanotic CHDs."}, {"label": "C", "text": "TOF", "answer": "T", "rationale": "Fallot's tetralogy is the commonest CYANOTIC congenital heart disease beyond the neonatal period — the classic blue baby of childhood."}, {"label": "D", "text": "TGA", "answer": "T", "rationale": "Transposition of the great arteries is the commonest cyanotic CHD presenting in the NEONATAL period; the parallel (rather than in-series) circulations cause severe cyanosis within hours to days as the ductus closes."}]}, {"id": "A0147", "type": "tf", "stem": "In TOF:", "system": "Cardiology", "topic": "Fallot's tetralogy & other cyanotic CHD", "source": "Ajisco Compiled Peds", "aiAuthored": true, "options": [{"label": "A", "text": "Heart failure is rare", "answer": "T", "rationale": "Because the pulmonary stenosis limits pulmonary blood flow, the volume overload that drives most shunt lesions into failure never develops — so congestive heart failure in classic TOF is RARE. Exceptions are TOF with absent pulmonary valve, severe anaemia, or infective endocarditis."}, {"label": "B", "text": "Cyanosis in infancy is uncommon", "answer": "F", "rationale": "Most untreated, symptomatic TOF children become cyanosed during INFANCY as the infundibular obstruction progresses; neonates may be pink (pink Fallot) but cyanosis in the first year is typical of the natural history. Describing infant cyanosis as uncommon understates the usual course."}, {"label": "C", "text": "There is biventricular hypertrophy", "answer": "F", "rationale": "The hypertrophy in TOF is RIGHT ventricular, the response to the outflow obstruction; the left ventricle is protected by the right-to-left shunt and does not hypertrophy. Significant LVH on ECG or imaging should suggest a different or additional lesion."}, {"label": "D", "text": "Iron deficiency anemia can occur", "answer": "T", "rationale": "Despite compensatory polycythaemia, coexisting iron deficiency anaemia is well documented in TOF: it renders red cells microcytic and stiffer, further raising blood viscosity and increasing the risk of cerebral thrombosis, and the fall in haemoglobin (relative anaemia) can unmask or worsen cyanosis. Screening and cautious iron repletion are part of ongoing care."}, {"label": "E", "text": "Sodium bicarbonate may be indicated in its management", "answer": "T", "rationale": "During a severe spell, intense hypoxaemia generates metabolic (lactic) acidosis, and acidosis lowers systemic vascular resistance, worsening the right-to-left shunt — a vicious cycle. Intravenous sodium bicarbonate breaks that cycle and is part of the management of severe or prolonged spells, guided by severity/blood gas."}]}, {"id": "A0148", "type": "tf", "stem": "Wide pulse pressure is often a feature of:", "system": "Cardiology", "topic": "Cardiac examination, pulses & murmurs", "source": "Ajisco Compiled Peds", "aiAuthored": true, "options": [{"label": "A", "text": "Venous hum", "answer": "F", "rationale": "A venous hum is a benign continuous murmur produced by laminar flow in the neck veins; it is an auscultatory finding that disappears when lying flat or with gentle jugular compression, and it does not alter arterial pulse pressure."}, {"label": "B", "text": "Mitral incompetence", "answer": "F", "rationale": "Mitral incompetence regurgitates into the atrium during systole, reducing forward stroke volume without any diastolic run-off from the aorta, so the pulse pressure is normal or narrowed. Wide pulse pressure belongs to the aortic run-off and hyperdynamic states, not MR."}, {"label": "C", "text": "VSD", "answer": "F", "rationale": "A VSD shunts blood in systole from left to right ventricle; there is no diastolic run-off from the aorta, so diastolic pressure is maintained and pulse pressure is not widened. (The rare exception is a VSD complicated by associated aortic regurgitation from cusp prolapse.)"}, {"label": "D", "text": "PDA", "answer": "T", "rationale": "In a patent ductus arteriosus blood runs off the aorta into the pulmonary artery throughout diastole, lowering diastolic pressure while systolic pressure is preserved or raised — hence a wide pulse pressure with bounding, collapsing (water-hammer) pulses. This is a signature sign of a significant PDA."}, {"label": "E", "text": "Thyrotoxicosis", "answer": "T", "rationale": "Thyrotoxicosis produces a hyperdynamic circulation — increased stroke volume with peripheral vasodilatation — giving a wide pulse pressure. Other members of this group include aortic regurgitation, large AV fistulae, severe anaemia and fever."}]}, {"id": "A0149", "type": "tf", "stem": "The following are compensatory mechanisms of shock in a child:", "system": "Cardiology", "topic": "Shock & fluid resuscitation", "source": "Ajisco Compiled Peds", "aiAuthored": true, "options": [{"label": "A", "text": "Peripheral vasoconstrictions", "answer": "T", "rationale": "Sympatho-adrenal catecholamine release constricts cutaneous and splanchnic vessels, maintaining central pressure and diverting flow to heart and brain — clinically the cold, mottled child with prolonged capillary refill time."}, {"label": "B", "text": "Increased Aldosterone", "answer": "T", "rationale": "Reduced renal perfusion activates the renin-angiotensin-aldosterone system; aldosterone (together with ADH) promotes salt-and-water retention to expand circulating volume — one reason oliguria is an early sign of compensated shock."}, {"label": "C", "text": "Increased Heart Rate -", "answer": "T", "rationale": "Tachycardia is the child's principal compensation because the young myocardium cannot augment stroke volume efficiently — paediatric cardiac output is rate-dependent. Bradycardia in a shocked child is an ominous, pre-arrest sign rather than reassurance."}, {"label": "D", "text": "Increased Stroke Volume", "answer": "F", "rationale": "In hypovolaemia the ventricles are underfilled, so stroke volume FALLS; compensation maintains cardiac output through tachycardia and raised systemic vascular resistance, not by increasing stroke volume."}, {"label": "E", "text": "Reduced Corticosteroids", "answer": "F", "rationale": "The physiological stress response INCREASES cortisol secretion (with catecholamines), which supports vascular tone and catecholamine sensitivity; adrenal insufficiency itself produces refractory shock. Reduced corticosteroids would impair, not serve, compensation."}]}, {"id": "A0150", "type": "tf", "stem": "In shock, blood is shunted to:", "system": "Cardiology", "topic": "Shock & fluid resuscitation", "source": "Ajisco Compiled Peds", "aiAuthored": true, "options": [{"label": "A", "text": "Brain", "answer": "T", "rationale": "Cerebral perfusion is protected by autoregulation and by selective vasoconstriction elsewhere; loss of this priority reveals itself as agitation, confusion and eventually coma."}, {"label": "B", "text": "Heart", "answer": "T", "rationale": "Coronary perfusion is maintained so the pump keeps working — failure of this compensation marks decompensated shock and imminent arrest."}, {"label": "C", "text": "Adrenal", "answer": "T", "rationale": "The classic triad of protected organs in shock is brain, heart and ADRENALS; preserved adrenal flow supports the catecholamine and cortisol surge that sustains compensation."}, {"label": "D", "text": "Kidney", "answer": "F", "rationale": "The kidney is among the FIRST beds sacrificed: intense renal vasoconstriction causes the oliguria that is an early, sensitive sign of shock, and prolonged hypoperfusion produces acute tubular necrosis."}, {"label": "E", "text": "Lungs", "answer": "F", "rationale": "The lungs are not on the protected list — pulmonary flow adjusts downward with the falling output rather than being preserved at others' expense. The protected vital organs are brain, heart and adrenals."}]}, {"id": "A0151", "type": "tf", "stem": "Which of the following are correctly matched?", "system": "Cardiology", "topic": "Cardiac examination, pulses & murmurs", "source": "Ajisco Compiled Peds", "aiAuthored": true, "options": [{"label": "A", "text": "Weak brachial and dorsalis pedis pulses - Aortic stenosis", "answer": "T", "rationale": "Severe aortic stenosis with a falling cardiac output gives small-volume, slow-rising pulses GLOBALLY — weak at both brachial and dorsalis pedis sites. Contrast coarctation of the aorta, where brachial pulses are strong while femoral/pedal pulses are weak and delayed (radio-femoral delay)."}, {"label": "B", "text": "Ejection systolic murmur at right upper sternal border - Pulmonary stenosis", "answer": "F", "rationale": "An ejection systolic murmur maximal at the RIGHT upper sternal border, radiating to the carotids, is AORTIC stenosis. Pulmonary stenosis is loudest at the LEFT upper sternal border, often with an ejection click and radiation towards the left clavicle and back."}, {"label": "C", "text": "Hypocalcaemia - William syndrome", "answer": "F", "rationale": "Williams syndrome is associated with infantile HYPERCALCAEMIA, together with elfin facies, supravalvar aortic stenosis and a gregarious cocktail-party personality. The hypocalcaemia-with-heart-disease combination points instead to DiGeorge/22q11 deletion (conotruncal anomalies)."}, {"label": "D", "text": "Pulmonary stenosis - Right parasternal heave", "answer": "T", "rationale": "Significant pulmonary stenosis hypertrophies the right ventricle, and the enlarged anteriorly-placed chamber lifts the lower sternum with systole — a palpable right (para)sternal heave, often accompanied by a thrill at the upper left sternal border."}, {"label": "E", "text": "Cough - Mitral stenosis", "answer": "T", "rationale": "In mitral stenosis the enlarged left atrium can compress the left main bronchus, and pulmonary venous hypertension itself irritates the airways, so a persistent (often dry) cough is a recognized feature of significant MS. Massive atrial enlargement may also stretch the recurrent laryngeal nerve, causing hoarseness (Ortner syndrome)."}]}, {"id": "A0152", "type": "tf", "stem": "The following are correctly matched:", "system": "Cardiology", "topic": "Infective endocarditis", "source": "Ajisco Compiled Peds", "aiAuthored": true, "options": [{"label": "A", "text": "Splinter haemorrhage – infective endocarditis", "answer": "T", "rationale": "Splinter haemorrhages — thin linear subungual streaks — are the classic peripheral stigmata of infect
