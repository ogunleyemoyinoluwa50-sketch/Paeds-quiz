ive endocarditis, reflecting septic microemboli and immune vasculitis; with Osler nodes, Janeway lesions and Roth spots they count among the minor Duke criteria. (The pairing has been corrected for clarity; trivial trauma can also cause them, but in exam language they point to endocarditis.)"}, {"label": "B", "text": "Erythema nodosum – Sydenham chorea", "answer": "F", "rationale": "The skin manifestation of acute rheumatic fever is erythema MARGINATUM — non-tender, evanescent, serpiginous pink rings — not erythema nodosum. Erythema nodosum (tender pretibial nodules) points to tuberculosis, streptococcal pharyngitis sequelae, sarcoidosis or inflammatory bowel disease, so pairing it with Sydenham chorea is incorrect."}]}, {"id": "A0153", "type": "tf", "stem": "Endocardial fibrosis:", "system": "Cardiology", "topic": "Pericardial disease & endomyocardial fibrosis", "source": "Ajisco Compiled Peds", "aiAuthored": true, "options": [{"label": "A", "text": "Is a common congenital heart disease in Nigerian children", "answer": "F", "rationale": "Endomyocardial fibrosis is NOT a congenital heart disease — it is an ACQUIRED restrictive cardiomyopathy of uncertain aetiology (links proposed to eosinophilia, malnutrition and environmental toxins), although it is indeed common in Nigerian and other tropical African children. Describing it as congenital is the deliberate error in this option."}, {"label": "B", "text": "Age of occurrence is usually the first 5 years of life", "answer": "F", "rationale": "EMF characteristically affects older children, adolescents and young adults (roughly the 10-30 year bracket); presentation within the first 5 years of life is unusual. This age pattern itself helps separate it from congenital lesions in a differential list."}, {"label": "C", "text": "Pericardial effusion is characteristic", "answer": "F", "rationale": "Pericardial effusion is NOT characteristic of EMF; the pathology is dense fibrous obliteration of the ventricular apex and inflow tract, causing restrictive filling and atrioventricular valve regurgitation with giant atria. Pericardial effusion belongs to pericardial disease (e.g. TB pericarditis), which gives the globular heart on chest X-ray."}, {"label": "D", "text": "Bilateral pedal edema evolving to generalized edema is a feature", "answer": "T", "rationale": "Right-dominant EMF presents exactly this way: bilateral pedal oedema progressing to generalized oedema with gross ascites and a raised JVP — right-sided restrictive failure, often with cardiac cachexia. It is a great mimic of hepatic and renal disease in our wards."}, {"label": "E", "text": "A mid-diastolic murmur maximal at the apex is characteristic", "answer": "F", "rationale": "The characteristic auscultation of EMF is a REGURGITANT (pansystolic) murmur of mural endocardial mitral or tricuspid involvement, plus a prominent third heart sound as filling is abruptly halted. A mid-diastolic apical rumble suggests rheumatic mitral stenosis (or a flow murmur across the mitral valve in a large left-to-right shunt), not EMF."}]}, {"id": "A0154", "type": "tf", "stem": "With respect to examination for cardiac diseases in children:", "system": "Cardiology", "topic": "Chest X-ray & ECG in cardiology", "source": "Ajisco Compiled Peds", "aiAuthored": true, "options": [{"label": "A", "text": "CT ratio of 50% in keeping with TOF.", "answer": "T", "rationale": "In uncomplicated TOF the heart is usually normal in size — a cardiothoracic ratio of about 50% is right at the upper limit of normal for a young child. The diagnostic feature is the boot SHAPE (upturned apex, concave pulmonary bay, oligaemic fields), not cardiomegaly."}, {"label": "B", "text": "Normal-sized heart.", "answer": "T", "rationale": "A normal-sized heart does not exclude significant congenital heart disease: TOF, pulmonary stenosis and coarctation of the aorta commonly present with normal cardiothoracic ratios, because these lesions are pressure (not volume) loads. So a normal CTR on chest X-ray should never reassure you out of a careful clinical examination."}, {"label": "C", "text": "Pulmonary vascular markings that extend to lateral 1/3 suggest pulmonary atresia.", "answer": "F", "rationale": "Pulmonary vascular markings extending to the lateral (outer) third of the lung fields indicate pulmonary PLETHORA — increased flow from a large left-to-right shunt. Pulmonary atresia does the opposite: the fields are oligaemic with a concave or absent pulmonary bay."}, {"label": "D", "text": "Boot-shaped heart shows right atrial enlargement.", "answer": "F", "rationale": "The boot-shaped heart (coeur en sabot) reflects right VENTRICULAR hypertrophy lifting the apex plus a concave pulmonary segment (and a right-sided aortic arch in about 25%) — the atrium is not the responsible chamber."}, {"label": "E", "text": "Right-sided gastric shadow shows dextrocardia (situs inversus).", "answer": "T", "rationale": "In situs inversus totalis the stomach bubble and the cardiac apex are mirror-imaged to the right, and the heart itself is usually structurally normal; a right-sided gastric shadow with dextrocardia is exactly how this benign condition is recognized. It must be distinguished from dextroposition and from the isomerism syndromes, where cardiac malposition accompanies serious intracardiac disease."}]}, {"id": "A0156", "type": "tf", "stem": "Concerning Chest X-rays in Paediatrics cardiology:", "system": "Cardiology", "topic": "Chest X-ray & ECG in cardiology", "source": "Ajisco Compiled Peds", "aiAuthored": true, "options": [{"label": "A", "text": "A CT ratio of 50% is consistent with TOF.", "answer": "T", "rationale": "A cardiothoracic ratio of about 50% is within normal limits and is exactly what uncomplicated TOF shows — the heart is not enlarged, it is reshaped (boot-shaped with an upturned apex and concave pulmonary bay). Cardiomegaly would suggest an associated lesion or a different diagnosis."}, {"label": "B", "text": "Pulmonary vascular markings to the outer 2/3rd is consistent with pulmonary atresia.", "answer": "F", "rationale": "Pulmonary vascular markings reaching the outer two-thirds of the fields denote pulmonary PLETHORA (increased flow), the hall-mark of large left-to-right shunts. Pulmonary atresia gives the reverse picture: dark, oligaemic lung fields with a small or absent pulmonary artery segment."}, {"label": "C", "text": "Absence of thymic shadow is expected in a 6-week old.", "answer": "F", "rationale": "The thymic sail or wave sign is NORMAL and expected on infant chest X-rays and usually remains visible through the first couple of years; its absence in a 6-week-old is abnormal. Consider DiGeorge syndrome (classically with conotruncal heart defects) or stress involution rather than dismissing it."}, {"label": "D", "text": "Right gastric shadow indicates dextrocardia.", "answer": "T", "rationale": "A right-sided gastric (air-fluid) shadow indicates mirror-image situs — situs inversus — in which the cardiac apex also points right (dextrocardia) while the heart is usually structurally normal. Recognizing the gastric bubble's side is the quickest way to classify cardiac malpositions on a plain film."}]}, {"id": "A0157", "type": "tf", "stem": "The following are correctly matched:", "system": "Cardiology", "topic": "Cardiac examination, pulses & murmurs", "source": "Ajisco Compiled Peds", "aiAuthored": true, "options": [{"label": "A", "text": "Single, soft pulmonary closure sound - Severe pulmonary stenosis.", "answer": "T", "rationale": "As pulmonary stenosis worsens, pulmonary valve closure becomes faint and delayed: P2 softens and the second sound becomes effectively single (A2 alone). A soft, single S2 with an ejection click is the classic auscultatory picture of severe valvar pulmonary stenosis."}, {"label": "B", "text": "Loud pulmonary closure sound - Pulmonary hypertension.", "answer": "T", "rationale": "A loud, sometimes palpable P2 reflects forceful closure of the pulmonary valve against high pulmonary artery pressure — the auscultatory signature of pulmonary hypertension, as in Eisenmenger physiology or persistent pulmonary hypertension of the newborn."}, {"label": "C", "text": "Ejection systolic murmur loudest at RUSE - Aortic incompetence.", "answer": "F", "rationale": "That description matches AORTIC STENOSIS (ejection systolic murmur at the right upper sternal border radiating to the carotids). Aortic incompetence produces an early DIASTOLIC blowing murmur best heard at the left lower sternal border, accompanied by a wide pulse pressure and collapsing pulse."}, {"label": "D", "text": "Continuous murmur at the left upper sternal border – patent ductus arteriosus", "answer": "T", "rationale": "The PDA gives a continuous machinery (train-in-a-tunnel) murmur best heard at the left upper sternal border and infraclavicular fossa, peaking around the second sound as run-off persists through the whole cardiac cycle. It travels with bounding pulses and a wide pulse pressure from the diastolic run-off."}, {"label": "E", "text": "Diastolic apical murmur - Mitral stenosis.", "answer": "T", "rationale": "Mitral stenosis yields a low-pitched mid-diastolic rumble localized to the apex with presystolic accentuation, best heard in the left lateral position with the bell; an opening snap may precede it. In children it is almost always a sequela of rheumatic fever."}]}, {"id": "A0162", "type": "tf", "stem": "Concerning infective endocarditis:", "system": "Cardiology", "topic": "Infective endocarditis", "source": "Ajisco Compiled Peds", "aiAuthored": true, "options": [{"label": "A", "text": "It is uncommon in patients with pulmonary stenosis.", "answer": "T", "rationale": "Isolated valvar pulmonary stenosis is a LOW-risk lesion for infective endocarditis — guidelines do not even recommend routine periprocedural prophylaxis for it. The danger lesions are prosthetic material, previous endocarditis, unrepaired cyanotic CHD, and (in our setting) rheumatic valves."}, {"label": "B", "text": "Pulmonary embolism is a likely complication in patients with right to left shunt.", "answer": "F", "rationale": "With a right-to-left shunt, infected material in the systemic venous return BYPASSES the lungs and embolizes systemically (paradoxical emboli) — cerebral abscess and strokes are the classic TOF complications. Septic PULMONARY emboli arise from right-SIDED endocarditis without a shunt, e.g. tricuspid valve infection."}, {"label": "C", "text": "Staph aureus is a common cause in patients with a normal heart.", "answer": "T", "rationale": "When endocarditis attacks a previously NORMAL heart it is usually the acute, destructive Staphylococcus aureus form, seeded from skin sepsis, catheters or injection use. Viridans streptococci dominate the subacute form on previously damaged (rheumatic, congenital) valves."}, {"label": "D", "text": "A positive echocardiography is diagnostic.", "answer": "F", "rationale": "Echocardiography supplies one major Duke criterion (vegetation, abscess, new valvular regurgitation) but is not by itself diagnostic: vegetations may be missed when small or right-sided, and other masses can mimic them. Diagnosis requires integration with blood cultures and the clinical criteria, and echo-negative endocarditis is a real entity."}, {"label": "E", "text": "A single monthly dose of IV benzathine penicillin is appropriate prophylaxis for rheumatic heart disease.", "answer": "F", "rationale": "This option contains two errors in one: benzathine penicillin is given INTRAMUSCULARLY (intravenous injection can be fatal), and monthly prophylaxis prevents recurrence of RHEUMATIC FEVER, not infective endocarditis. Endocarditis prophylaxis is periprocedural cover (e.g. amoxicillin around dental extraction) reserved for the highest-risk cardiac lesions."}]}, {"id": "A0163", "type": "tf", "stem": "Which of the following are correctly matched?", "system": "Cardiology", "topic": "Congenital heart disease — overview & associations", "source": "Ajisco Compiled Peds", "aiAuthored": true, "options": [{"label": "A", "text": "Turner syndrome: coarctation of the aorta.", "answer": "T", "rationale": "Coarctation of the aorta — often with a bicuspid aortic valve — is the classic cardiac lesion of Turner syndrome (45,X). This is why every girl with a webbed neck or unexplained short stature needs blood pressure measured in all four limbs."}, {"label": "B", "text": "Down syndrome: atrioventricular septal defect.", "answer": "T", "rationale": "Atrioventricular septal defect is the signature cardiac lesion of Down syndrome (trisomy 21), alongside VSD, ASD and PDA; about 40% of Down children have CHD, and AVSD heads the list."}, {"label": "C", "text": "Infant of diabetic mother: TGA.", "answer": "T", "rationale": "Infants of diabetic mothers have an increased incidence of transposition of the great arteries, together with hypertrophic cardiomyopathy and VSD — diabetic embryopathy particularly disturbs conotruncal septation."}, {"label": "D", "text": "Prematurity: PDA.", "answer": "T", "rationale": "The premature ductus often fails to close because of hypoxia and immature ductal smooth muscle, so persistent PDA is strongly associated with prematurity — and is treated medically with ibuprofen/indomethacin (COX inhibitors) or by ligation when it is haemodynamically significant."}, {"label": "E", "text": "Marfan syndrome: ASD.", "answer": "F", "rationale": "Marfan syndrome (fibrillin-1 defect) produces AORTIC ROOT dilatation, aortic regurgitation and dissection, with mitral valve prolapse — not atrial septal defect. An aortopathy, not a shunt, is its cardiovascular signature."}]}, {"id": "A0164", "type": "tf", "stem": "A baby presented at Otchew with fast breathing, poor feeding, diaphoresis, no fever. Murmurs heard on LLSE on a cardiac patient. The following is true:", "system": "Cardiology", "topic": "Acyanotic CHD (left-to-right shunts)", "source": "Ajisco Compiled Peds", "aiAuthored": true, "options": [{"label": "A", "text": "Echo is diagnostic.", "answer": "T", "rationale": "Two-dimensional echocardiography with colour Doppler directly visualizes the defect, localizes and sizes it, quantifies the shunt and estimates pulmonary artery pressure — it is the definitive, non-invasive diagnostic tool for VSD and guides the timing of intervention."}, {"label": "B", "text": "Upward shift of the apex beat.", "answer": "F", "rationale": "A large left-to-right shunt VOLUME-overloads the left ventricle, displacing the apex DOWNWARD and laterally (a diffuse, hyperdynamic apex). An UPWARD-lifted apex indicates right ventricular hypertrophy, as in TOF — the opposite physiology to this child."}, {"label": "C", "text": "ECG will show LVH.", "answer": "T", "rationale": "A haemodynamically significant VSD produces left ventricular volume overload, and the ECG shows LVH (tall R waves in left chest leads with deep septal Q waves), often with biventricular hypertrophy as pulmonary flow rises. Only small restrictive defects leave a normal tracing, and this symptomatic infant's defect is clearly significant."}]}, {"id": "A0165", "type": "tf", "stem": "Palpation of pulse in an infant:", "system": "Cardiology", "topic": "Cardiac examination, pulses & murmurs", "source": "Ajisco Compiled Peds", "aiAuthored": true, "options": [{"label": "A", "text": "You palpate ulnar artery on the forearm.", "answer": "F", "rationale": "In infants the radial and ulnar pulses are too small and deep for reliable palpation; the BRACHIAL (and femoral) pulses are the standard sites. Practically, the ulnar artery is essentially never the palpation site of choice at any age."}, {"label": "B", "text": "Detect atrial fibrillation.", "answer": "F", "rationale": "Palpation can reveal that a rhythm is irregularly irregular, but it cannot DIAGNOSE atrial fibrillation — confirmation requires an ECG; moreover AF is vanishingly rare in infants without structural heart disease. This option conflates detecting an irregularity with diagnosing a specific arrhythmia."}, {"label": "C", "text": "Check for rhythm.", "answer": "T", "rationale": "Pulse palpation formally assesses rate, RHYTHM, volume, character and symmetry — including radio-femoral delay and equality between limbs — each observation carrying specific diagnostic weight (e.g. weak femoral pulses suggesting coarctation)."}, {"label": "D", "text": "A bounding pulse excludes anemia.", "answer": "F", "rationale": "A bounding (hyperkinetic, water-hammer) pulse occurs WITH significant anaemia — the high-output state of low oxygen-carrying capacity — as well as in PDA, aortic regurgitation, fever and thyrotoxicosis. Far from excluding anaemia, in a pale child a bounding pulse should make you suspect it."}]}];

<script>
/* PaedsMaster — MB III Paediatrics Quiz Engine (v1) */
(function () {
  "use strict";
  const $ = (s, el) => (el || document).querySelector(s);
  const $$ = (s, el) => Array.from((el || document).querySelectorAll(s));
  const LS_KEY = "paedsMaster.stats.v1";

  let QUESTIONS = [];
  let stats = loadStats();
  let quiz = null; // {qs, idx, answered, correct, perQuestion}
  let flash = null;

  function loadStats() {
    try { return JSON.parse(localStorage.getItem(LS_KEY)) || blank(); } catch (e) { return blank(); }
  }
  function blank() {
    return { attempts: 0, correct: 0, bySystem: {}, byTopic: {}, answers: {}, sessions: 0, answeredQ: {} };
  }
  function saveStats() { localStorage.setItem(LS_KEY, JSON.stringify(stats)); }

  function recordAnswer(q, optLabel, correct) {
    stats.attempts++;
    if (correct) stats.correct++;
    const s = q.system, t = q.topic || "General";
    for (const [bucket, key] of [["bySystem", s], ["byTopic", s + "||" + t]]) {
      const o = (stats[bucket][key] = stats[bucket][key] || { n: 0, c: 0 });
      o.n++; if (correct) o.c++;
    }
    stats.answers[q.id + "|" + optLabel] = correct ? 1 : 0;
    const aq = (stats.answeredQ[q.id] = stats.answeredQ[q.id] || { n: 0, c: 0 });
    aq.n++; if (correct) aq.c++;
    saveStats();
  }

  function accuracy(o) { return o && o.n ? Math.round((100 * o.c) / o.n) : null; }

  /* ---------- routing ---------- */
  const routes = {
    "": renderHome, "/": renderHome,
    "/practice": renderPractice, "/quiz": renderQuiz,
    "/weak": renderWeak, "/flashcards": renderFlashcards,
  };
  function route() {
    const h = location.hash.replace(/^#/, "") || "/";
    const [path, query] = h.split("?");
    $$("nav a").forEach(a => a.classList.toggle("active", a.dataset.nav === (path === "/" ? "home" : path.slice(1))));
    const fn = routes[path] || renderHome;
    $("#app").innerHTML = "";
    fn(query);
  }

  async function boot() {
    // Data is embedded as a plain script (data/questions.js) so the site also
    // works when opened directly from disk (file://) — fetch() is only a fallback.
    if (window.PAEDS_DATA) {
      QUESTIONS = window.PAEDS_DATA;
    } else {
      try {
        const r = await fetch("data/questions.json");
        QUESTIONS = await r.json();
      } catch (e) {
        $("#app").innerHTML = "<div class='notice'>Could not load the question bank. Make sure the whole folder was extracted/uploaded (including <code>data/questions.js</code>) and, if opened locally, that all files sit in the same folder structure.</div>";
        return;
      }
    }
    stats.sessions++; saveStats();
    route();
  }

  const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const systemsOf = () => {
    const m = new Map();
    for (const q of QUESTIONS) m.set(q.system, (m.get(q.system) || 0) + 1);
    return [...m.entries()].sort((a, b) => b[1] - a[1]);
  };
  const topicsOf = sys => {
    const m = new Map();
    for (const q of QUESTIONS) if (q.system === sys) m.set(q.topic || "General", (m.get(q.topic || "General") || 0) + 1);
    return [...m.entries()].sort((a, b) => a[0].localeCompare(b[0]));
  };

  /* ---------- HOME ---------- */
  function renderHome() {
    const app = $("#app");
    const totalOpts = QUESTIONS.reduce((n, q) => n + q.options.length, 0);
    const acc = stats.attempts ? Math.round((100 * stats.correct) / stats.attempts) : null;
    app.innerHTML = `
      <h1>Part III Paediatrics Practice</h1>
      <p class="sub">True/False statement bank · essays & picture tests as flashcards · tracks your weak areas automatically</p>
      <div class="statgrid">
        <div class="stat"><div class="n">${QUESTIONS.length}</div><div class="l">questions loaded</div></div>
        <div class="stat"><div class="n">${totalOpts}</div><div class="l">T/F statements</div></div>
        <div class="stat"><div class="n">${stats.attempts}</div><div class="l">statements attempted</div></div>
        <div class="stat"><div class="n">${acc === null ? "—" : acc + "%"}</div><div class="l">overall accuracy</div></div>
      </div>
      <h2>Practice by system</h2>
      <div class="grid sys" id="sysgrid"></div>
      <h2>Quick start</h2>
      <p>
        <a class="btn" href="#/quiz?mix=20">🎯 20-question mixed drill</a>
        <a class="btn ghost" href="#/practice">Choose topics yourself</a>
        ${stats.attempts ? '<a class="btn ghost" href="#/weak">Review weak areas</a>' : ""}
      </p>
      <div class="notice">More systems are being added batch by batch — currently <b>fully stocked</b>: Neurology + mixed past-question bank. Next: Cardiology, Nephrology, Neonatology.</div>`;
    const g = $("#sysgrid");
    const icons = { "Neurology": "🧠", "Cardiology": "❤️", "Pulmonology": "🫁", "Nephrology": "🫘", "Neonatology": "👶", "Infectious Disease": "🦠", "Haematology & Oncology": "🩸", "Gastrointestinal & Hepatobiliary": "🍽️", "Endocrine & Genetics": "🧬", "Others (Emergency/Social)": "🚑" };
    for (const [sys, n] of systemsOf()) {
      const st = stats.bySystem[sys];
      const pct = accuracy(st);
      const el = document.createElement("a");
      el.className = "card"; el.href = "#/practice?system=" + encodeURIComponent(sys);
      el.style.textDecoration = "none"; el.style.color = "inherit";
      el.innerHTML = `<h3>${icons[sys] || "📚"} ${esc(sys)}</h3>
        <div class="count">${n} questions</div>
        ${pct !== null ? `<div class="count">accuracy: <b style="color:${pct < 70 ? "var(--bad)" : "var(--ok)"}">${pct}%</b> (${st.n} statements)</div>` : `<div class="count">not attempted yet</div>`}`;
      g.appendChild(el);
    }
  }

  /* ---------- PRACTICE SETUP ---------- */
  function renderPractice(query) {
    const params = new URLSearchParams(query || "");
    const sysParam = params.get("system");
    const app = $("#app");
    if (sysParam) {
      const topics = topicsOf(sysParam);
      app.innerHTML = `
        <a href="#/practice">← all systems</a>
        <h1>${esc(sysParam)}</h1>
        <p class="sub">Pick topics to include in your drill</p>
        <div id="topics"></div>
        <p class="fc-row"><button class="btn" id="startAll">Start — all topics</button>
        <button class="btn ghost" id="startSel">Start selected</button></p>`;
      const box = $("#topics");
      for (const [t, n] of topics) {
        const row = document.createElement("label");
        row.className = "topicrow";
        row.innerHTML = `<span class="tname"><input type="checkbox" value="${esc(t)}" checked style="margin-right:9px">${esc(t)}</span><span class="tmeta">${n} q</span>`;
        box.appendChild(row);
      }
      $("#startAll").onclick = () => startQuiz(QUESTIONS.filter(q => q.system === sysParam));
      $("#startSel").onclick = () => {
        const sel = $$("#topics input:checked").map(i => i.value);
        const qs = QUESTIONS.filter(q => q.system === sysParam && sel.includes(q.topic || "General"));
        qs.length ? startQuiz(qs) : alert("Select at least one topic.");
      };
      return;
    }
    app.innerHTML = `<h1>Practice</h1><p class="sub">Choose a system</p><div id="list"></div>`;
    const list = $("#list");
    for (const [sys, n] of systemsOf()) {
      const a = document.createElement("a");
      a.className = "topicrow"; a.href = "#/practice?system=" + encodeURIComponent(sys);
      a.style.textDecoration = "none"; a.style.color = "inherit";
      a.innerHTML = `<span class="tname">${esc(sys)}</span><span class="tmeta">${n} questions →</span>`;
      list.appendChild(a);
    }
  }

  /* ---------- QUIZ ---------- */
  function startQuiz(pool, label) {
    const shuffled = [...pool].sort(() => Math.random() - 0.5);
    quiz = { qs: shuffled, idx: 0, answered: 0, correct: 0, done: false, label: label || "" };
    location.hash = "/quiz";
  }
  function renderQuiz(query) {
    const params = new URLSearchParams(query || "");
    if (!quiz) {
      const mix = parseInt(params.get("mix") || "0", 10);
      if (mix > 0) { startQuiz(QUESTIONS, `Mixed ${mix}`); quiz.qs = quiz.qs.slice(0, mix); }
      else if (params.get("wrong")) { startQuiz(wrongQuestions()); if (!quiz.qs.length) { alert("No wrong statements recorded yet — go practice!"); quiz = null; renderPractice(""); return; } quiz.label = "Mistakes review"; }
      else { renderPractice(""); return; }
    }
    drawQuestion();
  }
  function wrongQuestions() {
    const wrongIds = new Set();
    for (const k in stats.answers) if (stats.answers[k] === 0) wrongIds.add(k.split("|")[0]);
    return QUESTIONS.filter(q => wrongIds.has(q.id));
  }
  function drawQuestion() {
    const app = $("#app");
    if (quiz.idx >= quiz.qs.length) return drawSummary();
    const q = quiz.qs[quiz.idx];
    quiz.done = false;
    const total = q.options.length;
    app.innerHTML = `
      <div class="qprogress"><span>${quiz.label ? esc(quiz.label) + " · " : ""}${esc(q.system)}${q.topic ? " → " + esc(q.topic) : ""}</span>
      <span>Question ${quiz.idx + 1}/${quiz.qs.length}</span></div>
      <div class="stemwrap stemmeta">
        <span class="badge badge-src">${esc(q.source)}</span>
        ${q.aiAuthored ? '<span class="badge badge-ai">AI-authored</span>' : '<span class="badge" style="background:var(--okbg);color:var(--ok)">answer key from source</span>'}
      </div>
      <div class="stem">${esc(q.stem)}</div>
      <div id="opts"></div>
      <div class="quizfoot">
        <span class="sub">Score this drill: <b id="liveScore">0/0</b></span>
        <span>
          <button class="btn ghost sm" id="quitBtn">End drill</button>
          <button class="btn" id="nextBtn" disabled>Next →</button>
        </span>
      </div>
      <div class="notice">Tap <b>T</b> or <b>F</b> for every statement — feedback is instant.</div>`;
    const box = $("#opts");
    quiz.state = { picked: 0, total, qid: q.id, optsCorrect: 0 };
    for (const o of q.options) {
      const row = document.createElement("div");
      row.className = "opt";
      row.innerHTML = `
        <div class="opt-head">
          <span class="olabel">${o.label}.</span>
          <span class="otext">${esc(o.text)}</span>
          <span class="tfbtns">
            <button class="tfbtn t" data-v="T">T</button>
            <button class="tfbtn f" data-v="F">F</button>
          </span>
        </div>
        <div class="result"></div>`;
      $$(".tfbtn", row).forEach(btn => btn.onclick = () => judge(row, q, o, btn));
      box.appendChild(row);
    }
    $("#nextBtn").onclick = () => { quiz.idx++; drawQuestion(); };
    $("#quitBtn").onclick = () => { quiz.idx = quiz.qs.length; drawQuestion(); };
  }
  function judge(row, q, o, btn) {
    if (row.dataset.done) return;
    row.dataset.done = "1";
    const chosen = btn.dataset.v;
    const correct = chosen === o.answer;
    row.classList.add(correct ? "correct" : "wrong");
    btn.classList.add("picked", chosen === "T" ? "t" : "f");
    $$(".tfbtn", row).forEach(b => { if (b !== btn) b.classList.add("dim"); b.disabled = true; });
    const res = $(".result", row);
    res.innerHTML = `
      <div class="verdict ${correct ? "ok" : "bad"}">${correct ? "✓ Correct" : "✗ Wrong"} — the answer is <b>${o.answer === "T" ? "TRUE" : "FALSE"}</b></div>
      ${o.rationale ? `<div class="rationale">${esc(o.rationale)}</div>` : ""}
      ${q.aiAuthored ? `<div class="sub" style="font-size:.75rem;margin-top:4px">AI-authored rationale — cross-check with your notes/lectures.</div>` : ""}`;
    quiz.answered++; quiz.state.picked++;
    if (correct) { quiz.correct++; quiz.state.optsCorrect++; }
    recordAnswer(q, o.label, correct);
    $("#liveScore").textContent = `${quiz.correct}/${quiz.answered}`;
    if (quiz.state.picked >= quiz.state.total) $("#nextBtn").disabled = false;
  }
  function drawSummary() {
    const app = $("#app");
    const pct = quiz.answered ? Math.round((100 * quiz.correct) / quiz.answered) : 0;
    const cls = pct >= 70 ? "ok" : pct >= 50 ? "amber" : "bad";
    app.innerHTML = `
      <div class="card" style="text-align:center;padding:34px 20px">
        <div class="sub">Drill complete</div>
        <div class="scorebig ${cls}">${pct}%</div>
        <div class="sub">${quiz.correct} of ${quiz.answered} statements correct${quiz.label ? " — " + esc(quiz.label) : ""}</div>
        <p style="margin-top:22px">
          <button class="btn" id="againBtn">🔁 New drill (same pool)</button>
          <a class="btn ghost" href="#/weak">Review weak areas</a>
          <a class="btn ghost" href="#/">Home</a>
        </p>
      </div>`;
    $("#againBtn").onclick = () => startQuiz(quiz.qs, quiz.label);
    quiz = null;
  }

  /* ---------- WEAK AREAS ---------- */
  function renderWeak() {
    const app = $("#app");
    const rows = [];
    for (const [sys, o] of Object.entries(stats.bySystem)) {
      rows.push({ kind: "sys", name: sys, ...o });
    }
    const topicRows = Object.entries(stats.byTopic)
      .map(([k, o]) => ({ key: k, sys: k.split("||")[0], topic: k.split("||")[1], ...o }))
      .sort((a, b) => (a.c / a.n) - (b.c / b.n));
    app.innerHTML = `
      <h1>Weak areas</h1>
      <p class="sub">Accuracy is per T/F statement (every option of every question counts)</p>
      ${stats.attempts === 0 ? `<div class="notice">No data yet — do some drills and this page lights up.</div>` : ""}
      <h2>By system</h2><div id="sysRows"></div>
      <h2>Topics needing review (weakest first)</h2><div id="topicRows"></div>
      <h2>Mistakes</h2>
      <p><a class="btn" href="#/quiz?wrong=1">🧯 Drill all questions you ever got wrong (${wrongQuestions().length})</a>
      <button class="btn ghost" id="resetBtn">Reset all progress</button></p>`;
    const sr = $("#sysRows");
    for (const r of rows.sort((a, b) => (a.c / a.n) - (b.c / b.n))) {
      const pct = accuracy(r);
      const div = document.createElement("div");
      div.className = "weakrow";
      div.innerHTML = `<div class="wt"><span>${esc(r.name)}</span><span>${pct}% (${r.c}/${r.n})</span></div>
        <div class="bar-wrap"><div class="bar ${pct < 60 ? "low" : pct < 80 ? "mid" : ""}" style="width:${pct}%"></div></div>`;
      sr.appendChild(div);
    }
    const tr = $("#topicRows");
    let shown = 0;
    for (const r of topicRows) {
      if (r.n < 4) continue;
      const pct = accuracy(r);
      const div = document.createElement("div");
      div.className = "weakrow";
      div.innerHTML = `<div class="wt"><span class="sub">${esc(r.sys)} — ${esc(r.topic)}</span><span class="${pct < 60 ? "bad" : pct < 80 ? "amber" : "ok"}">${pct}%</span></div>
        <div class="bar-wrap"><div class="bar ${pct < 60 ? "low" : pct < 80 ? "mid" : ""}" style="width:${pct}%"></div></div>`;
      tr.appendChild(div);
      shown++;
    }
    if (!shown) tr.innerHTML = `<p class="sub">Answer at least 4 statements in a topic to unlock this view.</p>`;
    $("#resetBtn").onclick = () => { if (confirm("Delete ALL progress on this device?")) { stats = blank(); saveStats(); renderWeak(); } };
  }

  /* ---------- FLASHCARDS (placeholder) ---------- */
  function renderFlashcards() {
    $("#app").innerHTML = `
      <h1>Flashcards</h1>
      <div class="notice">Coming in a later batch — essays, short essays and picture tests will appear here as flippable cards with model answers.</div>
      <p class="sub">Essay bank already in the workspace: Latest Paediatrics Essay MB PQ, written short essays, long/short/social paediatrics · 21 picture-test images · OSCE decks.</p>`;
  }

  /* ---------- theme ---------- */
  const th = localStorage.getItem("paedsMaster.theme");
  if (th) document.documentElement.dataset.theme = th;
  else if (window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches) document.documentElement.dataset.theme = "dark";
  $("#themeToggle").onclick = () => {
    const cur = document.documentElement.dataset.theme === "dark" ? "" : "dark";
    document.documentElement.dataset.theme = cur;
    localStorage.setItem("paedsMaster.theme", cur);
  };

  window.addEventListener("hashchange", () => { if (location.hash !== "#/quiz") quiz = null; route(); });
  boot();
})();

</script>
</body>
</html>
